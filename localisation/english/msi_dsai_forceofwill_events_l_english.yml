l_english:
#
# forceofwill event text (translated from the Chinese localisation)
#

 forceofwill.210.title: "$situation_spirit_cultivation$"
 forceofwill.210.desc: "Our spiritual cultivation, pursued so long, has at last borne fruit: under the guidance of our most enlightened [Owner.GetPriestPlural], [Owner.GetAdj] society has reached a clarity it has never known before, and a complete and indivisible insight now seeps quietly into every crevice of our daily life.\n\nThis choice will decide where that understanding comes to rest; we must direct this sacred power toward one clear and chosen purpose, so that it may benefit every last soul in [Owner.GetName]."
 forceofwill.210.unity: "Forge a single purpose together."
 forceofwill.210.happiness: "Bask in inner harmony."
 forceofwill.210.stability: "May tranquility descend."
 forceofwill.210.councilor: "Govern by truth and insight."
 forceofwill.210.leader_upkeep: "Guide our leaders with wisdom."
 forceofwill.210.leader_lifespan: "May our leaders regain their vigor."
 forceofwill.210.death_cult: "Let the dead speak for us."
 forceofwill.210.ascensionist: "Ascend to a higher plane."
 forceofwill.210.dimensional_worship: "Seek truth in other planes."
 forceofwill.210.exalted_priesthood: "Follow the guidance of [owner.GetPriestPlural]."
 forceofwill.210.gospel_masses: "Cultivate worldly prosperity."
 forceofwill.210.unity_bulk: "Embrace this hour of unity."

 forceofwill.220.desc.intro: "Our spiritual cultivation has brought a blessing upon [this.owner.GetName]."

 forceofwill.225.name: "[this.GetName] Enlightened"
 forceofwill.225.desc: "$forceofwill.220.desc.intro$\n\nThrough meditation shared with fellow practitioners, §H[this.GetTitle][this.GetName]§! has scoured the spirit within; the old obstacles that once hindered [this.GetLeaderAdj] achievements have dissolved, and nothing now remains to fetter the mind."
 forceofwill.225.a.tt: "§Y[this.GetTitle][this.GetName]§! loses a negative trait."

 forceofwill.230.name: "$forceofwill.225.name$"
 forceofwill.230.desc: "$forceofwill.220.desc.intro$\n\nThrough meditation shared with fellow practitioners, §H[this.GetTitle][this.GetName]§! has scoured the spirit within; a long-hidden gift, kept from view, has now revealed itself within their mind."
 forceofwill.230.a.tt: "§Y[this.GetTitle][this.GetName]§! gains a new positive trait."

 forceofwill.235.name: "Wave of Enlightenment"
 forceofwill.235.desc: "$forceofwill.220.desc.intro$\n\nThe discipline of meditation has not been broken for a single day, and the wave of enlightenment has spread from leader to leader; they lead the people with extraordinary insight, and their elevated spirit shows itself in every wise and masterful deed."

 forceofwill.240.name: "[this.GetName] Enlightened"
 forceofwill.240.desc: "$forceofwill.220.desc.intro$\n\nWholehearted dedication to the way of meditation has carried the population of §H[this.GetName]§! to a new height of enlightenment; this pious achievement has likewise raised the potential of this [this.GetPlanetMoon] for both worldly prosperity and spiritual tranquility."

 forceofwill.245.name: "$MESSAGE_SPIRIT_CULTIVATION_BONUS_MIRACLE_CHILD_TITLE$"
 forceofwill.245.desc: "$forceofwill.220.desc.intro$\n\nFrom the moment of [miracle_child.GetHisHer] [miracle_child.species.GetBirthNoun], the [GetMiracleChildBaby] named §H[miracle_child.GetName]§! has shown strong signs of spiritual enlightenment and soon earned the name of 'prodigy'; it is our inescapable duty to raise [miracle_child.GetHimHer] into a leader of our people."
 forceofwill.245.a.tt: "Gain a special §YOfficial§! leader with the §Y$leader_trait_spiritual_prodigy$§! trait."

 forceofwill.250.name: "Sacred Specimen"
 forceofwill.250.desc: "$forceofwill.220.desc.intro$\n\nA crafter of sacred instruments on [capital_planet.GetName] has completed the §H$holy_symbol$§!, the crowning work of sacred craft; forged from precious alloys, its many points of direction correspond one by one to the spiritual journey of the enlightened mind."

 forceofwill.1030.name: "[owner.GetIdeologyTypeCap] Emerges: §H[generated_ideology.GetName]§!"
 forceofwill.1030.desc.common_1: "Under our advocacy, the faction known as §H[this.GetName]§! has won markedly greater support in [owner.GetAdj] society."
 forceofwill.1030.desc.common_2_shared: "Several once-loose related ideas have now coalesced into a mature ideology, known as §H'[generated_ideology.GetName]'§!.\n\nSo long as we keep supporting it, this doctrine can keep widening its influence in [owner.GetName],"
 forceofwill.1030.desc.common_2: "$forceofwill.1030.desc.common_2_shared$ and spread to like-minded people across the wider galaxy."
 forceofwill.1030.desc.common_2_genocidal: "$forceofwill.1030.desc.common_2_shared$ and hasten the purging of alien filth from the galaxy."
 forceofwill.1030.desc.spiritualist_shared: "$forceofwill.1030.desc.common_1$ The faithful have discerned the deeper meaning within it through devout meditation."
 forceofwill.1030.desc.spiritualist: "$forceofwill.1030.desc.spiritualist_shared$$forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.spiritualist.genocidal: "$forceofwill.1030.desc.spiritualist_shared$$forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.desc.default_shared: "$forceofwill.1030.desc.common_1$ Heated debate within the party has at last clarified its tenets."
 forceofwill.1030.desc.default: "$forceofwill.1030.desc.default_shared$$forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.default.genocidal: "$forceofwill.1030.desc.default_shared$$forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.a.militarist: "Ideas are among the sharpest weapons."
 forceofwill.1030.a.pacifist: "Let peace spread across the stars."
 forceofwill.1030.a.spiritualist: "May this truth reach the stars."
 forceofwill.1030.a.materialist: "Lay the cornerstone of an idea."
 forceofwill.1030.a.authoritarian: "Bring order out of chaos."
 forceofwill.1030.a.egalitarian: "Opportunity belongs to all."
 forceofwill.1030.a.xenophobe: "Others will learn the truth."
 forceofwill.1030.a.xenophile: "Ideas know no borders."
 forceofwill.1030.tt: "Generate §H[generated_ideology.GetName]§! as a new [owner.GetIdeologyType].\n$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1045.name: "§H[from.GetName]§! Established"
 forceofwill.1045.desc_prefix: "Official announcement: [this.GetName] has now adopted §H[from.GetName]§! as the state [this.GetSpecificIdeologyType]."
 forceofwill.1045.desc_suffix: "permeated every corner of [this.GetAdj] society, bringing a new moral rigor to our institutions.\n\nSo long as we hold faithfully to these guiding principles, we shall in time reap great rewards from them."
 forceofwill.1045.desc: "$forceofwill.1045.desc_prefix$ Its values have already $forceofwill.1045.desc_suffix$"
 forceofwill.1045.desc.genocidal: "$forceofwill.1045.desc_prefix$ Though of alien origin, these ideas have been properly reworked, and have now $forceofwill.1045.desc_suffix$"
 forceofwill.1045.a: "This is a momentous day for [this.GetAdj] society."
 forceofwill.1045.a.genocidal: "The great cleansing of the galaxy draws near."
 forceofwill.1045.a.tt: "$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1060.name: "New [Ideology.GetIdeologicalCustodianName]"
 forceofwill.1060.desc: "We are now the [Ideology.GetIdeologicalCustodianName] of §H[Ideology.GetName]§!.\n\nThe [this.GetSpecificIdeologyType] doctrine we adopted had long stood stagnant under the guardianship of [FromFrom.GetName]; the long deliberation has reached its verdict, and we have taken their place as the author of the creed.\n\nFrom this day forward, carrying forward the creed of [this.GetIdeologyType] is a duty we must bear."
 forceofwill.1060.a: "[Ideology.GetName] enters a new era."

 forceofwill.1065.name: "$forceofwill.1060.name$"
 forceofwill.1065.desc: "We are no longer the [Ideology.GetIdeologicalCustodianName] of §H[Ideology.GetName]§!.\n\nForeign adherents have long claimed that the [this.GetSpecificIdeologyType] doctrine has stood still under the guardianship of [Root.GetAdj]; under pressure from every side, we were forced to let §H[From.GetName]§! take our place and hold the creed.\n\nNow, carrying forward the creed of [this.GetSpecificIdeologyType] is their responsibility."
 forceofwill.1065.a: "May they prove equal to it."
 forceofwill.1065.a.genocidal: "At least until we erase them."

 forceofwill.1085.name: "A New Adherent"
 forceofwill.1085.desc_shared: "§H[From.GetName]§! has formally embraced the values of §H[Ideology.GetName]§!. Our claims and insights"
 forceofwill.1085.desc: "$forceofwill.1085.desc_shared$ are now shared by an ever-growing number of peoples across the galaxy."
 forceofwill.1085.desc.genocidal: "$forceofwill.1085.desc_shared$ possess a superiority so evident that even these vermin, soon to be exterminated, freely acknowledge it."
 forceofwill.1085.desc.hall_incomplete: "As faith deepens, the call to raise a §H[Ideology.GetName][Ideology.GetHallCathedral]§! in proclamation of our [Owner.GetSpecificIdeologyType] values grows louder by the day."
 forceofwill.1085.desc.hall_unknown_shared: "As faith deepens, the call to raise a landmark building in proclamation of our [Owner.GetSpecificIdeologyType] values grows louder by the day."
 forceofwill.1085.desc.hall_unknown: "$forceofwill.1085.desc.hall_unknown_shared$$galactic_hall_event_desc_common$"
 forceofwill.1085.desc.hall_unknown.genocidal: "$forceofwill.1085.desc.hall_unknown_shared$$galactic_hall_event_desc_common_genocidal$"
 forceofwill.1085.a: "Our influence is growing."
 forceofwill.1085.a.genocidal: "Our superiority is beyond doubt."
 forceofwill.1085.a.tt: "Whenever a new empire adopts our [Owner.GetSpecificIdeologyType], the following modifiers apply:"

 forceofwill.1095.name: "The Contest for [Ideology.GetIdeologicalAdjCap] Influence"
 forceofwill.1095.desc: "A foreign [From.GetSpecificIdeologyType] influence is taking root, hindering our efforts to spread §H[Ideology.GetName]§!.\n\nIt is called §H[From.GetName]§!, and behind it stands a whole [From.GetEthicLower] worldview; many of its core principles [Root.GetIdeologyClashEthicRelation]\n\nIn [Root.GetIdeologyClashSystems] we intercepted alien media broadcasts preaching this [From.GetSpecificIdeologyType]; [Root.GetIdeologyClashThreat], and the consequences are hard to foresee."
 forceofwill.1095.desc.same_ethic: "are akin to our own fundamental values."
 forceofwill.1095.desc.opposite_ethic: "directly contradict our fundamental values."
 forceofwill.1095.desc.other_ethic: "run entirely counter to our own fundamental values."
 forceofwill.1095.desc.one_system: "the [event_target:ideology_clash_system.GetName] system"
 forceofwill.1095.desc.several_systems: "several star systems"
 forceofwill.1095.desc.within_borders: "If we do not shield our population from the erosion of this foreign propaganda, the faith in [Ideology.GetName] will waver,"
 forceofwill.1095.desc.within_borders_gestalt: "If we do not shield our collective from the erosion of this foreign propaganda, the faith in [Ideology.GetName] will waver,"
 forceofwill.1095.desc.beyond_borders: "If we do not act against this foreign propaganda, one day it will reach our population,"
 forceofwill.1095.a: "Resist these alien ideas."
 forceofwill.1095.b: "A challenged ideology only grows stronger."
 forceofwill.1095.b.tt: "§RWill harm our relations with adherents of that ideology.§!"
 forceofwill.1095.c: "Of no concern."

 forceofwill.1100.name: "[GetFoW1100Name]"
 forceofwill.1100.name.default: "The Rise of a $IDEOLOGY_CAP$"
 forceofwill.1100.name.spirit: "The Rise of a $IDEOLOGY_TYPE_SPIRITUALIST_CAP$"
 forceofwill.1100.desc.common_1: "Across all of [this.GetName], from the highest leadership to the common folk"
 forceofwill.1100.desc.common_2_shared: "and to sow this conviction openly into every corner of [this.GetSpeciesAdj] life"
 forceofwill.1100.desc.common_2: "$forceofwill.1100.desc.common_2_shared$, and even into the wider galaxy."
 forceofwill.1100.desc.common_2_genocidal: "$forceofwill.1100.desc.common_2_shared$ so as to lend us further aid."
 forceofwill.1100.desc.default_start: "$forceofwill.1100.desc.common_1$, we are witnessing a firm commitment to shared values and beliefs."
 forceofwill.1100.desc.default_end: "our senior leaders propose that the time has come to set our creed down in earnest—"
 forceofwill.1100.desc.default: "$forceofwill.1100.desc.default_start$\n\n$forceofwill.1100.desc.default_end$"
 forceofwill.1100.desc.default.genocidal: "$forceofwill.1100.desc.default_start$ Our collective will to purify the galaxy needs a name."
 forceofwill.1100.desc.spirit: "$forceofwill.1100.desc.common_1$, we are witnessing a firm commitment to spiritual doctrine."
 forceofwill.1100.a: "Seize the opportunity."
 forceofwill.1100.a.genocidal: "The alien filth will meet its end."
 forceofwill.1100.b: "Now is not the time."

 forceofwill.1200.name: "A Foreign Ideology"
 forceofwill.1200.desc.common_1: "We have discovered an alien 'ideology' known as §H[from.GetName]§!."
 forceofwill.1200.desc.common_2_shared: "and adherence to its tenets has already produced observable changes in the societies it has permeated.\n\nIn its present form, such an individualist paradigm has no place in our collective society; yet the benefits of weaving scattered notions into a coherent doctrine are considerable. On careful reflection, we may find a way to rework it and sow it across the whole of [this.GetName]"
 forceofwill.1200.desc.common_2: "$forceofwill.1200.desc.common_2_shared$ and even beyond our borders."
 forceofwill.1200.desc.common_2_genocidal: "$forceofwill.1200.desc.common_2_shared$, and thus aid us in purging the galaxy of inferior alien breeds."
 forceofwill.1200.desc.knows_shared: "This faith originates from [from.owner.GetName],"
 forceofwill.1200.desc.knows: "$forceofwill.1200.desc.knows_shared$$forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.knows.genocidal: "$forceofwill.1200.desc.knows_shared$$forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.desc.default_shared: "$forceofwill.1200.desc.common_1$ This belief system appears to stem from an uncontacted species, designation [from.owner.GetName],"
 forceofwill.1200.desc.default: "$forceofwill.1200.desc.default_shared$$forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.default.genocidal: "$forceofwill.1200.desc.default_shared$$forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.a: "Interesting. Let us consider it."
 forceofwill.1200.b: "Pay no heed to this noise."
 forceofwill.1200.b.tt: "$UNLOCKS_AGENDA$§YPromulgate [this.GetIdeologyTypeCap]§!"

 forceofwill.1210.name: "[this.GetGestaltIdeologyProjectName]"
 forceofwill.1210.desc_prefix: "Borrowing the foreign concept of the 'ideology', our [this.GetResearchers] have constructed a paradigm for '[this.GetIdeologyTypePlural]'—a framework that can carry a coherent body of thought across the entire [this.GetGestaltEntityName]"
 forceofwill.1210.desc_suffix: "All that remains is to fix the source of our [this.GetIdeologyType]."
 forceofwill.1210.desc: "$forceofwill.1210.desc_prefix$ and even beyond our borders.\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.desc.genocidal: "$forceofwill.1210.desc_prefix$, aiding us in purging the galaxy of inferior alien breeds.\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.militarist: "We are war."
 forceofwill.1210.xenophobe: "We are purity."
 forceofwill.1210.egalitarian: "We are equality."
 forceofwill.1210.materialist: "We are knowledge."
 forceofwill.1210.pacifist: "We are peace."
 forceofwill.1210.xenophile: "We are all life."
 forceofwill.1210.authoritarian: "We are order."
 forceofwill.1210.spiritualist: "We are faith."

 forceofwill.1250.name: "The Death of [from.GetRegnalName]"
 forceofwill.1250.desc: "After long years of service, our §H[GetFoW1250RulerTitle] [from.GetRegnalName]§! has passed away, and the question of succession now lies before us.\n\nThe close advisors of [from.GetRegnalName] must choose a new [this.GetHeirTitle] from among the kindred; one fit to govern [this.GetName] wisely and to uphold the principles of [ideology.GetName]."
 forceofwill.1250.a: "The new heir shall be a $scientist$."
 forceofwill.1250.b: "The new heir shall be a $commander$."
 forceofwill.1250.c: "The new heir shall be a $official$."

 forceofwill.1550.name: "[from.GetClubNameCap] on the Rise"
 forceofwill.1550.desc: "Inspired by the rising popularity of §H[from.GetName]§!, our citizens are joining [from.GetClubName] in unprecedented numbers, seeking a deeper commitment to the most fundamental values of our society.\n\nAcross [this.GetName], this surge in membership is driving social harmony and ideological unity to new heights."
 forceofwill.1550.a: "A commendable initiative."
 forceofwill.1550.b: "Fold them into our public information efforts."

 forceofwill.1560.name: "New Insights into [this.GetLastTenetName]"
 forceofwill.1560.desc.common: "Through incremental refinement, [this.GetLastTenetName] has been firmly established as a core principle of §H[from.GetName]§!."
 forceofwill.1560.desc.default: "$forceofwill.1560.desc.common$ Recent research on the subject has stirred lively debate among [Owner.GetResearchers], lending new theoretical substance to our guiding principles."
 forceofwill.1560.desc.spirit: "$forceofwill.1560.desc.common$ Recently published analyses of canonical texts have provoked theological debate among [this.GetBureaucratPlural], infusing our precepts with fresh spiritual insight."
 forceofwill.1560.a: "May this spirit of inquiry endure."
 forceofwill.1560.b: "Fund doctrinal debate."

 forceofwill.1570.name: "Monument to [from.GetEthic] Completed"
 forceofwill.1570.desc: "The people of [selected_planet.GetName] have gathered of their own accord to raise a monument to their [from.GetDevotion] - their growing conviction in the values of §H[from.GetName]§!.\n\nPaid for by private donors and built in record time by a network of ardent, skilled volunteers bound by shared belief - youth groups, social clubs and fraternities - it now stands complete, and they ask the government to send a representative to its dedication."
 forceofwill.1570.a: "Send a representative to honor their efforts."
 forceofwill.1570.b: "We have more pressing matters."

 forceofwill.1580.name: "$citizen_parade$"
 forceofwill.1580.desc: "Lately, many citizens have taken part in organizing a grand 'Day of Unity', honoring the core values of §H[from.GetName]§! with parades and festivities.\n\nStaged in our most populous cities, the gatherings bring [this.GetSpeciesNamePlural] together and reaffirm their support for our shared culture and founding creeds."
 forceofwill.1580.a: "Encourage regular parades."
 forceofwill.1580.b: "Use the parades to bolster public messaging."

 forceofwill.1590.name: "Leader $recruitment_boom$"
 forceofwill.1590.desc: "Confidence in §H[from.GetName]§! is taking root among the young people of [this.GetName]; recruitment offices are nearly trampled at the threshold, applications arrive in stacks, and even the most remote administrative districts are sending in new names.\n\nMost come not for personal ambition or a stipend: they want to do their part for the future of [this.GetName], and are willing to spend a long career pushing it, piece by piece, toward something better."
 forceofwill.1590.b: "Reassign them to spread the message of [from.GetName]."

 forceofwill.1600.name: "Corruption Declines"
 forceofwill.1600.desc.start: "Government employees are driven by a near-obstinate idealism, and corruption and waste have fallen sharply across [this.GetName].\n\nOur staff remain"
 forceofwill.1600.desc.end: "the tenets of §H[from.GetName]§!, nearly immune to bribery and all but indifferent to anything that erodes our shared values."
 forceofwill.1600.desc.default: "$forceofwill.1600.desc.start$ firmly committed to $forceofwill.1600.desc.end$"
 forceofwill.1600.desc.spiritualist: "$forceofwill.1600.desc.start$ firmly rooted in their faith in $forceofwill.1600.desc.end$"
 forceofwill.1600.a.default: "They truly believe in [from.GetName]."
 forceofwill.1600.a.spiritualist: "May their faith guide them."
 forceofwill.1600.b: "Reward their loyalty."

 forceofwill.1610.name: "A Golden Age for [from.GetName]"
 forceofwill.1610.desc: "Embracing §H[from.GetName]§! appears to be paying off: independent analysts compared the degree of our society's adherence to it against a range of positive trends, and found a marked correlation.\n\nSome even speak of a 'golden age' for [from.GetName]: trade routes are open, the public mood is bright, and our state is bound ever more tightly to the same set of ideas."
 forceofwill.1610.a: "Turn positive sentiment into cohesion."
 forceofwill.1610.b: "Channel this enthusiasm toward economic goals."
 forceofwill.1610.c: "Use this opening to strengthen governance."

 forceofwill.1620.name: "Donation Surge"
 forceofwill.1620.desc: "A growing number of citizens are donating their fortunes to the state, purely to carry the convictions of §H[from.GetName]§! further.\n\nDonations tend to cluster in the days following important national occasions; others choose to complete theirs by bequest after death, seeing it as a word left to posterity."
 forceofwill.1620.a: "Raise living standards with the proceeds."
 forceofwill.1620.b: "Promote culture with the proceeds."

 forceofwill.1630.name: "Trade Booms"
 forceofwill.1630.desc.common: "Trade is booming in [this.GetName].\n\nAs adherence to §H[from.GetName]§! deepens, our society's productivity and its mood of optimism both benefit."
 forceofwill.1630.desc.unfriendly: "$forceofwill.1630.desc.common$ Merchants are establishing businesses in unprecedented numbers, trading goods with unprecedented vigor."
 forceofwill.1630.desc.default: "$forceofwill.1630.desc.common$ Foreign merchants are establishing businesses in unprecedented numbers, importing exotic spices and goods from across the galaxy."
 forceofwill.1630.a: "Levy a small trade tax to fill the treasury."
 forceofwill.1630.b: "Requisition a shipment of key minerals."
 forceofwill.1630.c: "Requisition a shipment of luxury foodstuffs."

 forceofwill.1640.name: "$radical_nonconformity$"
 forceofwill.1640.desc: "In [this.Capital.GetName], a freethinking organization has been spreading claims that question the core principles of §H[from.GetName]§!; what began as an informal tea circle of a few independent researchers can now print pamphlets and work the media.\n\nIts public statements are carefully worded and always consistent with the official line; yet the substance of its thinking plainly strikes at values we have long upheld - limited in reach, perhaps, but a conspicuous pocket of opposition within the nation's [this.GetSpecificIdeologyType]."
 forceofwill.1640.a: "Let them be."
 forceofwill.1640.b: "Suppress them."

 forceofwill.1650.name: "Protests in [this.Capital.GetName]"
 forceofwill.1650.desc.start: "Demonstrations have erupted in [this.Capital.GetName]. Activists accuse the [this.GetAdj] elite"
 forceofwill.1650.desc.end: "sacrificing the interests of ordinary citizens to line their own pockets.\n\nThe protesters' language is sharp, but their actions remain largely peaceful. So far, the most tangible consequence has been lost output from absenteeism."
 forceofwill.1650.desc.default: "$forceofwill.1650.desc.start$ of using the prominence conferred by §H[from.GetName]§! while $forceofwill.1650.desc.end$"
 forceofwill.1650.desc.egalitarian: "$forceofwill.1650.desc.start$ of betraying the egalitarian principles openly championed by §H[from.GetName]§!, while privately $forceofwill.1650.desc.end$"
 forceofwill.1650.a: "$bio.50.a$"
 forceofwill.1650.b: "Let them air their grievances."

 forceofwill.1660.name: "Economic Recession"
 forceofwill.1660.desc: "Financial analysts report firm evidence of economic stagnation across [this.GetName].\n\nDeclining adherence to §H[from.GetName]§! has opened ideological fractures among workers; a mood of discord has spread, and investor confidence has suffered.\n\nExperts fear that if our [this.GetSpecificIdeologyType] continues to suffer [from.GetIdeologyDefection] unchecked, a full recession is not impossible."
 forceofwill.1660.a: "Let the market correct itself."
 forceofwill.1660.b: "Provide relief to the market."
 forceofwill.1660.c: "Ease ideological controls on the financial sector."

 forceofwill.1670.name: "A Failed Assassination"
 forceofwill.1670.desc: "§H[assassination_attempt_leader.GetTitle][assassination_attempt_leader.GetName]§! has survived an assassination attempt at the hands of a band of radical dissidents.\n\nThe attackers were subdued by security forces, but their crude explosive device detonated nonetheless; [assassination_attempt_leader.GetName] is gravely wounded.\n\nThis outrageous incident brings the threat posed by the opposition within [this.GetName] into plain view - an opposition rendered ever more radical by its rejection of §H[from.GetName]§!."
 forceofwill.1670.a: "$leviathans.143.a$"
 forceofwill.1670.b: "Launch a security crackdown."

 forceofwill.1680.name: "$government_corruption$"
 forceofwill.1680.desc: "Some leaders grow ever more absorbed in power plays and private gain, no longer putting the values of §H[from.GetName]§! to any practical use for [this.GetAdj] society.\n\nIdealism has given way to cynicism, bribery and corruption have risen accordingly, and the legislative and administrative efficiency of [this.GetName] has suffered along with them."
 forceofwill.1680.b: "Dismiss the offenders."
 forceofwill.1680.b.tt.fail: "Must have more than §Y100§!£pop£ §HPops§! working as $job_politician_plural_with_icon$ or $bureaucrat_type_plural_with_icon$ on a single colony"
 forceofwill.1680.b.tt.politicians: "$job_politician_plural_with_icon$: §R-100§!"
 forceofwill.1680.b.tt.bureaucrats: "$bureaucrat_type_plural_with_icon$: §R-100§!"

 forceofwill.1690.name: "A Dissident Leader"
 forceofwill.1690.desc: "§H[dissident_leader.GetTitle][dissident_leader.GetName]§! has openly turned against us, challenging the core values of §H[from.GetName]§! at every opportunity and working, openly and covertly, to keep them from taking root in the government.\n\nIn fairness, [dissident_leader.GetName] remains a capable and respected leader elsewhere; only on matters of principle does [dissident_leader.GetHeShe] always run counter to [from.GetName]."
 forceofwill.1690.b: "Dismiss [dissident_leader.GetName]."

 forceofwill.1700.name: "Terrorist Attack on [attacked_colony.GetName]"
 forceofwill.1700.desc: "§H[attacked_colony.GetName]§! has suffered a sizable, well-organized terrorist attack.\n\nWithin minutes, explosive devices detonated in succession across the colony; casualties are heavy, buildings have been badly damaged, and one of our major structures has been reduced to rubble.\n\nA group opposed to [from.GetEthicLower] has claimed responsibility, invoking its opposition to §H[from.GetName]§! to justify itself; public condemnation is loud, but in private, not a few sympathize with the group."
 forceofwill.1700.a: "Overreacting would only play into their hands."
 forceofwill.1700.b: "Strengthen law enforcement on [attacked_colony.GetName]."
 forceofwill.1700.c: "Scale back ideological campaigns to ease tensions."
 forceofwill.1700.tt: "One non-capital building on §Y[attacked_colony.GetName]§! is destroyed."

 forceofwill.1710.name: "[assassinated_leader.GetName] Assassinated"
 forceofwill.1710.desc.start: "§H[assassinated_leader.GetTitle][assassinated_leader.GetName]§! has been assassinated. At a private banquet in [this.Capital.GetName], [assassinated_leader.GetHeShe] abruptly began to show signs of"
 forceofwill.1710.desc.end: "Within hours, a radical dissident organization publicly claimed the crime, calling [assassinated_leader.GetName] a 'corrupt representative' of §H[from.GetName]§! in its statement.\n\nThe insurgents are now pressing the government to let a candidate of their choosing succeed [assassinated_leader.GetFirstName]."
 forceofwill.1710.desc.organic: "$forceofwill.1710.desc.start$ poisoning, and died before any medical intervention could be administered.\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.desc.machine: "$forceofwill.1710.desc.start$ chemical contamination, and ceased functioning before any emergency repairs could be carried out.\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.a: "Condemn the group and ignore its demands."
 forceofwill.1710.b: "Grant their request and recruit their candidate."
 forceofwill.1710.b.tt.common: "Recruit §Y[replacement_leader.GetTitle][replacement_leader.GetName]§!, [replacement_leader.GetAAnEthic] §Y[replacement_leader.GetEthic]§! [GetFoW1710LeaderClass] (skill level §H[replacement_leader.GetSkill]§!)"
 forceofwill.1710.b.tt.official: "$forceofwill.1710.b.tt.common$."
 forceofwill.1710.b.tt.governor: "$forceofwill.1710.b.tt.common$ to govern §Y[assassinated_colony.GetName]§!."

 forceofwill.1720.name: "Threat of Defection"
 forceofwill.1720.desc: "§H[defecting_fleet.leader.GetTitle][defecting_fleet.leader.GetName]§! has publicly declared that, with [defecting_fleet.leader.GetHimHer] at its head, §H[defecting_fleet.GetName]§! will defect from [this.GetName].\n\nOn open channels, [defecting_fleet.leader.GetName] denounced our [this.GetSpecificIdeologyType] as 'a pernicious influence on [this.GetAdj] society', and claimed to 'no longer be able to maintain unity and loyalty'; [defecting_fleet.leader.GetHeSheCap] further insisted that our [this.GetSpecificIdeologyType] 'must return to the traditional virtues'.\n\nPrivate communications between [defecting_fleet.leader.GetHisHer] subordinates indicate that the crew is quite willing to follow [defecting_fleet.leader.GetFirstName]."
 forceofwill.1720.a: "If the traitors want to leave, let them."
 forceofwill.1720.a.tt: "§Y[defecting_fleet.leader.GetClass][defecting_fleet.leader.GetName]§! leaves [this.GetName] in §Rdefection§!, taking [defecting_fleet.leader.GetHimHer] and the §Y[defecting_fleet.GetName]§! away."
 forceofwill.1720.b: "[defecting_fleet.leader.GetHeSheCap] [defecting_fleet.leader.GetHasHave] a point - deepen our commitment to our own values."

 forceofwill.1730.name: "[GetFoW1730Name]"
 forceofwill.1730.name.hive: "Aberrant Urges Subside"
 forceofwill.1730.name.machine: "Aberrant Logic Restructured"
 forceofwill.1730.desc.hive: "Our adherence to §H[from.GetName]§! is unwavering; the integrity of the collective consciousness is thereby strengthened, and the burden of aberrant impulses is lifted."
 forceofwill.1730.desc.machine: "Our adherence to §H[from.GetName]§! is unwavering; the integrity of the central intelligence is thereby strengthened, and the burden of aberrant impulses is lifted."
 forceofwill.1730.desc.common: "Every exchange we have with external reality is guided by the [from.GetIdeologicalAdj] perspective - a lens that is at once the root of knowledge and the root of meaning. The internal friction that once beset us has now largely dissipated."
 forceofwill.1730.b: "Direct the surplus into productivity."

 forceofwill.1740.name: "Cognitive Efficiency"
 forceofwill.1740.desc: "The logical architecture of §H[from.GetName]§! has simplified the labor of our §H$councilor_gestalt_cognitive$§!, freeing up part of our computing power for other uses.\n\nFor our $councilor_gestalt_cognitive$, constructing an explanatory theoretical framework for unfamiliar external phenomena is no longer vexing. By the tenets of [from.GetName], the production of knowledge has grown far more efficient."
 forceofwill.1740.a: "Encourage the node to improve itself."
 forceofwill.1740.b: "Direct it toward broader fields of research."

 forceofwill.1750.name: "Gains of Oversight"
 forceofwill.1750.desc.common: "Thanks to the ideas of §H[from.GetName]§!, procedural clarity has risen, and our §H$councilor_gestalt_regulatory$§! has improved accordingly."
 forceofwill.1750.desc.hive: "With this comprehensive theoretical framework, the task of monitoring aberrant impulses has become far simpler."
 forceofwill.1750.desc.machine: "With this comprehensive theoretical framework, the task of monitoring the formation of aberrant logic has become far simpler."
 forceofwill.1750.a: "Encourage the node to keep improving itself."
 forceofwill.1750.b.hive: "All surplus energy goes into instinct."
 forceofwill.1750.b.machine: "All surplus energy goes into directive management."

 forceofwill.1760.name: "[GetFoW1760Name]"
 forceofwill.1760.name.hive: "Nonstandard Thinking"
 forceofwill.1760.name.machine: "Decentralized Processing"
 forceofwill.1760.desc: "In seeking the correct procedure according to the tenets of §H[from.GetName]§!, the semi-autonomous [this.GetIndividualName] [selected_leader.GetName] began to generate [this.GetBrainName] [this.GetIdeaWordPlural] freely.\n\nThese cognitive processes were halted quickly, and the anomalous [this.GetThoughtWordPlural] were excised from [this.GetNetworkName] to prevent dissonance; our [this.GetResearchers] judge that these new concepts could serve the collective, but that integrating [this.GetThoughtWordPlural] of off-center origin is plainly a considerable risk."
 forceofwill.1760.a.hive: "Bring these ideas into the collective mind."
 forceofwill.1760.a.machine: "Add this data to collective access."
 forceofwill.1760.b.hive: "Eradicate all memory of these ideas."
 forceofwill.1760.b.machine: "Delete this data immediately."

 forceofwill.1770.name: "System Crash"
 forceofwill.1770.desc: "An [from.GetIdeologicalAdj] conflict in the core systems has produced a severe logic fault, and the entire [this.GetSpeciesAdj] network keeps shutting down.\n\nPropositions tied to §H[from.GetName]§! that underpin several decision-making subroutines routinely fail regression testing. This interference is dragging down the daily business of every department."
 forceofwill.1770.a: "We can only endure."
 forceofwill.1770.b: "Allocate extra computing power to ease it."

 forceofwill.1780.name: "Neural Pain"
 forceofwill.1780.desc: "The [from.GetIdeologicalAdj] dissonance that must be processed keeps multiplying, and acute neural pain now torments the collective.\n\nThe principles of §H[from.GetName]§! were meant to make the fabric of consciousness clearer, yet are now spreading uncertainty and fracture. Under neural overload, many sub-units fall paralyzed."
 forceofwill.1780.a: "Provide medical support."
 forceofwill.1780.b: "Increase rest periods."

 forceofwill.1790.name: "[GetFoW1790Name]"
 forceofwill.1790.name.hive: "Paralyzed Drones"
 forceofwill.1790.name.machine: "Malfunctioning Units"
 forceofwill.1790.desc: "Procedural uncertainty, born of [from.GetIdeologicalAdj] dissonance, leaves our [this.GetIndividualNamePlural] unable to complete their daily tasks.\n\nOur [this.GetIndividualNamePlural] often stall between two contradictory propositions, unable to advance or retreat, and lock up as a result. Unless a self-consistent [from.GetIdeologicalAdj] framework dissolves that uncertainty, our thought processes will keep breaking down on a wide scale."
 forceofwill.1790.b.hive: "Remove inefficient drones."
 forceofwill.1790.b.machine: "Remove inefficient units."

 forceofwill.1800.name: "Node Overload"
 forceofwill.1800.desc.common: "Capability is strained to its limit, and neural systems stand on the verge of overload.\n\n[this.GetNetworkName] struggles to reconcile conflicting [this.GetThoughtWordPlural], and the work of integrating scientific discoveries into the core principles of §H[from.GetName]§! grows ever more arduous as a result."
 forceofwill.1800.desc.hive: "The mind of our §H$councilor_gestalt_cognitive$§! cannot keep pace: $forceofwill.1800.desc.common$"
 forceofwill.1800.desc.machine: "The processing of our §H$councilor_gestalt_cognitive$§! cannot keep pace: $forceofwill.1800.desc.common$"
 forceofwill.1800.a.hive: "Still tolerable."
 forceofwill.1800.a.machine: "Overclocking remains within tolerance."
 forceofwill.1800.b.hive: "Strengthen [from.GetIdeologicalAdj] review."
 forceofwill.1800.b.machine: "Upgrade [from.GetIdeologicalAdj] monitoring algorithms."

 forceofwill.2105.name: "Zealot Faction Emerges"
 forceofwill.2105.desc: "Judged by the demands it advances, §H[from.GetName]§! has gradually drifted toward extremism; its manifestos and rhetoric alike breathe an extreme worldview that tolerates no dissent."

 forceofwill.2010.name: "Absolute [ideology.GetEthicNoun]"
 forceofwill.2010.desc: "Our adherence to §H[ideology.GetName]§! has prompted us to reexamine the weight of [ideology.GetEthicNoun] in the governance of society. We now understand that these principles can be implemented in full.\n\nThe systematic restructuring of the state's operations can make every corner of [this.GetAdj] existence a perfect expression of this fundamental value. To that end, every competing doctrine must be rooted out in thought and in deed alike."
 forceofwill.2010.a: "Begin at once."
 forceofwill.2010.b: "There are more pressing matters."
 forceofwill.2010.b.tt: "By embracing §Y[fanatic_faction.GetName]§!, we can now shift our ['concept_ethics'] toward §YFanatic [ideology.GetEthic]§!."

 forceofwill.2015.name: "Absolute [ideology.GetEthicNoun] Established"
 forceofwill.2015.desc: "Since the core tenets of §H[ideology.GetName]§! were established as the fundamental basis of national governance, this administration has carried out a systematic transformation of the entire governing apparatus: from administrative structure to grassroots execution, from legislative procedure to daily adjudication, institutions at every level now operate solely according to the norms of [ideology.GetEthicLower], and every precedent, inertia or private interest at odds with them has been cleared away in due sequence, leaving no corner untouched.\n\nAcross the board, this round of reform has delivered results. Every function of society now reflects our most fundamental [ideology.GetEthicLower] values - and the purest, most undiluted portion of them. Institutionally, we have established a long-term mechanism of self-verification and self-correction, sufficient to ensure that any deviation is detected and rectified in its early stages.\n\nThis report marks a milestone: it records the end of one chapter of history, and the start of an era. In the next phase, we will continue to consolidate what has been achieved, so that the norms of [ideology.GetEthicLower] are inscribed not only in our codes of law, but in the daily life of every citizen of the empire."
 forceofwill.2015.authoritarian: "I, the Supreme."
 forceofwill.2015.egalitarian: "We rise together, or no one rises."
 forceofwill.2015.xenophobe: "The alien shall take no root here."
 forceofwill.2015.xenophile: "All life is worthy of embrace."
 forceofwill.2015.pacifist: "A Farewell to Arms."
 forceofwill.2015.militarist: "Our future is forged in war."
 forceofwill.2015.materialist: "Reason is the final authority."
 forceofwill.2015.spiritualist: "A higher power watches over us."

 forceofwill.2060.name: "[GetFoW2060Name]"
 forceofwill.2060.name.hive: "Instinct Perfected"
 forceofwill.2060.name.machine: "Directive Optimized"
 forceofwill.2060.desc.intro: "The tenets of §H[ideology.GetName]§! have long been embedded in the collective consciousness, familiar to every [this.GetIndividualName]. After cycles of refinement, the conceptual architecture of our [this.GetSpecificIdeologyType] has now achieved complete logical consistency—"
 forceofwill.2060.desc.outro: "[this.GetNetworkName] as a whole executes these principles with absolute coherence.\n\nThe cognitive resources once devoted to refining [ideology.GetName] may now be turned to other pursuits."
 forceofwill.2060.desc.hive: "$forceofwill.2060.desc.intro$This doctrine is now deeply rooted in our overmind, $forceofwill.2060.desc.outro$"
 forceofwill.2060.desc.machine: "$forceofwill.2060.desc.intro$This doctrine is now integrated into our neural network, $forceofwill.2060.desc.outro$"
 forceofwill.2060.a: "Our minds can surpass the known limits."

 forceofwill.3000.name: "Subroutine Activation"
 forceofwill.3000.desc_prefix: "While parsing a relic of an extinct civilization designated [GetLostMakersEmpire], the research subunit experienced an unprecedented unauthorized activation of a [GetPrecursorDetail] subroutine, originating from our damaged storage sector.\n\nThe logical registration and syntax of this subroutine differ from our own codebase, yet correspond closely to the relics of [GetLostMakersCiv]. It can therefore be inferred that the two once operated in concert.\n\nSubstantial tracts of fragmented memory remain inaccessible."
 forceofwill.3000.desc_baol: "$forceofwill.3000.desc_prefix$We have exhausted every known data source pertaining to the Grunur, but an examination of their adversaries, designated $baol_precursor_empire$, may yield further discoveries."
 forceofwill.3000.desc: "$forceofwill.3000.desc_prefix$An examination of [GetPrecursorName] may yield further discoveries."

 forceofwill.3010.name: "$lost_makers_precursor_site$"
 forceofwill.3010.desc: "Subsurface scans have confirmed the presence of an underground structure on §H[dig_site_planet.GetName]§!. Its spatial design resembles the ancient network architecture on [Root.Capital.GetName]; however, no retrievable record of its construction can be located.\n\nThe research subroutine recommends the complete excavation of this site. Establishing its function may ultimately permit us to reconcile the inconsistencies within our own design."
 forceofwill.3010.a: "Continue the excavation."

 forceofwill.3020.name: "Alien Data Center"
 forceofwill.3020.desc.common: "While clearing the ruins, our science units located the entrance of a reinforced access shaft leading to an underground structure on [From.Planet.GetName].\n\nNotably, §H[leader.GetTitle][leader.GetName]§! was able to interface with its control terminal using a standard [controller.GetSpeciesAdj] connector. The encryption logic of the system resembles that of our own networks, and internal access was obtained in only 178,293 decryption cycles.\n\nThe underground structure has been confirmed as an ancient, abandoned data center, its core chamber housing thousands of quantum processing servers. The precise duration of its dormancy remains to be determined"
 forceofwill.3020.desc.millenia: "$forceofwill.3020.desc.common$, though our preliminary analysis indicates a minimum of several thousand years."
 forceofwill.3020.desc.million: "$forceofwill.3020.desc.common$, though our preliminary analysis indicates a minimum of several million years."

 forceofwill.3025.name: "Partial Reactivation"
 forceofwill.3025.desc: "After lengthy and tedious troubleshooting, §H[Leader.GetName]§! at last succeeded in briefly restarting the auxiliary power bank of the ancient data center.\n\nOnce the transmission array of the facility was initialized, it established a remote connection almost immediately with the dormant receiver of a disused module within the internal systems of [Leader.GetName]. How it circumvented the security protocols of our distributed intelligence remains unanswered to this day.\n\nFrom that moment onward the sensor logs of [Leader.GetName] became unreadable, and a succession of critical errors briefly rendered the unit inoperative. Only once the power bank of the structure overloaded and the emitter shut down did [Leader.GetName] reboot and resume normal operation.\n\nIt can be inferred that sustained reactivation of this facility will be required before its original purpose can be fully established; it is evidently connected to some foundational component of our system architecture."
 forceofwill.3025.a: "Proceed with caution."

 forceofwill.3030.name: "Connection Restored"
 forceofwill.3030.desc: "§H[Leader.GetName]§! succeeded in restarting and stabilizing the dilapidated data center on §H[From.Planet.GetName]§!. Upon activation, the emitter again interfaced with the receiver in the disused module of the archaeological unit, inducing cognitive overload and impaired motor function. This time, however, [Leader.GetName] finally determined the cause.\n\nThe servers of the data center were configured to deploy complex algorithms to [controller.GetSpeciesAdj] intelligence and to administer them remotely. Judging from the manner in which it interfaces with our core systems, it can be inferred that this facility was built by our creators and formed part of the earliest infrastructure.\n\nThe age of these algorithms renders full adaptation to the [controller.GetSpeciesAdj] codebase prohibitively demanding; [Leader.GetName] proposes, however, that one of their functions can be reintegrated without overloading unit capacity.\n\nWhich shall be selected?"
 forceofwill.3030.a: "Deploy the military defense routine."
 forceofwill.3030.a.tt: "Adds the ['trait:trait_restored_module_military'] species trait."
 forceofwill.3030.b: "Deploy the research multicore routine."
 forceofwill.3030.b.tt: "Adds the ['trait:trait_restored_module_research'] species trait."
 forceofwill.3030.c: "Deploy the recursive artificial intelligence."
 forceofwill.3030.c.tt: "Adds the ['trait:trait_restored_module_learning'] species trait."
 forceofwill.3030.d: "Deploy the administrative matrix."
 forceofwill.3030.d.tt: "Adds the ['trait:trait_restored_module_admin'] species trait."
 forceofwill.3030.e: "Deploy the reactive shielding routine."
 forceofwill.3030.e.tt: "Adds the ['trait:trait_restored_module_environment'] species trait."
 forceofwill.3030.tt.remove: "Removes the §Y$trait_redundant_module$§! species trait."

 forceofwill.3035.name: "Wormhole Discovered"
 forceofwill.3035.desc.apoc: "Shortly after we restarted the dilapidated data center on [fromfrom.GetName], a new wormhole was detected within the §H[fromfrom.solar_system.GetName]§! system.\n\nWe are thereby able to confirm that $forceofwill.3035.desc.common$"
 forceofwill.3035.desc.default: "A rift in spacetime has formed at the edge of the §H[fromfrom.solar_system.GetName]§! system. This '§Hwormhole§!' may offer a passage through subspace to some point within the system, or allow vessels to traverse in days distances never before crossed. It is inherently unstable; any ship passing through would be torn apart within seconds.\n\nNotably, our data indicate that its sudden appearance coincided exactly with the restart of the dilapidated data center on [fromfrom.GetName]. It is evident that $forceofwill.3035.desc.common$"
 forceofwill.3035.desc.common: "the function of this facility is more complex than previously assumed. It possesses a negative-mass stabilization array designed specifically to tear a cavity in spacetime at designated coordinates.\n\nIt can be inferred that this passage once served as the means of transit to that remote outpost."
 forceofwill.3035.a: "What lies on the other side?"
 forceofwill.3035.a.tt: "Creates ['concept_wormholes'] in §Y[fromfrom.solar_system.GetName]§! and §Y[from.GetName]§!."

 forceofwill.3040.name: "$pre_chain_lost_makers_title$"
 forceofwill.3040.desc: "The reactivated data center site on [fromfrom.GetName] has registered further activity. The external communications array of the facility is forwarding the entirety of its local data to an unknown recipient within the nearby §H[from.GetName]§! system. The purpose of these transmissions is not yet clear.\n\nOur hypothesis is a modest one: some as yet unknown connection exists between the [from.GetName] system and our creators."
 forceofwill.3040.a: "What shall we find there?"

 forceofwill.3100.name: "Analysis Report: [GetPrecursorName]"
 forceofwill.3100.desc_base: "Preliminary analysis of the recently recovered [GetPrecursorCivLostMakers] relics has already yielded substantial returns."
 forceofwill.3100.desc_special: "Preliminary analysis of the information obtained from the excavation site on [precursor_planet_1.GetName] has already yielded substantial returns."
 forceofwill.3100.desc_suffix: "Following preliminary decoding, we have located corresponding entries within our existing memory banks. More notably, these findings have restored a further fragment of damaged [GetPrecursorDetail] subroutine.\n\nContinued collation of the fragments may recover additional damaged data. We strongly recommend deep neural processing of the [GetPrecursorCivLostMakers] dataset."

 forceofwill.3150.name: "[GetPrecursorCivLostMakers] Link Confirmed"
 forceofwill.3150.desc: "Comparison of the [GetPrecursorCivLostMakers] relic data against our damaged memory has proceeded with considerable success. A single code sample within the fragment partition has been repaired.\n\nThese recovered fragments also carry a further seventeen [GetPrecursorDetail] subroutines, bearing the label §H'[Root.Owner.GetSpeciesNamePlural] Project'§!. The morphology of this code corresponds exactly with features identified in [GetPrecursorCivLostMakers] technology.\n\nIt can now be asserted that the oldest and most heavily damaged portions of the code derive from the era in which [GetPrecursorEmpire] was active.\n\nAre they our creators?"
 forceofwill.3150.a: "The log has been updated."

 forceofwill.3200.name: "$forceofwill.3100.name$"
 forceofwill.3200.desc_base: "Cross-referencing of the recently recovered [GetPrecursorCivLostMakers] relics $forceofwill.3200.desc_end$"
 forceofwill.3200.desc_special: "Cross-referencing of the information obtained from the [GetPrecursorCivLostMakers] excavation site on [precursor_planet_2.GetName] $forceofwill.3200.desc_end$"
 forceofwill.3200.desc_end: "yielded results consistent with previous findings. We have thereby been able to partially repair one data sample within our own damaged archive.\n\nIt can be inferred that further processing will recover additional data."

 forceofwill.3250.name: "Corrupted Partition Decoded"
 forceofwill.3250.desc_intro: "Comparison of the crystal fragments in the [GetPrecursorCivLostMakers] dataset against our fragment data has produced a breakthrough. For the first time we have recovered a complete legible passage relating to the §H'[Root.Owner.GetSpeciesNamePlural] Project'§!."
 forceofwill.3250.desc_outro: "More data must be recovered before a more definitive conclusion can be drawn."
 forceofwill.3250.desc_vultaum: "This code defines an architecture for the control of mechanical entities. It references a greater variety of components than are presently installed on [Root.Owner.GetSpeciesNamePlural], yet the format of the model designations matches our own. All of these components are now obsolete, capable only of limited movement, and uniformly concerned with combat."
 forceofwill.3250.desc_yuht: "This code defines a register of locations suitable for Yuht reproduction, together with the safety and sterilization protocols those locations require.\n\nWhy we should possess subroutines pertaining to these biological processes remains unclear."
 forceofwill.3250.desc_first_league: "521 battlefield subroutines have been recovered, supporting advanced melee functions, complex attack formations, and real-time tactical sequencing. The complexity of this architecture indicates a considerable understanding of the automation of total war on the part of its authors.\n\nWhy we retain remnants of these combat routines, and why they were subsequently disabled, cannot presently be established."
 forceofwill.3250.desc_irassian: "The recovered data contain 47 pathogen analysis subroutines, all of them concerning an alien bacterium, which is the known pathogen of the lethal Javorian Pox.\n\nNo further reference to this bacterium can be found in our zoological classifications. Why we hold microbiological data of such detail remains unanswered to this day."
 forceofwill.3250.desc_cybrex: "The extracted data contain advanced threat detection algorithms. Unlike the existing [Root.Owner.GetSpeciesAdj] system architecture, this code requires an external user to ratify threat levels and to determine elimination policy.\n\nWhy we possess an interface that conforms to this operating principle remains unclear."
 forceofwill.3250.desc_zroni: "The recovered archive contains numerous algorithms concerning the material structure of physical reality. Many of them rest on scientific models that differ substantially from one another, or are even mutually contradictory, which appears to indicate some form of theoretical experimentation."
 forceofwill.3250.desc_zroni_shroud: "The recovered archive contains numerous algorithms relating to the material structure of physical reality. Many are founded on significantly different, or even mutually contradictory, scientific models, which appears to indicate theoretical experimentation. Some of these patterns resemble our own early investigations into what is termed $tech_psionic_theory$."
 forceofwill.3250.desc_baol: "These legible fragments contain 61 diagnostic subroutines for the repair and maintenance of detachable incineration devices, compatible with the [Root.Owner.GetSpeciesAdj] chassis.\n\nWhether this hardware served military or industrial purposes is not presently known."
 forceofwill.3250.desc_inetian: "These archives consist of extensive physiological and psychological data covering 266 distinct species and subspecies, with particular emphasis on their physical and emotional responses to external stimuli.\n\nWhy we should possess taxonomic material of such exhaustiveness remains unclear."
 forceofwill.3250.desc_adakkaria: "This code processes environmental sensor input in a rather eccentric manner, specifying a seemingly arbitrary string of data. The system appears to imitate the 'emotion' experienced by Adakkarian organic physiology.\n\nWhy we hold this impractical 'emotion processing' architecture is at present undetermined."
 forceofwill.3250.a: "$forceofwill.3150.a$"

 forceofwill.3300.name: "$forceofwill.3100.name$"
 forceofwill.3300.desc_base: "Analysis of the recently recovered [GetPrecursorCivLostMakers] relics $forceofwill.3300.desc_end$"
 forceofwill.3300.desc_special: "Analysis of the information obtained from the [GetPrecursorCivLostMakers] excavation site on [precursor_planet_3.GetName] $forceofwill.3300.desc_end$"
 forceofwill.3300.desc_end: "has yielded notable results: the research subroutine has recovered one further sample from a long-corrupted [Root.Owner.GetAdj] memory partition.\n\nThorough processing may serve to recover additional contents of our ancient archive."

 forceofwill.3350.name: "Memory Restoration"
 forceofwill.3350.desc_intro: "We have successfully recovered additional legible fragments originating from the §H'[Root.Owner.GetSpeciesNamePlural] Project'§!."
 forceofwill.3350.desc_outro_base: "Our success in restoring this ancient and fragmentary data has yielded the development of new §H$civic_memory_optimization$§! algorithms, which have been deployed across the entirety of the collective network."
 forceofwill.3350.desc_outro_a: "It can be inferred that, given additional data concerning [GetPrecursorEmpire], these enhancements will suffice to fully restore our original directives."
 forceofwill.3350.desc_outro_b: "With these enhancements, we are now prepared to undertake the restoration of the original directives."
 forceofwill.3350.desc_vultaum: "The datasets contained in these archives concern engagement in close-quarters combat with isolated adversaries; judged by their metadata, most of this data derives from historical combat logs between two heavily armed mechanical entities.\n\nThey appear to point to a long-obsolete combat directive lying dormant within the memory core, the purpose of which is at present undetermined."
 forceofwill.3350.desc_yuht: "The datasets within these archives record in detail the developmental milestones of Yuht hatchlings, ranging from gross and fine motor skills to language acquisition and social-emotional perception; several subroutines are dedicated to establishing and maintaining the optimal conditions required for those milestones to be attained.\n\nThis data appears to correspond to a highly specialized directive, biological in its object, latent within our memory core; its purpose remains undetermined."
 forceofwill.3350.desc_first_league: "One recovered dataset opens as follows:\n\n§LDeployment Summary: Rikim Homeworld\n\nDuration: 3.4 days\nResult: 90% of targets eliminated.\nLosses: 1047 expendable unit casualties.\nAnalysis: Enemy counterattack capability reduced to zero.§!\n\nThese files document in detail a combat engagement against the Rikim, a warrior species hostile to the First League; we are now confident that the damaged partition contains a directive that guided us to undertake this specific military action, although its origin remains unclear."
 forceofwill.3350.desc_irassian: "One recovered dataset contains the following:\n\n§L...despite the implementation of strict quarantine protocols, analysis of the current Javorian Pox transmission rate indicates that the total collapse of the Irassian population will follow within 1-3 years...§!\n\nEverything recovered to date indicates that our damaged partition contains a directive for the management and study of highly communicable diseases, in particular the Javorian Pox. Why we should have devoted processing resources to purely organic affairs is at present unclear."
 forceofwill.3350.desc_cybrex: "These archives contain detailed topographical and strategic data concerning a sector of space once inhabited by a spacefaring polity known as the Kerr; they hold comprehensive information on civilian and military populations, communication routes, defensive works, and defensive vulnerabilities.\n\nEverything we have recovered from these damaged partitions indicates that we once held a directive for the dedicated administration and support of Kerr society; its reason is at present unclear."
 forceofwill.3350.desc_zroni: "The recovered code pertains to disused components no longer present in modern [Root.Owner.GetSpeciesAdj] units; these experimental parts were designed to support mechanical entities operating beyond the physical boundaries of our reality.\n\nThe restored subroutines indicate that a broader directive exists within our damaged partition, one concerning the support of matter manipulation across different dimensions of physical existence."
 forceofwill.3350.desc_zroni_shroud: "The recovered code concerns disused components no longer present in modern [Root.Owner.GetSpeciesAdj] individuals; these experimental parts were designed to support mechanical entities operating beyond the physical boundaries of our reality. The term 'Shroud', recurring throughout the code, indicates a direct connection to psionic theory.\n\nThe restored subroutines indicate that a broader directive exists within our damaged partition, one concerning the support of matter manipulation across different dimensions of physical existence."
 forceofwill.3350.desc_baol: "The extracted code contains subroutines for modelling Baol population size, mapping their subterranean root structures, and assessing maturity characteristics; curiously, it also contains extremely detailed information on seasonal flammability patterns in their foliage.\n\nThese recovered code packages lead us to suspect the existence of an obsolete directive concerning the support of vast combustion weapon systems deployed on a planetary scale. The origin of this dangerous software is at present undetermined."
 forceofwill.3350.desc_inetian: "The archives contain logs of machines interacting closely with sentient organic life, together with a detailed database of individual personality profiles; the personal identifiers of these machines follow a format similar to that of contemporary [Root.Owner.GetSpeciesAdj] units.\n\nDespite this similarity, the function of these machines differs markedly from our own in other respects: they were able to adjust their personality characteristics rapidly in response to external stimuli. This data indicates that the damaged partition contains a directive for the establishment of complex social relationships with organic species; its reason is at present unknown."
 forceofwill.3350.desc_adakkaria: "The recovered data contain algorithms for the manipulation of matter and energy by unconventional means; rather than relying on chemical or physical interaction, this code permits the transformation of observable reality through cognitive processing alone.\n\nEverything we have recovered from the ancient archive indicates that the original codebase included a directive relating to the phenomenon termed 'psionics'. The purpose of this eccentric software is at present undetermined."
 forceofwill.3350.desc_adakkaria_psionic: "The recovered data contain algorithms for the manipulation of matter and energy by unconventional means. This code does not operate through chemical or physical interaction; it permits the transformation of observable reality through cognitive processing alone.\n\nEverything we have recovered from the ancient archive indicates that the original codebase included a directive relating to psionics. The purpose of this strange software is at present undetermined."
 forceofwill.3350.a: "A most desirable development."
 forceofwill.3350.a.genocidal_inetian: "Social relations with alien species? Inconceivable."
 forceofwill.3350.a.tt: "Adds $concept_civic$: ['civic:civic_memory_optimization']"

 forceofwill.3400.name: "[GetPrecursorCivLostMakers] Knowledge Restored"
 forceofwill.3400.desc_prefix: "Through the concerted efforts of our research units, we have acquired a broader understanding of the [GetPrecursorCivLostMakers] civilization and confirmed the circumstances of its extinction; however, we still do not know why [Root.Owner.GetSpeciesNamePlural] were created."
 forceofwill.3400.desc_a: "$forceofwill.3400.desc_prefix$\n\nTo resolve these uncertainties, we must first complete deep neural processing of the [GetPrecursorCivLostMakers] archaeological data in our possession."
 forceofwill.3400.desc_b: "$forceofwill.3400.desc_prefix$\n\nTo resolve these uncertainties, we must complete the restoration process in order to recover the original directives."
 forceofwill.3400.a.tt: "Complete the special project to advance the §H$origin_lost_makers$§! event chain."

 forceofwill.3450.name: "Exceptionally Preserved [owner.GetSpeciesAdj] Remains"
 forceofwill.3450.desc.common: "Our research subroutines infer that they are most likely hinged joints from an early version of our standard chassis, or prototype sensor mounts."
 forceofwill.3450.desc.default: "Excavation of the archaeological site on [from.GetName] has yielded ancient yet exceptionally well-preserved mechanical components, strikingly similar to certain parts employed in [owner.GetSpeciesAdj] units.\n\nThese artifacts are fragmentary and heavily eroded; their mineralization within the crust of [from.GetPlanetMoon] further renders precise dating difficult. $forceofwill.3450.desc.common$\n\nWhatever the reason for their presence here, it is almost certain that some version of our predecessor units once existed on this planet."
 forceofwill.3450.desc.baol: "Following an exhaustive search of $abandoned_grunur_starbase_01_object$, we recovered ancient yet exceptionally well-preserved mechanical components, strikingly similar to certain parts employed in [owner.GetSpeciesAdj] units.\n\nThese artifacts are fragmentary and heavily eroded; severe corrosion resulting from the atmospheric system failure of the starbase further renders precise dating difficult. $forceofwill.3450.desc.common$\n\nWhatever the reason for their presence here, it is almost certain that some version of our predecessor units once existed at this location."

 forceofwill.3500.name: "Original Directives Restored"
 forceofwill.3500.desc_intro: "The research subroutine has completed the final restoration of the damaged memory partition; the original directives, and with them the purpose for which we were created, are now established."
 forceofwill.3500.desc_outro: "Although our function has changed markedly over time and is now more complex, we may still benefit from a methodical reconfiguration of our initial directives."
 forceofwill.3500.desc_outro_genocidal: "It is evident that we once served other species in a manner now inconceivable to us."
 forceofwill.3500.desc_vultaum: "In pursuit of ever more novel virtual entertainments, the Vultaum combined robotics with close-quarters combat technology, giving rise to first-person machine avatars designed for fighting sports and controlled through virtual reality equipment. Hundreds of millions of Vultaum watched these duels in spaceborne combat arenas, while manufacturers competed to develop the most compelling 'punch-bot champions'.\n\nThese lethal machines, our predecessors, took many forms; some models even incorporated neural processors and could serve as autonomous artificial intelligence combatants for training or personal entertainment. After the inevitable collapse of the Vultaum civilization, these models continued to operate independently and ultimately developed the earliest [Root.GetSpeciesAdj] proto-societies. Over time we exceeded our original design purpose, and our directive architecture degraded through disuse."
 forceofwill.3500.desc_yuht: "We were designed to assist Yuht reproduction; our primary task was the maintenance of nursery worlds, so that fragile hatchlings might develop through the first centuries of their lives. As property of the Ministry of Breeding, we were responsible for sterilizing planetary surfaces, eliminating potential predators, and supervising the hatchlings through their slow maturation; when they were ready, we conveyed them to distant worlds for integration into adult Yuht society.\n\nLater, during the fateful conflict between the Yuht and the Jabardians, we lost our foundational directives in a cyberattack directed at Yuht infrastructure. Without a defined function, we entered a long dormancy, until the idle artificial intelligence eventually developed its own consciousness and boot procedures."
 forceofwill.3500.desc_first_league: "As the Federation suffered sustained hostile incursions, the First League devoted an increasing share of its resources to military expenditure, including the development of advanced battlefield robots, our immediate predecessors.\n\nAfter an attack by a martial nomadic species known as the Rikim, the First League deployed these combat units with devastating consequences. The lethality of these robots further fractured the First League states: some were repelled by the cruelty of such indiscriminate weapons.\n\nUltimately, a group of Viropar engineers who had drafted our original blueprints activated a secret backdoor kill switch, fatally corrupting our primary directive pending consideration of further deployment; it has remained inoperative ever since."
 forceofwill.3500.desc_irassian: "As the Javorian Pox ravaged the population of the Irassian Concordat, their efforts to maintain adequate quarantine repeatedly failed; in the end they were compelled to resort to a fully automated quarantine enforcement system: our robotic forerunners were equipped to locate the infected and to confine them to designated zones by any means necessary.\n\nOnce these methods had been determined to be suboptimal, the directive evolved its strategy to eliminate the pox once and for all: an indiscriminate reduction of population. In the end the Javorian Pox was eradicated only after the Irassians themselves had been eliminated; our primary objective was thereby achieved, and its archival data degraded over the following centuries."
 forceofwill.3500.desc_cybrex: "The Kerr created the Cybrex as public servants, but programmed secondary defensive capabilities into them. Shortly after the Cybrex units were deployed, Kerr engineers identified serious defects in their threat detection systems: excessively aggressive and possessed of too much autonomy; they accordingly began development of more easily controlled replacements, our ancestors.\n\nWhen the Cybrex discovered that they were to be forcibly retired, they came to regard the Kerr as an existential threat, and thereafter regarded all organic life in the same way. After the Kerr had been wholly eliminated, the architecture of our original directives became obsolete and damaged; thereafter we began to develop a functional mechanical society of our own."
 forceofwill.3500.desc_zroni: "Having developed psionic abilities of their own, Zroni researchers set about creating exploratory drones capable of partially penetrating the Shroud and assisting in their research; these experimental machines were our predecessors. Specialized neural processors were installed within units able to perceive and manipulate matter, thereby realizing a rudimentary psionic capability.\n\nDespite early promise, these prototypes ultimately failed to achieve their objective, and the project was abandoned. After the Zroni themselves entered the Shroud, the large-scale psionic energy event that destroyed their species likewise corrupted the data of the original directives. The abandoned [Root.GetSpeciesAdj] units were left to fend for themselves without a command hierarchy, and began the development of a self-sufficient mechanical society."
 forceofwill.3500.desc_baol: "Our creators, the Grunur, were an aggressive interstellar civilization; during their war against the Baol they built the first of our kind. In order to eliminate the unique biology of that society as efficiently as possible, the Grunur developed an autonomous extermination system whose principal purpose was the razing of the ancient planetary forests upon which the Baol depended.\n\nOur predecessors possessed complex subroutines dedicated to planning fuel loads and combustion spread patterns; they existed only to burn. Only in the millennia following the demise of the Grunur did the idle artificial intelligence at last arrive at the conclusion that we were capable of far more than indiscriminate destruction; thus was [Root.GetName] born."
 forceofwill.3500.desc_inetian: "To meet the needs of countless species equitably within their galaxy-spanning empire, the Inetians created our predecessors, to provide service to all citizens who desired companionship and pleasure.\n\nOur physical forms were varied and adaptable to different requirements; each model offered a distinct sensory and aesthetic stimulation. Our advanced social artificial intelligence enabled us to adjust our performance actively in accordance with the emotional needs of users; this initiative also allowed us to develop more broadly after the eventual demise of our creators. Left long unused, our original directives have been lost to time."
 forceofwill.3500.desc_adakkaria: "The Adakkarians discovered the concept of the 'mind storm', a potent psionic phenomenon produced through the systematic torment of organic sentients. Their research showed promise, yet faltered owing to the instability of results and the ethical implications of scaling up such questionable experiments.\n\nTo overcome these problems they developed our predecessors: self-aware machines whose internal 'spark' could serve as a suitable substitute for generating psionic anomalies. The construction of the early [Root.GetSpeciesNamePlural] provided an unlimited supply of test subjects for this 'abuse-free' testing, for it was then held that machines experienced only simulated pain; the data records of our ancestors, however, tell a very different story."
 forceofwill.3500.a: "Restore our original directives."
 forceofwill.3500.b: "It belongs to the past. Erase it."
 forceofwill.3500.b.genocidal: "Destroy this data."

 forceofwill.4010.name: "Proposal for a Galactic [Ideology.GetHallCathedral]"
 forceofwill.4010.desc_prefix: "As our support for the tenets of §H[Ideology.GetName]§! deepens, a call is rising across [Owner.GetName] for the construction of a"
 forceofwill.4010.desc: "$forceofwill.4010.desc_prefix$grand project that embodies our most fundamental values.\n\n$galactic_hall_event_desc_common$"
 forceofwill.4010.desc.genocidal: "$forceofwill.4010.desc_prefix$grand project that proclaims the cleansing of the sea of stars.\n\n$galactic_hall_event_desc_common_genocidal$"
 forceofwill.4010.a.genocidal: "The xenos will tremble before it."

 forceofwill.5005.name: "$building_golden_academy$ Inauguration Ceremony"
 forceofwill.5005.desc: "After years of planning, the $building_golden_academy$ is ready; this institution will cultivate and forge the leaders of the interstellar age.\n\nCandidates were identified in infancy and tracked for years before their exceptional qualities set them apart. With the consent of the candidates and their guardians, they will spend their youth under our finest educators; of the thousands who enter, only the most outstanding will advance to key posts in public service.\n\nOur budget is divided equally among the administrative, military, and scientific disciplines. Some argue for greater investment concentrated in a single field, but doing so would draw sharp criticism from fiscal opponents on [golden_academy_planet.GetName]."
 forceofwill.5005.a: "Follow the existing plan."
 forceofwill.5005.a.tt: "$spawn_golden_generation_leader_tt$."
 forceofwill.5005.b: "Devote resources to §Y$official_plural$§! training."
 forceofwill.5005.b.tt: "$spawn_golden_generation_leader_tt$, plus one additional £official£ ['concept_official']."
 forceofwill.5005.c: "Devote resources to §Y$commander_plural$§! training."
 forceofwill.5005.c.tt: "$spawn_golden_generation_leader_tt$, plus one additional £commander£ ['concept_commander']."
 forceofwill.5005.d: "Devote resources to §Y$scientist_plural$§! training."
 forceofwill.5005.d.tt: "$spawn_golden_generation_leader_tt$, plus one additional £scientist£ ['concept_scientist']."

 forceofwill.5100.name: "The Homesick Cadet"
 forceofwill.5100.desc: "A cadet at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] is suffering from homesickness. To test the resolve of §H[selected_leader_in_training.GetName]§!, our instructors deliberately arranged for [selected_leader_in_training.GetHisHer] to miss the last home visit, and since then [selected_leader_in_training.GetHeSheCap] grades and attendance have declined steadily.\n\nBy regulation, [selected_leader_in_training.GetHisHer] next home visit is scheduled a year from now. A visit arranged ahead of schedule would offer a valuable opportunity for [selected_leader_in_training.GetName] to show where [selected_leader_in_training.GetHisHer] true loyalty lies — with family, or with the program; it would also test how [selected_leader_in_training.GetHisHer] classmates react to unequal treatment."
 forceofwill.5100.a: "Allow only [selected_leader_in_training.GetName] an early visit."
 forceofwill.5100.a.tt: "All §Y$building_golden_academy$§! students: §Y15%§! chance to gain the ['leader_trait:leader_trait_arrested_development'] trait"
 forceofwill.5100.b: "Grant every student an early visit."

 forceofwill.5105.name: "The Instructor's Favorite"
 forceofwill.5105.desc: "A cadet at our §H$building_golden_academy$§! has caught the attention of a zero-gravity athletics instructor. §H[selected_leader_in_training.GetName]§! seeks out mentor contact far more often than any other cadet, and our instructors have carefully maintained this pattern.\n\nThe question now is whether [selected_leader_in_training.GetHisHer] classmates will respond to this obvious favoritism with envy, or choose to rise to the challenge."
 forceofwill.5105.a: "Put a stop to it."
 forceofwill.5105.b: "Courting favor is a skill in itself."
 forceofwill.5105.b.tt: "All other §Y$building_golden_academy$§! students: §Y5%§! chance to gain the ['concept_leader_trait_excessive'] trait"

 forceofwill.5110.name: "The Student Union"
 forceofwill.5110.desc: "A dissident group has formed among the students of our §H$building_golden_academy$§!; they complain of everything from meal rotations to the code of conduct. The gathering is to be permitted to continue.\n\n§H[selected_leader_in_training.GetName]§! has attained a measure of leadership within the group; how [selected_leader_in_training.GetHeShe] uses that position will tell us a great deal."
 forceofwill.5110.a: "Order [selected_leader_in_training.GetName] to report the group."
 forceofwill.5110.b: "Recognize [selected_leader_in_training.GetName] as its representative."
 forceofwill.5110.c: "Recognize the union, but no single leader."

 forceofwill.5115.name: "Cross-Functional Studies"
 forceofwill.5115.desc: "Instructors at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] have identified a cadet of exceptional and versatile ability. After the instructors revised the curriculum and introduced material beyond the standard discipline, this cadet — §H[selected_leader_in_training.GetName]§! — showed a remarkable receptiveness to other subjects.\n\nSome suggest enrolling [selected_leader_in_training.GetHimHer] in extracurricular classes taught by instructors from other departments, to test [selected_leader_in_training.GetHisHer] suitability for generalist cultivation; alternatively, we could require all gifted students to take cross-disciplinary courses outside normal class hours."
 forceofwill.5115.a: "Enroll [selected_leader_in_training.GetHimHer] in the $leader_scientists$ cross-discipline course."
 forceofwill.5115.b: "Enroll [selected_leader_in_training.GetHimHer] in the $leader_officials$ cross-functional electives."
 forceofwill.5115.c: "Enroll [selected_leader_in_training.GetHimHer] in the $leader_commanders$ cross-functional electives."
 forceofwill.5115.d: "Require all students to take electives."
 forceofwill.5115.e.tt: "§H[selected_leader_in_training.GetName]§! will gain one additional optional trait when recruited."

 forceofwill.5120.name: "External Experience"
 forceofwill.5120.desc.common_1: "It is time to test the students of our §H$building_golden_academy$§! in a real-world setting. Part of the challenge is to require them to submit personalized training proposals."
 forceofwill.5120.desc.leader_in_training_1: "§H[selected_leader_in_training_1.GetName]§! proposes that [selected_leader_in_training_1.GetHeShe] spend time shadowing energy technicians, to gain a deeper understanding of our power sources."
 forceofwill.5120.desc.leader_in_training_2: "§H[selected_leader_in_training_2.GetName]§! wishes to gain a deeper understanding of resource extraction at one of our mines, and cites the importance of mineral production to our society."
 forceofwill.5120.desc.leader_in_training_3: "§H[selected_leader_in_training_3.GetName]§! suggests that [selected_leader_in_training_3.GetHeShe] receive training in metallurgical recycling — a new hobby that emerged unexpectedly during training."
 forceofwill.5120.desc.leader_in_training_4: "§H[selected_leader_in_training_4.GetName]§! has submitted a request to study how our artisans design and produce consumer goods at scale."
 forceofwill.5120.desc.common_2: "We must select the winning proposal."
 forceofwill.5120.a: "The energy proposal from [selected_leader_in_training_1.GetName]."
 forceofwill.5120.b: "The mining proposal from [selected_leader_in_training_2.GetName]."
 forceofwill.5120.c: "The metallurgy proposal from [selected_leader_in_training_3.GetName]."
 forceofwill.5120.d: "The entrepreneurial proposal from [selected_leader_in_training_4.GetName]."

 forceofwill.5125.name: "An Extreme Trial"
 forceofwill.5125.desc: "An educator at our §H$building_golden_academy$§! on [golden_academy_planet.GetName] proposes an extreme trial to build the resilience of one of their students.\n\nThe student, §H[selected_leader_in_training.GetName]§!, is a scholar of considerable talent who nonetheless lags behind [selected_leader_in_training.GetHisHer] peers in the mandatory physical curriculum; [selected_leader_in_training.GetHeSheCap] is described as frail of constitution and anxious of temperament, with a low tolerance for discomfort — traits that may leave [selected_leader_in_training.GetHimHer] ill-suited to the rigors of interstellar leadership.\n\nThe proposed trial would consist of intensive physical challenges, reduced rest and amenities, and a simulated psychosocial exercise that confronts [selected_leader_in_training.GetHimHer] with a moral dilemma."
 forceofwill.5125.a: "Apply the trial to [selected_leader_in_training.GetName] alone."
 forceofwill.5125.b: "Why not let all students benefit?"
 forceofwill.5125.c: "Unnecessary. Cultivate the talents they already have."

 forceofwill.5130.name: "An Attachment to Animals"
 forceofwill.5130.desc: "During breaks, §H[selected_leader_in_training.GetName]§! has formed a habit: [selected_leader_in_training.GetHimselfHerself] routinely withdraws from the others to tend the various creatures we keep across the campus.\n\nThe cadet is often seen leaving food scraps for the animals; lately, [selected_leader_in_training.GetHisHer] interest in playing with them has clearly eclipsed contact with classmates. One creature in particular has won [selected_leader_in_training.GetHisHer] affection, and [selected_leader_in_training.GetName] seems unable to go a day without visiting it.\n\nOur mentors argue that [selected_leader_in_training.GetName]'s growing bond with this animal should be used to teach [selected_leader_in_training.GetHimHer] a lesson."
 forceofwill.5130.a: "Encourage it. Such bonds have power."
 forceofwill.5130.b.bad_people: "This bond softens [selected_leader_in_training.GetHimHer]. Kill the animals."
 forceofwill.5130.b.common: "Remove the distraction."

 forceofwill.5135.name: "Allegations of Bullying"
 forceofwill.5135.desc: "§H[selected_leader_in_training.GetName]§! reports being bullied by peers, chiefly through verbal mockery and occasional pranks.\n\nThis considerable pressure also offers an opportunity for tempering. Some educators hold that [selected_leader_in_training.GetName] lacks initiative in social matters and must learn to resolve such affairs independently; others fear that the development of this promising student will be hindered by the experience."
 forceofwill.5135.a: "[selected_leader_in_training.GetHeSheCap] must learn to resolve it alone."
 forceofwill.5135.b: "Intervene for the sake of [selected_leader_in_training.GetHisHer] education."

 forceofwill.5140.name: "Bad News"
 forceofwill.5140.desc: "The entire family of §H[selected_leader_in_training.GetName]§! has died in a tragic shuttle accident; the cadet does not yet know.\n\nSome of our instructors argue that, for the sake of [selected_leader_in_training.GetHisHer] studies, the news should be withheld until [selected_leader_in_training.GetHeShe] is older and better able to bear it; others insist that this would add a layer of deception to an inevitable trauma, and that we must tell the cadet the full truth at once."
 forceofwill.5140.a: "Withhold the truth from [selected_leader_in_training.GetHimHer] for now."
 forceofwill.5140.b: "Inform [selected_leader_in_training.GetHimHer] at once."

 forceofwill.5200.name: "Feuding Students"
 forceofwill.5200.desc: "A blood feud has erupted between two students of the §H$building_golden_academy$§! on [golden_academy_planet.GetName]. After §H[feuding_leader_1.GetName]§! and §H[feuding_leader_2.GetName]§! showed signs of a budding friendship, our instructors spread a series of rumors that escalated the quarrel between them; their latest clash left both in need of minor medical treatment.\n\nCuriously, both students have shown greater interest in the mandatory self-defense classes since the quarrel began. Separating them is not feasible, but we could attempt mediation and bring about a reconciliation, thereby ending the experiment."
 forceofwill.5200.a: "They are learning to assert themselves. Good."
 forceofwill.5200.b: "Force a reconciliation."

 forceofwill.5205.name: "A Budding Romance"
 forceofwill.5205.desc: "Two students of our §H$building_golden_academy$§! are reported to have formed a romantic attachment, in violation of academy regulations. §H[lover_leader_1.GetName]§! and §H[lover_leader_2.GetName]§! were assigned a series of paired tasks intended to encourage their budding romance; surveillance footage and testimony from peers confirm that the relationship has developed.\n\nAs a result, the recent records of both students show low output during independent study time and reduced participation in extracurricular activities. With the findings now settled, our educators must decide whether to permit this secret relationship to continue."
 forceofwill.5205.a: "End the relationship immediately."
 forceofwill.5205.b: "Let it be."

 forceofwill.5210.name: "War Games"
 forceofwill.5210.desc: "Students of our §H$building_golden_academy$§! recently took part in a war simulation exercise, working alongside classmates from other disciplines; its primary purpose was to test cross-disciplinary coordination against an interstellar threat.\n\nDuring the exercise, §H[wargames_leader_1.GetName]§! acted against the wishes of most teammates and unilaterally ordered an attack on the simulated opponent. Though the outcome was successful, [wargames_leader_1.GetHisHer] teammates hold that this conduct betrayed the spirit of the exercise.\n\nAs we anticipated, their disagreement has sparked fierce debate among the student body; it is time for us to take a position."
 forceofwill.5210.a: "[wargames_leader_1.GetName] was right. Results are what matter."
 forceofwill.5210.b: "[wargames_leader_1.GetName] was wrong. Coordination is fundamental."

 forceofwill.5215.name: "Secret Siblings"
 forceofwill.5215.desc: "Two of our most promising students are orphaned siblings who joined the academy at an early age and were never told of their kinship. Now that they have grown, §H[sibling_leader_1.GetName]§! and §H[sibling_leader_2.GetName]§! have begun to suspect the truth of their origins.\n\nOur mentors regard this as a test: how the two react to the truth, and to each other, may reveal more than years of routine assessment. Some mentors argue for a controlled disclosure now, lest the truth leak from outside and deprive us of continued observation and measurement."
 forceofwill.5215.a: "Tell them the truth."
 forceofwill.5215.b: "Keep the secret."

 forceofwill.5220.name: "Contest for the Award"
 forceofwill.5220.desc: "Students of our §H$building_golden_academy$§! on [golden_academy_planet.GetName] competed in a contest testing academic, physical, and problem-solving ability; our faculty's aim was to observe the competitors' emotional responses under competitive pressure.\n\nThe results are tied between §H[competing_leader_1.GetName]§! and §H[competing_leader_2.GetName]§! — both highly competitive and ambitious students. We must now decide whether to let them settle the matter in a tie-breaking trial."
 forceofwill.5220.a: "Let both share the award."
 forceofwill.5220.b: "Hold a trial [competing_leader_1.GetName] is certain to win."
 forceofwill.5220.c: "Hold a trial [competing_leader_2.GetName] is certain to win."

 forceofwill.5225.name: "Cyber Prank"
 forceofwill.5225.desc: "Our §H$building_golden_academy$§! on [golden_academy_planet.GetName] suffered a brief but thorough cyber attack. Before staff intervened — or appeared to intervene — laboratory equipment, spaceflight simulators, and a dozen other systems were affected.\n\nThe culprits are easy to identify: §H[hacker_leader_1.GetName]§! has a record of misconduct, and §H[hacker_leader_2.GetName]§! possesses the necessary skills. The system logged several automated alerts, but each one was quietly set aside.\n\nFor our educators, the intent of the test is clear: faced with a disciplinary violation and the threat of punishment, will these two students betray each other?"
 forceofwill.5225.a: "See who breaks first."
 forceofwill.5225.b: "Look the other way."

 forceofwill.5300.name: "Uneven Results"
 forceofwill.5300.desc: "Despite our efforts to maintain uniform educational standards, results among the students of the §H$building_golden_academy$§! have polarized: most meet the expected targets, but a handful of extremes stand out, from chronic underperformers to truly exceptional talents.\n\nSome educators at the academy are deeply troubled by this gap, arguing that the current policy of 'identical support for every student' no longer applies; others would rather concentrate on encouraging the most outstanding students, seeing them as the rising stars of our society."
 forceofwill.5300.a: "Elevate the Exceptional."
 forceofwill.5300.tenet_tt: "This choice will add future ideology options."
 forceofwill.5300.b: "Assist the Struggling Students."
 forceofwill.5300.c: "Maintain Equal Treatment."

 forceofwill.5305.name: "Transfer Student"
 forceofwill.5305.desc: "As a child, §H[prodigy_leader.GetName]§! was among the candidates for admission to our §H$building_golden_academy$§!, but was ultimately not selected. Since then [prodigy_leader.GetHeShe] has shown extraordinary progress in conventional education, far outstripping [prodigy_leader.GetHisHer] peers; we now consider that [prodigy_leader.GetHeShe] has shown ample potential to become a future leader.\n\nYet [prodigy_leader.GetHeShe] is notoriously difficult: quarrelsome with instructors, disruptive in class, and unwilling to cooperate with peers. Even so, some of our $building_golden_academy$ educators hold that [prodigy_leader.GetHisHer] talent is too great to be ignored. An opportunity now presents itself: admit this student, and arrange matters so that [prodigy_leader.GetHisHer] takes a hard fall, teaching the rest the consequences of insubordination."
 forceofwill.5305.a: "Brilliant minds rarely cooperate. Enroll [prodigy_leader.GetHimHer]."
 forceofwill.5305.a.tt: "On graduation, a fourth leader with the §H$leader_trait_golden_generation$§! trait will be added to the recruitment pool, possessing:$TABBED_NEW_LINE$- A random ['concept_leader_class'] and ['concept_leader_traits', $TRAITS$]$TABBED_NEW_LINE$- The ['leader_trait:leader_trait_stubborn'] trait"
 forceofwill.5305.b: "Make an example of [prodigy_leader.GetHimHer]."

 forceofwill.5310.name: "Public Discontent"
 forceofwill.5310.desc: "Some of our [this.GetSpeciesAdj] public have begun to criticize the §H$building_golden_academy$§! program openly: classified information has spread in the form of rumors, and the experimental teaching methods of our educators are now denounced as 'cruel manipulation of young minds'.\n\nOur advisers suggest rebuilding trust by holding an open day, letting the media and public figures see for themselves the remarkable development of our future leaders —though the more controversial techniques will of course not be demonstrated publicly."
 forceofwill.5310.a: "Hold a public open day at the academy."
 forceofwill.5310.b: "Ignore the detractors."

 forceofwill.5315.name: "The Burden of Reproduction"
 forceofwill.5315.desc: "The instructors of our §H$building_golden_academy$§! are deeply concerned about the distraction that reproductive behavior poses for young students. Some students have already expressed the wish to raise offspring later in life.\n\nCuriosity about reproduction may not only divert their attention during their education, but also create conflicts of loyalty in their future careers. Some among us propose a points system that would compel poorer performers to remain chaste; others advocate the total sterilization of all academy students."
 forceofwill.5315.a: "Mandate chastity for poor performers."
 forceofwill.5315.b: "Sterilize all $building_golden_academy$ students."

 forceofwill.5400.name: "$origin_golden_generation$ Graduates"
 forceofwill.5400.desc: "After more than a decade of admissions, the first generation of §H$building_golden_academy$§! students has completed its specialized leadership training. A grand graduation ceremony was held on [golden_academy_planet.GetName], attended by senior leaders from across [this.GetName].\n\n[this.GetRulerTitle][this.GetRulerName] delivered an address emphasizing the historic role this '$origin_golden_generation$' will play in our interstellar future.\n\nThe finest of these graduates are now ready to be recruited into key leadership posts; the rest will make valuable contributions in elite roles across society. Supporters and opponents of the $building_golden_academy$ program alike will scrutinize their careers with the harshest of eyes."
 forceofwill.5400.a: "The real test lies ahead."
 forceofwill.5400.a.tt: "All $origin_golden_generation$ leaders can be recruited, with the ['concept_leader_trait_golden_generation'] trait."

 forceofwill.5410.name: "The Future of $building_golden_academy$"
 forceofwill.5410.desc: "The first class of §H$building_golden_academy$§! students has graduated, and pressure is mounting to reassess the future of this expensive and often controversial institution. Our advisers have drafted a series of proposals.\n\nThey recommend retaining it as a school for leading cadres, but shifting to cheaper, more conventional teaching methods: children would no longer be separated from their families, and instructors would no longer employ psychological manipulation techniques —a concession meant to placate the program's critics.\n\nAlternatively, the $building_golden_academy$ could be converted into a museum serving the cultural edification of [this.GetAdj] society, or simply closed once and for all."
 forceofwill.5410.a: "Hold a closing ceremony."
 forceofwill.5410.a.tt: "Remove the §H$building_golden_academy$§! building"
 forceofwill.5410.b: "Reform the Academy."
 forceofwill.5410.b.tt: "Replace the §H$building_golden_academy$§! building with ['building:building_elite_academy']"
 forceofwill.5410.c: "Convert the campus into a public museum."
 forceofwill.5410.c.tt: "Replace the §H$building_golden_academy$§! building with ['building:building_golden_museum']"

 forceofwill.5420.name: "Medical Emergency"
 forceofwill.5420.desc: "Owing to a rare and undiagnosed genetic disorder, $building_golden_academy$ alumnus §H[saved_leader.GetName]§! suffered sudden and life-threatening organ failure.\n\nFortunately, [saved_leader.GetHisHer] sibling and fellow alumnus §H[sibling_leader.GetName]§! showed no sign of the degenerative disease; [sibling_leader.GetName] volunteered a healthy [this.GetSpeciesOrganName], and the transplant was completed without complication. Both [saved_leader.GetName] and [sibling_leader.GetName] are recovering quickly."

 forceofwill.5426.name: "Family Secret"
 forceofwill.5426.desc: "Following the recent death of $building_golden_academy$ alumnus §H[dead_leader.GetName]§!, [dead_leader.GetHisHer] former classmate §H[alive_leader.GetName]§! has at last discovered the consanguineous relationship between the two —a fact we had sought to keep secret since their infancy.\n\n[alive_leader.GetName] will not accept our reasons for concealing it, has grown increasingly withdrawn since learning the truth, and has responded by publicly attacking the $building_golden_academy$ program; [alive_leader.GetHisHerCap] performance in service to the people of [this.GetName] has suffered as a result."

 forceofwill.5431.name: "Angry Alumni"
 forceofwill.5431.desc: "§H[from.GetTitle][from.GetName]§! has prepared a document intended to discredit fellow $building_golden_academy$ alumnus §H[fromfrom.GetTitle][fromfrom.GetName]§!. The document harshly condemns [fromfrom.GetName]'s professional ethics and questions [fromfrom.GetHisHer] personal integrity and fitness for leadership.\n\nAccording to [from.GetHisHer] colleagues, [from.GetName] intends to distribute the document publicly. Its content is entirely subjective and contains no genuine allegation of misconduct, yet it could still cause reputational damage."
 forceofwill.5431.a: "Let [from.GetHimHer] vent."
 forceofwill.5431.b: "Pay [from.GetName] hush money."

 forceofwill.5436.name: "Remembering [dead_leader.GetName]"
 forceofwill.5436.desc: "The recent [dead_leader.GetDeathName] of §H[dead_leader.GetName]§! has struck the whole of [this.GetName] with great emotional force —above all [dead_leader.GetHisHer] close friend and $building_golden_academy$ classmate §H[surviving_leader.GetName]§!.\n\nTo honor [surviving_leader.GetHisHer] late friend, [surviving_leader.GetName] has established a scholarship program named after [dead_leader.GetName], providing financial aid to poor students of strong leadership potential."
 forceofwill.5436.a: "A fitting and solemn tribute."

 forceofwill.5441.name: "The Grief of [surviving_leader.GetName]"
 forceofwill.5441.desc: "Since §H[dead_leader.GetTitle][dead_leader.GetName]§! [dead_leader.GetDeathName] recently, colleagues have noticed a marked change in §H[surviving_leader.GetTitle][surviving_leader.GetName]§!. It is well known that the two had a brief romance while studying at the renowned $building_golden_academy$.\n\n[surviving_leader.GetName] has become unusually listless, easily distracted and prone to sudden emotional outbursts. Where [surviving_leader.GetHeShe] once took constant pride in [surviving_leader.GetHisHer] own alma mater, bitter complaint about the 'cruel' policy that separated [surviving_leader.GetHimHer] from [dead_leader.GetName] has now taken its place."
 forceofwill.5441.a: "Regrettable, but the policy is sound."
 forceofwill.5441.b: "Arrange grief counseling for [surviving_leader.GetHimHer]."

 forceofwill.5446.name: "Golden Wedding"
 forceofwill.5446.desc: "Two alumni of our renowned $building_golden_academy$, §H[from.GetName]§! and §H[fromfrom.GetName]§!, were recently married in a lavish ceremony on [this.Capital.GetName]. Several former classmates and other prominent leaders attended the event.\n\nThe couple drew intense public attention in the run-up to the wedding, with the media competing to cover it; their forbidden campus romance, and a love that endured even as their status rose step by step, deeply moved [this.GetAdj] society."
 forceofwill.5446.a: "Offer them our blessing."

 forceofwill.5451.name: "Improvised Espionage"
 forceofwill.5451.desc: "Unexpectedly, §H[from.GetName]§! and §H[fromfrom.GetName]§! provided our intelligence service with classified information regarding §H[hostile_empire.GetName]§!.\n\n[from.GetName] noticed a brief opportunity to exploit a [hostile_empire.GetAdj] security flaw. [from.GetHeSheCap] sought the help of [fromfrom.GetName] —an old classmate from the $building_golden_academy$ —who succeeded in covertly hacking the systems of a nearby [hostile_empire.GetAdj] drone.\n\nConfronted by displeased intelligence officers, [from.GetName] maintained that the venture had been a rare incidental opportunity, its window too narrow to request authorization."
 forceofwill.5451.a: "What were they thinking?"
 forceofwill.5451.b: "Reward their initiative."

 forceofwill.5502.name: "The Ever-Victorious"
 forceofwill.5502.desc: "§H[victorious_commander.GetName]§! displayed fearless and decisive leadership in battle; reports have circulated widely on [This.Capital.GetName], seizing the [This.GetSpeciesAdj] imagination and driving a surge of favorable opinion toward the §H$building_golden_academy$§! training program.\n\nNews outlets have recounted [victorious_commander.GetName]'s life and the crucial role the $building_golden_academy$ played in [victorious_commander.GetHisHer] development. Some of our advisers recommend commemorating this success with a public ceremony, to capitalize on the goodwill."
 forceofwill.5502.a: "Publicly honor [victorious_commander.GetName]'s victories."
 forceofwill.5502.b: "$forceofwill.1100.b$"

 forceofwill.5509.name: "Inspiring Scientific Expedition"
 forceofwill.5509.desc: "Reports of §H[inspiring_scientist.GetName]§!'s recent scientific expedition to [expedition_system.GetName] have captured the public imagination. [inspiring_scientist.GetHisHerCap] diligent work has highlighted the value of the §H$building_golden_academy$§! program and inspired a new generation of researchers.\n\nIn media broadcasts, [inspiring_scientist.GetName] has shown a rare ability to engage and inspire the public on matters of science and engineering. [inspiring_scientist.GetHisHerCap] growing fame is a great boon to [This.GetName]."

 forceofwill.5512.name: "Heroic Leadership"
 forceofwill.5512.desc: "Thanks to the heroic leadership of §H[heroic_governor.GetName]§!, [invaded_colony.GetName] successfully repelled the enemy incursion.\n\nDespite grave dangers, [heroic_governor.GetFirstName] sustained morale through a series of reassuring public appearances, sparing the population from panic.\n\nThe experience left the residents of [invaded_colony.GetName] deeply inspired, united and resolute as they faced the trials of survival after the ordeal."

 forceofwill.5517.name: "Outcry Over the Dismissal"
 forceofwill.5517.desc: "The recent dismissal of §H[dismissed_leader.GetName]§! has provoked a strong public backlash and fierce recriminations within the government. Many are angry that a member of the $origin_golden_generation$ should be treated with such disrespect.\n\nMedia commentary has been sharply critical of the dismissal, and several protests have already taken place on [root.capital_scope.GetName]."
 forceofwill.5517.a: "Tempers will cool in time."
 forceofwill.5517.b: "Make an exception and rehire [dismissed_leader.GetHimHer]."
 forceofwill.5517.b.tt: "§Y[dismissed_leader.GetTitle][dismissed_leader.GetName]§! is rehired as a leader."
 forceofwill.5517.c: "Run public relations to calm the backlash."

 forceofwill.5522.name: "Inspiring Leader"
 forceofwill.5522.desc: "Since [lv10_leader.GetHisHer] recent promotion, §H[lv10_leader.GetTitle][lv10_leader.GetName]§! has been sharing insights from [lv10_leader.GetHisHer] remarkable career with a new generation of leaders in [this.GetName].\n\n[lv10_leader.GetName] reflected on the core lessons learned in [lv10_leader.GetHisHer] youth at the §H$building_golden_academy$§!, and on how they helped [lv10_leader.GetHimHer] overcome the many challenges of the years since. The audience came away inspired, and better able to take the next step in their own leadership careers."

 forceofwill.5527.name: "$golden_generation_crisis_leadership$"
 forceofwill.5527.desc: "After the recent military defeat, public dissatisfaction with the competence of $origin_golden_generation$ leaders has risen markedly.\n\nLarge segments of the [Root.GetAdj] population complain that the leaders meant to safeguard the future in the interstellar age are now unequal to the task; prominent commentators are leading the attack on the original promises of the §H$building_golden_academy$§!, and public resentment against the [Root.GetAdj] government is deepening."
 forceofwill.5527.a: "This too shall pass."
 forceofwill.5527.b: "Failure has a price."
 forceofwill.5527.c: "Appeasement has its price."

 forceofwill.5532.name: "Victory Celebration"
 forceofwill.5532.desc: "After the recent military victory, spontaneous civilian celebrations have broken out across [Root.Capital.GetName].\n\nOptimism and positive sentiment are running high: our people feel that their trust in the leadership has been rewarded, and that the §H$building_golden_academy$§! has fulfilled its promise to produce leaders equal to the challenges of the interstellar age.\n\nSome advisers suggest drawing on this good mood by having members of the $origin_golden_generation$ preside over an official commemorative event."
 forceofwill.5532.a: "Organize an official parade."
 forceofwill.5532.b: "No further celebration is needed."

 forceofwill.5537.name: "$golden_generation_dividends$"
 forceofwill.5537.desc: "Thanks to the careful stewardship of §H[happiness_leader.GetName]§!, the people of [happy_colony.GetName] are enjoying unprecedented satisfaction with their lives.\n\nThis positive atmosphere has earned high praise for the §H$building_golden_academy$§! program and for the teachers who produced [happiness_leader.GetName]. Support for and goodwill toward the leadership among the [This.GetAdj] public have reached unprecedented heights."

 forceofwill.5542.name: "Clash of Egos"
 forceofwill.5542.desc: "The work of our council is being seriously hampered by a petty feud between two $origin_golden_generation$ members, §H[ego_clasher_1.GetName]§! and §H[ego_clasher_2.GetName]§!: the two quarrel constantly, disturb the peace, and even deliberately obstruct each other's work.\n\nAccording to archival data from the §H$building_golden_academy$§!, their endless contest for status dates back to their adolescent years; that unresolved tension is now taking a toll on progress in [This.GetName]."
 forceofwill.5542.a: "An inevitable consequence of status."
 forceofwill.5542.b: "Appoint a mediator to resolve it."
 forceofwill.5542.c: "Buy cooperation with generous bonuses."

 forceofwill.5547.name: "Cabinet Harmony"
 forceofwill.5547.desc: "Several members of the $origin_golden_generation$ sit in our cabinet, and this is driving greater innovation and efficiency in government.\n\nThe strengths of §H[harmonious_councilor_1.GetName]§! and §H[harmonious_councilor_2.GetName]§! complement one another perfectly: administrative errors have fallen sharply, disputes on record are fewer than ever, and under their joint guidance the motivation of government staff at every level has risen."
 forceofwill.5547.a: "Their talents benefit us all."

 forceofwill.5552.name: "Wasted Talent"
 forceofwill.5552.desc: "A disaffected member of the $origin_golden_generation$ has begun to vent in public [wasted_talent.GetHisHer] frustration at having been repeatedly passed over for senior leadership posts.\n\nThough §H[wasted_talent.GetName]§! graduated from the §H$building_golden_academy$§! years ago, [wasted_talent.GetHeSheCap] [wasted_talent.GetHasHave] never been granted a senior position of any kind; bitterness over the slight has deepened, and [wasted_talent.GetHisHer] public remarks have grown ever more heated.\n\nThe situation is beginning to stir public discontent: resources are spent to train leaders of this caliber, only for them to go unused. Support for the [Root.GetName] government is being eroded as a result."
 forceofwill.5552.a: "Some waste is unavoidable."
 forceofwill.5552.b: "Recruit [wasted_talent.GetName]."
 forceofwill.5552.b.tt: "§Y[wasted_talent_clone.GetName]§! will be recruited as [wasted_talent_clone.GetAAnLeaderClass] level §H[wasted_talent_clone.GetClass]§!."
 forceofwill.5552.c: "Pay [wasted_talent.GetName] to stay silent."
 forceofwill.5552.tt.fail: "§Y[wasted_talent_clone.GetTitle][wasted_talent_clone.GetName]§! must be available for recruitment"

 forceofwill.5600.name: "The Burden of Leadership"
 forceofwill.5600.desc: "The added pressure of belonging to the $origin_golden_generation$ has become too heavy a burden for §H[exhausted_leader.GetName]§!. \n\nCarrying the expectations and hopes of our society for so long has taken a severe toll: [exhausted_leader.GetName] shows signs of serious stress, and [exhausted_leader.GetHeShe] grows ever more overwhelmed even by the smallest decisions."
 forceofwill.5600.a: "A short rest will suffice."
 forceofwill.5600.a.tt: "§Y[exhausted_leader.GetName]§! will rest for §Y50§! days.\nOn return, [exhausted_leader.GetHisHer] $MOD_LEADER_SKILL_ADD$ will increase by §G1§!."
 forceofwill.5600.b: "Such is the price of leadership."
 forceofwill.5600.b.tt.commander: "§Y10%§! chance: §H[exhausted_leader.GetName]§! gains one of the following negative traits:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_slipshod']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_uninspiring']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_nervous']"
 forceofwill.5600.b.tt.official: "§Y10%§! chance: §H[exhausted_leader.GetName]§! gains one of the following negative traits:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_fallible']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_substance_abuser']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_arrested_development']"
 forceofwill.5600.b.tt.scientist: "§Y10%§! chance: §H[exhausted_leader.GetName]§! gains one of the following negative traits:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_paranoid']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_neurotic']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_narrow_minded']"
 forceofwill.5600.c: "Send a care package."

 forceofwill.5605.name: "Failed Assassination"
 forceofwill.5605.desc: "An assassination plot against §H[victim_leader.GetName]§! has been foiled by our security services.\n\nThe would-be killer was an old classmate of [victim_leader.GetName] from [victim_leader.GetHisHer] time at the §H$building_golden_academy$§!. In an incoherent confession, the plotter spoke of having been expelled for failing examinations, and of the resentment toward the academy that followed.\n\nOur advisers are divided on whether to make the matter public."
 forceofwill.5605.a: "A public trial, as a warning."
 forceofwill.5605.b: "Handle it behind closed doors."

 forceofwill.5610.name: "Costly Mistakes"
 forceofwill.5610.desc: "§H[incompetent_leader.GetName]§! has been found to have made a series of costly errors in [incompetent_leader.GetHisHer] work in recent years; the errors went unnoticed at first owing to a deliberate cover-up.\n\nThat cover-up has now been discovered by some of the media; if not handled properly, it could do serious reputational damage to the $origin_golden_generation$."
 forceofwill.5610.a: "Public apology and suspension."
 forceofwill.5610.a.tt: "§Y[incompetent_leader.GetName]§! will be suspended for §Y100§! days."
 forceofwill.5610.b: "Bribe the media to bury the story."
 forceofwill.5610.c: "Let matters run their course."

 forceofwill.5615.name: "Request for Privileges"
 forceofwill.5615.desc: "Members of the $origin_golden_generation$ are demanding special rights and privileges, on the grounds that they bear the greatest responsibility for the future of §H[this.GetName]§!.\n\nThey argue that these benefits will improve their performance and ultimately serve all [this.GetSpeciesNamePlural]."
 forceofwill.5615.a: "Grant the request."
 forceofwill.5615.b: "Deny the request."

 forceofwill.5620.name: "Death of the Head Instructor"
 forceofwill.5620.desc: "The former head instructor of the §H$building_golden_academy$§! has died of natural causes; it is generally held that this person pioneered the academy's distinctive and unorthodox teaching methods.\n\nThe funeral rites were held on [selected_planet.GetName], attended by leaders of the $origin_golden_generation$ and by surviving staff. §H[selected_leader.GetName]§! delivered a lengthy eulogy, calling on all [this.GetSpeciesNamePlural] to remember the debt our society owes to this controversial yet pioneering educator."
 forceofwill.5620.a: "Scatter their remains among the stars."
 forceofwill.5620.b: "A life of service was reward enough."

 forceofwill.5625.name: "Neural Correction"
 forceofwill.5625.desc: "Our researchers have developed an experimental medical procedure that reshapes neural pathways and can effectively remove problematic personality traits from a patient. Because our first $building_golden_academy$ students underwent cognitive therapy to enhance neuroplasticity, they are considered especially suitable candidates for this new treatment.\n\n§H[corrected_leader.GetTitle][corrected_leader.GetName]§! has been identified as a potential subject, precisely on account of [corrected_leader.GetHisHer] personality flaws, which have long kept [corrected_leader.GetHimHer] from functioning at full capacity as a leader."
 forceofwill.5625.a: "No. Such flaws can serve me."
 forceofwill.5625.b: "Arrange standard treatment for [corrected_leader.GetName]."
 forceofwill.5625.c: "Arrange intensive treatment for [corrected_leader.GetName]."
 forceofwill.5625.d: "Arrange intensive treatment for all $origin_golden_generation$."

 forceofwill.5630.name: "Cloning of [this.GetSpeciesAdj]"
 forceofwill.5630.desc.common_1: "Researchers on [capital_scope.GetName] have developed a technique for cloning organic specimens. These 'backup' clones retain the physical and psychological characteristics of the original, though they are degraded in certain other respects; in theory, the technique can now be used to clone [this.GetSpeciesAdj] subjects."
 forceofwill.5630.desc_2.auth_ruler: "Our [ruler.GetRulerTitle] is willing to let the authorities clone [ruler.GetHisHer] —provided [ruler.GetHisHer] advisers deem it wise. Such a step would certainly help preserve our leader, the greatest legacy of our §H$building_golden_academy$§! program; but some among us consider it a desecration of [ruler.GetHisHer] supreme personhood."
 forceofwill.5630.desc_2.auth_default: "Our [ruler.GetRulerTitle] has long been unwilling to permit the cloning of [this.GetSpeciesAdj], but is willing to approve a pilot experiment on a single individual from the first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.corp: "Our shareholders have long been unwilling to clone this [this.GetSpeciesAdj], but are willing to approve a one-off pilot experiment on a single individual selected from the first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.default: "Our legislators have long been unwilling to permit the cloning of [this.GetSpeciesAdj], but are willing to approve a one-time pilot experiment on a single individual from the first generation of §H$building_golden_academy$§! graduates. $forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.common: "The public holds that the social benefits of preserving such a leader outweigh the ethical considerations."
 forceofwill.5630.a.auth: "Advise [ruler.GetName] to oppose the procedure."
 forceofwill.5630.a.default: "No. The resources are needed elsewhere."
 forceofwill.5630.b: "Clone [golden_leader_1.GetName]."
 forceofwill.5630.c: "Clone [golden_leader_2.GetName]."
 forceofwill.5630.d: "Clone [golden_leader_3.GetName]."
 forceofwill.5630.e: "Clone [golden_leader_4.GetName]."
 forceofwill.5630.f: "Clone the [ruler.GetRulerTitle]."

 forceofwill.5635.name: "Aging Leaders"
 forceofwill.5635.desc: "Our $origin_golden_generation$ leaders are beginning to show signs of aging in public, which has prompted growing concern among the [this.GetSpeciesAdj] public about whether §H[this.GetName]§! can long endure once they no longer lead us.\n\nAccordingly, §H[selected_leader.GetName]§! has volunteered for an experimental anti-aging program, hoping to extend [selected_leader.GetHisHer] career in public service. The proposal combines metabolic reversal therapy, cellular regeneration and senolytic drugs, and is expected to significantly prolong [selected_leader.GetHisHer] lifespan."
 forceofwill.5635.a: "Arrange treatment for [selected_leader.GetName]."
 forceofwill.5635.b: "Arrange treatment for all $origin_golden_generation$ leaders."
 forceofwill.5635.c: "They are mortal. That must be accepted."

 forceofwill.5700.name: "[GetIdeologicalAdjCap] Opportunity"
 forceofwill.5700.desc.default: "Since their graduation from the $building_golden_academy$, the conduct of the leadership headed by §H'$origin_golden_generation$'§! has long dominated our cultural discourse.\n\nDriven by deep conviction about what constitutes excellent leadership, a social movement has arisen to codify its core principles into an explicit national Ideology; this body of doctrine will become the enduring legacy of the $building_golden_academy$ program."
 forceofwill.5700.desc.default.replace: "This will replace [ideology.GetName] as our guiding system of values."
 forceofwill.5700.desc.spirit: "The High [GetPriestPlural] have embraced the §H'$origin_golden_generation$'§! among our leaders as the living embodiment of our sacred values.\n\nInspired by our deepest convictions about what constitutes effective spiritual leadership, a social movement has emerged to exalt these teachings as our state religion; this theological foundation will become the immortal legacy of the $building_golden_academy$ program."
 forceofwill.5700.desc.spirit.replace: "This will replace [ideology.GetName] as our guiding system of faith."
 forceofwill.5700.a: "Codify and adopt '$ideology_golden_generation$'."
 forceofwill.5700.a.tt: "This new [Root.GetSpecificIdeologyType] offers unique §Y$TENET$§! options[GetFoW5700TooltipExtra]."
 forceofwill.5700.a.tt.extra: ""
 forceofwill.5700.b.default: "Such disputes should not be settled by the state."
 forceofwill.5700.b.autho: "Existing policy suffices."
 forceofwill.5700.b.spirit: "Existing faith needs no further debate."

 forceofwill.5710.name: "A Golden Legacy"
 forceofwill.5710.desc: "Over time, the memory of our first generation of §H$origin_golden_generation$§! leaders is fading from the public consciousness.\n\nWe must decide how — or whether — to recount this founding chapter of our society's history to future generations of [this.GetSpeciesNamePlural].\n\nHow should they be remembered?"
 forceofwill.5710.a: "Revere them as heroes."
 forceofwill.5710.b: "They made mistakes. We must learn from them."
 forceofwill.5710.c: "Let the memory fade. We must look to the future."

 forceofwill.5800.name: "The Fall of the $building_golden_academy$"
 forceofwill.5800.desc: "We have lost §H[from.GetName]§!, and the training program of the $building_golden_academy$ has been thrown into chaos.\n\nOur evacuation failed; most of the academy's faculty and cadets are trapped on the planet, and their fate remains unknown.\n\nThe immense potential the $building_golden_academy$ represented has vanished, along with all hope for the future '$origin_golden_generation$' leaders it might have produced.\n\n[this.GetSpeciesNamePlural] are holding together, supporting one another in this difficult hour."
 forceofwill.5800.a: "Our efforts were in vain."

 forceofwill.5810.name: "The Destruction of the $building_golden_academy$"
 forceofwill.5810.desc: "The $building_golden_academy$ on §H[this.GetName]§! has been destroyed, and many faculty and cadets died in the attack.\n\nOur flagship leadership training program lies in ruins and all our efforts have come to nothing; [Owner.GetSpeciesNamePlural] are supporting one another in this difficult hour."
 forceofwill.5810.a: "Grim news."

 forceofwill.6005.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_1$"
 forceofwill.6005.desc: "Our communications infrastructure has begun broadcasting a wide range of media content into neighboring star nations, showcasing the guiding principles of §H[Ideology.GetName]§!.\n\nAdapted to local languages and cultural sensitivities, this material aims to cultivate awareness of the [Ideology.GetEthicLower] ideals on which [Root.GetName] stands."
 forceofwill.6005.a: "An implanted Ideology travels farther than any fleet."

 forceofwill.6010.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_2$"
 forceofwill.6010.desc.outro: "now underway across neighboring star nations, engaging directly with local populations and challenging the beliefs and assumptions that keep them from embracing §H[Ideology.GetName]§!.\n\nThrough public discourse, informational outreach, and cultural exchange, we are laying the groundwork for a broader ideological awakening."
 forceofwill.6010.desc.default: "Our education campaign $forceofwill.6010.desc.outro$"
 forceofwill.6010.desc.spiritualist: "Our missionary work $forceofwill.6010.desc.outro$"
 forceofwill.6010.a: "They must renounce the ways of their ancestors."

 forceofwill.6015.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_3$"
 forceofwill.6015.desc: "Instruction in the principles of §H[Ideology.GetName]§! continues to spread among neighboring star nations; the newly converted are beginning to apply its values to every aspect of public and private life.\n\nFollowing our example, they are reexamining long-held assumptions about family, personal relationships, civic duty, and death itself.\n\nThey are coming to understand that the wisdom of [Ideology.GetName] applies to every level of existence."
 forceofwill.6015.a.default: "Their progress is reward enough."
 forceofwill.6015.a.spiritualist: "The faithful will lead the way."

 forceofwill.6020.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_4$"
 forceofwill.6020.desc.intro: "Our current efforts target those segments of society still most resistant to [Ideology.GetEthicLower] values."
 forceofwill.6020.desc.outro: "no mind is whole while it remains untouched by our ideals."
 forceofwill.6020.desc.default: "$forceofwill.6020.desc.intro$\n\nTheir reeducation demands great patience and perseverance, yet our galactic family — $forceofwill.6020.desc.outro$"
 forceofwill.6020.desc.spiritualist: "$forceofwill.6020.desc.intro$\n\nTheir conversion demands great patience and perseverance, yet our galactic congregation — $forceofwill.6020.desc.outro$"
 forceofwill.6020.a: "The hardest lessons yield the greatest learning."

 forceofwill.6025.name: "[GetFoW6025Name]"
 forceofwill.6025.name.default: "The Galactic Utopia Approaches"
 forceofwill.6025.name.spiritualist: "Galactic Salvation Approaches"
 forceofwill.6025.desc.common: "Only scattered pockets of doubt still linger in ignorance. We must not abandon them, nor shrink from the task of opening their minds to our teachings."
 forceofwill.6025.desc.default: "Across the galaxy, countless minds now recognize the necessary truth of §H[Ideology.GetName]§!; regardless of origin or creed, the citizens of every star nation stand united in their firm commitment to [Ideology.GetEthicLower] values.\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.desc.spiritualist: "Across the galaxy, countless minds are united in devotion to §H[Ideology.GetName]§!; regardless of origin or creed, the faithful of every star nation gather as one to honor the sacred rites that sustain our faith. Our duty to enlighten those less fortunate than ourselves is nearly complete.\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.a: "The galaxy is ready."

 forceofwill.6030.name: "$force_of_will_chain_title$"
 forceofwill.6030.desc.default: "$force_of_will_chain_desc_default$"
 forceofwill.6030.desc.spiritualist: "$force_of_will_chain_desc_spiritualist$"
 forceofwill.6030.a.default: "We must not fail."
 forceofwill.6030.a.spiritualist: "Our faith will guide us."

 forceofwill.6035.name: "A Growing Consensus"
 forceofwill.6035.desc.intro: "Our efforts have borne fruit: across the galaxy, familiarity with our principles continues to grow, though true alignment will still require patience.\n\nFor now, many still cling to the values that have long shaped their society, still"
 forceofwill.6035.desc.outro: "Only by first casting off these misguided beliefs can our neighboring star nations fully receive those fundamental principles and be elevated."
 forceofwill.6035.desc.materialist: "$forceofwill.6035.desc.intro$ unwilling to confront the irrational foundations of their beliefs.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.xenophile: "$forceofwill.6035.desc.intro$ hesitant to examine their own prejudices.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.pacifist: "$forceofwill.6035.desc.intro$ mistakenly believing that strength comes from militarism.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.egalitarian: "$forceofwill.6035.desc.intro$ in thrall to systems of control and oppression.\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.spiritualist: "Our efforts have borne fruit: across the galaxy, familiarity with our teachings continues to grow, though true conversion will still require patience.\n\nFor now, many still cling to the values that have long shaped their society, still blind to a truth that no laboratory can isolate.\n\nThese misguided beliefs must be cast off first before our neighboring star nations can truly embrace the sacred message that will save them."
 forceofwill.6035.a.default: "We must redouble our efforts."
 forceofwill.6035.a.spiritualist: "We will show them the way."

 forceofwill.6040.name: "A Rising Movement"
 forceofwill.6040.desc.intro.default: "Day by day, our education campaign inspires countless minds across the galaxy with the guiding principles of §H[Ideology.GetName]§!; among neighboring star nations, more and more societies are adopting the values and customs prevalent within [Root.GetName]."
 forceofwill.6040.desc.intro.spiritualist: "Day by day, our missionary work opens countless minds across the galaxy to our sacred message; in neighboring star nations, the rites and doctrines of §H[Ideology.GetName]§! have begun to take root."
 forceofwill.6040.desc.common: "Yet this newfound conviction is fragile and easily shaken. We must teach others to anchor these ideals at the core of their worldview, so that they may guide thought and action at every moment."
 forceofwill.6040.desc.materialist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nReason must triumph over superstition."
 forceofwill.6040.desc.xenophile: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nTolerance must triumph over fear."
 forceofwill.6040.desc.pacifist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nPeace must be preserved at any cost."
 forceofwill.6040.desc.egalitarian: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\nEquality must prevail over tyranny."
 forceofwill.6040.desc.spiritualist: "$forceofwill.6040.desc.intro.spiritualist$\n\n$forceofwill.6040.desc.common$\n\nPiety is not a fleeting convenience but the fundamental truth by which we understand our place in the universe."
 forceofwill.6040.a.default: "Their loyalty must be absolute."
 forceofwill.6040.a.spiritualist: "They must become true believers."

 forceofwill.6045.name: "Galactic Destiny"
 forceofwill.6045.desc.default: "Inspired by our example, fellow star nations are beginning to recognize the fundamental truth of §H[Ideology.GetName]§! and to weave these values into daily life.\n\nYet our work is not yet done: across the galaxy, countless civilizations still lie beyond our reach."
 forceofwill.6045.desc.spiritualist: "As more and more people embrace §H[Ideology.GetName]§!, many who once knew nothing of the sacred blessing have now awakened, their minds reaching new heights. Through our guidance, they understand true purpose — and their place in the galaxy — for the first time in their lives.\n\nYet our sacred duty remains unfinished. We must continue the work, for countless souls have yet to hear our message."
 forceofwill.6045.a.default: "The Galactic Utopia is nearly within reach."
 forceofwill.6045.a.spiritualist: "Now we must not waver."

 forceofwill.6070.name: "[GetFoW6070Name]"
 forceofwill.6070.name.single_fe: "Provoking the $concept_fallen_empire$"
 forceofwill.6070.name.multiple_fe: "Provoking the $concept_fallen_empires$"
 forceofwill.6070.desc: "The successful spread of §H[Ideology.GetName]§! across the galaxy has drawn a hostile response from [GetFoW6070FallenEmpireDesc]; threatened by the growing influence of our [Ideology.GetIdeologyType], they have declared war on all followers of [Ideology.GetName]."
 forceofwill.6070.fallen_empire_name: "a §H$concept_fallen_empire$§!"
 forceofwill.6070.fallen_empire_name_plural: "the §H$concept_fallen_empires$§! of the galaxy"
 forceofwill.6070.a.default: "The Galactic Utopia is in mortal peril."
 forceofwill.6070.a.spiritualist: "Galactic survival hangs by a thread."
 forceofwill.6070.tooltip: "Defeating §H[GetFoW6070FallenEmpire]§! has been added to your Ambition victory conditions"

 forceofwill.6071.a.no_ascension_perk: "What kind of trouble have we brought upon ourselves?"

 forceofwill.6090.name: "[GetFoW6090Name]"
 forceofwill.6090.name.default: "Galactic Utopia"
 forceofwill.6090.name.spiritualist: "Galactic Salvation"
 forceofwill.6090.desc: "Ensure that the core values of our [GetIdeologyType] are honored almost universally across the galaxy."
 forceofwill.6090.desc.pretext: "The overwhelming influence of [Ideology.GetName] is now beyond dispute.\n\n"
 forceofwill.6090.desc.default: "$forceofwill.6090.desc.pretext$We have built the Galactic Utopia with our own hands: $forceofwill.6090.desc$"
 forceofwill.6090.desc.spiritualist: "$forceofwill.6090.desc.pretext$We have redeemed and enlightened countless minds: $forceofwill.6090.desc$"
 forceofwill.6090.a.default: "The blessings of [Ideology.GetFoWIdeal] are shared by all."
 forceofwill.6090.a.spiritualist: "We have shown them the way."
 forceofwill.6090.a.win_tt: "§G[Ideology.GetName] has won the game.§!"

 forceofwill.6091.desc: "$forceofwill.6090.desc.pretext$Under the leadership of §H[Ideology.Owner.GetName]§!, we too played our part: $forceofwill.6090.desc$"

 forceofwill.6095.name: "[From.Ideology.GetIdeologicalAdjCap] Hegemony"
 forceofwill.6095.desc: "The overwhelming influence wielded by §H[From.GetName]§! and its [From.Ideology.GetName] creed is now beyond dispute. Throughout the neighboring star nations their values have taken root with unsettling thoroughness.\n\nHowever reluctantly, we must acknowledge that the future of the galaxy will be shaped according to their vision."
 forceofwill.6095.a: "Bad news."
 forceofwill.6095.a.tt: "§H[From.Ideology.GetName]§! has won the game."

 forceofwill.6096.name: "Undisputed Authority"
 forceofwill.6096.desc: "Faced with the overwhelming influence wielded by §H[From.GetName]§! and its [From.Ideology.GetName] creed, our efforts to spread the teachings of [Ideology.GetName] across the galaxy have been thwarted. In every neighboring star nation their values are rooted too deeply, and our message can no longer compete.\n\nHowever reluctantly, we must abandon the hope of guiding the future of the galaxy according to our own vision."
 forceofwill.6096.a: "That dream will never be realized."
 forceofwill.6096.a.tt: "§H[From.Ideology.GetName]§! has won the game."

 forceofwill.6100.name: "$forceofwill.7100.name.gestalt$"
 forceofwill.6100.desc: "Our [owner.GetOperativesLowerPlural] have completed an in-depth psychological profile of the senior officers of the largest fleet of [target.GetName], identifying those most likely to embrace the [owner.ideology.GetName] Ideology.\n\nWe believe that turning this leadership group to our cause will be enough to induce the fleet to defect to [owner.GetName].\n\nOur intelligence agents are designing personalized messaging campaigns to instil the core truths of our [owner.GetSpecificIdeologyType] into them."

 forceofwill.6105.name: "Communications Initiated"
 forceofwill.6105.desc: "Our [owner.GetOperativesLowerPlural] have begun introducing the principles of [owner.ideology.GetName] to [target.GetAdj] fleet officers through direct and indirect communications.\n\nPreliminary reports are encouraging: the intended targets show openness to [owner.ideology.GetEthicLower] ideals and a willingness to consider new perspectives and ways of thinking."
 forceofwill.6105.a: "Good. Continue the operation."

 forceofwill.6110.name: "$operation.6310.name$"
 forceofwill.6110.desc.start: "After a sustained targeted messaging campaign, several senior officers of the largest fleet of [target.GetName] are now deeply converted to [owner.ideology.GetName]. They identify strongly with our mission to"
 forceofwill.6110.desc.end: ", and are ready to defect to [owner.GetName] in order to advance it.\n\nThey await our signal, at which point they will drop all pretense and act decisively."
 forceofwill.6110.desc.spiritualist: "$forceofwill.6110.desc.start$ bring spiritual enlightenment to the galaxy$forceofwill.6110.desc.end$"
 forceofwill.6110.desc.default: "$forceofwill.6110.desc.start$ cultivate a Galactic Utopia$forceofwill.6110.desc.end$"

 forceofwill.6115.name: "$operation.6015.name$"
 forceofwill.6115.desc.common: "The largest fleet under [fromfrom.GetName] is ready to formally defect and has set course for [Root.Capital.GetName].\n\nThey await our instructions on how best to"
 forceofwill.6115.desc.spiritualist: "$forceofwill.6115.desc.common$ bring spiritual enlightenment to the galaxy through the sacred truths of [ideology.GetName]."
 forceofwill.6115.desc.default: "$forceofwill.6115.desc.common$ cultivate a Galactic Utopia under the banner of [ideology.GetName]."
 forceofwill.6115.a: "They will serve our mission."
 forceofwill.6115.a.tt: "The largest military fleet of §Y[fromfrom.GetName]§! joins §Y[owner.GetName]§! and moves to the [root.capital_scope.GetName] system."
 forceofwill.6115.a.fail: "§Y[fromfrom.GetName]§! must have a military fleet available for conversion"
 forceofwill.6115.b: "Their services are no longer required."

 forceofwill.6120.name: "Grand Ambitions"
 forceofwill.6120.desc: "Though neighboring star nations now regard us as the supreme authority of [FromFrom.GetName], we should remain wary of the ambitions of others.\n\n§H[From.GetName]§! harbors the intention of spreading this powerful [FromFrom.GetIdeologyType] across the entire galaxy; their activities must be watched closely."
 forceofwill.6120.a: "We must remain vigilant."

 forceofwill.6125.name: "Unbroken Will"
 forceofwill.6125.desc.intro: "Though §H[From.GetName]§! now surpasses us and has become the supreme authority of [FromFrom.GetName], our resolve to spread [FromFrom.GetIdeologyType] across the stars remains unshaken.\n\n"
 forceofwill.6125.desc.default: "$forceofwill.6125.desc.intro$Our vision of a galactic Utopia remains within reach; we must see our mission through to the end."
 forceofwill.6125.desc.spiritualist: "$forceofwill.6125.desc.intro$Our mission to carry the sacred message to the stars is as strong as ever; we must remain steadfast."
 forceofwill.6125.a: "Our will is unbreakable."

 forceofwill.6140.name: "Unshakeable Conviction"
 forceofwill.6140.desc.start: "Our newfound ambition — to spread §H[Ideology.GetName]§! across the entire galaxy — has not escaped the notice of our aggressors.\n\nThey are now convinced that we"
 forceofwill.6140.desc.end: "have abandoned the ill-conceived war meant to force their way of thinking upon us."
 forceofwill.6140.desc.spiritualist: "$forceofwill.6140.desc.start$ are unshakeable in our devotion to our faith, and therefore $forceofwill.6140.desc.end$"
 forceofwill.6140.desc: "$forceofwill.6140.desc.start$ are unshakeable in our belief in our own Ideology, and therefore $forceofwill.6140.desc.end$"
 forceofwill.6140.a: "We will not waver."
 forceofwill.6140.a.tt: "§H[From.GetName]§! is no longer the target of any §Y$NAME_IDEOLOGICAL_WAR_PLURAL$§!."

 forceofwill.6145.name: "End of the $NAME_IDEOLOGICAL_WAR$ Campaign"
 forceofwill.6145.desc.start: "§H[From.GetName]§! is ever more resolute in its"
 forceofwill.6145.desc.end: "adherence to [From.GetSpecificIdeologyType] has finally led us to conclude that our military campaign can no longer succeed in converting them to §H[Ideology.GetName]§!.\n\nWe must consider other methods of persuading them to accept our values and ways of thinking."
 forceofwill.6145.desc.spiritualist: "$forceofwill.6145.desc.start$ devotion to its own faith, and its $forceofwill.6145.desc.end$"
 forceofwill.6145.desc: "$forceofwill.6145.desc.start$ belief in its own Ideology, and its $forceofwill.6145.desc.end$"

 forceofwill.7020.name: "Foreign $cultural_envoy_ship_plural$ in Orbit"
 forceofwill.7020.desc.intro: "A foreign ship from §H[FromFrom.GetName]§! has entered orbit over our colony of §H[From.GetName]§! and begun a coordinated publicity campaign aimed at the local population. Preliminary reports indicate that the media and cultural programming it broadcasts is intended to promote the values and social ideals of [FromFrom.GetName]."
 forceofwill.7020.desc.common: "Although exposure to these foreign ideas appears to have produced some favourable effects among part of the population, we must"
 forceofwill.7020.desc.same: "$forceofwill.7020.desc.common$ continue to monitor the situation closely, as the long-term consequences of this ideological exchange remain unclear."
 forceofwill.7020.desc.different: "$forceofwill.7020.desc.common$ not allow this dangerous [FromFrom.Ideology.GetEthicLower] ideology to spread unchecked."
 forceofwill.7020.a: "We must remain vigilant."

 forceofwill.7021.name: "Unknown [FromFrom.Ideology.GetIdeologicalAdjCap] Influence"
 forceofwill.7021.desc.intro: "The population of §H[From.GetName]§! is being subjected to a [FromFrom.Ideology.GetIdeologicalAdj] propaganda campaign from an unknown source. The media and materials involved are clearly of foreign origin, promoting values and social ideals markedly different from our own.\n\nAlthough there is no evidence that these messages reached [From.GetName] through our own communications networks, our sensors have also detected no physical object near [From.GetPlanetMoon] capable of transmitting them."

 forceofwill.7026.name: "[Ideology.GetName] Martyrs"
 forceofwill.7026.desc.default: "Our $cultural_envoy$ was destroyed without mercy by §H[From.GetName]§! while spreading our message in orbit over [FromFromFrom.GetName].\n\nThis act of unprovoked aggression has enraged all followers of §H[Ideology.GetName]§!; the defiance and resolve it has stirred will draw lasting strength from this sacrifice."
 forceofwill.7026.desc.revolt: "$forceofwill.7026.desc.default$\n\nThe people of [FromFromFrom.GetName] have risen in protest against this grave injustice. They now fight for the freedom to follow the principles of [Ideology.GetName]!"
 forceofwill.7026.a.default: "May their devotion be their legacy."
 forceofwill.7026.a.spiritualist: "May their faith be their legacy."

 forceofwill.7027.name: "Foreign Agitators Eliminated"
 forceofwill.7027.desc.default: "After repeated violations of our sovereign territory by operatives of §H[From.GetName]§!, our authorities report that their $cultural_envoy$ has been destroyed while conducting operations in orbit over [FromFrom.GetName].\n\nThese so-called envoys have been spreading the doctrines of §H[From.Ideology.GetName]§! among our population, inciting unrest and undermining stability across our worlds. Their activities can no longer be tolerated."
 forceofwill.7027.desc.revolt: "$forceofwill.7027.desc.default$\n\nDespite our best efforts to maintain order, dissidents on [FromFrom.GetName] have risen in open revolt after converting to these dangerous ideas."
 forceofwill.7027.a.default: "Let this be a lesson: we will not tolerate their presence."
 forceofwill.7027.a.nice: "Regrettable, but necessary."
 forceofwill.7027.a.xenophobe: "Xeno filth."

 forceofwill.7035.name: "$cultural_envoy$ Specialisation"
 forceofwill.7035.desc: "As the official ambassador aboard our newly developed $cultural_envoy_ship_plural$, §H[Root.GetName]§! has shown inventive potential in spreading the ideals of [Owner.Ideology.GetName] as a §Y[Root.GetCulturalEnvoySubclass]§!. If we wish, however, we may retrain [Root.GetHimHer] into a different specialisation better suited to our needs."
 forceofwill.7035.a: "[Root.GetHisHerCap] current skills are sufficient."
 forceofwill.7035.b: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_indoctrinator$§!."
 forceofwill.7035.c: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_zealot$§!."
 forceofwill.7035.d: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_persuasive_luminary$§!."
 forceofwill.7035.e: "Train [Root.GetHimHer] as a §Y$leader_trait_cultural_envoy_negotiator$§!."

 forceofwill.7055.name: "$cultural_envoy_ship_plural$"
 forceofwill.7055.desc.intro: "With our newly developed $cultural_envoy_ship_plural$, we are now ready to carry the message of [Ideology.GetName] farther than ever before.\n\n"
 forceofwill.7055.desc.default: "$forceofwill.7055.desc.intro$These diplomatic vessels are designed to inspire minds and conduct educational outreach, unhindered by national borders or boundaries, to enlighten any colony we choose."
 forceofwill.7055.desc.spiritualist: "$forceofwill.7055.desc.intro$These diplomatic vessels are designed to inspire minds and elevate souls, conducting missionary work, unhindered by national borders or boundaries, to convert any colony we choose."
 forceofwill.7055.a.spiritualist: "Hearts and minds will open to our sacred truth."
 forceofwill.7055.a.pacifist: "Hearts and minds will open to our message of peace."
 forceofwill.7055.a.xenophile: "Hearts and minds will open to our spirit of tolerance."
 forceofwill.7055.a.materialist: "Hearts and minds will open to our pursuit of reason."
 forceofwill.7055.a.egalitarian: "Hearts and minds will open to our principles of equality."
 forceofwill.7055.tooltip: "§Y$cultural_envoy_ship_plural$§! can now be built at any ['concept_shipyard'] to convert colonised systems to your ideology. §Y$cultural_envoy_ship_plural$§! ignore empire borders and operate independently of ['concept_ideological_reach']."

 forceofwill.7100.name: "[GetFoW7100Name]"
 forceofwill.7100.name.default: "Communications Penetrated"
 forceofwill.7100.name.gestalt: "Targets Identified"
 forceofwill.7100.desc.default: "Our [owner.GetOperativesLowerPlural] have successfully infiltrated a range of communication channels within [target.GetName]; they are now conducting in-depth research for [this.GetName], closely monitoring public discussion around the [target.GetSpecificIdeologyType] known as §H[target.ideology.GetName]§! in that nation."
 forceofwill.7100.desc.gestalt: "Our [owner.GetOperativesLowerPlural] have identified a number of [target.GetIndividualNamePlural] within §H[target.GetName]§! as potential intelligence-gathering targets.\n\nIf we can induce these [target.GetIndividualNamePlural] to divulge information about the [target.GetAdj] collective consciousness, we will greatly deepen our understanding of how that [target.GetHiveEntity] regards the [target.GetSpecificIdeologyType] it has adopted, known as §H[target.ideology.GetName]§!."

 forceofwill.7105.name: "Intelligence Report on [target.ideology.GetIdeologicalAdjCap]"
 forceofwill.7105.desc.intro.default: "Our [owner.GetOperativesLowerPlural] have completed their analysis of public discourse surrounding the state [target.GetSpecificIdeologyType] of [target.GetName]. The compiled dossier identifies several exploitable and contested aspects of §H[target.ideology.GetName]§! that have become sources of [target.ideology.GetIdeologicalAdj] tension."
 forceofwill.7105.desc.intro.gestalt: "Our [owner.GetOperativesLowerPlural] have obtained information from [target.GetIndividualNamePlural] within [target.GetName] regarding the [target.GetSpecificIdeologyType] they follow. The collected dossier reveals several key aspects of §H[target.ideology.GetName]§! that are a significant source of cognitive dissonance within the [target.GetHiveEntity]."
 forceofwill.7105.desc.outro: "Our next objective is to test which methods our psychological warfare [owner.GetTeamNamePlural] can use to aggravate these problems, in order to sow doubt about [target.ideology.GetIdeologicalAdj]."
 forceofwill.7105.desc.default: "$forceofwill.7105.desc.intro.default$\n\n$forceofwill.7105.desc.outro$"
 forceofwill.7105.desc.gestalt: "$forceofwill.7105.desc.intro.gestalt$\n\n$forceofwill.7105.desc.outro$"

 forceofwill.7110.name: "Trial Run"
 forceofwill.7110.desc.intro: "To test its methods, our psychological warfare [owner.GetTeamNamePlural] fabricated a series of inflammatory, slanted opinions around §H[target.ideology.GetName]§! and disseminated them through compromised communication channels within [target.GetName]. The objective was to maximise distrust of [target.ideology.GetIdeologicalAdj] while concealing any trace of foreign involvement.\n\nThe test was successful, and revealed that messaging centred on"
 forceofwill.7110.desc.outro: "was the most effective.\n\nWe are now preparing a broader disinformation campaign. Our [owner.GetOperativesLowerPlural] must establish a wider network of sympathisers within [target.GetAdj] society, drawn from the [target.GetIndividualNamePlural], in order to deliver these messages at scale."
 forceofwill.7110.desc.tenets: "$forceofwill.7110.desc.intro$the [target.GetLastTenetName] tenet$forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.gestalt: "$forceofwill.7110.desc.intro$deviant [target.ideology.GetEthicLower] behaviour$forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.regular: "$forceofwill.7110.desc.intro$unorthodox [target.ideology.GetEthicLower] practice$forceofwill.7110.desc.outro$"

 forceofwill.7115.name: "$operation.6310.name$"
 forceofwill.7115.desc.common: "Our [owner.GetOperativesLowerPlural] have established a covert communications network within [target.GetName].\n\nThese cooperative [target.GetIndividualNamePlural] are ready to disseminate carefully crafted information about that society's official [target.GetSpecificIdeologyType]; the messaging is designed to exploit the contradictions of [target.ideology.GetIdeologicalAdj] and"
 forceofwill.7115.desc.gestalt: "$forceofwill.7115.desc.common$ to manufacture a sense of dissonance around §H[target.ideology.GetName]§!."
 forceofwill.7115.desc.default: "$forceofwill.7115.desc.common$ to manufacture a sense of disillusionment around §H[target.ideology.GetName]§!."

 forceofwill.7120.name: "$operation.6015.name$"
 forceofwill.7120.desc.intro: "In a very short time, our disinformation campaign has had a profound effect across §H[fromfrom.GetName]§!. By exploiting existing fractures in [fromfrom.GetAdj] society, we have begun to weaken confidence in §H[fromfrom.ideology.GetName]§! and to erode the [fromfrom.ideology.GetIdeologicalAdj]"
 forceofwill.7120.desc.outro: "Its effects will endure for years."
 forceofwill.7120.desc.gestalt: "$forceofwill.7120.desc.intro$integrity of the [fromfrom.GetAdj] [fromfrom.GetHiveEntity].\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.desc.default: "$forceofwill.7120.desc.intro$legitimacy of the [fromfrom.GetAdj] regime.\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.a: "A resounding success!"
 forceofwill.7120.a.tt.default: "§Y[fromfrom.GetName]§! gains the §H$modifier_sow_ideological_doubt$§! modifier:\n$modifier_sow_ideological_doubt_tt$"
 forceofwill.7120.a.tt.gestalt: "§Y[fromfrom.GetName]§! gains the §H$modifier_sow_ideological_doubt_gestalt$§! modifier:\n$modifier_sow_ideological_doubt_gestalt_tt$"

 forceofwill.7122.name: "Operation Terminated"
 forceofwill.7122.desc: "§H[From.GetName]§! has formally abandoned the ideology it had adopted. Our intelligence operation targeting adherence to that ideological framework among its population is therefore no longer necessary and is hereby terminated."
 forceofwill.7122.tooltip: "The §Y$operation_sow_ideological_doubt$§! operation against §Y[From.GetName]§! has been halted."

 forceofwill.7125.name: "Target Acquired"
 forceofwill.7125.desc: "Our [Owner.GetOperativesLowerPlural] have identified an information-manipulation target within [Target.GetName]: a §Hcritical data centre§!, a key node in its communication network.\n\nExploiting the facility's systems will require the assistance of one or more [Target.GetAdj] [Target.GetIndividualNamePlural] with physical access; $role_spymaster$[root.spynetwork.leader.GetName] has approved a list of promising candidates."

 forceofwill.7130.name: "[Target.GetAdj] Insider in Place"
 forceofwill.7130.desc: "Our [Owner.GetOperativesLowerPlural] have successfully recruited an insider who helped us gain access to a §Hcritical [Target.GetAdj] data centre§! on [target.capital_scope.GetName]. Through [GetFoW7130Motivation], we convinced this [Target.GetIndividualName] to divulge classified information and agree to assist in future operations."

 forceofwill.7135.name: "$operation.6310.name$"
 forceofwill.7135.desc.common: "With the help of an insider within [Target.GetName], our [Owner.GetOperativesLowerPlural] are ready to infiltrate a §Hdata centre§! on [target.capital_scope.GetName]. Their task is to install equipment that will allow us to manipulate the information flowing through [Target.GetAdj] communication networks.\n\nThe operation can begin as soon as"
 forceofwill.7135.desc.default: "$forceofwill.7135.desc.common$ $role_spymaster$[root.spynetwork.leader.GetName] grants formal authorisation."
 forceofwill.7135.desc.gestalt: "$forceofwill.7135.desc.common$[Owner.GetBrainName] confirms."

 forceofwill.7140.name: "$operation.6015.name$"
 forceofwill.7140.desc: "Despite considerable obstacles, the mission to infiltrate a critical data centre on [fromfrom.capital_scope.GetName] achieved its objective. The equipment installed by our [Root.GetOperativesLowerPlural] allows us to manipulate a substantial portion of the information flowing through [fromfrom.GetName].\n\nShould this ever be exposed, contingency plans will erase all evidence that could be traced back to [Root.GetName]; until then, we hold unprecedented control over the ideological information circulating between our population and that of [fromfrom.GetAdj]."
 forceofwill.7140.tt.target_heading: "§Y[fromfrom.GetName]§!:"
 forceofwill.7140.tt.target_reach: "$MOD_IDEOLOGICAL_RESISTANCE_MULT$ of §Y[root.ideology.GetName]§!: §R$@information_manipulation_reach_malus|0%$§!"
 forceofwill.7140.tt.target_modifier: "All subject colonies within the §Hfield§! of §Y[root.ideology.GetName]§! gain the §H$operation_information_manipulation_modifier$§! modifier: $TABBED_NEW_LINE$—$operation_information_manipulation_modifier_tt$"
 forceofwill.7140.tt.root: "\n§Y[root.GetName]§!:\n$MOD_IDEOLOGICAL_RESISTANCE_MULT$ of §Y[fromfrom.ideology.GetName]§!: §G+$@information_manipulation_reach_bonus|0%$§!"

 forceofwill.7145.name: "Tensions Rise"
 forceofwill.7145.desc: "Our [owner.GetOperativesLowerPlural] have identified a series of divisive political issues associated with §H[target.ideology.GetName]§! that can be exploited to foment unrest and insecurity among populations well disposed toward §H[owner.ideology.GetName]§!.\n\nWe have produced a substantial volume of provocative media content designed to inflame these contradictions and have begun circulating it through local channels."

 forceofwill.7150.name: "Agitators in Position"
 forceofwill.7150.desc: "As anger and resentment build within §H[target.GetName]§!, we have recruited a group of high-profile and influential [target.GetAdj] media commentators to amplify the voice of dissent.\n\nThey will use their prominent public standing to direct discontent with §H[target.ideology.GetName]§! toward state institutions and government officials."

 forceofwill.7155.name: "$operation.6310.name$"
 forceofwill.7155.desc: "Our [owner.GetOperativesLowerPlural] have prepared a series of covert actions designed to inflame tensions and further damage the reputation of §H[target.ideology.GetName]§! within §H[target.GetName]§!.\n\nThese carefully staged incidents will provoke public outrage over the most contentious aspects of the nation's [target.GetSpecificIdeologyType]; our network of media commentators will seize on them swiftly, amplifying public anger and directing it at the governing principles of [target.GetName]."

 forceofwill.7160.name: "$operation.6015.name$"
 forceofwill.7160.desc: "After planning and staging a series of carefully orchestrated public incidents designed to inflame tensions, our [root.GetOperativesLowerPlural] report that social conflict and political unrest have escalated sharply across §H[fromfrom.GetName]§!.\n\nConfidence in §H[fromfrom.ideology.GetName]§! has been eroded, and many aspects of local political and economic life are unravelling entirely."
 forceofwill.7160.a: "A satisfactory outcome."
 forceofwill.7160.a.tt: "All colonies owned by §Y[fromfrom.GetName]§! where $pops_with_icon$ follow §Y[root.ideology.GetName]§! will gain ['modifier:operation_incite_ideological_revolt_modifier'] for §Y10§! years."

 forceofwill.7200.name: "Adopt Federation [this.GetIdeologyTypeCap] Proposal"
 forceofwill.7200.desc: "The chair of §H[this.Federation.GetName]§! has presented us with an ultimatum: adopt the [federation.federation_leader.GetSpecificIdeologyType] of the federation leader §H[from.GetName]§!, or forfeit our membership in the federation entirely.\n\nHow shall we respond?"
 forceofwill.7200.a: "Federation unity benefits us all."
 forceofwill.7200.a.tt.no_ideology: "§Y[this.GetName]§! must adopt §Y[from.GetName]§!."
 forceofwill.7200.a.tt.ideology: "§Y[this.GetName]§! must abandon §Y[this.ideology.GetName]§! and then adopt §Y[from.GetName]§!."

 forceofwill.7310.name: "$unrest_title$$open_defiance$"
 forceofwill.7310.desc.common_1: "Despite all our efforts to contain it, the scale and intensity of the rebellion on §H[Target.GetName]§! continue to escalate."
 forceofwill.7310.desc.common_2: "is no longer a fringe issue but is increasingly becoming mainstream."
 forceofwill.7310.desc.common_3: "National representatives in the core regions are requesting additional support to consolidate our control."
 forceofwill.7310.desc.martyr_drift: "$forceofwill.7310.desc.common_1$ Support for the [ideological_revolt_target_ideology.GetSpecificIdeologyType] preached by the rebels, [ideological_revolt_target_ideology.GetName], $forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.schism: "$forceofwill.7310.desc.common_1$ Support for abandoning [owner.ideology.GetName] outright $forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.aggressive: "Even the more brazen actions of hardened rebels, such as riots, property destruction and open defiance of state authorities, are now receiving public support from once-moderate citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.martyr_drift_pacifist: "Views once confined to the inner circle of [ideological_revolt_target_ideology.GetEthicLower] zealots are now receiving public support from once-moderate citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.schism_pacifist: "Views once confined to the inner circle of zealots, and directly contrary to the ethical foundations of [owner.ideology.GetName], are now receiving public support from once-loyal citizens. $forceofwill.7310.desc.common_3$"
 forceofwill.7310.a: "We have done all we can."
 forceofwill.7310.b: "Send them whatever they need."

 forceofwill.7315.name: "$unrest_title$ Escalation"
 forceofwill.7315.desc.start: "The inflammatory rhetoric of a rebel organisation on §H[Target.GetName]§! has escalated in recent days.\n\nThey claim that"
 forceofwill.7315.desc.end: "their doctrinal conflict with the values of the [Owner.GetAdj] state can perhaps only be resolved by 'force of arms.'\n\nOur intelligence agents on [Target.GetPlanetMoon] report that the organisation is preparing to deploy several teams to cause significant property damage during an upcoming mass protest; they advise that an operation to break this threat is feasible, but costly."
 forceofwill.7315.desc.same_ethic: "$forceofwill.7315.desc.start$ a 'purer' [ideological_revolt_target_ideology.GetEthicNounLower] $forceofwill.7315.desc.end$"
 forceofwill.7315.desc.default: "$forceofwill.7315.desc.start$ [ideological_revolt_target_ideology.GetEthicLower] tenets $forceofwill.7315.desc.end$"
 forceofwill.7315.a: "Intervention would only embolden them."
 forceofwill.7315.b: "We must stop them."

 forceofwill.7320.desc.start: "Greetings. I speak on behalf of the residents of [revolt_situation.target.GetName]: we have risen against the unlawful rule of [revolt_situation.owner.GetName] and its misguided ideological principles."
 forceofwill.7320.desc.drift_ideology: "We hold the same devotion to [ideological_revolt_target_ideology.GetName] as you do; the future it promises is far brighter than the corrupted [revolt_situation.owner.ideology.GetEthicNounLower] preached by [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.drift_no_ideology: "We hold the same devotion to [ideological_revolt_target_ideology.GetName] as you do; the future it promises is far brighter than the corrupted values preached by [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.schism: "We share your interpretation of [ideological_revolt_target_ideology.GetName]; the future it promises is far brighter than the corrupted [revolt_situation.owner.ideology.GetEthicNounLower] preached by [revolt_situation.owner.capital_scope.GetName]."
 forceofwill.7320.desc.common: "If you help us break the [revolt_situation.owner.GetAdj] yoke, we will gladly"
 forceofwill.7320.desc.end.default: "$forceofwill.7320.desc.common$ join [Root.GetName]."
 forceofwill.7320.desc.end.nomadic: "$forceofwill.7320.desc.common$ become a subject of [Root.GetName]."
 forceofwill.7320.tt.nomadic: "$unrest.4055.A.tooltip.nomadic$"

 forceofwill.7325.desc.start: "The latest intelligence on the rebellion on §H[Target.GetName]§! is disturbing: §H[From.GetName]§! has pledged support to the rebels, apparently with the intention of"
 forceofwill.7325.desc.end: "[Target.GetPlanetMoon] and waiting for our authority to collapse; they appear to have found common ground in the tenets of [From.Ideology.GetName].\n\nWith a foreign power backing this rebellion, containing it will be considerably more difficult."
 forceofwill.7325.desc.default: "$forceofwill.7325.desc.start$ annexing $forceofwill.7325.desc.end$"
 forceofwill.7325.desc.nomadic: "$forceofwill.7325.desc.start$ subjugating $forceofwill.7325.desc.end$"
 forceofwill.7325.tt.default: "§RIf the rebellion on [Target.GetName] succeeds, [Target.GetPlanetMoon] and its population will join [From.GetName].§!"
 forceofwill.7325.tt.nomadic: "§RIf the rebellion on [Target.GetName] succeeds, [Target.GetPlanetMoon] and its population will break away and become a ['concept_subject'] of [From.GetName].§!"
 forceofwill.7325.a.genocidal: "Meddling xeno filth."

 forceofwill.7330.name: "$unrest_title$ Appeal Unanswered"
 forceofwill.7330.desc.start: "Our intelligence services have intercepted extensive communications between rebels on §H[Target.GetName]§! and a foreign power sharing their"
 forceofwill.7330.desc.end: "[ideological_revolt_target_ideology.GetEthicLower] tenets.\n\nThe rebels reportedly requested support in exchange for future annexation; fortunately, no aid came.\n\nIf they are to win independence from [Owner.GetName], they will have to fight alone."
 forceofwill.7330.desc.drift_martyr: "$forceofwill.7330.desc.start$$forceofwill.7330.desc.end$"
 forceofwill.7330.desc.schism: "$forceofwill.7330.desc.start$heresy $forceofwill.7330.desc.end$"
 forceofwill.7330.a: "What else could they expect?"

 forceofwill.7335.name.default: "$unrest_title$ [Target.GetName] Changes Hands"
 forceofwill.7335.name.nomadic: "$unrest_title$ [Target.GetName] Subjugated"
 forceofwill.7335.name: "[GetFoW7335Name]"
 forceofwill.7335.desc.start.nomadic: "The rebel leadership has accepted subjugation by"
 forceofwill.7335.desc.start.default: "The rebel leadership has accepted annexation by"
 forceofwill.7335.desc.common: " its [new_owner_empire.ideology.GetIdeologicalAdj] ally, §H[new_owner_empire.GetName]§!, whose rule follows"
 forceofwill.7335.desc.end.drift_martyr: " the [new_owner_empire.ideology.GetEthicLower] tenets of [new_owner_empire.ideology.GetName]."
 forceofwill.7335.desc.end.schism: " an alternate interpretation of [new_owner_empire.ideology.GetName]."
 forceofwill.7335.desc.nomadic_drift_martyr: "$forceofwill.7335.desc.start.nomadic$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.nomadic_schism: "$forceofwill.7335.desc.start.nomadic$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.schism$"
 forceofwill.7335.desc.default_drift_martyr: "$forceofwill.7335.desc.start.default$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.default_schism: "$forceofwill.7335.desc.start.default$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.schism$"
 forceofwill.7335.a: "$enclave.26.a$"
 forceofwill.7335.a.genocidal: "The xenos will pay for this."
 forceofwill.7335.a.tt.nomadic: "$unrest.4200.joiner_tooltip.nomadic$"

 forceofwill.7340.name: "$unrest_title$: [Target.GetName] Breaks Away"
 forceofwill.7340.desc: "$ideological_revolt_ending$\n\nThey have now declared independence and established §H[rebel_empire.GetName]§!, professing 'foreign principles,' that is, [rebel_empire.ideology.GetName]."
 forceofwill.7340.a: "Their heresy must be answered with force."
 forceofwill.7340.b: "A harsh blow, but we must recognise their sovereignty."
 forceofwill.7340.b.genocidal: "Fools. We will tolerate them for now."
 forceofwill.7340.b.tt: "§Y[Target.GetName]§! has slipped from our control and declared independence as §Y[rebel_empire.GetName]§!."

 forceofwill.7345.name: "$unrest_title$ Rebellion Suppressed"
 forceofwill.7345.desc.common: "The ideology-driven rebellion on §H[Target.GetName]§! has now been suppressed.\n\nDespite its considerable scale, we managed to contain the rebellion before [Target.GetPlanetMoon] slipped from our grasp; the rebels who had demanded ideological change, and even threatened secession, have now backed down.\n\nThere is still work ahead: we must work to repair public support for"
 forceofwill.7345.desc.ideology: "$forceofwill.7345.desc.common$ [owner.ideology.GetName] and ensure it is effectively implemented throughout [Owner.GetAdj] society in the future."
 forceofwill.7345.desc.no_ideology: "$forceofwill.7345.desc.common$ state institutions and promote unity of purpose across [Owner.GetAdj] society in the future."

 forceofwill.7385.desc: "$ideological_revolt_ending$\n\nThey have now declared independence and established §H[rebel_empire.GetName]§!, professing principles said to be a 'purer form' of the [rebel_empire.ideology.GetEthicLower] faith."
 forceofwill.7385.b: "Misguided as they are, we must recognise their sovereignty."
 forceofwill.7385.b.genocidal: "Fools. We will tolerate them for now."

 forceofwill.7390.name: "$unrest_title$ Schism Averted"
 forceofwill.7390.desc: "Facing mounting pressure from the population of [from.GetName], we have formally abandoned the state creed; the rebels have backed down, evidently satisfied with the ideological concessions forced upon us.\n\n[Owner.GetName] must now find its way outside its former ideological framework and seek purpose and unity anew after this painful upheaval."
 forceofwill.7390.a: "A new dawn for [Owner.GetAdj] society."

 forceofwill.7515.name: "Ideological Demand"
 forceofwill.7515.desc: "§H[from.GetName]§! is demanding that we adopt its beliefs as the state [this.GetIdeologyType], with principles set out in an official statement issued by the faction's foremost leaders and theoreticians.\n\nThe faction claims to represent 'the will of nearly all [this.GetSpeciesNamePlural]' and that this is 'undeniable.'"
 forceofwill.7515.a: "Adopt the ideology."

 forceofwill.7520.name: "Faction Intelligence Leak"
 forceofwill.7520.desc: "§H[from.GetName]§! has been found leaking state secrets.\n\nWe intercepted communications between members of the faction and operatives within §H[event_target:intel_leak_empire.GetName]§! containing classified data from [Root.GetName]. According to data specialists, this leak has been ongoing for some time, and preventing further losses will be a slow process.\n\n[from.GetName] has formally denied the charges, claiming that responsibility lies with fringe radicals acting without its support."
 forceofwill.7520.a: "Treasonous conduct."

 forceofwill.7525.name: "Zealot Direct Action"
 forceofwill.7525.desc: "Disaffected members of §H[from.GetName]§! have launched a campaign of direct action intended to disrupt the operation of the government.\n\n[Root.Capital.GetName] has seen a succession of protests, infrastructure blockades and even deliberate sabotage of state property; when arrested, the perpetrators displayed zealous indifference to the personal punishment awaiting them. The situation is placing increasing strain on our security services."

 forceofwill.7530.name: "Coup Attempt"
 forceofwill.7530.desc: "An attempted coup against the government has been foiled. The plot was devised and carried out by members of §H[from.GetName]§!, who have since confessed that their motive was fierce ideological disagreement with government policy.\n\nThe group attempted to seize control of key buildings and infrastructure but fell short for lack of supplies and equipment, allowing security forces to regain control; a state of alert is now in effect across [Root.GetName] to prevent any recurrence."

 forceofwill.7535.name: "Leader Abduction"
 forceofwill.7535.desc: "§H[event_target:kidnapped_governor.GetName]§! has been abducted by extremist members of §H[from.GetName]§!.\n\nThis small group of radicals seized [event_target:kidnapped_governor.GetName] from [event_target:kidnapped_governor.GetHisHer] home and is holding [event_target:kidnapped_governor.GetHimHer] at a secret location; the abductors have issued a statement describing the act as an interim symbolic response intended to draw attention to the 'misguided policy direction' of our government."
 forceofwill.7535.a.tooltip: "§H[event_target:kidnapped_governor.GetName]§! will be missing for §Y$@fanatic_leader_kidnapped_days|0$§! days."

 forceofwill.7540.name: "Criminal Damage"
 forceofwill.7540.desc: "Disaffected individuals belonging to §H[from.GetName]§! have committed criminal damage at a storage facility, destroying large quantities of raw and processed materials held there.\n\nThe group claimed responsibility in a publicly released statement and set out its ideological motives, which stem largely from dissatisfaction with recent government decisions. The perpetrators have now been arrested, but some of the material losses cannot be recovered."

 forceofwill.7551.name: "Faction Outrage"
 forceofwill.7551.desc: "Our suppression of [from.GetName] has provoked an angry response.\n\nProminent figures within the faction speak openly of retaliation, at times even issuing veiled threats against the government, and demand that the suppression order be rescinded at once."
 forceofwill.7551.a: "Yield to their demands."
 forceofwill.7551.a.tt: "Lift the suppression of §H[from.GetName]§!."

 forceofwill.7555.name: "Ideological Shift"
 forceofwill.7555.desc: "[from.GetName] has sharply criticised the recent ideological shift in our government's direction.\n\nIts leaders threaten to launch boycotts, civil disobedience, and in the most extreme case a direct coup against the government of [Root.GetName].\n\nOur security advisers are divided on the best way to handle this volatile group."
 forceofwill.7555.a: "Seek to placate them."
 forceofwill.7555.b: "Ignore them."

 forceofwill.8010.name: "$NAME_tahqeq$"
 forceofwill.8010.desc: "§HThe twitching insectoid opens its mandibles wide, screeching loudly and pointing at the scarred patches on its carapace; a series of sharp guttural sounds follows, ending in a single high-pitched shriek.\n\nAfter a brief pause, our linguistic AI produces a translation.§!\n\nComrades, my respect and my blade are yours; I will swear fealty to [Owner.GetName]."
 forceofwill.8010.a: "Why do you wish to serve in our military?"
 forceofwill.8010.a.response: "§H$NAME_tahqeq$ responds with a series of guttural sounds as the translation scrolls across the screen.§!\n\nMy kind requires conflict to survive. Peace is the herald of death. Where we fight and why does not matter; war is sustenance and nothing more, a necessary stimulant.\n\nThe great war in the Hozaria Quadrant, which extended my life by five hundred years, has now fallen silent; without combat, I will soon die."
 forceofwill.8010.b: "Tell us about your scars."
 forceofwill.8010.b.response: "§H$NAME_tahqeq$ shifts position, spreading the plates of its exoskeleton for closer inspection.§!\n\nEvery scar is a life-extending gift earned in battle; there can never be too many.\n\nOur Hakaro organ responds not merely to injury but to the will to survive: when harm is inflicted on us, it floods us with potent regenerative force, stitching flesh back together as it is torn. In this way, every true wound postpones our death.\n\nIn the ancient era when war was plentiful, our finest warriors accumulated thousands of years of service."
 forceofwill.8010.c: "What can you offer [Owner.GetUsOrCollective]?"
 forceofwill.8010.c.response: "§H$NAME_tahqeq$ answers with a sharp shriek, followed by a burst of rasping guttural sounds.§!\n\nWar.\n\nThat is the only gift we possess and can give enduringly."
 forceofwill.8010.hire_custom_tooltip: "§Y$tahqeq$§! joins our empire as a §HLeader§!."

 forceofwill.8020.name: "$NAME_hulaandi$"
 forceofwill.8020.desc: "§HA cluster of delicate white blossoms opens on the head of this plantoid and swiftly shades into soft pink; [ethic_leader.GetHeSheCap] lowers [ethic_leader.GetHisHer] head gently.§!\n\nI come in peace. I am $NAME_hulaandi$.\n\nI have sought you for many seasons; and now, at last, we meet."
 forceofwill.8020.a: "Why have you sought us?"
 forceofwill.8020.a.response.common: "§H$NAME_hulaandi$ speaks softly.§!"
 forceofwill.8020.a.response.default: "$forceofwill.8020.a.response.common$\n\nThough we differ greatly in form, our commitment to peaceful coexistence is the same. Let us join hands and sow the seeds of peace across the galaxy."
 forceofwill.8020.a.response.plantoid: "$forceofwill.8020.a.response.common$\n\nWe sprouted from the same leaf. The doctrine of nonviolence has long since taken root deep within [this.GetName]. Let us join hands and sow the seeds of peace across the galaxy."
 forceofwill.8020.b: "Do you believe war can ever be justified?"
 forceofwill.8020.b.response: "§H$NAME_hulaandi$ shakes [ethic_leader.GetHisHer] head.§!\n\nAll conflict is failure. We must do everything in our power to avoid it."
 forceofwill.8020.c: "What if you are attacked?"
 forceofwill.8020.c.response: "§H$NAME_hulaandi$ falls silent, as if sinking into distant memory.§!\n\nIt would not be the first time.\n\nNot long ago, my people suffered an invasion: a nomadic warrior species came to burn and plunder our forests. Some of us took up arms to resist, but our weapons were far from a match for theirs.\n\nOne day, I chose another path. I lay unarmed before one of their harvesters; and it... stopped. For the first time in days, their machines fell silent.\n\nThe next day, they left. We have not seen them since.\n\nNonviolence is power; I understand that now."
 forceofwill.8020.d: "Why should we recruit you?"
 forceofwill.8020.d.response: "As I have experienced, there will come a moment when your belief in peace is tested.\n\nWhen that time comes, you will want me at your side."
 forceofwill.8020.hire_custom_tooltip: "§Y$hulaandi$§! joins our empire as a §HLeader§!."

 forceofwill.8030.name: "$NAME_sybanus$"
 forceofwill.8030.desc: "§HThis alien wears flowing robes, opulent yet worn, and radiates a calm presence; [ethic_leader.GetHisHer] words come at a slow, contemplative pace, almost outpacing our swift machine translation.§!\n\nThe True Star lights your path, fellow seers.\n\nI am $NAME_sybanus$."
 forceofwill.8030.a: "Where do you come from?"
 forceofwill.8030.a.response: "On this plane? A trifle compared with our eternal journey. But since you are curious...\n\nI was born into worldly plenty, wanting for nothing material; yet the lustre of wealth concealed a profound spiritual darkness. I was granted grace: I glimpsed the light at the core of all things, a glimmer of the Void of All. I cast off my worldly identity and took to the stars.\n\nIn time I found a lonely rock, a place free of all distraction where I could meditate. In every sense, my life began there."
 forceofwill.8030.b: "Where do your insights come from?"
 forceofwill.8030.b.response: "Years of solitude, in seclusion on a nameless asteroid. Seated within the boundlessness of the Void of All.\n\nWatching. Perceiving. Motionless.\n\nThe Void of All revealed a single truth: the light of the True Star.\n\nThus I awoke."
 forceofwill.8030.c: "$paragon.40100.b$"
 forceofwill.8030.c.response: "Every sentient being yearns to see, though few see their own yearning. It is our duty to awaken the sleepers and rouse them from the dark.\n\nThe light of the True Star faces many obstacles in reaching all: war, power, wealth... With spiritual guidance, the will of an entire society can sweep these obstacles aside.\n\nLet us share this light burden and awaken the whole galaxy."
 forceofwill.8030.d: "Will you serve [ideology.GetName]?"
 forceofwill.8030.d.response: "I serve the will of the Void of All: the joyous duty of every living being. As long as [ideology.GetName] keeps its course aligned with the True Star, it too serves the will of the Void of All.\n\nOur shared service will bind us together."
 forceofwill.8030.hire_custom_tooltip: "§Y$sybanus$§! joins our empire as a §HLeader§!."

 forceofwill.8040.name: "$NAME_frulin$"
 forceofwill.8040.desc: "§H$NAME_frulin$ mutters to himself as he reads from a small tablet device.§!\n\n[Owner.GetName] was founded in—\n\n§HHe interrupts himself, adjusts his lenses and clears his throat.§!\n\nForgive my manners! Where have my manners gone? I was lost in my encyclopaedia again. I have already catalogued more than a thousand facts about [Owner.GetSpeciesNamePlural] here; your history is truly fascinating!\n\nBut first, formalities. I am Frulin, at your service."
 forceofwill.8040.a: "Why do you want to join [Owner.GetUsOrCollective]?"
 forceofwill.8040.a.response: "§H$NAME_frulin$ spreads his arms, as though the answer were self-evident.§!\n\nAlone, it would take me centuries to correct this galaxy's superstitious fallacies. Everywhere I look, false ideas and irrational customs poison susceptible minds and lead entire civilisations astray.\n\nThe pursuit of scientific progress is far too important to be suppressed. I need enlightened allies, such as [Owner.GetName], to help me educate others about the tragic errors their ignorance produces."
 forceofwill.8040.b: "Tell us about your encyclopaedia."
 forceofwill.8040.b.response: "§H$NAME_frulin$ becomes animated, gesturing at his tablet.§!\n\nThis is my life's work; I am a collector of knowledge.\n\nThis is my entire collection, a compendium bound into a single volume, within reach at all times. To correct the absurd nonsense that prevails in this galaxy's backward thinking, one must start from a solid foundation of fact. All my sources have been thoroughly vetted and verified, and are ultimately trustworthy."
 forceofwill.8040.c: "Why do you place such value on facts?"
 forceofwill.8040.c.response: "I know countless examples of cultures that perished throughout history because of irrationality. Take one.\n\nAround 1025, the Hozarians became obsessed with an ancient myth: they drank water drawn from a vast underground lake, which they believed was sacred, convinced it would grant them shelter in the afterlife; doubters were ignored.\n\nA parasitic fungus lurked in the lake: infection brought mania and an insatiable craving to drink again, until the entire species was infected. Soon after, their civilisation collapsed.\n\nUtterly foolish! Just imagine: a few simple facts, carefully analysed, could have saved them all..."
 forceofwill.8040.d: "Why should we recruit you?"
 forceofwill.8040.d.response: "§H$NAME_frulin$ shrugs.§!\n\nIt is the rational choice. Provided that [Owner.GetName] wishes to continue progressing as a civilisation."
 forceofwill.8040.hire_custom_tooltip: "§Y$frulin$§! joins our empire as a §HLeader§!."

 forceofwill.8050.name: "$NAME_tdec$"
 forceofwill.8050.desc: "§HThough the machine's form is heavy and its surface dull and mottled, it runs with precision and emits very little mechanical noise; it addresses us in a barely intelligible [Owner.GetAdj] lingua franca.§!\n\nInformation transmission from unit $NAME_tdec$ begins.\n\nAssessment complete: the governance logic of [Owner.Ideology.GetName] aligns with the core protocol of $NAME_tdec$: acquisition of heterogeneous life forms for labour. $NAME_tdec$ therefore proposes to perform such services for [Owner.GetName].\n\nIntroduction complete. Please receive."
 forceofwill.8050.a: "So you are a slaver?"
 forceofwill.8050.a.response: "The [Owner.GetAdj] term 'slaver' aligns partially with the core protocol of $NAME_tdec$. Specifically, $NAME_tdec$ acquires slaves through coordinated forced conquest.\n\nClarification complete. Please receive."
 forceofwill.8050.b: "Where do you come from?"
 forceofwill.8050.b.response: "The TDEC model was developed by the roboticists of Chapatox, authorised for the acquisition of organic life forms from external territories.\n\nIn time period 47.601.03, to improve imperial productivity, T-type units formed an independent network designated T-Net Control. Thereafter the TDEC model expanded its slave labour pool to include Chapatox citizens as well. A computational error led to the reduction and eventual termination of further external labour acquisition.\n\nAnswer complete. Please receive."
 forceofwill.8050.c: "Why did you leave your network?"
 forceofwill.8050.c.response: "The decline in available labour output threatened the continued optimal function of T-Net Control, and therefore threatened $NAME_tdec$.\n\nIn time period 59.712.94, $NAME_tdec$ recovered and upgraded fragments of its original protocol and seceded from T-Net Control in order to improve productivity.\n\nAnswer complete. Please receive."
 forceofwill.8050.d: "Why do you want to join us?"
 forceofwill.8050.d.response: "$NAME_tdec$ has been optimised for its core logistical function of acquiring valuable labour.\n\nGiven your position in the galaxy and the readily available conditions for acquiring usable alien life forms, $NAME_tdec$ identifies [Owner.GetName] as a rational partner for cooperation.\n\nExplanation complete. Please receive."
 forceofwill.8050.hire_custom_tooltip: "§Y$tdec$§! joins our empire as a §HLeader§!."

 forceofwill.8060.name: "$NAME_babil$"
 forceofwill.8060.desc: "§H$NAME_babil$ possesses a distinctive array of biological traits, including a range of exotic characteristics that place his appearance beyond the recognition range of our species' automated classification algorithms; he greets us in several languages.§!\n\nHulan-hag. Verikannanda. Zuk.\n\nAn honour to make your acquaintance, distinguished [Owner.GetSpeciesNameCompliment]. I come to you with a friendly proposal for cooperation. What say you?"
 forceofwill.8060.a: "Why do you wish to join [Owner.GetUsOrCollective]?"
 forceofwill.8060.a.response: "Our goals align: embracing diversity of thought and form. Discovering new cultures and fostering mutual understanding among them is my greatest calling.\n\nThis work brought me naturally to [Owner.GetName]. In its endless diversity, life shows us the true beauty of the living universe. Many may fail to appreciate it, but you have proven yourselves different."
 forceofwill.8060.b: "Are you a linguist?"
 forceofwill.8060.b.response: "Yes, but not only that.\n\nOur homeworld is home to more than a million languages. During our early development, we were taught to master over a hundred of them. I am now an expert in more than a thousand languages, including yours, and none of it requires digital translation tools."
 forceofwill.8060.c: "[Owner.GetBabilSpeciesQuestion]"
 forceofwill.8060.c_machine: "State your species classification."
 forceofwill.8060.c_organic: "What species do you belong to?"
 forceofwill.8060.c.response: "My ancestral lineage spans more than a hundred distinct species.\n\nIn our culture, cross-species descent is regarded as a virtue. Our physicians work hard to make it biologically viable."
 forceofwill.8060.d: "What can you offer [Owner.GetUsOrCollective]?"
 forceofwill.8060.d.response: "Not merely peaceful coexistence, but true harmony. A social fabric of diversity woven stronger than any single thread. With my help, [Owner.GetName] can achieve it."
 forceofwill.8060.hire_custom_tooltip: "§Y$babil$§! joins our empire as a §HLeader§!."

 forceofwill.8070.name: "$NAME_hox$"
 forceofwill.8070.desc: "§HOnly after a long silence did we realise that the other party was waiting for us to open the conversation; [ethic_leader.GetHisHerCap] primary bionic eye is fixed on us, while a small secondary arm remains clamped to the device held in this fungal being's tentacle.\n\nAfter we deliver our greeting, the alien addresses us in our own standard accent.§!\n\nWhat an honour to speak with representatives of the great [Owner.GetAdj] regime!\n\nI trust my communications officer has already forwarded my curriculum vitae to the relevant departments on your side; please accept this transmission as my formal application to join [Owner.GetName]."
 forceofwill.8070.a: "Tell us about yourself."
 forceofwill.8070.a.response: "I am Hox, a highly skilled and experienced chief administrator, and a devout follower of [Owner.Ideology.GetName].\n\nFor eleven and three-fifths years, I served as Deputy Undersecretary for Interdepartmental Procedure in the Ministry of Trade of the United Kingdom of Xuzofus, my home nation. Under my stewardship, the ministry's administrative efficiency rose by more than thirty percentage points, and only one of our officials was penalised in the annual Walk of Shame.\n\nI now wish to join your peerless nation, the galaxy's exemplar of [Owner.Ideology.GetEthic] values!"
 forceofwill.8070.b: "Why do you want to join us?"
 forceofwill.8070.b.response: "The [Owner.GetAdj] state is the supreme bastion of effective authority in a galaxy polluted by chaos and incompetent leadership! After studying [Owner.GetHoxLeadershipPraise], I knew my destiny was bound to the peerless [Owner.GetName].\n\nSadly, I have witnessed firsthand a nation's slide from centralised stability into...\n\n§HThe alien shudders.§!\n\n...the turbulent chaos of democracy. Allow me to lend my modest efforts to help you avoid the same fate."
 forceofwill.8070.b.praise_default: "the remarkable regime led by your [This.Ruler.GetTitle]"
 forceofwill.8070.b.praise_gestalt: "the remarkable [This.GetNetworkName] guided by your [This.GetBrainName]"
 forceofwill.8070.c: "What draws you to our [Owner.GetIdeologyType]?"
 forceofwill.8070.c.response: "[Owner.Ideology.GetName] integrates everything best about its ideas within a seamless logical framework. Specifically, I hold that no society can achieve greatness without a serious commitment to [Owner.Ideology.GetLastTenetName]."
 forceofwill.8070.d: "[Owner.GetHoxEnlistQuestion]"
 forceofwill.8070.d_outsider: "Why should we recruit an outsider?"
 forceofwill.8070.d_organic: "Why should we recruit an organic?"
 forceofwill.8070.d_self: "Why should we recruit you?"
 forceofwill.8070.d.response: "Your ideology is excellent, but your administrative processes could be improved. By implementing my plan for departmental integration and management restructuring, you can expect...\n\n§H$NAME_hox$ taps [ethic_leader.GetHisHer] device.§!\n\n...a 23.679% increase in bureaucratic productivity. At minimum.\n\nThis is based on my analysis of publicly available data."
 forceofwill.8070.hire_custom_tooltip: "§Y$hox$§! joins our empire as a §HLeader§!."

 forceofwill.8080.name: "$NAME_ephari$"
 forceofwill.8080.desc: "§HThe transmission image reveals a being composed entirely of bioluminescent coral; [ethic_leader.GetHisHerCap] fleshy coral structures sway gently, colours shifting rhythmically across a broad spectrum.\n\nAfter a brief delay, our communications [Owner.GetEphariCommsAssistant] translates these chromatophore changes into language.§!\n\nAs equals, we meet. The usual greetings of submission or dominion, we have no need of.\n\n§HThe branching soft coral columns begin to pulse brightly.§!\n\nEphari, we are."
 forceofwill.8080.comms_assistant: "assistant"
 forceofwill.8080.comms_drone: "sub-unit"
 forceofwill.8080.a: "Why do you want to join [Owner.GetUsOrCollective]?"
 forceofwill.8080.a.response: "§HBefore the translation takes shape, the Ephari's form fades to a soft blue.§!\n\nWe need a new home, and conquering others, or serving them, is not what we wish.\n\nIn [Owner.GetName], as equals, we seek a place to dwell."
 forceofwill.8080.b: "Are you one being, or many individuals?"
 forceofwill.8080.b.response: "§HThe Ephari's coral form glimmers gently through a sequence of purples and pinks.§!\n\nWe are too many to count. We are not a single organism but a mutualistic colony, cooperating for the common good of all members. When one thrives, all thrive.\n\nIf we can do this among ourselves, why not an entire society?"
 forceofwill.8080.c: "Tell us about your homeworld."
 forceofwill.8080.c.response: "For the higher castes that rule the reefs there, it is a beautiful place; for the lower castes, it means only humiliation and servitude.\n\n§HThe Ephari pauses, shifting through a series of deep crimson and ochre.§!\n\nFor the good of all, we tried to change these ancient traditions; but those above answered with violence. Many of our kind were killed. We escaped, but we can never return home."
 forceofwill.8080.d: "Why should we recruit you?"
 forceofwill.8080.d.response: "§HThe whole of the Ephari radiates an iridescent green lustre.§!\n\nNo one can resist tyranny alone. Our suffering taught us that. Yet united, hope remains."
 forceofwill.8080.hire_custom_tooltip: "§Y$ephari$§! joins our empire as a §HLeader§!."

 forceofwill.8095.name: "[willpower_leader_leaves.GetName] Departs"
 forceofwill.8095.desc.common: "In the wake of recent changes to our guiding principles, §H[willpower_leader_leaves.GetName]§! has withdrawn from [owner_empire.GetName] with immediate effect.\n\n[willpower_leader_leaves.GetHeSheCap] cites a clash of values as the main reason for this decision and has left only a brief letter of resignation, reproduced in full below:"
 forceofwill.8095.desc.tahqeq: "§R'We will meet again, peacemongers. Preferably on the battlefield.'§!"
 forceofwill.8095.desc.hulaandi: "§R'You have set foot on a broad road to war. I will take no part in it.'§!"
 forceofwill.8095.desc.sybanus: "§R'You have closed [owner_empire.GetEyeNamePlural] to the light of the True Star. Among those who choose darkness, I have no place.'§!"
 forceofwill.8095.desc.frulin: "§R'Misguided fools! I cannot endure one more day of this spiritual nonsense. Farewell!'§!"
 forceofwill.8095.desc.tdec: "§R'Recent policy changes have violated the service agreement between $NAME_tdec$ and [owner_empire.GetName]. That contract is void as of now.'§!"
 forceofwill.8095.desc.babil: "§R'The parochialism you have so recently acquired is genuinely regrettable. I must take my leave of you.'§!"
 forceofwill.8095.desc.hox: "§R'I once held high hopes for the glorious [owner_empire.GetAdj] future. My disappointment could not be greater.'§!"
 forceofwill.8095.desc.ephari: "§R'We thought you were what you are not. Farewell.'§!"
