 ###############
 #  Faction Ideology Choice
 ###############

 msi_dsai_faction.100.title:0 "The Dividing Line"
 msi_dsai_faction.100.desc:0 "Pragmatists are not one people; they are simply those who refuse to be bound by dogma. Now that the faction proposes to set an ideology for the empire, two camps have taken opposite ends of the long table. One trusts in measure and efficiency, and holds that every question will in time be answered by a newer and better machine. The other answers that a machine can only weigh what can be weighed, and that the soul of an empire is not among those things. The argument will not settle itself. We must choose between them -- or rather, choose what manner of people we mean to be."
 msi_dsai_faction.100.materialist:0 "Let Efficiency Rule"
 msi_dsai_faction.100.spiritualist:0 "Let Faith Rule"

 msi_dsai_faction.101.title:0 "The Two Ends of the Balance"
 msi_dsai_faction.101.desc:0 "Conciliationists call balance a virtue, but balance has never been still. When the faction moves to raise its creed to the empire's official ideology, a storm gathers in the chamber. Some hold that every laborer should be fit for the highest seat; others answer that order needs a hand at the helm, and that the finest should be given more. We cannot stand in the middle forever. This time, someone must choose a future for the empire."
 msi_dsai_faction.101.egalitarian:0 "Raise Everyone High"
 msi_dsai_faction.101.authoritarian:0 "Let the Finest Rule"

 msi_dsai_faction.102.title:0 "The Gate and the Lintel"
 msi_dsai_faction.102.desc:0 "Solidarists have always guarded the 'we' -- but where the boundary of that 'we' lies is a question no one can avoid. The elders of the faction say that because the stars are cold, we should reach out to every civilization willing to stand beside us. The young answer that every hand we reached for has come back as a blade. A gate can open only one way. We must decide who, under our lintel, may call us kin."
 msi_dsai_faction.102.xenophile:0 "Open the Gates"
 msi_dsai_faction.102.xenophobe:0 "Bar the Gates"

 msi_dsai_faction.103.title:0 "Blade and Precept"
 msi_dsai_faction.103.desc:0 "Sovereigntists honor every flag, and know as well that the honor behind a flag is often underwritten by a blade. Now the faction asks that this conviction be written as the empire's official ideology, and the two camps hold fast to either end. Some would found a state on morality and restraint, so that the stars remember our name and not our fleets. Others say that in a universe with no judge, only those who keep their weapons close have any right to speak of morality. The choice is ours to make."
 msi_dsai_faction.103.pacifist:0 "Let Morality Rule"
 msi_dsai_faction.103.militarist:0 "Let the Blade Rule"
