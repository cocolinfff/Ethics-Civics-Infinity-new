############################
# Member State Administration - Colonisation and transfer
############################
 msi_dsai_ms_colonize_title:0 "Allegiance of the New Colony"
 msi_dsai_ms_colonize_desc:0 "Colonisation of §Y[This.GetName]§! is complete. Under the union's charter, the new colony must be assigned: grant it to a member state, or keep it as a directly administered territory of the union.\n\nGranting it to a member state raises that state's satisfaction and gives the planet the corresponding member-state sovereignty modifier. A directly administered territory receives no member-state modifier and changes no member state's satisfaction."
 msi_dsai_ms_colonize_opt_1:0 "Grant to the United Federation"
 msi_dsai_ms_colonize_opt_2:0 "Grant to the People's Front"
 msi_dsai_ms_colonize_opt_3:0 "Grant to the Steel Realm"
 msi_dsai_ms_colonize_opt_4:0 "Grant to the United Empire"
 msi_dsai_ms_colonize_opt_5:0 "Grant to the Trade League"
 msi_dsai_ms_colonize_opt_free:0 "Keep as a directly administered territory"

 msi_dsai_ms_transfer_title:0 "Transfer Planet Sovereignty"
 msi_dsai_ms_transfer_desc:0 "Current planet: §Y[This.GetName]§!.\n\nTransferring sovereignty to a member state gives the planet that state's sovereignty modifier and raises the state's satisfaction. If the planet belonged to another member state, that state will be greatly upset; returning it to direct administration will upset it slightly."
 msi_dsai_ms_transfer_cancel:0 "Cancel"

 msi_dsai_ms_guide_title:0 "Transfer Planet Sovereignty"
 msi_dsai_ms_guide_desc:0 "Transferring sovereignty requires a target planet.\n\nSelect a planet you control on the star map (the capital is excluded), then click “Transfer Planet Sovereignty” in this panel. The same transfer is also available through the planetary decision on that planet."
 msi_dsai_ms_guide_back:0 "Back to Member State Administration"

############################
# Member State Administration - Reshape ethos
############################
 msi_dsai_ms_ethic_title:0 "Reshape a Member State's Ethos"
 msi_dsai_ms_ethic_desc_1:0 "You are reshaping the ideology of the §YUnited Federation§!."
 msi_dsai_ms_ethic_desc_2:0 "You are reshaping the ideology of the §YPeople's Front§!."
 msi_dsai_ms_ethic_desc_3:0 "You are reshaping the ideology of the §YSteel Realm§!."
 msi_dsai_ms_ethic_desc_4:0 "You are reshaping the ideology of the §YUnited Empire§!."
 msi_dsai_ms_ethic_desc_5:0 "You are reshaping the ideology of the §YTrade League§!."
 msi_dsai_ms_ethic_desc_cost:0 "\n\nThe state's ethos changes immediately, its satisfaction falls by §R10§!, and the union gains the §G“Member State Ethos Reshaped”§! modifier for §G10 years§!.\n\n§HCost:§!§Y150§! influence, §Y50§! unity."
 msi_dsai_ms_ethic_cancel:0 "Cancel"

############################
# Member State Administration - Initialisation notice
############################
 msi_dsai_ms_init_title:0 "Member State Mechanism Activated"
 msi_dsai_ms_init_desc:0 "The new government structure has drawn the many political entities into a single supranational body. Under the union's charter, your capital now carries the sovereignty symbols of all five member states: the United Federation, the People's Front, the Steel Realm, the United Empire and the Trade League.\n\nEvery new colony may now be granted to one of them, or kept under direct union administration. The “Convene the Member States' Assembly” decision has been added to your country decisions."
 msi_dsai_ms_init_opt:0 "Open Member State Administration"

