 msi_dsai_ms_init_desc:0 "The new government structure has drawn the many political entities into a single supranational body. Under the union's charter, your capital now carries the sovereignty symbols of all five member states: the $msi_dsai_desc_name_1$, the $msi_dsai_desc_name_2$, the $msi_dsai_desc_name_3$, the $msi_dsai_desc_name_4$, the $msi_dsai_desc_name_5$, the $msi_dsai_desc_name_6$, the $msi_dsai_desc_name_7$ and the $msi_dsai_desc_name_8$.\n\nEvery new colony may now be granted to one of them, or kept under direct union administration. The §HConvene the United Government Conference§! decision has been added to your planet decisions."
