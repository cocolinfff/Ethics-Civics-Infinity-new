 decision_msi_dsai_ms_transfer_planet_desc:0 "Transfer this planet's sovereignty to a member state, or return it to direct union administration."
 decision_msi_dsai_ms_transfer_planet_effects:0 "Opens the transfer dialog to choose which member state receives this planet's sovereignty."

