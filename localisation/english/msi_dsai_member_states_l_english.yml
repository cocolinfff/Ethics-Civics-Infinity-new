 msi_dsai_ms_colonize_desc:0 "Colonisation of §Y[This.GetName]§! is complete. Under the union's charter, the new colony must be assigned: grant it to a member state, or keep it as a directly administered territory of the union.\n\nGranting it to a member state raises that state's satisfaction and gives the planet the corresponding member-state sovereignty modifier. A directly administered territory receives no member-state modifier and changes no member state's satisfaction."
