 msi_dsai_ms_desc_intro_1:0 "$msi_dsai_desc_name_1$ is composed of dozens of autonomous provinces, large and small, governed uniformly by a relatively powerful federal government. Political life in this faction consists of elections, lobbying, and endless negotiations. Although this system is slow and diffuse, it is precisely through this that the nation has preserved its long tradition of pluralism."
 msi_dsai_ms_desc_intro_2:0 "$msi_dsai_desc_name_2$ emerged from the independence struggle of former colonial peoples and, after long-term social construction, gradually formed a new society of self-reliance and democracy. This faction advocates equality and solidarity among the people within the nation and hopes to spread its cherished ideals throughout the entire civilization and even the whole galaxy."
 msi_dsai_ms_desc_intro_3:0 "$msi_dsai_desc_name_3$ originated from a failed alliance and a brutal civil war. The survivors of the old alliance reforged the shattered union through iron and blood and sacrifice. The duality of obedience and rebellion among the people under this faction’s rule makes them eager to stabilize their fragile economy through war — just as in the \"Golden Age\" of the past."
 msi_dsai_ms_desc_intro_4:0 "$msi_dsai_desc_name_4$ is a loose and ancient commonwealth, in which dozens of former colonies are linked to one another by a common language, legal traditions, and a single crown. The monarch holds only a symbolic seat in this faction; what truly holds the empire together is a unified tariff schedule, mutually recognized diplomas, and a shipping network covering the jurisdictions under its rule."
 msi_dsai_ms_desc_intro_5:0 "$msi_dsai_desc_name_5$ is assembled from dozens of small and medium-sized states. They have no single capital, only a long string of free-trade port worlds and a permanent arbitration chamber. This faction believes that territory won through conquest cannot be maintained for long, and that only peace and trust are the foundations on which they can survive in the universe."
 msi_dsai_ms_desc_intro_6:0 "$msi_dsai_desc_name_6$ is made up of the same ethnicity and the same language. They believe that only by keeping their bloodline and culture pure can their nation stand among the stars; after the coalition government was established, this country viewed its parliament as a springboard for expanding the nation's borders outward.\n\n"
 msi_dsai_ms_desc_intro_7:0 "$msi_dsai_desc_name_7$ is an alliance made up of scholar-run nations. Its planetary parliament also serves as a research institution, and members often double as lab directors. Any budget proposals from the joint government have to pass the academy's feasibility assessment first.\n\n"
 msi_dsai_ms_desc_intro_8:0 "The political life of $msi_dsai_desc_name_8$ revolves around faith, and typically, bishops and priest elders make decisions on national policies together. It sees the united government as a community leading to higher revelation, but it also worries that the secular squabbles in parliament could weaken the cohesion of faith.\n\n"

