############################
# Member State Administration - Panel body (success_text concatenation)
############################
 msi_dsai_ms_desc_name_1:0 "§BUnited Federation§!\n"
 msi_dsai_ms_desc_name_2:0 "§RPeople's Front§!\n"
 msi_dsai_ms_desc_name_3:0 "§WSteel Realm§!\n"
 msi_dsai_ms_desc_name_4:0 "§HUnited Empire§!\n"
 msi_dsai_ms_desc_name_5:0 "§GTrade League§!\n"

 msi_dsai_ms_desc_intro_1:0 "This society is stitched together from dozens of autonomous provinces that legislate, tax and police themselves, surrendering to the centre only the fleet and the right to declare war. Its political life consists of elections, lobbies and endless interstate negotiation; the union offices feel more like a standing conference of delegates than a capital. Critics call it slow and diffuse; its defenders answer that this slowness is precisely what keeps any single province from being swallowed by a machine."
 msi_dsai_ms_desc_intro_2:0 "This organisation grew out of early trade unions and research cooperatives. It treats the individual as one link in the collective, and so folds resources, land and labour into a single production schedule; it celebrates the factory that starts on time and the laboratory that finishes the year without an accident. The heaviest word in its political vocabulary is contribution."
 msi_dsai_ms_desc_intro_3:0 "This polity began in a border war and has written armament and discipline into every procedure of daily life since: school drills follow fleet watches, factory quotas are graded by military standards. Its territory is vast and its winters long, so it measures safety in strategic depth and treats peace as the interval between two rounds of preparation."
 msi_dsai_ms_desc_intro_4:0 "This empire is a loose and ancient association: dozens of former colonies bound by a shared language, a shared legal tradition and a single crown. The monarch holds only a symbolic seat in the union; what truly holds the Empire together is a common tariff, mutually recognised credentials and a shipping network spanning half a sector. Its subjects live between two legal systems, and are proud of it."
 msi_dsai_ms_desc_intro_5:0 "This league is assembled from dozens of small and middling civilisations. It has no single capital, only a long chain of port worlds and one permanent arbitration hall. Voting weight is apportioned by shipping shares, and its legal code spends far more pages on standards, subsidies and claims than on sovereignty and constitution. Old officials of the League like to say that contracts outlast flags and standards outlast armies."

 msi_dsai_ms_desc_ethic_prefix:0 "§EEthos:§!\n"
 msi_dsai_ms_desc_line_break:0 "\n"
 msi_dsai_ms_desc_ethic_1:0 "Interventionism"
 msi_dsai_ms_desc_ethic_2:0 "Pacifism"
 msi_dsai_ms_desc_ethic_3:0 "Cooperativism"
 msi_dsai_ms_desc_ethic_4:0 "Competitionism"
 msi_dsai_ms_desc_ethic_5:0 "Technicism"
 msi_dsai_ms_desc_ethic_6:0 "Spiritualism"
 msi_dsai_ms_desc_ethic_7:0 "Pluralism"
 msi_dsai_ms_desc_ethic_8:0 "Monoculturalism"
 msi_dsai_ms_desc_ethic_9:0 "Conciliationism"
 msi_dsai_ms_desc_ethic_10:0 "Pragmatism"
 msi_dsai_ms_desc_ethic_11:0 "Solidarism"
 msi_dsai_ms_desc_ethic_12:0 "Sovereigntism"
 msi_dsai_ms_ethic_attraction_tt:0 "§HMember State Ethos:§! The current ethos of the member state that holds this planet gains §G25%§! attraction."

 msi_dsai_ms_desc_sat_1:0 "Satisfaction: §Y[Root.msi_dsai_ms_sat_1]§!/100\n"
 msi_dsai_ms_desc_sat_2:0 "Satisfaction: §Y[Root.msi_dsai_ms_sat_2]§!/100\n"
