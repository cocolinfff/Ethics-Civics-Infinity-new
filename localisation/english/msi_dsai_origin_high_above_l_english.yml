l_english:
 origin_high_above:0 "High Above"
 origin_high_above_desc:0 "This civilization's drive to reach the stars began with a contest between two pre-FTL nations: each one kept building its administrative towers higher than the other, simply to prove which of them was the superior nation. That race never truly ended - the two great space elevators still climb to this day."
 origin_high_above_effects:0 "- Two space elevators, the §YTower of Democratic Thought§! and the §YTower of the Liberty Torch§!, stand upon the homeworld, and each can climb to 20 levels.\n- The §YTower of Democratic Thought§! provides $MOD_PLANET_AMENITIES_ADD$, $MOD_PLANET_STABILITY_ADD$ and $MOD_POP_HAPPINESS$, growing stronger with each level.\n- The §YTower of the Liberty Torch§! provides $MOD_POP_BONUS_WORKFORCE_MULT$ and $mod_planet_jobs_trade_produces_mult$, growing stronger with each level.\n- Planetary decisions let you spend $r_energy$ and $r_minerals$ to raise either tower.\n- When the two towers stand at different heights a §YRivalry Effect§! arises: the greater the gap, the higher the $MOD_POP_BONUS_WORKFORCE_MULT$, but the worse the $MOD_PLANET_STABILITY_ADD$ penalty."
