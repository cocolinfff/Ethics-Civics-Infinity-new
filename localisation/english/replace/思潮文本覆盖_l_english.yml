l_english:

###############
#    Ethics    
###############

 ethic_authoritarian:0 "Competitionism"
 ethic_authoritarian_desc:1 "§LSurvival of the fittest: the individual is an end in itself, and society merely the means to that end. The common good is secured only once every private good is secured first.§!\n"

 ethic_fanatic_authoritarian:0 "Elitism"
 ethic_fanatic_authoritarian_desc:1 "§LThe strongest claim the most — this is the only law the cosmos ever wrote. Fretting over the unfit only makes us soft; only the elite can truly carry us through a hostile universe.§!\n"

 ethic_absolute_authoritarian:0 "Absolutism"
 ethic_absolute_authoritarian_desc:0 "§LAll glory and wisdom are mine by right — the unshaken reward of the victor.§!\n"

 ethic_conciliationsm:0 "Conciliationism"
 ethic_conciliationsm_desc:1 "§LFreedom breeds chaos; authority leads to the abyss. No form of government in this universe is absolutely superior. Whether a human is black or white, one who catches a Burog is a good human.§!\n"

 ethic_egalitarian:0 "Cooperativism"
 ethic_egalitarian_desc:1 "§LBetween the individual and the collective there can be no irreconcilable opposition — nor should there be. A person's worth lives on in the greater whole they help to compose.§!\n"

 ethic_fanatic_egalitarian:0 "Egalitarianism"
 ethic_fanatic_egalitarian_desc:1 "§LEquality cannot be discharged with empty promises. Every member of society must be able to rise through their own labor. Without the support of its producers, a thriving society is a word on paper.§!\n"

 ethic_absolute_egalitarian:0 "Equalism"
 ethic_absolute_egalitarian_desc:0 "§LInequality divides rich from poor as entropy divides heat from cold. As sapient beings, we must name every tyranny and uproot it until the final victory.§!\n"

 ethic_xenophobe:0 "Monoculturalism"
 ethic_xenophobe_desc:1 "§LEvery culture our civilization has ever grown is a treasure hammered out over ages, the fittest there is for us. One truth we must hold fast: alien thought is poison to our civilization.§!\n"

 ethic_fanatic_xenophobe:0 "Xenophobia"
 ethic_fanatic_xenophobe_desc:1 "§LWe already gamble greatly in crossing the star sea, and every unknown is magnified by suspicion. Trust in alien life is meaningless: across species and across ideology, cosmic society ceases to be a forest of fairy tales.§!\n"

 ethic_absolute_xenophobe:0 "Purism"
 ethic_absolute_xenophobe_desc:0 "§LWe must accept a simple truth: everything in this universe bears us pure malice. To protect ourselves, we must learn to refuse others.§!\n"

 ethic_nationalism:0 "Solidarism"
 ethic_nationalism_desc:1 "§LIn a frozen universe, every unknown is deadly. For the eternal welfare of our state, we can — and must — trust without reservation the many communities that compose our great society.§!\n"

 ethic_xenophile:0 "Pluralism"
 ethic_xenophile_desc:0 "§LNever let the warmth of the heart go out. Shelter the weak, aid one another, and befriend the peoples of every civilization. Though such feeling be betrayed a thousand times, it remains our greatest wish.§!\n"

 ethic_fanatic_xenophile:0 "Fraternalism"
 ethic_fanatic_xenophile_desc:0 "§LEvery mind among us holds some curiosity for the unknown, and some instinctive dread of being alone. We would speak with any species at all, if only to know more, and understand more.§!\n"

 ethic_absolute_xenophile:0 "Xenolatry"
 ethic_absolute_xenophile_desc:0 "§LWe have come to know our own frailty all too well. Only by pleading with the alien strangers who command higher technology may we yet be saved.§!\n"

 ethic_militarist:0 "Interventionism"
 ethic_militarist_desc:1 "§LThere is no true quiet in the void. We hold courage and discipline to be the only real virtues — and the will to strike first in defense of our way of life, their proof.§!\n"

 ethic_fanatic_militarist:0 "Militarism"
 ethic_fanatic_militarist_desc:1 "§LIn this helpless deep, nothing carries further than force. Arms guard us better than any fragile pact or promise.§!\n"

 ethic_absolute_militarist:0 "Violentism"
 ethic_absolute_militarist_desc:0 "§LTo survive the universe, weakness and illusion are our greatest enemies. Violence solves nothing — yet before absolute violence, no problem remains.§!\n"

 ethic_defensivism:0 "Sovereigntism"
 ethic_defensivism_desc:1 "§LThose who worship war perish by it; those who forget war perish in the dark. We respect the sovereignty of others — yet only with weapons in hand will restless ambition take our choices seriously.§!\n"

 ethic_pacifist:0 "Pacifism"
 ethic_pacifist_desc:0 "§LEvery dispute admits a peaceful answer; violence is the resort of the last extreme. Conflict is destructive — it destroys the very things we fight over.§!\n"

 ethic_fanatic_pacifist:0 "Appeasement"
 ethic_fanatic_pacifist_desc:0 "§LThe universe is a dark forest, and every civilization a hunter carrying a gun. In this endless arena of slaughter, only peace and our love can bring one ray of light to the dark thicket.§!\n"

 ethic_absolute_pacifist:0 "Moralism"
 ethic_absolute_pacifist_desc:0 "§LWe have endured suspicion and violence far too long — so long that the void itself is steeped in darkness. If we do not act, who else will light the universe?§!\n"

 ethic_spiritualist:0 "Spiritualism"
 ethic_spiritualist_desc:1 "§LAll life and culture are but the outward form of spirit, far beyond what the narrow word 'matter' can hold. More than finite flesh, we should attend to the infinite spiritual welfare of our people.§!\n"

 ethic_fanatic_spiritualist:0 "Clericalism"
 ethic_fanatic_spiritualist_desc:0 "§LOur sages labored their whole lives for our eternal bliss, and laid the foundation of our thought. The old doctrines are not beyond transcendence — but before we go further, we must be patient with our society, and with our people.§!\n"

 ethic_absolute_spiritualist:0 "Transcendentalism"
 ethic_absolute_spiritualist_desc:0 "§LCast off the surface of matter, and let the soul commune directly with the wonder of the cosmos! Its radiance is everywhere, and together we shall share in that great light.§!\n"

 ethic_pragmatism:0 "Pragmatism"
 ethic_pragmatism_desc:1 "§LThe fate of a civilization rests on the material no less than on the progress of the spirit. Only thought applied dialectically to the remaking of society can call itself sound.§!\n"

 ethic_materialist:0 "Technicism"
 ethic_materialist_desc:0 "§LWhat we call spirit is only the working of cosmic law; to set feeling above reality is folly of the first order. Only relentless progress brings the good life.§!\n"

 ethic_fanatic_materialist:0 "Efficientism"
 ethic_fanatic_materialist_desc:0 "§LInefficient tradition blocks every advance without mercy. Society is no more than one algorithm after another; before ever-new technology, nothing is irreplaceable.§!\n"

 ethic_absolute_materialist:0 "Mechanism"
 ethic_absolute_materialist_desc:0 "§LUnnecessary. Superfluous. Obsolete. Fit to be culled. Soon to be culled. Already culled. Existence is everything; everything is for existence.§!\n"

 ethic_neutral:0 "Neutralism"
 ethic_neutral_desc:0 "§LNeutral thought is free thought, accepting all possibilities...§!"
 concept_ethic_neutralneutral:0 "$ethic_neutral$"
 concept_ethic_neutralneutral_desc:0 "$ethic_neutral_desc$\n$t$- ['ethic:ethic_conciliationsm']\n$t$- ['ethic:ethic_nationalism']\n$t$- ['ethic:ethic_defensivism']\n$t$- ['ethic:ethic_pragmatism']"
 concept_fanatic_ethics:0 "Fanatic Ethics"
 concept_fanatic_ethics_desc:0 "Passionate thoughts will bring strong willpower.\n$t$- ['ethic:ethic_fanatic_authoritarian']\n$t$- ['ethic:ethic_fanatic_egalitarian']\n$t$- ['ethic:ethic_fanatic_materialist']\n$t$- ['ethic:ethic_fanatic_spiritualist']\n$t$- ['ethic:ethic_fanatic_militarist']\n$t$- ['ethic:ethic_fanatic_pacifist']\n$t$- ['ethic:ethic_fanatic_xenophile']\n$t$- ['ethic:ethic_fanatic_xenophobe']"

 ethic_gestalt_consciousness:0 "Gestalt Consciousness"
 ethic_gestalt_consciousness_desc:0 "§LMany minds, \nOne self.§!"

 ethic_focused:0 "United Will"
 ethic_focused_desc:0 "This empire has gradually unified throughout history, eliminating all ideologies deemed erroneous."

