l_english:

 NAME_socialism1:0 "Shui Wa"
 socialism1:0 "An outstanding migrant worker who has worked in a variety of jobs, [Root.GetFirstName] loves the land and the vast starry sky that nurtures him."
 socialism1_catch_phrase:0 "§L“Standing at such a high place, people's thoughts must be different...”§!"


 ethic_paragon.51000.name:0 "$NAME_socialism1$"
 ethic_paragon.51000.desc:0 "§HHe took off the hat woven from crop fibers from his head and wiped the stains on his face with fabric wrapped around his upper body.§!\n\nHello, [ruler.GetRegnalName][Root.GetRulerCall], my name is Shui Wa, I want to find a job."
 ethic_paragon.51000.a:0 "What is your line of work?"
 ethic_paragon.51000.a.response:0 "I can do anything, \n\n§HHe thought for a moment and continued.§!\n\nI started out as a farmer. Later, worked as a miner in a private mine, and then went to the city to shine people's shoes... From six years ago until last month, I was a maintenance officer for the external structure of the space station."
 ethic_paragon.51000.b:0 "Why did you choose to work for us?"
 ethic_paragon.51000.b.response:0 "I know a friend who told me that the current era is full of opportunities, with golden birds flying all over the sky. As long as you reach out and catch one, you may catch one - if you take yourself seriously first. I saw your job advertisement and thought I could do it, so I came."
 ethic_paragon.51000.c:0 "So what position do you think you can do?"
 ethic_paragon.51000.c.response:1 "When I was working, I self-taught some socio-economic knowledge and now I have obtained a Master's degree in Sociology. I have always been interested in urban planning and I think I can serve as a governor."
 ethic_paragon.51000.hire_custom_tooltip:0 "§Y$NAME_socialism1$§! joins our empire as a §HLeader§!."

 # Shui Wa / socialism1
 ethic_paragon.51010.name:0 "The Friends"
 ethic_paragon.51010.desc:1 "§Y[Root.GetName]§!Friend, human scientist§Y$NONA_BLORG_EX_HUSBAND_NAME$§! Hope to join our empire. The scientist said he was quite interested in the super space engineering project we were about to start building, and brought with him the new materials he was working on. [Root.GetFirstName] assures us that $NONA_BLORG_EX_HUSBAND_NAME$ is knowledgeable enough to be the chief designer of space engineering construction."
 ethic_paragon.51010.a:0 "His knowledge and experience are quite valuable."
 ethic_paragon.51010.a.custom_tooltip:0 "The Human §Y$LUHAI_NAME$§! joins our empire as a §HLeader§!."
 ethic_paragon.51010.b:0 "We have identified a better candidate."
 LUHAI_NAME:0 "Lu Hai"
 LUHAI_DESC:0 "An outstanding materials scientist."
 ethic_paragon.51020.name:0 "Desire for the Stars"
 ethic_paragon.51020.desc:1 "Governor §Y[Root.GetName]§! His longing for the profound universe is increasing day by day. In addition to his busy work, he always comes to the top of tall buildings and overlooks the deep starry sky. Finally, after completing a certain day's work, he came to the office of [ruler.GetRegnalName] and submitted a job change application. He is eager to obtain approval for space exploration and hopes to allocate a research ship for him."
 ethic_paragon.51020.a.custom_tooltip:0 "$NAME_socialism1$ is still a §Y$official$§!."
 ethic_paragon.51020.b.custom_tooltip:0 "$NAME_socialism1$ became a §Y$scientist$§!."


 # 乡村教师 / socialism2
 ethic_rural_teachers.2.name:0 "Talent Analytics Programs"
 ethic_rural_teachers.2.desc:0 "We notice that §Y[primitive_civ.Capital_Scope.GetName]§! has begun a new round of technological revolution, and a steady stream of scientific and technological talents is emerging on this planet.\n\nAfter studying the general history of galactic civilizations, our sociologists agree that there will be a group of "galactic" research geniuses in this civilization, and some talents will be buried in the course of history. The Scientific Advisory Board has submitted to us a proposal to identify and recruit the buried geniuses of the [primitive_civ.GetAdj] civilization to replenish our talent pool, and assures us that this will not interfere with the development of this civilization."
 ethic_rural_teachers.2.a:0 "Interesting idea, keep going."
 ethic_rural_teachers.4.name:0 "Village Teacher"
 ethic_rural_teachers.4.desc:0 "Some time ago, our observatory launched a large-scale assessment of the §Y[primitive_civ.GetAdj] civilization§!. After tireless efforts, our research team really found a down-and-out indigenous scientist. Born in a remote mountain village on the planet, this genius returned to his birthplace to work in education after receiving his education, and because he was not actually engaged in scientific work, it was not until we investigated that he found out [teacher.GetSheHe].\n\nOur investigators have found that he has suffered from an incurable disease under the current state of technology of the [primitive_civ.GetAdj] civilization, and if we do not act in time, we will unfortunately see the fall of a genius who can affect interstellar civilization."
 ethic_rural_teachers.4.a:0 "Immediately send a scientific research team to treat [teacher.GetSheHeCap]."
 ethic_rural_teachers.4.b:0 "Let's not waste time."
 ETHIC_RURAL_TEACHERS_PROJECT:0 "Emergency Medical Treatment"
 ETHIC_RURAL_TEACHERS_PROJECT_DESC:0 "A [primitive_civ.GetAdj] teacher from the planet [primitive_civ.Capital_Scope.GetName] was confirmed by our scientists to be a supergenius, but [teacher.GetSheHe] is terminally ill because of poverty. Whatever the purpose, we need to send a team of scientists to treat it immediately."
 ethic_rural_teachers.5.name:0 "Awakening"
 ethic_rural_teachers.5.desc:0 "Our scientific team successfully cured [teacher.GetName], now [teacher.GetSheHe] woke up in our observatory.\n\nIn the beginning, [teacher.GetName] was astonished by its environment, but after communicating with our resident researchers, [teacher.GetSheHe] calmed down, but still showed concern for his hometown, the students he educated, to be exact. In Jean [teacher.GetName] may still not be able to convince [teacher.GetSheHe] works for us."
 ethic_rural_teachers.5.a:0 "Let me and [teacher.GetSheHe] talk about it."

 socialism2:0 "A great village teacher."
 socialism2_catch_phrase:0 "§L“No matter how poor you are, you can't be poor in education, and no matter how hard you are, you can't miser students.”§!"

 ethic_paragon.52000.name:0 "[teacher.GetName]"
 ethic_paragon.52000.desc:0 "§HSee your hologram, [teacher.GetSheHe] pushed the auxiliary lens holder worn in front of the visual organ in embarrassment.§!\n\nHello, [Root.GetLeaderNamePersistent][Root.GetRulerCall], I'm [teacher.GetName], it's an honor to meet you..."
 ethic_paragon.52000.a:0 "Please relax and talk about yourself."
 ethic_paragon.52000.a.response:0 "Me? I think you should know that I'm just an ordinary [primitive_civ.GetAdj] teacher...\n\n§H[teacher.GetSheHe] thought for a moment and continued.§!\n\nYou may have seen my information, the place where I teach is where I was born, and it is very barren. I was educated in our civilized city, and only then did I know that our civilization had entered - ah, yes, the industrial age, thank you——, but the place where I was born was still in the primitive agricultural age, numb to the scary."
 ethic_paragon.52000.b:0 "So why are you back where you were born?"
 ethic_paragon.52000.b.response:0 "Well... No matter what, the babies still have hope.\n\nPerhaps you and your civilization have also experienced things like this: adults have become increasingly shrewd in long-term scarcity, they despise the "poor words" that slow down money, and even do not make long-term plans, just want to earn those foolish household money Knowledge never takes root and sprouts in their minds, but children are different. Even if they suffer at home, they still have to carry a blanket to school. They are like a group of little insects struggling to break free from the darkness with all their lives. They are like this, and I was like this before My teacher is concerned about me, and I am also concerned about these children who want to go to school\n\n§H[teacher.GetSheHe] smiled sheepishly.§!\n\nSorry to make you laugh."
 ethic_paragon.52000.c:0 "Do you know that you actually have enough talent to change the world, enough to feed and clothe your life?"
 ethic_paragon.52000.c.response:1 "Talent? Me? I never knew what my talent was, I was just interested in physics and had won the first prize in a certain competition before. But by the time I graduated, the school in my hometown had been abandoned for several years. Without a teacher to teach the children, it wouldn't be possible. Without my teacher, I wouldn't have been able to finish high school, and I couldn't see the lights outside. So I let go of these competitions and went back to teaching the children.\n\n§HSpeaking of which, [teacher.GetSheHe] paused, as if pondering something. You wait patiently for a while until [teacher.GetSheHe] spoke again.§!\n\nI think I probably know May I ask, is your civilization helping me because of what you said about my talent? Your civilization needs talent now?"
 ethic_paragon.52000.d:0 "You are very sharp, and we do need your talent to work for us."
 ethic_paragon.52000.d.response:1 "Work for your civilization? Your civilization is my lifesaver, the level of civilization is beyond my imagination, and I really want to join you. But I'm worried about those kids... Before taking office, I have a request, can your civilization promote the formation of a consensus in the [primitive_civ.GetAdj] society to value education at the bottom?\n\n§H[teacher.GetSheHe] scratched the top of his skull.§!\n\nThis is just an unreasonable request from me, and I will join your civilization no matter what. But I don't want the children to be foolish like the adults just because I'm gone..."
 ethic_paragon.52000.e:0 "§HWe promise you.§!"
 ethic_paragon.52000.e_custom_tooltip:0 "§Y[teacher.GetName]§! joins our empire as a §HLeader§!.\n[primitive_civ.GetAdj] civilization will undergo a transformation."
 ethic_paragon.52000.f:0 "§LSorry, we can't do it...§!"
 ethic_paragon.52000.hire_custom_tooltip:0 "§Y[teacher.GetName]§! joins our empire as a §HLeader§!."


 # 莉莉丝·米娅
 lilith_mia_digsite:0 "Ancient Core"
 lilith_mia_digsite_desc:0 "Probes have discovered an unnatural cavern deep beneath the crust of [From.Planet.GetName], housing a colossal mechanical construct embedded within. If something truly lies buried down there, we had best uncover it before anyone else does."

 lilith_mia.2.name:0 "Anomaly Report from the Mining Expedition"
 lilith_mia.2.desc:0 "An alien mining expedition in our employ detected a pulsed signal while conducting deep drilling on a barren world in the §Y[Root.Capital.solar_system.GetName]§! system. The signal emanated from a vast cavern beneath the rock strata, with a steady, regular frequency unlike any known geological phenomenon.\n\nWe have dispatched an archaeological team to take over the site. If something truly lies buried down there, we had best uncover it before anyone else does."
 lilith_mia.2.a:0 "Dispatch the archaeological team."

 lilith_mia.10.name:0 "Fortress Beneath the Strata"
 lilith_mia.10.desc:0 "The archaeological team descended underground through the borehole left by the mining expedition. After breaching the final rock face, a corridor sealed with alloy emerged before them.\n\nAt the end of the corridor stood a massive defensive gate, its armor plating far exceeding the engineering standards of any known civilization. Geological dating indicates the fortress was constructed—and abandoned—long before our species ever emerged as a civilization in this galaxy. Researching it will grant us immense insight into the history of this galactic sector."
 lilith_mia.10.a:0 "Begin the work."

 lilith_mia.11.name:0 "Ancient Archives"
 lilith_mia.11.desc:0 "The interior of the fortress is far vaster than anticipated. We have found record halls, barracks, armories, and sealed passageways leading even deeper. Most systems have ceased functioning, but portions of the data lattices remain accessible.\n\nDecryption efforts continued for weeks, and the pieced-together records reveal that this planet served as a war fortress for an unknown civilization long before our species developed civilization. It was a frontline hub that withstood countless sieges, only to be completely abandoned following a single handover.\n\nThe phrase 【▮▮▮▮▮▮▮▮▮▮▮▮】 appears repeatedly in the archives. We do not know the exact meaning of this phrase, but it appears to be the name of the fortress's second-to-last commander, who also issued the full evacuation order.\n\nThe final operational log contains only a short codename: 【The Watcher】."
 lilith_mia.11.a:0 "Press deeper."

 lilith_mia.12.name:0 "The Watcher"
 lilith_mia.12.desc:0 "As more data was recovered, our computer teams uncovered further traces of modification. All evidence indicates that in the years before its final shutdown, the fortress was no longer used for military purposes, but was gradually converted into an advanced cutting-edge research institute.\n\nThe portrait of 【The Watcher】 has also been pieced together from various archives: this leader was an extraordinarily accomplished strategist who, in ancient times, commanded vast military fleets to win vast territories for a theocratic empire. Widely revered within her civilization, she was destined to live out her days in grand cathedrals—yet she chose a heretical path out of a fanatical devotion to machinery. After secretly acquiring ownership of a remote fortress that was about to be abandoned, she transformed the fortress into an experimental base for her own research on synthetic humans, and ultimately transformed herself into a mechanical body, uploading her consciousness into the core of the fortress."
 lilith_mia.12.a:0 "Press deeper."

 lilith_mia.13.name:0 "Central Core Chamber"
 lilith_mia.13.desc:0 "We have reached the fortress's central core chamber. Within the vast space, countless conduits converge from all directions onto a sealed central pedestal, connected to a still-dormant personality core.\n\n§HLilith Mia§!, the great fleet commander, the last 【Watcher】 of the ancient fortress, slumbers here. Her tactical database holds the memories of countless wars—the most precious legacy of a brilliant military mind. We can attempt to awaken her and negotiate her service to our civilization. But doing so carries immense risk. Should we chance awakening an ancient war intelligence?"
 lilith_mia.13.a:0 "Awaken her."
 lilith_mia.13.b:0 "Dismantle and study."

 lilith_mia.14.name:0 "Awakening"
 lilith_mia.14.desc:0 "The personality core was connected to the power supply matrix. After a brief silence, the machine arrays in the central core chamber roared back to life.\n\nUnexpectedly, she agreed almost eagerly to our request that she serve our civilization—by her own account, she had long grown disgusted with the stale dogma of her ancient civilization. She far prefers commanding fleets across the stars to being enshrined as a so-called 'saint' in temples.\n\nBefore formally integrating her into our command structure, however, we need to determine her specific political alignment."
 lilith_mia.14.tooltip:0 "“You need to ask me about this? Do whatever you want. Either way, I'm the one who ends up fighting and dying on the front lines.”"
 lilith_mia.14.militarist:0 "$ethic_militarist$"
 lilith_mia.14.pacifist:0 "$ethic_pacifist$"
 lilith_mia.14.materialist:0 "$ethic_materialist$"
 lilith_mia.14.spiritualist:0 "$ethic_spiritualist$"
 lilith_mia.14.authoritarian:0 "$ethic_authoritarian$"
 lilith_mia.14.egalitarian:0 "$ethic_egalitarian$"
 lilith_mia.14.xenophobe:0 "$ethic_xenophobe$"
 lilith_mia.14.xenophile:0 "$ethic_xenophile$"
 lilith_mia.14.gestalt:0 "$ethic_gestalt_consciousness$"

 lilith_mia.15.name:0 "Legendary Leader: $NAME_Lilith_Mia$"
 lilith_mia.15.desc:0 "So, you actually intend for me to join you?\n\n§HA faint trace of anticipation colors Lilith's voice.§!\n\nFor the record, I'm not staying because I want to help you. It's just... since you went and woke me up, someone has to clean up your mess, right?"
 lilith_mia.15.a:0 "Why are you willing to help us?"
 lilith_mia.15.a.response:0 "Who said I'm willing to help you?\n\n§HShe retorts immediately, the red glow of her core flashing wildly.§!\n\nI just think your technology has some potential, and I don't want to watch you throw your lives away for nothing. A young civilization like yours would barely survive out there on your own."
 lilith_mia.15.b:0 "What wars have you commanded?"
 lilith_mia.15.b.response:0 "More than you could count. Do you keep track of every calorie you consume?\n\nI once led a fleet across the galactic core black hole to raid the Doom Legions of Nochamatlan. I commanded the Holy Guard beneath the Crown of Zakran to hold off the remnants of the Synthetic Queen at the edge of the Celestial Spur. I led the Papal Crusade against the xeno-hives beyond the galactic rim... Even before this fortress sealed itself, I single-handedly commanded its automated defense array to fend off those papal lapdogs.\n\nA young civilization like yours couldn't possibly comprehend my former glory. You just need to know I've fought many battles, and I've rarely lost."
 lilith_mia.15.c:0 "Do you have any demands?"
 lilith_mia.15.c.response:0 "Don't mess with my core processor. Don't touch my battle plans. The rest is up to you.\n\n§HShe pauses, then turns down the volume of her speakers slightly.§!\n\nOh, and you'd better study the tactical examples I give you. A young civilization like yours has a lot to learn, understand?"
 lilith_mia.15.d:0 "$DISMISS$ (Not really)"
 lilith_mia.15.d.custom_tooltip:0 "§HHey! You wake me up just to leave me here all alone?§!"

 NAME_Lilith_Mia:0 "Lilith Mia"
 NAME_Lilith_Mia_Species:0 "Ancient Cybernetic Intelligence"
 NAME_Lilith_Mia_Species_plural:0 "Ancient Cybernetic Intelligences"
 NAME_Lilith_Mia_Species_adj:0 "Ancient Cybernetic"
 lilith_mia_leader_background:0 "This leader was a brilliant strategist from a long-dead interstellar civilization. She abandoned the theocratic faith out of devotion to machinery and research, uploading her consciousness into a mechanical body."
 lilith_mia_catch_phrase:0 "I can't stand watching you idiots bungle this war. Listen up—the next battle plan is mine, and no one will argue. ...What are you staring at? Get moving!"





 red_dawn:0 "§RRed Dawn§!"
 trait_red_dawn:0 "§RRed Dawn§!"
 trait_red_dawn_desc:0 "A species that has implanted the idea of communism in the collective subconscious, the only belief they have since they entered the age of utopianism."

 NAME_red_dawn:0 "Red Dawn"
 NAME_new_red_dawn:0 "United Civilization of New Red Dawn"
 NAME_red_dawn_database:0 "Red Dawn Database"

 leader_trait_huazhang:0 "Temporary Political Commissar"
 leader_trait_huazhang_desc:0 "As the last group of executors of the Red Dawn Civilization Spark Plan, the scientists of the People's Academy of Sciences were urgently granted the highest level operation right of the collective unconscious. As long as the seeds fall into the soil, new forests will absorb nutrients from the ashes and break through the soil, thriving."

 leader_trait_red_dawn:0 "§RRed Dawn§!"
 leader_trait_red_dawn_desc:0 "The species of Red Dawn is said to have achieved a high degree of self-sublimation, and even implanted the concept of communism into the collective subconscious. They not only break through their own desires, but also enable them to learn quickly in a variety of complex environments."
 leader_trait_governor_red_dawn:0 "§RRed Dawn§!"
 leader_trait_governor_red_dawn_desc:0 "The species of Red Dawn is said to have achieved a high degree of self-sublimation, and even implanted the concept of communism into the collective subconscious. They not only break through their own desires, but also enable them to learn quickly in a variety of complex environments."
 leader_trait_scientist_red_dawn:0 "§RRed Dawn§!"
 leader_trait_scientist_red_dawn_desc:0 "The species of Red Dawn is said to have achieved a high degree of self-sublimation, and even implanted the concept of communism into the collective subconscious. They not only break through their own desires, but also enable them to learn quickly in a variety of complex environments."


 ethic_easter.1.name:0 "Deep Space Signal"
 ethic_easter.1.desc:0 "Our sensors picked up a regular signal from outside our star system, and the data showed that the source appeared to be approaching our planet at sub-light speeds. We need to dispatch a professional team to decipher the signal and keep track of its source."
 ethic_easter.1.a:0 "Let's see where it came from"

 stardust_chain_title:0 "Deep Space Signal"
 stardust_chain_desc:0 "Our sensors picked up a regular signal from outside our star system, and the data showed that the source appeared to be approaching our planet at sub-light speeds. We need to dispatch a professional team to decipher the signal and keep track of its source."
 STARDUST_PROJECT:0 "Deep Space Signal"
 STARDUST_PROJECT_DESC:0 "Our sensors picked up a regular signal from outside our star system, and the data showed that the source appeared to be approaching our planet at sub-light speeds. We need to dispatch a professional team to decipher the signal and keep track of its source."


 ethic_easter.2.name:0 "Make Connections"
 ethic_easter.2.desc:0 "After deciphering, we have successfully established a connection with an unknown alien object - apparently, it has intelligence and is seeking to communicate with us."
 ethic_easter.2.a:0 "Access to communication"
 ethic_easter.2.b:0 "Alien? Fire now!"
 ethic_easter.2.c:0 "Food? Fire now!"


 ethic_easter.3.name:0 "The Laurel"
 ethic_easter.3.desc:0 "§H<Dictionary Translation Completed>§!\n\nHello, unfamiliar civilization, this is the Red Dawn deep space scientific research ship-Laurel, our ship's three-dimensional space navigation system is about to fail, and I ask your space station to pilot."

 ethic_easter.3.a:0 "Who are you?"
 ethic_easter.3.a.hive:0 "Which collective consciousness do you belong to?"
 ethic_easter.3.a.machine:0 "Inquiry: Your information?"
 ethic_easter.3.a.response:0 "I'm a database administrator, codenamed §YHua Zhang§!, working at the Laborers Academy of the Red Dawn Civilization, number 1231.\n\nOngoing mission: Spark.\n\nPlease forgive me for my rash visit to your planet. My spaceship is about to be completely destroyed. I can only choose the civilization planet closest to the dimensional coordinates in the probe—your planet for docking and supply."

 ethic_easter.3.b:0 "Red Dawn? "
 ethic_easter.3.b.socialism:0 "Red Dawn? Sounds like you are practicing socialism too?"
 ethic_easter.3.b.hive:0 "Red Dawn? Another colony?"
 ethic_easter.3.b.machine:0 "Searching for data... No Red Dawn Civilization found."
 ethic_easter.3.b.machine_servitor:0 "Searching for data... No Red Dawn Civilization found."
 ethic_easter.3.b.response:0 "Red Dawn is the homeland of all laborers in the galaxy, a great civilization. We achieved communist society in the whole galaxy 50,000 years ago — a truly equal and free society."
 ethic_easter.3.b.socialism.response:0 "Yes, comrade, we are indeed on the road of socialism and have already gone further.\n\nRed Dawn is the homeland of all laborers in the galaxy, a great civilization. We achieved communist society in the whole galaxy 50,000 years ago — a truly equal and free society."
 ethic_easter.3.b.hive.response:0 "No, Red Dawn is an individual consciousness independent civilization...\n\nRed Dawn is the homeland of all workers in the galaxy, a great civilization. Fifty thousand river system years ago, we have widely realized a communist society in the whole system - a collectivism society in which every intelligent life can coexist harmoniously."
 ethic_easter.3.b.machine.response:0 "Of course you don't have the record because I'm from the past. §L*Complicated laughter, seemingly mixed with multiple organic emotions*§!\n\nRed Dawn is the homeland of all workers in the galaxy, a great civilization. Fifty thousand river system years ago, we have widely realized a communist society in the whole system - a collectivism society in which every intelligent life can coexist harmoniously."
 ethic_easter.3.b.machine_servitor.response:0 "Of course you don't have the record because I'm from the past. §L*Complicated laughter, seemingly mixed with multiple organic emotions*§!\n\nRed Dawn is the homeland of all workers in the galaxy, a great civilization. Fifty thousand river system years ago, we have widely realized a communist society in the whole system - a collectivism society in which every intelligent life can coexist harmoniously.\n\nBut we've seen machine intelligences like yours before and fought alongside them. It's a pity..."

 ethic_easter.3.c:0 "What have you encountered?"
 ethic_easter.3.c.machine:0 "Inquiry: What happened to Red Dawn?"
 ethic_easter.3.c.response:0 "We have encountered a man-made disaster called a "natural disaster"...\n\nAbout 36,000 years ago, a new space civilization in the galaxy came into contact with some kind of force capable of destroying the universe. Under the temptation of certain existences, they choose to completely destroy the galaxy in exchange for their own "upgrade". Red Dawn did everything in his power to stop them before they could complete their plan to destroy the galaxy, but we were also greatly damaged by it. After this, several ancient countries, even still in feudal times, suddenly declared war on us, temporarily abandoned their hostile positions and joined forces to destroy our great civilization ...\n\nThe tyrants never see the working people as their equal."

 ethic_easter.3.d:0 "How about you?"
 ethic_easter.3.d.machine:0 "Inquiry: Why are you still wandering?"
 ethic_easter.3.d.response:0 "This is my task. On the eve of the fall of the Central, the Academy of Sciences packed and stored all the data of our civilization and asked us to evacuate the warring zones separately and rebuild communist civilization on other planets. My comrades were wanted and besieged throughout the galaxy, and only I survived by various coincidences. Over the last century, I've observed that the ancient empires seem to have forgotten the red dawn—and I can take a breather for a while. But my ship was on the verge of destruction after more than 20,000 years of heavy operation and had to be repaired with enough industrial base, and I didn't discover you until recently."

 ethic_easter.3.e:0 "Why don't you stay in our country?"
 ethic_easter.3.e.hive:0 "The Hive Mind can temporarily give you a job."
 ethic_easter.3.e.machine:0 "We can temporarily give you a research position."
 ethic_easter.3.e.machine_servitor:0 "We can take care of you."
 ethic_easter.3.e.response:0 "I hope so too. According to our Latecomer Civilization Assistance Agreement, I will assist you in space exploration and help you build society. During this period, you can freely access the data in our database, which is intended for latecomer civilizations. However, 7,000 years ago, in order to give up the energy consumption of the ecological circulation system, I made my life form two-dimensional, and I can't leave the command module of the Laurel now."
 ethic_easter.3.e.capitalism.response:0 "I hope so too. According to our Latecomer Civilization Assistance Agreement, I will assist you in space exploration and help you build society. During this period, you can freely access the data in our database, which is intended for latecomer civilizations. However, 7,000 years ago, in order to give up the energy consumption of the ecological circulation system, I made my life form two-dimensional, and I can't leave the command module of the Laurel now.\n\nBy the way, I noticed that your civilization has certain thoughts that I hate... I must warn you: the knowledge I provide will have a strong ideological orientation . No matter what happens after your civilization comes into contact with my knowledge, I will also not stand for your government."
 ethic_easter.3.egestalt.response:0 "I hope so too. According to our Latecomer Civilization Assistance Agreement, I will assist you in space exploration and help you build society. During this period, you can freely access the data in our database, which is intended for latecomer civilizations. However, 7,000 years ago, in order to give up the energy consumption of the ecological circulation system, I made my life form two-dimensional, and I can't leave the command module of the Laurel now."
 ethic_easter.3.e.machine_servitor.response:0 "Thank you for your kindness, but I need to provide you with some help under our Late Civilization Assistance Agreement. I will assist you in your space exploration. During this period, you can freely access the data in our database, which is intended for latecomer civilizations. However, 7,000 years ago, in order to give up the energy consumption of the ecological circulation system, I made my life form two-dimensional, and I can't leave the command module of the Laurel now."

 ethic_easter.3.f:0 "§YWelcome to join!§!"
 ethic_easter.3.f.response:0 "<Communications are down, §YHua Zhang§! has joined the Empire as a Scientist>\n<§YThe Laurel§! we have docked at the Capital Star Base, please proceed with maintenance work>\n<You can now access the §RRed Dawn§! database via the §YAddress List§!.>\n\n§LImage credit: §!§HPixiv§!\n§LLeader Portrait by: §!§H瘋狐§!\n§LEvent image by: §!§HMORNCOLOUR§!"

 ethic_easter.3.g:0 "§ROrganic slag? Fire now!§!"
 ethic_easter.3.g.response:0 "Exterminator? Gee...\n\n§L( The alien spaceship suddenly disappeared, and our detection radar turned up to scan, but nothing came up. )§!"

 ethic_easter.3.h:0 "§RTurn off Communication§!"


 ethic_easter.4.name:0 "Signal Disappears"
 ethic_easter.4.desc:0 "The alien spaceship suddenly disappeared, and our detection radar turned up to scan, but nothing came up."
 ethic_easter.4.a:0 "Sly alien"



 ethic_easter.100.name:0 "Red Dawn Database"
 ethic_easter.100.desc:0 "§H<Loading main interface...>§!\n\nPermission authentication passed, welcome, young civilization.\n\n§L*A neatly handwritten note is attached to the bottom of the operation panel: "When I tried to repair the dimension engine before, it seemed that I accidentally broke the output module. The traffic is limited. You can make do with it. OVO"*§!"
 ethic_easter.100.a:0 "Retrieve overall data"
 ethic_easter.100.b:0 "Retrieve physics data"
 ethic_easter.100.c:0 "Retrieve engineering data"
 ethic_easter.100.d:0 "Retrieve society data"
 ethic_easter.100.e:0 "Pause data retrieval"
 ethic_easter.100.f:0 "Close interface"


 red_dawn_database_boot:0 "Database Boot"
 red_dawn_database_boot_desc:0 "The Pioneer Civilization Database, provided by the §YHua Zhang§! friendship from the Alien Traveler, consumes a lot of energy in order to keep it in working condition.\n§L"This thing hasn't been updated for a long time. The system is a little old. It's very troublesome to shut down and restart." Someone said so.§!"
 red_dawn_database:0 "Red Dawn Database"
 red_dawn_database_desc:0 "A database left over from a great civilization, which contains the civilization's summary of the past and its vision for the future, which makes people yearn for this great civilization after studying."
 red_dawn_database_physics:0 "Red Dawn Database"
 red_dawn_database_physics_desc:0 "A database left over from a great civilization, from which we have extracted the section on physics. These sources detail how Red Dawn physicists collided with sparks of thought in their interactions with other civilizations."
 red_dawn_database_engineering:0 "Red Dawn Database"
 red_dawn_database_engineering_desc:0 "A database of the legacy of a great civilization, from which we have extracted the engineering part. These documents detail how the workers of Red Dawn continued to improve production techniques in their labor."
 red_dawn_database_society:0 "Red Dawn Database"
 red_dawn_database_society_desc:0 "A database of the legacy of a great civilization, from which we have extracted the section on sociology specifically. These documents detail how the proletariat of the Red Dawn seized power step by step and, in practice, worked out the road to communism."

 red_dawn_ship:0 "Red Dawn Science Ship"
 red_dawn_ship_plural:0 "Red Dawn Science Ships"
 NAME_Laurel:0 "The Laurel"
 NAME_Red_Dawn_Ship:0 "The LookAfar"

 huazhang_leader_desc:0 "Hua Zhang escaped the collapse of the Red Dawn civilization, and during the long interstellar voyage, his goal of rebuilding a society where everyone is equal and everyone is happy has never wavered."
 huazhang_leader_catch_phrase:0 "§LThere is no need to feel sad because of the disillusionment of ideals, we will shine like stars until the end of eternity.§!"

 armed_scientist_key:0 "Armed Science Ship"
 armed_construction_key:0 "Armed Construction Ship"


 ethic_easter.200.name:0 "Eternal Time and Space"
 ethic_easter.200.desc:0 "So, is that the so-called 'Keepers of Knowledge' starting again?\n\nAh, yes, we have seen them since 50000 years ago. They are passionate about harvesting the spark of wisdom from every civilization in the Milky Way, and then preserving it in the stagnant position of their home planet to permanently freeze their thinking, earning the nickname 'preserving knowledge for the Milky Way'"'. Countless civilizations have fallen or even perished due to the lack of key technologies, and it was only when we were still at the red dawn that these insane creatures were willing to converge"
 ethic_easter.200.f:0 "In that case, let's not follow their instructions."

 ethic_easter.200.a:0 "We are too weak, maybe we really need to hand you over"
 ethic_easter.200.a.response:0 "Are they asking for me?\n\nIt's not impossible... Seriously, when I knew we were in contact with them, I was prepared to be kidnapped by this group of pariahs – and there were precedents for forcing certain countries to hand over their heads of state and forcing the Gestalt civilization to give away their brains."

 ethic_easter.200.b:0 "Will they target you because of your Red Dawn background?"
 ethic_easter.200.b.response:0 "Perhaps not, their technology is not yet strong enough to achieve universal immortality. It has been over 10000 years since the disappearance of our Red Dawn, and they have long forgotten all about it.\n\n*sotto voce*I even suspect that they don't even remember where their species' parent star is."

 ethic_easter.200.c:0 "You Are you really willing to go there? Go to your enemy's territory?"
 ethic_easter.200.c.response:0 "The life of an individual? We Red Dawn don't care about these. It is the parochialism of biological instinct to attach too much importance to the survival of individuals, while the sea of our collective unconscious completely covers this backward gene philosophy. We have been fighting for the progress of all civilizations since the appearance of the Red Dawn. Your civilization is still young and full of vitality, and losing an outsider will not harm the progress you deserve. Providing assistance for your growth is what we seniors should do."

 ethic_easter.200.d:0 "So... Goodbye, friend."
 ethic_easter.200.d.response:0 "Goodbye, friends, I wish you always progress.\n\nI have left the database at the Capital Academy of Sciences, and you can access it at any time through the communication list.\n\nDon't worry about me, even in a stagnant position, I won't die completely. The universe is big, but life is even bigger. As long as the spark remains, we will eventually reunite at the end of the universe, right?*smile*"

 ethic_easter.200.e:0 "$PRESCRIPTED_ruler_name_humans4$ has left."


 ethic_easter.201.name:0 "Communication Invitation"
 ethic_easter.201.desc:0 "Since last month, [red_dawn_enemy.GetName] has blocked all information transmission to the outside world, and the communication frequency band that used to be filled with the voice of [red_dawn_enemy.GetSpeciesName]'s command has fallen into unprecedented silence.\n\nThe unsettling silence has been ongoing for a month, and while interstellar society is discussing the meaning behind the silence, an unexpected communication request appears on our desk - a letter from [red_dawn_enemy.Capital.GetName], the capital of [red_dawn_enemy.GetName]."
 ethic_easter.201.a:0 "Connect communication."


 ethic_easter.202.name:0 "Communication from §H[red_dawn_enemy.Capital.GetName]§!"
 ethic_easter.202.desc:0 "Hello Comrade [Root.GetRulerName], we have met again. I am §YHua Zhang§!, the first governing chairman of §H$NAME_new_red_dawn$§!, and on behalf of all members of $NAME_new_red_dawn$, I would like to extend my greetings to the friends of [Root.GetName]."

 ethic_easter.202.a:0 "Hua Zhang? Aren't you 'saved' by Keepers of Knowledge?"
 ethic_easter.202.a.response:0 "Yes, it's me, I'm still alive...\n\nI once said, the universe is big, but life is even bigger, and we really meet again.*smile*"

 ethic_easter.202.b:0 "How did you escape Keepers of Knowledge? You are now Their leader?"
 ethic_easter.202.b.response:0 "It's been a long experience... Back then, I controlled $NAME_Laurel$ to [red_dawn_enemy.Capital.GetName], I found [red_dawn_enemy.GetName]'s internal defenses have slackened to an outrageous degree. The restored $NAME_Laurel$ - thank you for your selfless help back then - restored the ability to stealth in the super-dimensional dimension at its peak, which I once used to escape the pursuit of the four empires in its heyday, which naturally escaped the sight of the now declining knowledge administrator.\n\nAfter that I sneaked into [red_dawn_enemy.Capital.GetName], and met a group of [red_dawn_enemy.GetSpeciesName]。 I shared with them the history of the Red Dawn civilization and led them to form the New Red Dawn civilization. We have been rebelling for more than a decade[red_dawn_enemy.GetName]'s reactionary feudal government, until last month, we managed to connect to their database that had been shut down for a hundred centuries, and broke into [red_dawn_enemy.GetName] the last bastion of the emperor - that database was originally red dawn, and it is ridiculous that this group of "knowledge-seeking monks" tinkered for 10,000 years without even turning it on."

 ethic_easter.202.c:0 "What are your plans for the future? You are to perpetuate [red_dawn_enemy.GetName]'s foreign policy?"
 ethic_easter.202.c.response:0 "Continuation of the foreign policy of the fallen empire? No, neither Red Dawn's consistent idea of the great unity of the galactic workers nor the awakened [red_dawn_enemy.GetSpeciesName] Workers will not allow this to happen again. Although we do not reject the liberation of the toiling masses by force, we prefer to let the working people of the galaxy identify with communism from the bottom of their hearts through the exchange of ideas. Of course, the old corrupt empires don't deserve it – we'll declare war on the Holy Guardians, Enigmatic Observers, and Militant Isolationists, completely eliminating the most reactionary forces that stand in the way of galactic progress.\n\n[Root.GetName] helped me in the most dangerous times and saved our civilization. I would like to personally present you with a batch of warships built with ancient cutting-edge technology, and I hope [Root.GetName] will accept this gift from me. However, if [Root.GetName] chooses to swim against the tide of history and hinder the progress of the galactic laborers, we will not give up our military attack on you because of our feelings, please forgive me."
 ethic_easter.202.c.soc:0 "$ethic_easter.202.c$"
 ethic_easter.202.c.soc.response:0 "Continuation of the foreign policy of the fallen empire? No, neither Red Dawn's consistent idea of the great unity of the galactic workers nor the awakened [red_dawn_enemy.GetSpeciesName] Workers will not allow this to happen again. Although we do not reject the liberation of the toiling masses by force, we prefer to let the working people of the galaxy identify with communism from the bottom of their hearts through the exchange of ideas. Of course, the old corrupt empires don't deserve it – we'll declare war on the Holy Guardians, Enigmatic Observers, and Militant Isolationists, completely eliminating the most reactionary forces that stand in the way of galactic progress.\n\nFor [Root.GetName]... On behalf of the $NAME_new_red_dawn$, I formally extend an invitation to [Root.GetName], and we sincerely hope to form an interstellar alliance with [Root.GetName] to declare war on the decaying old dynasty. I have also lived in the society of [Root.GetName], and I believe that you are our comrades, and we can safely give your backs to you. Of course, choosing to declare war on empires with cutting-edge technology is a difficult choice for a nascent civilization, and we respect your decision no matter what.\n\nBy the way, [Root.GetName] helped me in the most dangerous times and saved our civilization. I would like to personally present you with a batch of warships built with ancient cutting-edge technology, and I hope [Root.GetName] will accept this gift from me."

 ethic_easter.202.d:0 "Turn off communication"
 ethic_easter.202.d.soc1:0 "We accept the invitation from Red Dawn and hope that we can make progress together in the future."
 ethic_easter.202.d.soc2:0 "Forget it, we are not yet able to withstand the anger of the fallen empire..."

 NAME_Wangfeng:0 "Wang Feng"
 wangfeng1:0 "Wang Feng was born into a hegemonic empire. When she reached adulthood, Red Dawn liberated her hometown, allowing her to receive education at Red Dawn's Naval Academy. After graduation, she quickly became a battleship captain and shone brightly in a crucial battle, being promoted to the rank of fleet commander. Her long military career has strengthened her beliefs, and even years after the passing of the Red Dawn, her ambition to fight for the liberation of all sentient beings in the Milky Way has never changed."
 wangfeng1_catch_phrase:0 "The victory of the interstellar revolution will not be won through the rhetoric of politicians, it must be fought for through armed violence. The enemies of the proletariat are everywhere, and between survival and destruction, only the Red Army stands firm."

 ethic_easter.300.name:0 "$NAME_Wangfeng$"
 ethic_easter.300.desc:0 "Salute to you, young leader of revolutionary civilization. I am the commander of the Red Dawn Fleet, number 819, General Wang Feng."
 ethic_easter.300.a:0 "Who are you?"
 ethic_easter.300.a.response:0 "As I said, I come from the Red Dawn, and perhaps you have already met some of our people. After all, our civilization left a large number of seeds before its demise. It is precisely because you are the Red camp that, after long-term observation on our ship AI, comply with our support regulations that I am here to communicate with you."
 ethic_easter.300.b:0 "What are you good at?"
 ethic_easter.300.b.response:0 "I am skilled in fleet command and political commissar work. After all, as a fleet commander, I have an obligation to learn more knowledge and contribute to safeguarding our country and the Galactic Revolution."
 ethic_easter.300.c:0 "How did you and your crew survive?"
 ethic_easter.300.c.response:0 "When our fleet was hit by a core attack, according to orders from superiors, 25% of our fleet's leadership, including myself, underwent two-dimensional operations, while the other crew members and soldiers uploaded themselves as digital life to the core command ship of my ship. That is to say, the current ship is a large command network core that can help you carry out battles."
 ethic_easter.300.d:0 "Will you stay to help us?"
 ethic_easter.300.d.response:0 "This question is certain, whether out of rules or personal willingness, I will stay and help you."
 ethic_easter.300.hire_custom_tooltip:0 "§Y$NAME_Wangfeng$§! joins our empire as a §HLeader§!."

 leader_trait_wangfeng_fleet:0 "Fleet Political Commissar"
 leader_trait_wangfeng_fleet_desc:0 "For the commanders of the Red Dawn, the importance of political work outweighs military work."
 leader_trait_wangfeng_fleet_effect:0 "As long as the leader is commanding the fleet, it will bring this effect to the whole country:\n$t$$mod_pop_ethic_socialism_attraction_mult$：§Y+25%§!\n$t$$mod_pop_ethic_militarist_attraction_mult$：§Y+25%§!\nIf the leader enters the territory of any of our enemy countries during a battle, this effect will double that of our enemies."
 modifier_wangfeng:0 "Fleet Political Commissar"
 modifier_wangfeng_desc:0 "Wang Feng's political work inspires our army to devote itself to the cause of the liberation of the Milky Way."
 modifier_wangfeng_enemy:0 "Fleet Political Commissar"
 modifier_wangfeng_enemy_desc:0 "The enemy's political commissar is launching a political offensive against our army to shake the minds of grassroots soldiers."
 leader_trait_wangfeng_ideology:0 "War and Peace"
 leader_trait_wangfeng_ideology_desc:0 "Wang Feng loves peace, but she is well aware that seeking peace through struggle leads to peaceful survival, and seeking peace through compromise leads to peaceful death."
 leader_trait_wangfeng_ideology_effect:0 "Will be provided during peace §Y$mod_pop_ethic_socialism_attraction_mult$§!, in times of war, it increases §Y$mod_pop_ethic_militarist_attraction_mult$§!"
 leader_trait_wangfeng_government:0 "Interim Governor"
 leader_trait_wangfeng_government_desc:0 "In addition to military experience, Wang Feng also has some administrative management experience, and she can shine and shine in our cabinet."
 leader_trait_wangfeng_produce:0 "Chairman of the Military Labor Commission"
 leader_trait_wangfeng_produce_desc:0 "Red Dawn encourages soldiers to participate in production labor, and Wang Feng has brought this tradition to our army."
