 ethic_easter.100.desc:0 "§H<正在加载主界面...>§!\n\n权限认证通过，欢迎你们，年轻的文明。\n\n§L*操作面板下方贴着一张字迹工整的便条：“我之前试着修维度引擎的时候好像不小心把输出模块弄坏了，流量有限，你们凑合着用吧。OVO”*§!"
