 ethic_easter.1.name:0 "深空信号"
 ethic_easter.1.desc:0 "我们的传感器收到了一段来自恒星系外的规律信号，数据显示信号源似乎正在以亚光速接近我们的星球。我们需要派遣一个专业团队，以破译信号并持续追踪信号源。"
 ethic_easter.1.a:0 "让我们看看它的来历"

