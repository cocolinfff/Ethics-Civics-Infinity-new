############################
# 成员国管理 —— 殖民与移交
############################
 msi_dsai_ms_colonize_title:0 "新殖民地的归属"
 msi_dsai_ms_colonize_desc:0 "§Y[This.GetName]§! 的殖民工作已经完成。按照联合政府的章程，新建立的殖民地必须明确归属：可以把它授予某个成员国，也可以保留为联合政府直辖地。\n\n授予成员国会使该国满意度上升，并让星球获得对应成员国的主权修正。直辖地不享有任何成员国修正，也不会改变任何成员国的满意度。"
 msi_dsai_ms_colonize_opt_1:0 "授予合众联邦"
 msi_dsai_ms_colonize_opt_2:0 "授予人民阵线"
 msi_dsai_ms_colonize_opt_3:0 "授予钢铁国度"
 msi_dsai_ms_colonize_opt_4:0 "授予联合帝国"
 msi_dsai_ms_colonize_opt_5:0 "授予贸易同盟"
 msi_dsai_ms_colonize_opt_free:0 "保留为联合政府直辖地"

 msi_dsai_ms_transfer_title:0 "移交星球主权"
 msi_dsai_ms_transfer_desc:0 "当前星球：§Y[This.GetName]§!。\n\n把主权移交给某个成员国后，该星球将获得对应成员国的主权修正，该国满意度上升。若该星球原本属于其他成员国，原成员国将大幅不满；收归直辖则会使原成员国小幅不满。"
 msi_dsai_ms_transfer_cancel:0 "取消"

 msi_dsai_ms_guide_title:0 "移交星球主权"
 msi_dsai_ms_guide_desc:0 "移交星球主权需要指定目标星球。\n\n请在星图上选中一颗由你控制的星球（首都除外），然后点击面板上的「移交星球主权」按钮；也可以在星球界面的行星决议中找到「移交星球主权」。"
 msi_dsai_ms_guide_back:0 "返回成员国管理"

############################
# 成员国管理 —— 改变思潮
############################
 msi_dsai_ms_ethic_title:0 "改变成员国思潮"
 msi_dsai_ms_ethic_desc_1:0 "你正在重组 §Y合众联邦§! 的意识形态。"
 msi_dsai_ms_ethic_desc_2:0 "你正在重组 §Y人民阵线§! 的意识形态。"
 msi_dsai_ms_ethic_desc_3:0 "你正在重组 §Y钢铁国度§! 的意识形态。"
 msi_dsai_ms_ethic_desc_4:0 "你正在重组 §Y联合帝国§! 的意识形态。"
 msi_dsai_ms_ethic_desc_5:0 "你正在重组 §Y贸易同盟§! 的意识形态。"
 msi_dsai_ms_ethic_desc_cost:0 "\n\n该国的思潮会立即改变，满意度降低 §R10§!，联合政府获得 §G10 年§! 的「成员国思潮重塑」修正。\n\n§H消耗：§!§Y150§! 影响力、§Y50§! 凝聚力。"
