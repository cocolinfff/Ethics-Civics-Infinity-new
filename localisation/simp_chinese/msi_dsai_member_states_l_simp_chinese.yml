 decision_msi_dsai_ms_transfer_planet_desc:0 "把本星球的主权移交给某个成员国，或收归联合政府直辖。"
 decision_msi_dsai_ms_transfer_planet_effects:0 "打开移交弹窗，选择接收本星球主权的成员国。"

