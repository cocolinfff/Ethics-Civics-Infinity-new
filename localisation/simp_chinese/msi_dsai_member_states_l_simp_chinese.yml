 msi_dsai_ms_init_title:0 "成员国协调机制生效"
 msi_dsai_ms_init_desc:0 "新的政府架构把大大小小的政治实体纳入了同一个超国家机构。根据联合政府的章程，你的首都现在同时承载全部八个成员国的主权象征：$msi_dsai_desc_name_1$、$msi_dsai_desc_name_2$、$msi_dsai_desc_name_3$、$msi_dsai_desc_name_4$、$msi_dsai_desc_name_5$、$msi_dsai_desc_name_6$、$msi_dsai_desc_name_7$与$msi_dsai_desc_name_8$。\n\n此后新建立的殖民地可以选择授予其中一国，或收归联合政府直辖。§H召开联合政府会议§!决议已经出现在星球决议列表中。"
 msi_dsai_ms_init_opt:0 "进入成员国管理"

