############################
# 成员国管理 —— 初始化告知
############################
 msi_dsai_ms_init_title:0 "成员国协调机制生效"
 msi_dsai_ms_init_desc:0 "新的政府架构把大大小小的政治实体纳入了同一个超国家机构。根据联合政府的章程，你的首都现在同时承载全部五个成员国的主权象征：合众联邦、人民阵线、钢铁国度、联合帝国与贸易同盟。\n\n此后新建立的殖民地可以选择授予其中一国，或收归联合政府直辖。「召开成员国大会」决议已经出现在国家决议列表中。"
 msi_dsai_ms_init_opt:0 "进入成员国管理"

