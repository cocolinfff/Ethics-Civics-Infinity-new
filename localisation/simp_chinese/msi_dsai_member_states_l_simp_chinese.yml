 msi_dsai_ms_menu_desc_common:0 "§H拉拢§!使该国满意度上升§G15§!。\n§H移交§!把当前选中的星球交给该国。\n§H制裁§!使满意度下降§R20§!，轮值主席不可用。\n§H改变思潮§!替换该国当前的思潮。"

 msi_dsai_ms_tip_pick:0 "切换到该成员国，查看其思潮、满意度与殖民地数量。"
 msi_dsai_ms_tip_change_cost:0 "选择后消耗§Y200§!影响力与§Y5000§!凝聚力。"
 msi_dsai_ms_tip_woo:0 "消耗§Y200§!影响力，使该国满意度提高§G15§!，并获得§G5年§!的§H被拉拢的成员国§!修正。"
 msi_dsai_ms_tip_transfer:0 "把当前选中的星球主权移交给该成员国；若没有选中星球，则打开操作指引。也可以在星球界面的行星决议中操作。若该星球原本属于其他成员国，原成员国将大幅不满。"
 msi_dsai_ms_tip_sanction:0 "削减该成员国的自主权：满意度降低§R20§!，联合政府获得§G10年§!的§H被制裁的成员国§!修正。轮值主席不可被制裁。"
 msi_dsai_ms_tip_ethic:0 "消耗§Y200§!影响力与§Y5000§!凝聚力，改变该成员国的思潮，并获得§G10年§!的§H成员国思潮重塑§!修正。"
