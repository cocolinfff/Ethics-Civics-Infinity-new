 msi_dsai_ms_desc_intro_1:0 "$msi_dsai_desc_name_1$由数十个大大小小的自治行省组成，并由一个相对强势的联邦政府统一管辖。这一阵营的政治生活由选举、游说与无穷无尽的谈判构成，尽管这一套系统迟钝而涣散，但这个国家也正由此而保持了长久的多元化传统。"
 msi_dsai_ms_desc_intro_2:0 "$msi_dsai_desc_name_2$脱胎于前殖民地人民的独立斗争，在长期的社会建设后逐渐形成了自强民主的新社会。这一阵营倡导国家内部人民的平等团结，并希望将他们的宝贵理念推广至整个文明、乃至全银河。"
 msi_dsai_ms_desc_intro_3:0 "$msi_dsai_desc_name_3$起源于一个失败的联盟与一场残酷的内战，旧联盟的幸存者依靠铁血与牺牲重铸了分崩离析的联盟。这一阵营治下人民服从与叛逆的二相性让他们渴望通过战争来稳定其脆弱的经济——就像过去的“黄金时代”那样。"
 msi_dsai_ms_desc_intro_4:0 "$msi_dsai_desc_name_4$是一个松散而古老的联合体，数十个前殖民地以共同的语言、法律传统与一顶王冠彼此牵连。君主在这一阵营中只有象征性的一席，真正维系帝国的是统一的关税表、互相承认的文凭，以及一张覆盖治下辖区的航运网络。"
 msi_dsai_ms_desc_intro_5:0 "$msi_dsai_desc_name_5$由数十个中小国家拼合而成，他们没有单一的首都，只有遍布已知世界的贸易自由港与一间常设的仲裁厅。这一阵营相信依靠征服赢来的领土并不能长久维系，只有和平与信任才是他们在宇宙中赖以生存的根基。"
 msi_dsai_ms_desc_intro_6:0 "$msi_dsai_desc_name_6$由同一个民族、同一种语言构成。他们相信唯有保持血脉与文化的纯粹，才能让民族在群星之间立足；联合政府成立后，这个国家把议会视作向外扩张民族边界的跳板。\n\n"
 msi_dsai_ms_desc_intro_7:0 "$msi_dsai_desc_name_7$是由学者治理的国家组成的同盟。它的行星议会同时是研究机构，议员往往身兼实验室主管，任何联合政府的预算提案都要先通过学院的可行性评估。\n\n"
 msi_dsai_ms_desc_intro_8:0 "$msi_dsai_desc_name_8$的政治生活围绕信仰展开，习惯上主教与祭司长老共同决定国家政策。它把联合政府视作通往更高启示的共同体，但也担心议会的世俗争吵会削弱信仰的凝聚力。\n\n"

