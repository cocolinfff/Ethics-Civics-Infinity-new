 msi_dsai_ms_ethic_desc_1:0 "你正在重组$msi_dsai_desc_name_1$的意识形态。"
 msi_dsai_ms_ethic_desc_2:0 "你正在重组$msi_dsai_desc_name_2$的意识形态。"
