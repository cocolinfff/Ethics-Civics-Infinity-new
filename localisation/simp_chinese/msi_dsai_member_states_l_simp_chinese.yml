############################
# 成员国管理 —— 面板正文（success_text 拼接）
############################
 msi_dsai_ms_desc_name_1:0 "§B合众联邦§!\n"
 msi_dsai_ms_desc_name_2:0 "§R人民阵线§!\n"
 msi_dsai_ms_desc_name_3:0 "§W钢铁国度§!\n"
 msi_dsai_ms_desc_name_4:0 "§H联合帝国§!\n"
 msi_dsai_ms_desc_name_5:0 "§G贸易同盟§!\n"

 msi_dsai_ms_desc_intro_1:0 "这个社会由数十个自治行省拼合而成，行省各自立法、各自征税，只把舰队与宣战权交给中央。联合政府的政治生活由选举、游说与无穷无尽的跨省谈判构成，其办公地更像是各邦代表常驻的一间会议室。批评者说它迟钝而涣散，支持者则回答：正是这种迟钝，让任何一邦都不至于被吞进一台机器。"
 msi_dsai_ms_desc_intro_2:0 "这个组织脱胎于早期的产业工会与科研合作社。它将个人视为集体的一个环节，因而把资源、土地与劳动力编入同一张生产计划表，并推崇准点开动的工厂与全年无事故的实验站。在它的政治语汇里，分量最重的一个词是“贡献”。"
 msi_dsai_ms_desc_intro_3:0 "这个政体起家于一场边境战争，此后便把军备与纪律写进日常生活的每一道程序：学校的晨操按舰队作息编排，工厂的产量考核参照军工标准。它疆域辽阔、冬季漫长，习惯以战略纵深衡量安全，也习惯把和平看作两场战备之间的间歇。"
 msi_dsai_ms_desc_intro_4:0 "这个帝国是一个松散而古老的联合体，数十个前殖民地以共同的语言、法律传统与一顶王冠彼此牵连。君主在联合政府中只有象征性的一席，真正维系帝国的是统一的关税表、互相承认的文凭，以及一张覆盖半个星区的航运网络。它的臣民习惯在两套法律之间生活，并以此自豪。"
 msi_dsai_ms_desc_intro_5:0 "这个联盟由数十个中小文明拼合而成，没有单一首都，只有一长串港口世界与一间常设的仲裁厅。表决权按航运份额折算，法律条文里关于标准、补贴与索赔的篇幅，远远超过关于主权与宪制的篇幅。同盟的老官僚常说：契约比旗帜耐用，标准比军队长远。"

