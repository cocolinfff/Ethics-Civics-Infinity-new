l_simp_chinese:
 origin_high_above:0 "高天之上"
 origin_high_above_desc:0 "这个文明向星空攀登的动力，源自前太空时代两个国家之间一场旷日持久的攀比：为了证明自己才是最优秀的国家，两国不断把行政大楼盖得比对方更高。这场竞赛从未真正结束——直到今天，这两座伟大的太空电梯仍在不断向上攀升。"
 origin_high_above_effects:0 "—母星上矗立着§Y民主思想塔§!与§Y自由火炬塔§!两座太空电梯，各可攀升至20层。\n—§Y民主思想塔§!提供$MOD_PLANET_AMENITIES_ADD$、$MOD_PLANET_STABILITY_ADD$与$MOD_POP_HAPPINESS$，层数越高越强。\n—§Y自由火炬塔§!提供$MOD_POP_BONUS_WORKFORCE_MULT$与$mod_planet_jobs_trade_produces_mult$，层数越高越强。\n—可以通过星球决议投入$r_energy$与$r_minerals$，加高任意一座塔。\n—两塔高度不等时会产生§Y攀比效应§!，高差越大，$MOD_POP_BONUS_WORKFORCE_MULT$越高，但$MOD_PLANET_STABILITY_ADD$下降也越严重。"
