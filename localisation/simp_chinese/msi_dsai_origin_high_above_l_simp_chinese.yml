 msi_dsai_deposit_democracy_tower_1_desc:0 "两座太空电梯之一。它源于前太空时代两个国家互相攀比的执念，如今成了这个文明向星空攀升的象征。"
 msi_dsai_deposit_democracy_tower_2_desc:0 "民主思想塔又高了一层。更多舱段被接上塔身，通勤者与货物沿着它昼夜穿行。"
 msi_dsai_deposit_democracy_tower_3_desc:0 "塔身已经越过了城市的天际线，从远处望去像一根插进云里的针。"
 msi_dsai_deposit_democracy_tower_4_desc:0 "暮色里，塔顶的灯是整片大陆最先亮起的光。"
 msi_dsai_deposit_democracy_tower_5_desc:0 "塔身开始穿过云层，天气在它脚下载沉载浮。"
 msi_dsai_deposit_democracy_tower_6_desc:0 "塔身已经穿透了大部分大气层，站在顶端能望见星球的弧度。"
 msi_dsai_deposit_democracy_tower_7_desc:0 "风在高处变得稀薄，维护队伍需要穿加压服才能作业。"
 msi_dsai_deposit_democracy_tower_8_desc:0 "越往上，天空从蓝变深，最后变成一片没有星星的黑。"
 msi_dsai_deposit_democracy_tower_9_desc:0 "第一段近地轨道接驳舱投入使用，运输不再需要火箭。"
 msi_dsai_deposit_democracy_tower_10_desc:0 "它在轨道与地面之间拉出一条稳定的线，运费跌到了历史低点。"
 msi_dsai_deposit_democracy_tower_11_desc:0 "近地轨道上已经能清晰望见它的塔尖。它不再只是一座建筑，而是一种宣告。"
 msi_dsai_deposit_democracy_tower_12_desc:0 "塔身外壁挂着成排的舱段，像一棵长到天天的树。"
 msi_dsai_deposit_democracy_tower_13_desc:0 "地面的钟楼已经看不到它的顶端，只能靠信号灯确认它还在。"
 msi_dsai_deposit_democracy_tower_14_desc:0 "它比星球上任何一座山峰都高，而且还在继续长。"
 msi_dsai_deposit_democracy_tower_15_desc:0 "从这个高度俯瞰，整片大陆都缩成了地图上的一个色块。"
 msi_dsai_deposit_democracy_tower_16_desc:0 "它的塔尖已经触到了同步轨道的锚点。"
 msi_dsai_deposit_democracy_tower_17_desc:0 "轨道站开始以它为轴心布置，整条轨道都被它带得动起来了。"
 msi_dsai_deposit_democracy_tower_18_desc:0 "人们开始在塔身中段定居，那里成了一个没有地平线的城市。"
 msi_dsai_deposit_democracy_tower_19_desc:0 "它快要够到理论极限了，工程师们开始担心下一层到底还撑不撑得住。"
 msi_dsai_deposit_democracy_tower_20_desc:0 "它抵达了太空电梯的理论极限高度。从地面到轨道，这条通道彻底改变了这颗星球的命运。"

