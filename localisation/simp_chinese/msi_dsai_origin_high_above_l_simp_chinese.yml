 msi_dsai_deposit_liberty_tower_1_desc:0 "与民主思想塔遥遥相对的另一座太空电梯。两国当年谁也不肯让步，于是各自盖了一座。"
 msi_dsai_deposit_liberty_tower_2_desc:0 "自由火炬塔加高了。它的外壁挂满了灯火，夜里从半个星球上都能看见。"
 msi_dsai_deposit_liberty_tower_3_desc:0 "塔身越往上越细，像一支举向天空的火把。"
 msi_dsai_deposit_liberty_tower_4_desc:0 "塔上的货舱开始昼夜不停地运转，港口在它脚下长了出来。"
 msi_dsai_deposit_liberty_tower_5_desc:0 "第一批轨道货物从这里上去，又从这里下来，全程没有点火。"
 msi_dsai_deposit_liberty_tower_6_desc:0 "塔身穿过云层之上，天气在它脚下翻滚。"
 msi_dsai_deposit_liberty_tower_7_desc:0 "商队开始在塔基排队，等待档期上塔。"
 msi_dsai_deposit_liberty_tower_8_desc:0 "它运出去的东西比运进来的多，账面上第一次出现了顺差。"
 msi_dsai_deposit_liberty_tower_9_desc:0 "高处的风声消失了，只剩下结构在缓慢地嗡鸣。"
 msi_dsai_deposit_liberty_tower_10_desc:0 "它成了这颗星球上最忙的一条路。"
 msi_dsai_deposit_liberty_tower_11_desc:0 "从轨道上看，它与民主思想塔像两根并立的针，扎在同一片大陆上。"
 msi_dsai_deposit_liberty_tower_12_desc:0 "塔身的灯火连成一条线，夜里像一道竖起来的地平线。"
 msi_dsai_deposit_liberty_tower_13_desc:0 "货物吞吐量已经压过了地面所有的港口加起来。"
 msi_dsai_deposit_liberty_tower_14_desc:0 "它在塔顶开了第二个接驳口，为了不排队，也为了不被比下去。"
 msi_dsai_deposit_liberty_tower_15_desc:0 "站在轨道站往下看，那两座塔之间只隔着一小段黑暗。"
 msi_dsai_deposit_liberty_tower_16_desc:0 "它开始把轨道上的东西运下来，规模比运上去时还要大。"
 msi_dsai_deposit_liberty_tower_17_desc:0 "塔身的货运轨道换成了第二套，旧的那套已经磨得发亮。"
 msi_dsai_deposit_liberty_tower_18_desc:0 "它不再只是交通设施，而是整颗星球经济的一条主动脉。"
 msi_dsai_deposit_liberty_tower_19_desc:0 "它快要够到理论极限了，塔基的维护队伍开始三班倒地轮值。"
 msi_dsai_deposit_liberty_tower_20_desc:0 "它终于也抵达了极限高度。两座塔在穹顶之上相对而立，谁也没有真正赢过谁。"

 decision_msi_democracy_tower_up:0 "加高民主思想塔"
 decision_msi_democracy_tower_up_desc:0 "把民主思想塔再往上接一层（最高 20 层）。投入$r_energy$与$r_minerals$，让它在与自由火炬塔的较量中取得领先。"
 decision_msi_liberty_tower_up:0 "加高自由火炬塔"
 decision_msi_liberty_tower_up_desc:0 "把自由火炬塔再往上接一层（最高 20 层）。投入$r_energy$与$r_minerals$，让它不至于被民主思想塔比下去。"

