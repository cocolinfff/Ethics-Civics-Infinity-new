l_simp_chinese:
 ###############
 #  派系意识形态抉择
 ###############

 msi_dsai_faction.100.title:0 "思想的分野"
 msi_dsai_faction.100.desc:0 "实用主义者从来不是同一类人——他们只是都拒绝被教条束缚。当派系提出要以一套意识形态为帝国定纲，两派人马立刻站到了长桌的两端：一边相信丈量与效率，主张一切问题终能由更新更好的机器回答；另一边则说，机器只能衡量能被衡量的东西，而帝国的灵魂不在其中。争论不会自行平息。我们必须在他们之间作出选择——或者说，选择我们愿意成为哪一种人。"
 msi_dsai_faction.100.materialist:0 "以效率立国"
 msi_dsai_faction.100.spiritualist:0 "以信仰立国"

 msi_dsai_faction.101.title:0 "天平的两端"
 msi_dsai_faction.101.desc:0 "调和主义者以平衡为美德，但平衡从来不是静止的。当派系提出把自身的主张上升为帝国意识形态，一场风暴便在议会里酝酿：有人主张，每一个劳动者都应当有资格站上最高的位置；也有人认为，秩序需要有人掌舵，最优秀的人理应得到更多。我们无法永远站在中间。这一次，必须有人为帝国选择一种未来。"
 msi_dsai_faction.101.egalitarian:0 "让所有人站上高处"
 msi_dsai_faction.101.authoritarian:0 "让最优者执掌权柄"

 msi_dsai_faction.102.title:0 "门与门楣"
 msi_dsai_faction.102.desc:0 "团结主义者守护的从来是「我们」——但「我们」的边界在哪里，没有人能绕开这个问题。派系里的长者说，正因星海冰冷，我们才该向每一个愿意并肩的文明伸出手；年轻的一方则反问，那些伸出去的手，最后都变成了刺向我们的刀。帝国的大门只能朝着一个方向敞开。我们必须决定，门楣之内，究竟谁能称我们为同类。"
 msi_dsai_faction.102.xenophile:0 "敞开门扉"
 msi_dsai_faction.102.xenophobe:0 "闩紧门闩"

 msi_dsai_faction.103.title:0 "刀锋与准则"
 msi_dsai_faction.103.desc:0 "主权主义者尊重每一面旗帜，也同样清楚：旗帜背后的尊重，往往由刀锋背书。如今派系要求把这份信念写成帝国的官方意识形态，两派各执一端：一派主张以道德与克制立国，让星海记住我们的名字而不是我们的舰队；另一派则说，在这个没有法官的宇宙里，唯有始终握紧武器的人，才有资格谈论道德。选择必须由我们作出。"
 msi_dsai_faction.103.pacifist:0 "以道德立国"
 msi_dsai_faction.103.militarist:0 "以刀锋立国"
