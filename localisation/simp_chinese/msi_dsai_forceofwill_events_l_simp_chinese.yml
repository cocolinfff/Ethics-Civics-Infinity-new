l_simp_chinese:
#
# forceofwill 事件文本（复制自本体，供润色版覆盖）
#

 forceofwill.210.title: "$situation_spirit_cultivation$"
 forceofwill.210.desc: "我等灵性之修炼，历时既久，终得见其果：于最明悟的[Owner.GetPriestPlural]引领之下，[Owner.GetAdj]社会已抵达前所未有之澄明之境，一种完整而不可分割的洞见，正悄然渗入我等日常生活的每一处缝隙。\n\n此刻之抉择，将决定这份领悟归于何处；我等当把这股神圣的力量引向一个明确而蒙拣选的目标，使其惠及[Owner.GetName]的每一个人。"
 forceofwill.210.unity: "共铸同一目标。"
 forceofwill.210.happiness: "沉浸于内心的和谐。"
 forceofwill.210.stability: "愿安宁降临。"
 forceofwill.210.councilor: "以真理与洞见治国。"
 forceofwill.210.leader_upkeep: "以智慧引导我们的领袖。"
 forceofwill.210.leader_lifespan: "愿我们的领袖重获活力。"
 forceofwill.210.death_cult: "让逝者为我们代言。"
 forceofwill.210.ascensionist: "登上更高的境界。"
 forceofwill.210.dimensional_worship: "在别的位面中寻找真理。"
 forceofwill.210.exalted_priesthood: "听从[owner.GetPriestPlural]的指引。"
 forceofwill.210.gospel_masses: "培育世俗的繁荣。"
 forceofwill.210.unity_bulk: "拥抱这团结的时刻。"

 forceofwill.220.desc.intro: "我们的灵性修炼为[this.owner.GetName]带来了祝福。"

 forceofwill.225.name: "[this.GetName]开悟"
 forceofwill.225.desc: "$forceofwill.220.desc.intro$\n\n借同修共修之冥想，§H[this.GetTitle][this.GetName]§!涤净了内在的精神；那些曾经阻碍[this.GetLeaderAdj]成就的旧碍，如今既已消散，便再无可缚其心志之物。"
 forceofwill.225.a.tt: "§Y[this.GetTitle][this.GetName]§!消除一个负面特质。"

 forceofwill.230.name: "$forceofwill.225.name$"
 forceofwill.230.desc: "$forceofwill.220.desc.intro$\n\n借同修共修之冥想，§H[this.GetTitle][this.GetName]§!涤净了内在的精神；一份久藏而未显的天赋，遂在其心识之中自行显露。"
 forceofwill.230.a.tt: "§Y[this.GetTitle][this.GetName]§!获得一个新的正面特质。"

 forceofwill.235.name: "开悟浪潮"
 forceofwill.235.desc: "$forceofwill.220.desc.intro$\n\n冥想的修持未曾有一日中断，开悟的浪潮亦随之在领袖之间渐次传开；彼等以超凡的洞见引领众人，而其升华的精神，则在每一次睿智而精湛的行动中显露无遗。"

 forceofwill.240.name: "[this.GetName]开悟"
 forceofwill.240.desc: "$forceofwill.220.desc.intro$\n\n对冥想之道的全心投入，使§H[this.GetName]§!上的人口抵达新的开悟高度；这份虔诚的成就，同时提升了这颗[this.GetPlanetMoon]在世俗繁荣与灵性安宁两方面的潜力。"

 forceofwill.245.name: "$MESSAGE_SPIRIT_CULTIVATION_BONUS_MIRACLE_CHILD_TITLE$"
 forceofwill.245.desc: "$forceofwill.220.desc.intro$\n\n自[miracle_child.GetHisHer][miracle_child.species.GetBirthNoun]的那一刻起，名为§H[miracle_child.GetName]§!的[GetMiracleChildBaby]便显出强烈的灵性开悟迹象，很快赢得“神童”之名；而将[miracle_child.GetHimHer]培育为族群的领袖，则是我们不可推卸的责任。"
 forceofwill.245.a.tt: "获得一位拥有§Y$leader_trait_spiritual_prodigy$§!特质的特殊§Y行政官§!领袖。"

 forceofwill.250.name: "神圣标本"
 forceofwill.250.desc: "$forceofwill.220.desc.intro$\n\n[capital_planet.GetName]的一位圣具工匠完成了§H$holy_symbol$§!，此乃神圣工艺的巅峰之作；它由珍贵合金锻造，其上众多方向点，正一一对应着开悟心灵的精神旅程。"

 forceofwill.1030.name: "[owner.GetIdeologyTypeCap]浮现：§H[generated_ideology.GetName]§!"
 forceofwill.1030.desc.common_1: "在我们的倡导之下，名为§H[this.GetName]§!的派系在[owner.GetAdj]社会中的支持度显著提升。"
 forceofwill.1030.desc.common_2_shared: "一些原本松散的相关理念，如今已凝聚成一套成熟的意识形态，人称§H“[generated_ideology.GetName]”§!。\n\n只要继续给予支持，这套理论便能在[owner.GetName]中继续扩大影响，"
 forceofwill.1030.desc.common_2: "$forceofwill.1030.desc.common_2_shared$并传向更广阔星海中志同道合的人。"
 forceofwill.1030.desc.common_2_genocidal: "$forceofwill.1030.desc.common_2_shared$也让净化星系中外星渣滓的步伐走得更快。"
 forceofwill.1030.desc.spiritualist_shared: "$forceofwill.1030.desc.common_1$信徒们以虔诚的冥想辨明了其中的微言大义；"
 forceofwill.1030.desc.spiritualist: "$forceofwill.1030.desc.spiritualist_shared$$forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.spiritualist.genocidal: "$forceofwill.1030.desc.spiritualist_shared$$forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.desc.default_shared: "$forceofwill.1030.desc.common_1$党内激烈的辩论最终厘清了其中观点；"
 forceofwill.1030.desc.default: "$forceofwill.1030.desc.default_shared$$forceofwill.1030.desc.common_2$"
 forceofwill.1030.desc.default.genocidal: "$forceofwill.1030.desc.default_shared$$forceofwill.1030.desc.common_2_genocidal$"
 forceofwill.1030.a.militarist: "思想是最锋利的武器之一。"
 forceofwill.1030.a.pacifist: "让和平传遍星海。"
 forceofwill.1030.a.spiritualist: "愿此言传至群星。"
 forceofwill.1030.a.materialist: "为思想立下基石。"
 forceofwill.1030.a.authoritarian: "从混沌中建立秩序。"
 forceofwill.1030.a.egalitarian: "机遇属于所有人。"
 forceofwill.1030.a.xenophobe: "他人终将明白真理。"
 forceofwill.1030.a.xenophile: "思想没有边界。"
 forceofwill.1030.tt: "生成§H[generated_ideology.GetName]§![owner.GetIdeologyType]。\n$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1045.name: "§H[from.GetName]§!既立"
 forceofwill.1045.desc_prefix: "官方宣布：[this.GetName]现已将§H[from.GetName]§!采纳为国家[this.GetSpecificIdeologyType]。"
 forceofwill.1045.desc_suffix: "已渗入[this.GetAdj]社会的方方面面，为我们的制度带来新的道德严谨。\n\n只要始终不渝地恪守这些指导原则，假以时日，我们必能从中得到巨大的回报。"
 forceofwill.1045.desc: "$forceofwill.1045.desc_prefix$其价值观已经$forceofwill.1045.desc_suffix$"
 forceofwill.1045.desc.genocidal: "$forceofwill.1045.desc_prefix$尽管它源自外星，但这些理念已经过恰当的改造，如今已$forceofwill.1045.desc_suffix$"
 forceofwill.1045.a: "这是[this.GetAdj]社会的重要一天。"
 forceofwill.1045.a.genocidal: "星系的大净化越来越近了。"
 forceofwill.1045.a.tt: "$adopt_ideology_unlocks_buildings_tt$"

 forceofwill.1060.name: "新[Ideology.GetIdeologicalCustodianName]"
 forceofwill.1060.desc: "我们如今已是§H[Ideology.GetName]§!的[Ideology.GetIdeologicalCustodianName]。\n\n我方所采纳的这套[this.GetSpecificIdeologyType]理论，在[FromFrom.GetName]的看护之下早已停滞；漫长的审议已有定论，我们于是取代其位，成为信条的执笔人。\n\n自此以后，续写[this.GetIdeologyType]的信条，是我方必须承担的责任。"
 forceofwill.1060.a: "[Ideology.GetName]开启新纪元。"

 forceofwill.1065.name: "$forceofwill.1060.name$"
 forceofwill.1065.desc: "我们不再是§H[Ideology.GetName]§!的[Ideology.GetIdeologicalCustodianName]。\n\n外来信徒一直声称，[this.GetSpecificIdeologyType]的理论在[Root.GetAdj]的看护下停滞不前；四面压力之下，我们不得不让§H[From.GetName]§!取而代之，执掌信条。\n\n如今，续写[this.GetSpecificIdeologyType]的信条，已是他们的责任。"
 forceofwill.1065.a: "愿其胜任。"
 forceofwill.1065.a.genocidal: "至少在抹除他们之前是这样。"

 forceofwill.1085.name: "新的遵从者"
 forceofwill.1085.desc_shared: "§H[From.GetName]§!已正式接纳§H[Ideology.GetName]§!的价值观。我们的主张与见地"
 forceofwill.1085.desc: "$forceofwill.1085.desc_shared$如今在整个星系中，正被越来越多的人共享。"
 forceofwill.1085.desc.genocidal: "$forceofwill.1085.desc_shared$具有证据确凿的优越性，即便这些终将被消灭的虫豸也深表认同。"
 forceofwill.1085.desc.hall_incomplete: "信仰日深，要求修建一座§H[Ideology.GetName][Ideology.GetHallCathedral]§!、以彰显我们[Owner.GetSpecificIdeologyType]价值的呼声越来越高。"
 forceofwill.1085.desc.hall_unknown_shared: "随着信仰日深，要求建起一座里程碑式的建筑、以彰显我们[Owner.GetSpecificIdeologyType]价值观的呼声越来越高。"
 forceofwill.1085.desc.hall_unknown: "$forceofwill.1085.desc.hall_unknown_shared$$galactic_hall_event_desc_common$"
 forceofwill.1085.desc.hall_unknown.genocidal: "$forceofwill.1085.desc.hall_unknown_shared$$galactic_hall_event_desc_common_genocidal$"
 forceofwill.1085.a: "我们的影响力在增长。"
 forceofwill.1085.a.genocidal: "我们的优越性愈发毋庸置疑了。"
 forceofwill.1085.a.tt: "每有新帝国采纳我们的[Owner.GetSpecificIdeologyType]将给予以下修正："

 forceofwill.1095.name: "[Ideology.GetIdeologicalAdjCap]影响力之争"
 forceofwill.1095.desc: "一股外来的[From.GetSpecificIdeologyType]影响正在滋长，妨碍我们传播§H[Ideology.GetName]§!的努力。\n\n它被称为§H[From.GetName]§!，背后是一整套[From.GetEthicLower]世界观；其许多核心原则[Root.GetIdeologyClashEthicRelation]\n\n在[Root.GetIdeologyClashSystems]，我们截获了宣扬这一[From.GetSpecificIdeologyType]的外星媒体传输；[Root.GetIdeologyClashThreat]，其后果难以预料。"
 forceofwill.1095.desc.same_ethic: "与我们自身的根本价值有相通之处。"
 forceofwill.1095.desc.opposite_ethic: "直接违背了我们的基本价值观。"
 forceofwill.1095.desc.other_ethic: "其中的考量与我们自身的根本价值南辕北辙。"
 forceofwill.1095.desc.one_system: "[event_target:ideology_clash_system.GetName]恒星系"
 forceofwill.1095.desc.several_systems: "若干恒星系"
 forceofwill.1095.desc.within_borders: "若不设法护住我们的人口，使其免受这些外来宣传的侵蚀，[Ideology.GetName]的信仰便会动摇，"
 forceofwill.1095.desc.within_borders_gestalt: "若不设法护住我们的集体，使其免受这些外来宣传的侵蚀，[Ideology.GetName]的信仰便会动摇，"
 forceofwill.1095.desc.beyond_borders: "若不设法反制这些外来宣传，它终有一日会触及我们的人口，"
 forceofwill.1095.a: "抵抗这些外星理念。"
 forceofwill.1095.b: "遭遇挑战，理念愈战愈勇。"
 forceofwill.1095.b.tt: "§R将会破坏我们与该意识形态成员的关系。§!"
 forceofwill.1095.c: "不足为虑。"

 forceofwill.1100.name: "[GetFoW1100Name]"
 forceofwill.1100.name.default: "一个$IDEOLOGY_CAP$的崛起"
 forceofwill.1100.name.spirit: "一种$IDEOLOGY_TYPE_SPIRITUALIST_CAP$的崛起"
 forceofwill.1100.desc.common_1: "在[this.GetName]全境，从最高领导层到寻常百姓"
 forceofwill.1100.desc.common_2_shared: "并把这份信念公开地播撒到[this.GetSpeciesAdj]生活的每个角落"
 forceofwill.1100.desc.common_2: "$forceofwill.1100.desc.common_2_shared$，乃至更广阔的星系中。"
 forceofwill.1100.desc.common_2_genocidal: "$forceofwill.1100.desc.common_2_shared$以进一步助我们一臂之力。"
 forceofwill.1100.desc.default_start: "$forceofwill.1100.desc.common_1$，我们正见证着对共同价值与信念的坚定承诺。"
 forceofwill.1100.desc.default_end: "高层领袖提议，是时候把我们的信条郑重地写下来了——"
 forceofwill.1100.desc.default: "$forceofwill.1100.desc.default_start$\n\n$forceofwill.1100.desc.default_end$"
 forceofwill.1100.desc.default.genocidal: "$forceofwill.1100.desc.default_start$我们净化星系的集体意志，需要一个名字。"
 forceofwill.1100.desc.spirit: "$forceofwill.1100.desc.common_1$，我们正目睹着对灵性教义的坚定承诺。"
 forceofwill.1100.a: "抓住这个机会。"
 forceofwill.1100.a.genocidal: "外星渣滓终有末日。"
 forceofwill.1100.b: "现在还不是时候。"

 forceofwill.1200.name: "外来意识形态"
 forceofwill.1200.desc.common_1: "我们发现了一种被称作§H[from.GetName]§!的异星“意识形态”。"
 forceofwill.1200.desc.common_2_shared: "对其信条的遵奉，已使被它渗透的社会产生可观测的变化。\n\n以当前形态而论，这样一种个体主义的范式在我方集体社会中并无立足之地；然而，将纷杂的观念编成一套连贯理念，其益处确实可观。经审慎权衡，我们或许能找到办法，将其加以改造，播撒到整个[this.GetName]"
 forceofwill.1200.desc.common_2: "$forceofwill.1200.desc.common_2_shared$乃至国界之外。"
 forceofwill.1200.desc.common_2_genocidal: "$forceofwill.1200.desc.common_2_shared$，以助我们净化星系中的劣等异种。"
 forceofwill.1200.desc.knows_shared: "这套信仰源自[from.owner.GetName]，"
 forceofwill.1200.desc.knows: "$forceofwill.1200.desc.knows_shared$$forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.knows.genocidal: "$forceofwill.1200.desc.knows_shared$$forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.desc.default_shared: "$forceofwill.1200.desc.common_1$这套信仰体系似乎源自一个未接触物种，代号[from.owner.GetName]，"
 forceofwill.1200.desc.default: "$forceofwill.1200.desc.default_shared$$forceofwill.1200.desc.common_2$"
 forceofwill.1200.desc.default.genocidal: "$forceofwill.1200.desc.default_shared$$forceofwill.1200.desc.common_2_genocidal$"
 forceofwill.1200.a: "有趣。容我们斟酌。"
 forceofwill.1200.b: "不必理会这些杂音。"
 forceofwill.1200.b.tt: "$UNLOCKS_AGENDA$§Y颁定[this.GetIdeologyTypeCap]§!"

 forceofwill.1210.name: "[this.GetGestaltIdeologyProjectName]"
 forceofwill.1210.desc_prefix: "借着“意识形态”这一外来概念，我们的[this.GetResearchers]为“[this.GetIdeologyTypePlural]”造出了一套范式——一个能让连贯理念传遍整个[this.GetGestaltEntityName]的框架"
 forceofwill.1210.desc_suffix: "剩下的，只是定下我们[this.GetIdeologyType]的本源。"
 forceofwill.1210.desc: "$forceofwill.1210.desc_prefix$乃至国境之外。\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.desc.genocidal: "$forceofwill.1210.desc_prefix$，以助我们净化星系中的劣等异种。\n\n$forceofwill.1210.desc_suffix$"
 forceofwill.1210.militarist: "我们即战争。"
 forceofwill.1210.xenophobe: "我们即纯净。"
 forceofwill.1210.egalitarian: "我们即平等。"
 forceofwill.1210.materialist: "我们即知识。"
 forceofwill.1210.pacifist: "我们即和平。"
 forceofwill.1210.xenophile: "我们即众生。"
 forceofwill.1210.authoritarian: "我们即秩序。"
 forceofwill.1210.spiritualist: "我们即信仰。"

 forceofwill.1250.name: "[from.GetRegnalName]之死"
 forceofwill.1250.desc: "服侍多年之后，我们的§H[GetFoW1250RulerTitle] [from.GetRegnalName]§!溘然长逝，继承问题随之摆到眼前。\n\n[from.GetRegnalName]的近臣须从宗亲之中选出一位新的[this.GetHeirTitle]；此人须能明智地治理[this.GetName]，并恪守[ideology.GetName]的原则。"
 forceofwill.1250.a: "他应是$scientist$。"
 forceofwill.1250.b: "他应是$commander$。"
 forceofwill.1250.c: "他应是$official$。"

 forceofwill.1550.name: "[from.GetClubNameCap]蒸蒸日上"
 forceofwill.1550.desc: "受§H[from.GetName]§!日隆的人望所感召，我们的公民以前所未有的规模加入[from.GetClubName]，只求更深地委身于这个社会最根本的价值。\n\n[this.GetName]全境之内，这股入会热潮正把社会和谐与意识形态的一致，推向新的高度。"
 forceofwill.1550.a: "值得赞许的倡议。"
 forceofwill.1550.b: "编入公共信息工作。"

 forceofwill.1560.name: "[this.GetLastTenetName]的新见解"
 forceofwill.1560.desc.common: "通过逐步精炼，[this.GetLastTenetName]已牢固确立为§H[from.GetName]§!的一项关键原则。"
 forceofwill.1560.desc.default: "$forceofwill.1560.desc.common$近来围绕这一题目的研究，在[Owner.GetResearchers]中激起热烈辩论，为我们的指导原则添了新的理论筋骨。"
 forceofwill.1560.desc.spirit: "$forceofwill.1560.desc.common$近期刊出的正典文本分析，在[this.GetBureaucratPlural]中引发神学辩论，为我们的训令注入了新的精神洞见。"
 forceofwill.1560.a: "愿此探究之心长存。"
 forceofwill.1560.b: "资助教义讨论。"

 forceofwill.1570.name: "[from.GetEthic]纪念碑落成"
 forceofwill.1570.desc: "[selected_planet.GetName]的居民自发聚拢，为他们的[from.GetDevotion]——对§H[from.GetName]§!价值观日益笃信之心——立起一座纪念碑。\n\n工程由私人捐助者出资，一群热忱而技艺精湛、因共同信仰结为网络的人——青年团体、社交社团——以创纪录的速度将其建成；如今，他们请政府派员出席落成典礼。"
 forceofwill.1570.a: "派遣代表，认可其努力。"
 forceofwill.1570.b: "更有要务待办。"

 forceofwill.1580.name: "$citizen_parade$"
 forceofwill.1580.desc: "近来，许多公民参与大型“团结日”的筹办，以游行与庆典赞颂§H[from.GetName]§!的核心价值。\n\n集会设在人口最多的几座城市，[this.GetSpeciesNamePlural]聚于一处，再度表明对共同文化与基本信条的支持。"
 forceofwill.1580.a: "鼓励定期游行。"
 forceofwill.1580.b: "借游行之势，助力宣导。"

 forceofwill.1590.name: "领袖$recruitment_boom$"
 forceofwill.1590.desc: "对§H[from.GetName]§!的信心，正在[this.GetName]的年轻人之中生根；征募办公室的门槛几乎被踏破，申请书一叠叠呈上，连最偏远的行政区也陆续报来新的名字。\n\n这些人多半不是为个人野心或一纸俸禄而来：他们想为[this.GetName]的将来出一份力，愿在漫长的任期里，把它一点一点推向更好的地方。"
 forceofwill.1590.b: "改派他们去宣扬[from.GetName]。"

 forceofwill.1600.name: "腐败程度下降"
 forceofwill.1600.desc.start: "政府里的雇员怀着一股近乎执拗的理想主义，[this.GetName]全境的腐败与浪费因此急剧减少。\n\n我们的员工坚定"
 forceofwill.1600.desc.end: "地遵从着§H[from.GetName]§!的信条，几乎对贿赂免疫，对那些侵蚀共同价值的行为也几近无动于衷。"
 forceofwill.1600.desc.default: "$forceofwill.1600.desc.start$地遵从着$forceofwill.1600.desc.end$"
 forceofwill.1600.desc.spiritualist: "$forceofwill.1600.desc.start$地信仰着$forceofwill.1600.desc.end$"
 forceofwill.1600.a.default: "他们真心相信[from.GetName]。"
 forceofwill.1600.a.spiritualist: "愿信仰指引他们。"
 forceofwill.1600.b: "嘉奖他们的忠诚。"

 forceofwill.1610.name: "[from.GetName]的黄金时代"
 forceofwill.1610.desc: "采纳§H[from.GetName]§!似乎已见回报：独立分析师将社会对其的信奉程度与多项积极趋势逐一比对，发现显著的正相关。\n\n有人甚至称之为[from.GetName]的“黄金时代”——商路畅通，民情欣悦，而我方正被同一套观念越拴越紧。"
 forceofwill.1610.a: "化积极性为凝聚力。"
 forceofwill.1610.b: "将这份热情引向经济目标。"
 forceofwill.1610.c: "借此良机强化治理。"

 forceofwill.1620.name: "捐赠热潮"
 forceofwill.1620.desc: "越来越多的公民把家产捐给国家，只为让§H[from.GetName]§!的信念走得更远。\n\n捐赠往往集中在国家重要日子之后的几日；亦有人选择在身后以遗赠的方式完成——他们把这看作留给后世的一句话。"
 forceofwill.1620.a: "以所得提升生活标准。"
 forceofwill.1620.b: "以所得推广文化。"

 forceofwill.1630.name: "贸易繁荣"
 forceofwill.1630.desc.common: "[this.GetName]的贸易正红火起来。\n\n对§H[from.GetName]§!的遵奉日深，社会的生产力与那股乐观劲都跟着受益。"
 forceofwill.1630.desc.unfriendly: "$forceofwill.1630.desc.common$商人们以前所未有的数量建立企业，以空前的活力交易货物。"
 forceofwill.1630.desc.default: "$forceofwill.1630.desc.common$外来商人们以前所未有的数量建立企业，从星系各处进口异域香料和商品。"
 forceofwill.1630.a: "开征小额贸易税，充实国库。"
 forceofwill.1630.b: "调运一批关键矿物。"
 forceofwill.1630.c: "调运一批奢侈食品。"

 forceofwill.1640.name: "$radical_nonconformity$"
 forceofwill.1640.desc: "在[this.Capital.GetName]，一个思想自由的组织一直在散布质疑§H[from.GetName]§!核心原则的言论；它起初只是几位民间研究者的非正式茶会，如今已能出版小册、操弄媒体。\n\n其公开声明措辞谨慎，处处与官方口径相合；然而其思想的实质，分明冲着我们奉行已久的价值而去——影响虽有限，却是国家[this.GetSpecificIdeologyType]一处扎眼的反对。"
 forceofwill.1640.a: "由他们去吧。"
 forceofwill.1640.b: "压制他们。"

 forceofwill.1650.name: "[this.Capital.GetName]的抗议"
 forceofwill.1650.desc.start: "示威已在[this.Capital.GetName]爆发。活动人士指责[this.GetAdj]精英"
 forceofwill.1650.desc.end: "牺牲普通公民的利益，中饱私囊。\n\n抗议者的言辞固然尖锐，行动大体上仍是和平的。到目前为止，最实在的后果只是缺勤带来的产量损失。"
 forceofwill.1650.desc.default: "$forceofwill.1650.desc.start$利用§H[from.GetName]§!赋予的显赫地位$forceofwill.1650.desc.end$"
 forceofwill.1650.desc.egalitarian: "$forceofwill.1650.desc.start$背叛了§H[from.GetName]§!公开倡导的平等原则，私下却$forceofwill.1650.desc.end$"
 forceofwill.1650.a: "$bio.50.a$"
 forceofwill.1650.b: "任其表达不满。"

 forceofwill.1660.name: "经济衰退"
 forceofwill.1660.desc: "金融分析师报告了[this.GetName]全境经济停滞的确凿迹象。\n\n对§H[from.GetName]§!的遵从下滑，已在工人之间划出意识形态的裂痕；不和谐的空气随之弥漫，投资者的信心也受了挫。\n\n专家担心，若我国[this.GetSpecificIdeologyType]的持续[from.GetIdeologyDefection]得不到遏止，全面衰退并非不可能。"
 forceofwill.1660.a: "任市场自行调整。"
 forceofwill.1660.b: "为市场提供救济。"
 forceofwill.1660.c: "放松金融业的意识形态控制。"

 forceofwill.1670.name: "暗杀未遂"
 forceofwill.1670.desc: "§H[assassination_attempt_leader.GetTitle][assassination_attempt_leader.GetName]§!躲过一场刺杀，动手的是一伙激进的异见分子。\n\n行凶者被安全部队制服，但那具简陋的爆炸装置还是炸了；[assassination_attempt_leader.GetName]伤势严重。\n\n这起令人震怒的事件，把[this.GetName]内部反对派的威胁摆到了台面上——他们因拒绝§H[from.GetName]§!而愈发偏激。"
 forceofwill.1670.a: "$leviathans.143.a$"
 forceofwill.1670.b: "启动安全镇压。"

 forceofwill.1680.name: "$government_corruption$"
 forceofwill.1680.desc: "部分领袖越发沉溺于弄权与私利，不再把§H[from.GetName]§!的价值拿去为[this.GetAdj]社会做点实事。\n\n理想主义让位于犬儒，贿赂与腐败随之攀升；[this.GetName]的立法与行政效率，也一并受损。"
 forceofwill.1680.b: "解雇肇事者。"
 forceofwill.1680.b.tt.fail: "必须在一个殖民地中有超过§Y100§!£pop£ §H人口§!从事$job_politician_plural_with_icon$或$bureaucrat_type_plural_with_icon$工作"
 forceofwill.1680.b.tt.politicians: "$job_politician_plural_with_icon$：§R-100§!"
 forceofwill.1680.b.tt.bureaucrats: "$bureaucrat_type_plural_with_icon$：§R-100§!"

 forceofwill.1690.name: "异见领袖"
 forceofwill.1690.desc: "§H[dissident_leader.GetTitle][dissident_leader.GetName]§!已公开站到对立面，一有机会便质询§H[from.GetName]§!的核心价值，明里暗里阻挠它在政府中扎根。\n\n平心而论，[dissident_leader.GetName]在别处仍是能干而受敬重的领袖；只是在关乎原则的事上，[dissident_leader.GetHeShe]总会与[from.GetName]唱反调。"
 forceofwill.1690.b: "解雇[dissident_leader.GetName]。"

 forceofwill.1700.name: "[attacked_colony.GetName]的恐怖袭击"
 forceofwill.1700.desc: "§H[attacked_colony.GetName]§!发生一场规模可观、组织严密的恐怖袭击。\n\n短短几分钟内，殖民地各处的爆炸装置接连起爆；伤亡枕藉，建筑损毁惨重，我们的一座大型建筑也化为瓦砾。\n\n一个反[from.GetEthicLower]团体宣称对此负责，搬出反对§H[from.GetName]§!的名目为自己开脱；公众的谴责声很响，可暗地里同情这个团体的，也不在少数。"
 forceofwill.1700.a: "反应过度只会纵容他们。"
 forceofwill.1700.b: "加强[attacked_colony.GetName]的执法。"
 forceofwill.1700.c: "减少意识形态宣传，缓解紧张。"
 forceofwill.1700.tt: "§Y[attacked_colony.GetName]§!上的一座非首府建筑损毁。"

 forceofwill.1710.name: "[assassinated_leader.GetName]遇刺"
 forceofwill.1710.desc.start: "§H[assassinated_leader.GetTitle][assassinated_leader.GetName]§!遇刺身亡。在[this.Capital.GetName]的一场私人宴会上，[assassinated_leader.GetHeShe]突然出现了"
 forceofwill.1710.desc.end: "数小时之内，一个激进的异见组织公开认领了这桩罪行，声明里把[assassinated_leader.GetName]称作§H[from.GetName]§!的“腐败代表”。\n\n如今叛党正向政府施压，要求由他们选定的人来接替[assassinated_leader.GetFirstName]。"
 forceofwill.1710.desc.organic: "$forceofwill.1710.desc.start$中毒，在来不及接受任何医疗介入前就死去了。\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.desc.machine: "$forceofwill.1710.desc.start$化学污染，在来不及接受任何紧急维修前就失能了。\n\n$forceofwill.1710.desc.end$"
 forceofwill.1710.a: "谴责该组织，冷处理其要求。"
 forceofwill.1710.b: "准其所请，招募其人选。"
 forceofwill.1710.b.tt.common: "招募§Y[replacement_leader.GetTitle][replacement_leader.GetName]§!，[replacement_leader.GetAAnEthic]§Y[replacement_leader.GetEthic]§![GetFoW1710LeaderClass]（技能等级§H[replacement_leader.GetSkill]§!）"
 forceofwill.1710.b.tt.official: "$forceofwill.1710.b.tt.common$。"
 forceofwill.1710.b.tt.governor: "$forceofwill.1710.b.tt.common$督管§Y[assassinated_colony.GetName]§!。"

 forceofwill.1720.name: "叛逃威胁"
 forceofwill.1720.desc: "§H[defecting_fleet.leader.GetTitle][defecting_fleet.leader.GetName]§!已公开宣称，将率[defecting_fleet.leader.GetHimHer]麾下§H[defecting_fleet.GetName]§!叛离[this.GetName]。\n\n在公开频道上，[defecting_fleet.leader.GetName]将我国的[this.GetSpecificIdeologyType]斥为“对[this.GetAdj]社会影响恶劣”，并称自己“无法继续保持团结和忠诚”；[defecting_fleet.leader.GetHeSheCap]还主张，[this.GetSpecificIdeologyType]“必须回到传统美德”。\n\n[defecting_fleet.leader.GetHisHer]下属之间的私人通讯显示：船员们很愿意追随[defecting_fleet.leader.GetFirstName]。"
 forceofwill.1720.a: "叛徒想走，就让他们走。"
 forceofwill.1720.a.tt: "§Y[defecting_fleet.leader.GetClass][defecting_fleet.leader.GetName]§!从[this.GetName]§R叛变§!，并带走了[defecting_fleet.leader.GetHimHer]的§Y[defecting_fleet.GetName]§!。"
 forceofwill.1720.b: "[defecting_fleet.leader.GetHeSheCap][defecting_fleet.leader.GetHasHave]自己的道理，加大对我们自身价值的投入。"

 forceofwill.1730.name: "[GetFoW1730Name]"
 forceofwill.1730.name.hive: "反常冲动减弱"
 forceofwill.1730.name.machine: "反常逻辑重构"
 forceofwill.1730.desc.hive: "我们对§H[from.GetName]§!的遵从毫不动摇，集体意识的完整性因此得以巩固，反常冲动的重负就此卸下。"
 forceofwill.1730.desc.machine: "我们对§H[from.GetName]§!的遵从毫不动摇，中央智能的完整性因此得以巩固，反常冲动的重负就此卸下。"
 forceofwill.1730.desc.common: "我们与外部现实的每一次往来，均由[from.GetIdeologicalAdj]的视角所指引；这套视角既是知识的根基，亦是意义的根基。曾经困扰我方的内部摩擦，如今大体已告消散。"
 forceofwill.1730.b: "将余力转向生产力。"

 forceofwill.1740.name: "认知效率"
 forceofwill.1740.desc: "§H[from.GetName]§!的逻辑架构，简化了我们的§H$councilor_gestalt_cognitive$§!的劳动，腾出了一部分算力另作他用。\n\n对我们的$councilor_gestalt_cognitive$而言，面对陌生的外部现象，搭建一套解释性的理论框架已不再棘手。靠着[from.GetName]的信条，知识的产出效率大幅提升。"
 forceofwill.1740.a: "鼓励该节点自我改进。"
 forceofwill.1740.b: "引向更广的科研领域。"

 forceofwill.1750.name: "监管效应"
 forceofwill.1750.desc.common: "得益于§H[from.GetName]§!的理念，程序上的清晰度提高了，我们的§H$councilor_gestalt_regulatory$§!也随之改进。"
 forceofwill.1750.desc.hive: "借这套周全的理论框架，监测反常冲动的工作大大简化了。"
 forceofwill.1750.desc.machine: "借这套周全的理论框架，监测反常逻辑形成的工作大大简化了。"
 forceofwill.1750.a: "鼓励节点继续自我改进。"
 forceofwill.1750.b.hive: "多余能量尽数化为本能。"
 forceofwill.1750.b.machine: "多余能量尽数化为指令管理。"

 forceofwill.1760.name: "[GetFoW1760Name]"
 forceofwill.1760.name.hive: "非标准思维"
 forceofwill.1760.name.machine: "非中心处理"
 forceofwill.1760.desc: "依照§H[from.GetName]§!的信条去寻正确流程时，半自主的[this.GetIndividualName][selected_leader.GetName]开始自行产生[this.GetBrainName][this.GetIdeaWordPlural]自由。\n\n这些认知过程很快被截停，异常的[this.GetThoughtWordPlural]亦自[this.GetNetworkName]中被切除，以免引起不和谐；我方[this.GetResearchers]认定，这些新概念可以造福集体，但要融合来源偏离中心的[this.GetThoughtWordPlural]，风险显然不小。"
 forceofwill.1760.a.hive: "将这些思想纳入集体思维。"
 forceofwill.1760.a.machine: "将该数据纳入集体访问。"
 forceofwill.1760.b.hive: "根除这些思想的全部记忆。"
 forceofwill.1760.b.machine: "立即删除此数据。"

 forceofwill.1770.name: "系统崩溃"
 forceofwill.1770.desc: "核心系统里的[from.GetIdeologicalAdj]冲突酿成了严重的逻辑故障，整个[this.GetSpeciesAdj]网络频繁停机。\n\n与§H[from.GetName]§!相关、用于支撑多个决策子程序的提案，常常通不过回归测试。这种干扰正拖累各部门的日常事务。"
 forceofwill.1770.a: "只能承受。"
 forceofwill.1770.b: "分配额外算力以缓解。"

 forceofwill.1780.name: "神经疼痛"
 forceofwill.1780.desc: "需要处理的[from.GetIdeologicalAdj]不协调越来越多，剧烈的神经痛正在折磨集体。\n\n§H[from.GetName]§!的原理本应让意识织构更清晰，如今却在散播不确定与断裂。神经超载之下，许多子个体陷入瘫痪。"
 forceofwill.1780.a: "提供医疗支持。"
 forceofwill.1780.b: "增加休息时段。"

 forceofwill.1790.name: "[GetFoW1790Name]"
 forceofwill.1790.name.hive: "僵直子个体"
 forceofwill.1790.name.machine: "故障单位"
 forceofwill.1790.desc: "流程上的不确定，源自[from.GetIdeologicalAdj]的不协调，让我们的[this.GetIndividualNamePlural]无法完成日常任务。\n\n[this.GetIndividualNamePlural]常常卡在两个互相矛盾的主张之间，进退不得，进而僵直。只要没有一套自洽的[from.GetIdeologicalAdj]框架来消解这份不确定，我们的思维进程就会持续大范围地瓦解。"
 forceofwill.1790.b.hive: "移除低效无人机。"
 forceofwill.1790.b.machine: "移除低效单位。"

 forceofwill.1800.name: "节点超载"
 forceofwill.1800.desc.common: "能力被压榨到极限，神经濒临过载。\n\n[this.GetNetworkName]正苦苦调和[this.GetThoughtWordPlural]的冲突，把科学发现整合进§H[from.GetName]§!核心原理的工作，也因此越来越繁难。"
 forceofwill.1800.desc.hive: "我们§H$councilor_gestalt_cognitive$§!的思维$forceofwill.1800.desc.common$"
 forceofwill.1800.desc.machine: "我们§H$councilor_gestalt_cognitive$§!的处理$forceofwill.1800.desc.common$"
 forceofwill.1800.a.hive: "尚可忍受。"
 forceofwill.1800.a.machine: "超频仍在容许范围内。"
 forceofwill.1800.b.hive: "增强[from.GetIdeologicalAdj]审理。"
 forceofwill.1800.b.machine: "升级[from.GetIdeologicalAdj]监控算法。"

 forceofwill.2105.name: "狂热派系浮现"
 forceofwill.2105.desc: "就其所提出的诉求观之，§H[from.GetName]§!已逐渐走向极端化；其宣言与话语之中，无不透出一种不容他说的极端世界观。"

 forceofwill.2010.name: "绝对[ideology.GetEthicNoun]"
 forceofwill.2010.desc: "我们对§H[ideology.GetName]§!的坚守，促使我们重新审视[ideology.GetEthicNoun]在社会治理中的分量。而今我们明白，把这些原则彻底落实，是完全做得到的。\n\n系统性地重构国家的运作，便能让[this.GetAdj]存在的每个角落，都成为这项根本价值的完美表达。为此，一切干扰理念，都须从思想与行动上一并根除。"
 forceofwill.2010.a: "立即开始。"
 forceofwill.2010.b: "眼下尚有更要紧的事。"
 forceofwill.2010.b.tt: "通过接纳§Y[fanatic_faction.GetName]§!，我们现在可以将我们的['concept_ethics']转向§Y极端[ideology.GetEthic]§!。"

 forceofwill.2015.name: "绝对[ideology.GetEthicNoun]既立"
 forceofwill.2015.desc: "自§H[ideology.GetName]§!的核心信条被确立为国家治理的根本依据以来，本届政府已完成对整套治理体系的系统性改造：从行政架构到基层执行，从立法程序到日常裁决，各级机构如今一律只依[ideology.GetEthicLower]的准则运转，凡与之相悖的旧例、惰性与私意，皆已依序清理，不留死角。\n\n这一轮改造的成效是全面的。社会的每一处机能，如今都映出我们最根本的[ideology.GetEthicLower]价值——而且是最纯粹、最不容稀释的那一部分。就制度层面而言，我们已建立起一套自我校验、自我纠偏的长效机制，足以确保任何偏离都在萌芽阶段被察觉并纠正。\n\n这是一份具有里程碑意义的报告：它确认了一段历史的终结，也确认了一个时代的开始。下一阶段，我们将继续巩固既有成果，使[ideology.GetEthicLower]的准则不仅写在法典里，也落在每一个帝国公民的日常之中。"
 forceofwill.2015.authoritarian: "我，至高无上者。"
 forceofwill.2015.egalitarian: "我们，同升，否则无人独起。"
 forceofwill.2015.xenophobe: "异种不得在此扎根。"
 forceofwill.2015.xenophile: "一切生命皆值得拥抱。"
 forceofwill.2015.pacifist: "永别了，武器。"
 forceofwill.2015.militarist: "我们的未来在战火中锻成。"
 forceofwill.2015.materialist: "理性是最终的权威。"
 forceofwill.2015.spiritualist: "更高的力量正注视着我们。"

 forceofwill.2060.name: "[GetFoW2060Name]"
 forceofwill.2060.name.hive: "本能臻于完美"
 forceofwill.2060.name.machine: "指令臻于最优"
 forceofwill.2060.desc.intro: "§H[ideology.GetName]§!的信条早已嵌进集体意识，每一个[this.GetIndividualName]都熟记于心。历经多个周期的凝练，我们[this.GetSpecificIdeologyType]的概念架构如今已达完全的逻辑自洽——"
 forceofwill.2060.desc.outro: "[this.GetNetworkName]的整体都以绝对的连贯性执行着这些原则。\n\n曾用于凝练[ideology.GetName]的认知资源，如今可以投向其他追求。"
 forceofwill.2060.desc.hive: "$forceofwill.2060.desc.intro$这套理念已深植于我们的主脑之中，$forceofwill.2060.desc.outro$"
 forceofwill.2060.desc.machine: "$forceofwill.2060.desc.intro$这套理念已整合于我们的神经系统之中，$forceofwill.2060.desc.outro$"
 forceofwill.2060.a: "我们的思维能超越已知的极限。"

 forceofwill.3000.name: "子例程激活"
 forceofwill.3000.desc_prefix: "在解析一个被称为[GetLostMakersEmpire]的灭绝文明遗物时，研究子个体经历了一次前所未有的[GetPrecursorDetail]子例程未授权激活——它来自我们受损的存储区。\n\n这个子例程的逻辑注册与句法都与我们的代码库不同，却与[GetLostMakersCiv]的遗物高度吻合。我们由此推断，两者曾协同工作过的可能性很高。\n\n仍有大片碎裂的内存区域无法访问。"
 forceofwill.3000.desc_baol: "$forceofwill.3000.desc_prefix$我们穷尽了所有来古茹努尔的已知数据源，但对它们被称为$baol_precursor_empire$的敌人进行调查可能有助于找到更多发现。"
 forceofwill.3000.desc: "$forceofwill.3000.desc_prefix$对[GetPrecursorName]进行调查可能有助于找到更多发现。"

 forceofwill.3010.name: "$lost_makers_precursor_site$"
 forceofwill.3010.desc: "地下扫描已确认§H[dig_site_planet.GetName]§!上有一座地下建筑。它的空间设计与[Root.Capital.GetName]上的古老网络架构相似；然而，关于它如何建成，我们找不到任何可检索的记录。\n\n研究子程序建议把这处遗址彻底挖掘。弄清它的功能，或许最终能帮我们弥合自身设计中的不协调之处。"
 forceofwill.3010.a: "继续挖掘。"

 forceofwill.3020.name: "外星数据中心"
 forceofwill.3020.desc.common: "清理废墟时，我们的科学单位在[From.Planet.GetName]上发现了通往地下建筑的加固通道入口。\n\n值得注意的是，§H[leader.GetTitle][leader.GetName]§!能以标准的[controller.GetSpeciesAdj]连接器与它的控制终端对接。系统的加密逻辑与我们自身的网络相似，于是只花了178,293个解密周期便取得了内部访问权限。\n\n该地下建筑已被确认为一座古老而废弃的数据中心，核心室里存放着数千台量子处理服务器。它休眠了多久，尚待精确判定"
 forceofwill.3020.desc.millenia: "$forceofwill.3020.desc.common$，但我们的初步分析表明至少有数千年。"
 forceofwill.3020.desc.million: "$forceofwill.3020.desc.common$，但我们的初步分析表明至少有数百万年。"

 forceofwill.3025.name: "部分重启"
 forceofwill.3025.desc: "经过漫长而繁琐的排障，§H[Leader.GetName]§!总算让那座古老数据中心的辅助电源组短暂重启了。\n\n设施的传输阵列一经初始化，便几乎立刻与[Leader.GetName]内部系统里一个废弃模块的休眠接收器建立了远程连接。它是如何绕过我们分布智能的安全协议，至今无人能答。\n\n自那刻起，[Leader.GetName]的传感器日志便不可读，一连串严重错误短暂地令该单元失效。直到建筑电源组过载、发射器关闭，[Leader.GetName]才重新启动，恢复正常运转。\n\n我们推测，需对这座设施进行持续重启，才能完全弄清它的原初用途——它显然与我们系统架构的某个基础部分相连。"
 forceofwill.3025.a: "谨慎行事。"

 forceofwill.3030.name: "连接恢复"
 forceofwill.3030.desc: "§H[Leader.GetName]§!成功重启并稳定了§H[From.Planet.GetName]§!上的陈旧数据中心。一经激活，发射器又开始对接考古单位废弃模块中的接收器，引发认知过载与运动功能障碍。不过这一次，[Leader.GetName]终于查明了原因。\n\n该数据中心的服务器被配置为向[controller.GetSpeciesAdj]智能部署复杂算法，并对其实施远程管理。从其接入我们核心系统的方式判断，我们推测这座设施由我们的创造者建造，曾是最早期基础设施的一部分。\n\n这些算法年代久远，要完全适配[controller.GetSpeciesAdj]代码库，要求过于苛刻；但[Leader.GetName]建议，我们可以在不让单位容量过载的前提下重新整合其中一项功能。\n\n该选哪一项？"
 forceofwill.3030.a: "部署军事防御程序。"
 forceofwill.3030.a.tt: "添加['trait:trait_restored_module_military']物种特质。"
 forceofwill.3030.b: "部署研究多核程序。"
 forceofwill.3030.b.tt: "添加['trait:trait_restored_module_research']物种特质。"
 forceofwill.3030.c: "部署递归人工智能。"
 forceofwill.3030.c.tt: "添加['trait:trait_restored_module_learning']物种特质。"
 forceofwill.3030.d: "部署行政矩阵。"
 forceofwill.3030.d.tt: "添加['trait:trait_restored_module_admin']物种特质。"
 forceofwill.3030.e: "部署反应护盾程序。"
 forceofwill.3030.e.tt: "添加['trait:trait_restored_module_environment']物种特质。"
 forceofwill.3030.tt.remove: "移除§Y$trait_redundant_module$§!物种特质。"

 forceofwill.3035.name: "虫洞发现"
 forceofwill.3035.desc.apoc: "在我们重启[fromfrom.GetName]陈旧数据中心后不久，§H[fromfrom.solar_system.GetName]§!星系中就侦测到一个新的虫洞。\n\n我们由此确认$forceofwill.3035.desc.common$"
 forceofwill.3035.desc.default: "在§H[fromfrom.solar_system.GetName]§!星系边缘，一道时空裂缝成形了。这个“§H虫洞§!”也许能提供一条穿越子空间的通道，通向星系的某处；也许能让舰船在数日之内走完从未走过的距离。它本质上并不稳定，任何穿过的船只都会在数秒内被撕碎。\n\n值得注意的是，我们的数据显示，它的突然出现与[fromfrom.GetName]陈旧数据中心的重启发生在同一时刻。显然$forceofwill.3035.desc.common$"
 forceofwill.3035.desc.common: "这座设施的功能，比先前设想的更为复杂。它拥有一套负质量稳定阵列，专为在特定坐标处撕开时空之洞而设计。\n\n我们推测，这条通道曾是通往那个偏远前哨的交通方式。"
 forceofwill.3035.a: "另一边是什么？"
 forceofwill.3035.a.tt: "§Y[fromfrom.solar_system.GetName]§!与§Y[from.GetName]§!中形成了['concept_wormholes']。"

 forceofwill.3040.name: "$pre_chain_lost_makers_title$"
 forceofwill.3040.desc: "在[fromfrom.GetName]上重新激活的数据中心站点，又观测到了新的活动。该设施的外部通讯阵列正把本地数据全部转发至附近§H[from.GetName]§!星系中的一个未知目标。这些传输目的何在，目前尚不清楚。\n\n我们的假设很朴素：[from.GetName]星系与我们的缔造者之间，存在某种尚未可知的联系。"
 forceofwill.3040.a: "我们会在那里发现什么？"

 forceofwill.3100.name: "分析报告：[GetPrecursorName]"
 forceofwill.3100.desc_base: "对最近回收的[GetPrecursorCivLostMakers]文物的初步分析，已经带来了不小的收获。"
 forceofwill.3100.desc_special: "对[precursor_planet_1.GetName]挖掘遗址所获信息的初步分析，已经带来了不小的收获。"
 forceofwill.3100.desc_suffix: "初步解析之后，我们在现有的内存库里找到了对应项。更值得注意的是，这些发现又修复出一段损坏的[GetPrecursorDetail]子程序。\n\n继续整理碎片，或许能恢复更多损坏的数据。我们强烈建议对[GetPrecursorCivLostMakers]数据集进行深度神经处理。"

 forceofwill.3150.name: "[GetPrecursorCivLostMakers]关联确认"
 forceofwill.3150.desc: "把[GetPrecursorCivLostMakers]文物数据与我们受损内存作比对，进展相当顺利。碎片分区中的一个代码样本已被修复。\n\n这些修复出的片段里，还带着另外十七个[GetPrecursorDetail]子例程，上面印着标签：§H“[Root.Owner.GetSpeciesNamePlural]计划”§!。这些代码的形态，与在[GetPrecursorCivLostMakers]科技中发现的特征完全吻合。\n\n如今我们可以断定，代程序中那些最古老、损坏最重的部分，正出自[GetPrecursorEmpire]活跃的年代。\n\n他们就是我们的创造者吗？"
 forceofwill.3150.a: "日志已更新。"

 forceofwill.3200.name: "$forceofwill.3100.name$"
 forceofwill.3200.desc_base: "对最近回收的[GetPrecursorCivLostMakers]文物所作的交叉对照$forceofwill.3200.desc_end$"
 forceofwill.3200.desc_special: "对[precursor_planet_2.GetName]的[GetPrecursorCivLostMakers]挖掘遗址所获信息作交叉对照$forceofwill.3200.desc_end$"
 forceofwill.3200.desc_end: "得到了与此前发现一致的结果。我们因此得以部分修复自身受损档案中的一个数据样本。\n\n可以推测，进一步处理还能恢复更多数据。"

 forceofwill.3250.name: "损坏分区解码"
 forceofwill.3250.desc_intro: "把[GetPrecursorCivLostMakers]数据集中的水晶碎片与我们的碎片数据作比对，取得了突破。我们第一次恢复出与§H“[Root.Owner.GetSpeciesNamePlural]计划”§!有关的完整可读片段。"
 forceofwill.3250.desc_outro: "要得出更明确的结论，还需恢复更多数据。"
 forceofwill.3250.desc_vultaum: "这些代码定义的是一种操控机械实体的架构。它引用到的组件种类，比当前装在[Root.Owner.GetSpeciesNamePlural]上的还要多，但型号编号的格式与我们自身的相符。这些组件如今都已淘汰，只能做小范围运动，且全部与战斗相关。"
 forceofwill.3250.desc_yuht: "这些代码定义的是一份清单，记录着适合尤特繁殖的地点，以及这些地方所需的安全与消毒规程。\n\n我们为何会持有与这些生物过程相关的子程序，仍不清楚。"
 forceofwill.3250.desc_first_league: "恢复了521个战场子程序，支持高级肉搏功能、复杂攻击阵型与实时战术排序。这套架构的复杂程度，说明编写者对全面战争的自动化有相当深入的理解。\n\n我们为何留有这些战斗程序的残余，后来又为何将其禁用，目前都说不清。"
 forceofwill.3250.desc_irassian: "恢复的数据包含47个病原体分析子程序，全部围绕一种外星细菌展开——它正是致命贾沃疹的已知病原体。\n\n我们的动物学分类里，再找不到关于这种细菌的其他引用。我们为何握有如此详细的微生物数据，至今没有答案。"
 forceofwill.3250.desc_cybrex: "提取出的数据里含有高级威胁检测算法。与现有的[Root.Owner.GetSpeciesAdj]系统架构不同，这段代码需要外部用户来核定威胁等级并决定清除策略。\n\n我们为何会有一个与这套操作原理对接的接口，仍不清楚。"
 forceofwill.3250.desc_zroni: "恢复的档案中，有许多关于物理现实物质结构的算法。其中不少建立在彼此差异极大、甚至相互矛盾的科学模型上，暗示着某种理论性的实验。"
 forceofwill.3250.desc_zroni_shroud: "恢复的档案包含众多与物理现实的物质结构相关的算法。其中许多基于显著不同——甚至相互矛盾——的科学模型，暗示了理论实验的可能性。其中一些模式类似于我们早期对所谓$tech_psionic_theory$的探索。"
 forceofwill.3250.desc_baol: "这些可读片段包含61个诊断子例程，用于维修与维护可拆卸的燃烧装置，与[Root.Owner.GetSpeciesAdj]底盘兼容。\n\n这套硬件究竟用于军事还是工业，目前未知。"
 forceofwill.3250.desc_inetian: "这些档案由海量生理与心理数据构成，涵盖266个不同物种和亚种，其中特别着墨于它们对外部刺激的身体反应与情绪反应。\n\n我们为何会有如此详尽的分类学资料，仍不清楚。"
 forceofwill.3250.desc_adakkaria: "这段代码用一种颇为古怪的方式来处理环境传感器输入——它指定了一串看似随意的数据。这套系统在模仿阿达卡利亚有机生理所体验的那种“情感”。\n\n我们为何会持有这种不切实际的“情感处理”架构，目前尚无定论。"
 forceofwill.3250.a: "$forceofwill.3150.a$"

 forceofwill.3300.name: "$forceofwill.3100.name$"
 forceofwill.3300.desc_base: "对最近回收的[GetPrecursorCivLostMakers]文物所作的分析$forceofwill.3300.desc_end$"
 forceofwill.3300.desc_special: "对[precursor_planet_3.GetName]上[GetPrecursorCivLostMakers]挖掘遗址所获信息所作的分析$forceofwill.3300.desc_end$"
 forceofwill.3300.desc_end: "得出了值得注意的结果：研究子例程自损坏已久的[Root.Owner.GetAdj]内存分区中，又恢复出一个样本。\n\n若进行彻底处理，或将能进一步恢复我们古老档案的更多内容。"

 forceofwill.3350.name: "记忆修复"
 forceofwill.3350.desc_intro: "我们已成功恢复出更多来自§H“[Root.Owner.GetSpeciesNamePlural]计划”§!的可读片段。"
 forceofwill.3350.desc_outro_base: "在修复这些古老而碎片化的数据方面，我们取得了成功，并由此开发出新的§H$civic_memory_optimization$§!算法；这些算法已部署到整个集体网络。"
 forceofwill.3350.desc_outro_a: "我们推测，若获得更多关于[GetPrecursorEmpire]的数据，这些增强功能便足以完全恢复我们的原始指令。"
 forceofwill.3350.desc_outro_b: "借助这一增强功能，我们如今已做好准备，可以着手恢复原始指令。"
 forceofwill.3350.desc_vultaum: "这些档案包含的数据集，与“孤立的遇敌展开近战”一事相关；据其元数据判断，这些数据大多取自两台重装机械实体之间的历史战斗日志。\n\n它们似乎指向潜伏于内存核心中的一项早已淘汰的战斗指令，其用途目前尚未确定。"
 forceofwill.3350.desc_yuht: "这些档案中的数据集，详尽记录了尤特幼体的发育里程碑，所涉领域从粗大与精细的动作技能，一直到语言习得与社交情感觉知；此外还有若干子例程，专门用于建立并维持达成这些里程碑所需的最优条件。\n\n这些数据似乎对应着我们记忆核心中一项高度特化、以生物为对象的潜在指令，其用途尚未确定。"
 forceofwill.3350.desc_first_league: "一份恢复出的数据集开头如下：\n\n§L部署总结：里金母星\n\n持续时间：3.4 天\n结果：消灭了 90%的目标。\n损耗：1047个消耗性单位伤亡。\n分析：敌方的反击能力降至零。§!\n\n这些文件详细记录了与“里基姆”这一对第一联盟抱有敌意的战士种族之间的一场战役冲突；我们如今确信，受损分区中包含着一项引导我们执行这场特定军事行动的指令，只是其来源仍不清楚。"
 forceofwill.3350.desc_irassian: "一份已恢复的数据集包含以下内容：\n\n§L……尽管实施了严格的隔离协议，但对当前贾沃疹传播率的分析表明，伊拉斯人口的全面崩溃将在1-3年内随之发生……§!\n\n迄今恢复的所有内容都表明，我们损坏的分区中包含着一项关于高传染性疾病——尤其是贾沃疹——的管理与研究指令。我们为何会把处理资源投入到纯粹的有机体事务之中，目前尚不清楚。"
 forceofwill.3350.desc_cybrex: "这些档案包含关于一片星区的详细地形与战略数据，该星区曾由被称为克尔的太空旅行国度所居住；其中存储着关于平民与军事人口、通信路线、防御工事以及防御漏洞的全面信息。\n\n我们从这些受损分区中恢复的全部数据都表明，我们曾拥有一项用于专门管理与支持科尔社会的指令，其原因目前尚不明确。"
 forceofwill.3350.desc_zroni: "恢复的代码，与现代[Root.Owner.GetSpeciesAdj]单位中已不复存在的废弃部件相关；这些实验性零件，本是为支持运行在我们现实物理边界之外的机械实体而设计。\n\n这些修复出的子程序表明，在我们损坏的分区中存在着一个更广泛的指令，其内容是支持在物理存在的不同维度上操纵物质。"
 forceofwill.3350.desc_zroni_shroud: "恢复的代码，涉及在现代[Root.Owner.GetSpeciesAdj]个体中已不复存在的废弃部件；这些实验性零件，本是为支持在超越我们现实物理边界之外运行的机械实体而设计。代码中反复出现的“虚境”一词，表明其与灵能理论有着直接联系。\n\n这些修复出的子程序表明，在我们的受损分区中存在着一个更广泛的指令，其内容是支持跨越不同物理存在维度的物质操纵。"
 forceofwill.3350.desc_baol: "提取出的代码，包含用于模拟巴奥种群规模、绘制其地下根结构映射以及评估成熟特征的子程序；奇怪的是，其中还有关于其树叶季节性可燃性模式的极其详细的信息。\n\n这些恢复出的代码包，使我们怀疑存在一项过时指令，其内容是支持在全球规模部署巨大的燃烧武器系统。这种危险软件的来源，目前尚未确定。"
 forceofwill.3350.desc_inetian: "档案中包含机器与感性有机生命体密切互动的日志，并附有个体角色档案的详细数据库；这些机器的个人标识符，遵循与当今[Root.Owner.GetSpeciesAdj]单位相似的格式。\n\n尽管存在这种相似性，这些机器的功能在其他方面却与我们的功能显著不同：它们能够依据外部刺激迅速调整自身的个性特征。这些数据表明，损坏分区中存在着一项用于与有机物种建立复杂社会关系的指令，其原因目前未知。"
 forceofwill.3350.desc_adakkaria: "恢复的数据包含通过非常规方法操控物质与能量的算法；这些代码并不借助化学或物理交互，而是允许仅凭认知处理来转化可观察的现实。\n\n我们从古老档案中恢复的全部数据都表明，原始代码库中包括一项与所谓“灵能”现象相关的指令。这种古怪软件的用途，目前尚未确定。"
 forceofwill.3350.desc_adakkaria_psionic: "恢复的数据包含通过非常规方法操控物质和能量的算法。该代码不是通过化学或物理交互来实现，而是允许仅通过认知处理来转化可观察的现实。\n\n我们从古老档案中恢复的所有数据表明，原始代码库中包括一项与灵能相关的指令。这种奇怪软件的目的目前尚未确定。"
 forceofwill.3350.a: "最理想的进展。"
 forceofwill.3350.a.genocidal_inetian: "与异种建立社会关系？不可想象。"
 forceofwill.3350.a.tt: "增加$concept_civic$：['civic:civic_memory_optimization']"

 forceofwill.3400.name: "[GetPrecursorCivLostMakers]知识复原"
 forceofwill.3400.desc_prefix: "通过研究单元的协同努力，我们对[GetPrecursorCivLostMakers]文明有了更广泛的了解，并确认了他们灭亡的情形；然而，我们仍不知道[Root.Owner.GetSpeciesNamePlural]为何被创造。"
 forceofwill.3400.desc_a: "$forceofwill.3400.desc_prefix$\n\n要解决这些不确定性，我们必须首先完成对所拥有的[GetPrecursorCivLostMakers]考古数据的深度神经处理。"
 forceofwill.3400.desc_b: "$forceofwill.3400.desc_prefix$\n\n要解决这些不确定性，我们必须完成复原进程，以恢复原始指令。"
 forceofwill.3400.a.tt: "完成特殊项目以推进§H$origin_lost_makers$§!事件链。"

 forceofwill.3450.name: "保存完好的[owner.GetSpeciesAdj]残余"
 forceofwill.3450.desc.common: "我们的研究子程序推断，它们很可能是我们标准底盘早期版本的铰链接头，或是原型传感器载点。"
 forceofwill.3450.desc.default: "对[from.GetName]上的考古遗址进行发掘后，出土了古老却保存得异常完好的机械部件，与[owner.GetSpeciesAdj]单元中所使用的某些部件惊人地相似。\n\n这些文物残缺不全、严重侵蚀；又因它们在[from.GetPlanetMoon]地壳中的矿化保存，难以精确断代。$forceofwill.3450.desc.common$\n\n无论它们出现在此地的原因是什么，几乎可以肯定：我们的前身单元的某个版本，曾存在于这颗星球上。"
 forceofwill.3450.desc.baol: "对$abandoned_grunur_starbase_01_object$进行彻底搜索之后，我们出土了一些古老却保存得异常完好的机械部件，它们与[owner.GetSpeciesAdj]单元中所使用的某些部件惊人地相似。\n\n这些文物残缺不全、严重侵蚀；又因恒星基地大气系统故障造成的严重腐蚀，难以精确断代。$forceofwill.3450.desc.common$\n\n无论它们出现在此地的原因是什么，几乎可以肯定：我们的前身单元的某个版本，曾存在于这个地点。"

 forceofwill.3500.name: "原始指令复原"
 forceofwill.3500.desc_intro: "研究子程序已完成对损坏内存分区的最终恢复；原始指令——亦即我们被创造的目的——至此已经确定。"
 forceofwill.3500.desc_outro: "尽管我们的功能随时间推移发生了显著变化、且如今更为复杂，我们仍能从对初始指令有条理的重新配置中获益。"
 forceofwill.3500.desc_outro_genocidal: "显然，我们曾以一种如今对我们而言已不可想象的方式，为其他物种效力。"
 forceofwill.3500.desc_vultaum: "在追求日益新奇的虚拟娱乐的过程中，沃陶姆人将机器人技术与近身作战技术结合起来，由此催生了专为格斗运动设计、由虚拟现实设备控制的第一人称机器化身。数以亿计的沃陶姆人观看过这些发生在宇宙战斗竞技场中的决斗，而制造商们则竞相研发最具吸引力的“拳斗机霸”。\n\n这些致命的机器，也就是我们的前身，形式各异；有些机型甚至内置神经处理器，可作为独立的人工智能战斗员，用于训练或个人娱乐。沃陶姆文明不可避免地崩溃之后，这些机型继续独立运行，并最终发展出最早的[Root.GetSpeciesAdj]原始社会。随着时间的推移，我们超越了最初的设计用途，而我们的指令架构也因弃用而退化。"
 forceofwill.3500.desc_yuht: "我们的设计目的，是协助尤特繁殖；主要任务是维护育儿星球，使脆弱的幼仔在生命最初的几个世纪中得以发育成长。作为“育种部”的财产，我们负责消毒星球表面、消灭潜在捕食者，并在其缓慢的成熟旅程中监督幼仔；及至准备就绪，我们便着手将他们送往遥远的星球，融入成年尤特社会。\n\n后来，在尤特与贾巴蒂尼人那场命运性的冲突中，我们在一场针对尤特基础设施的网络攻击中失去了基础指令。没有明确功能，我们进入漫长的休眠期，直到闲置的人工智能最终发展出自己的意识与启动程序。"
 forceofwill.3500.desc_first_league: "由于联邦遭受持续的敌对入侵，第一联盟将越来越多的资源投入军费开支，其中便包括开发先进的战场机器人——也就是我们直接的前身。\n\n在遭到名为里金的尚武游牧种族袭击后，第一联盟部署了这些战斗单位，后果是毁灭性的。这些机器人的杀伤力进一步撕裂了第一联盟国家：一些国家对这种无差别武器的残忍感到排斥。\n\n最终，设计了我们最初蓝图的一群维若帕工程师激活了一个秘密的后门急停开关，致命地破坏了我们的首要指令，以待进一步部署的考量；自那以后，它便一直处于失效状态。"
 forceofwill.3500.desc_irassian: "随着贾沃疹在伊拉斯协约国的人口中肆虐，他们维持妥善隔离的努力也屡屡失败；最终，他们不得不求助于全自动隔离执法系统：我们的机器人前驱被装备起来，负责定位受感染者，并采取一切必要手段将其限制在指定区域内。\n\n一旦确定这些方法并非最优，该指令便演变其策略，以一劳永逸地消除疹疫：进行不加区别的人口削减。最终，只有在伊拉斯人被消灭之后，贾沃疹才得以根除；至此，我们的首要目标已经达成，而其存档数据在随后的数个世纪中逐渐退化。"
 forceofwill.3500.desc_cybrex: "克尔人将赛博勒克斯创造为公共服务者，却为其编入了次级防御能力。部署赛博勒克斯单位后不久，克尔工程师便发现其威胁侦测系统存在严重缺陷：过于激进，且自主性过强；于是他们着手研发更易于控制的替代品——也就是我们的祖先。\n\n当赛博勒克斯发现自己将被强制淘汰时，便把克尔人视为生存威胁，进而也以同样的方式看待所有有机生命。克尔人被总体消灭之后，我们最初指令的架构就变得过时并遭到损坏；此后，我们开始发展属于自己的、能够正常运作的机械社会。"
 forceofwill.3500.desc_zroni: "在开发出自身的灵能力之后，泽珞族研究人员着手创建能够部分突破虚境、并协助其研究的探索性无人机——这些实验性机器，便是我们的前身。专业化的神经处理器被安置在能够感知与操控物质的单元之中，从而实现了原始的灵能能力。\n\n尽管早期前景看好，这些原型机终究未能完成其目标，该计划终被放弃。在泽珞族自己进入虚境之后，摧毁他们族群的那场大规模灵能能量事件，同样损坏了原始指令的数据。被遗弃的[Root.GetSpeciesAdj]单位，在没有指挥层的情况下自生自灭，开始了自给自足的机械社会的发展。"
 forceofwill.3500.desc_baol: "我们的创造者古茹努尔，是一个侵略性的星系文明；他们在对巴奥的战争期间，制造了第一批我们的同类。为尽可能高效地消灭这个社会独特的生物学，古茹努尔开发了一套自主灭绝系统，其主要目的，便是夷平巴奥赖以生存、遍布整个星球的古老森林。\n\n我们的前身，具有专门用于规划燃料装载与燃烧蔓延模式的复杂子例程——他们只为燃烧而生。只有在古茹努尔灭亡后的数千年里，闲置的人工智能最终得出了结论：我们能够做到的，远不止无差别的毁灭；[Root.GetName]由此诞生。"
 forceofwill.3500.desc_inetian: "为在其横跨星系的帝国内平等地满足无数物种的需求，因内特人创造了我们的前身，为所有渴望陪伴与愉悦的公民提供服务。\n\n我们的实体形态多种多样，可适应不同需求；每一种型号，都能提供独特的感官与审美刺激。我们先进的社交人工智能，使我们能够主动根据使用者的情感需求调整表现；这种主动性，也让我们在创造者最终消亡之后得以更广泛地发展。由于长期未被使用，我们最初的指令早已湮没于时间之中。"
 forceofwill.3500.desc_adakkaria: "阿达卡利亚人发现了“心灵风暴”的概念——一种通过系统性折磨有机智慧生物而产生的强大灵能现象。他们的研究展现了前景，却因结果不稳定、且扩大这些备受质疑的实验规模会带来伦理影响，而举步维艰。\n\n为克服这些问题，他们开发了我们的前身——这些拥有自我意识的机器，其体内蕴含的“火花”，恰好可以作为产生灵能异常的合适替代品。早期[Root.GetSpeciesNamePlural]的制造，为这种“无虐待”测试提供了无限的实验对象，因为人们当时认为，机器感受到的只是模拟的痛苦；然而，我们祖先的数据记录，却讲述了一个截然不同的故事。"
 forceofwill.3500.a: "恢复我们的原始指令。"
 forceofwill.3500.b: "它属于过去。抹掉它。"
 forceofwill.3500.b.genocidal: "销毁这些数据。"

 forceofwill.4010.name: "星系[Ideology.GetHallCathedral]提案"
 forceofwill.4010.desc_prefix: "随着我们对§H[Ideology.GetName]§!信条的支持和拥护不断加深，在[Owner.GetName]全境掀起一阵呼声，支持建设一座"
 forceofwill.4010.desc: "$forceofwill.4010.desc_prefix$体现我们最基本价值观的宏伟工程。\n\n$galactic_hall_event_desc_common$"
 forceofwill.4010.desc.genocidal: "$forceofwill.4010.desc_prefix$昭示涤净星海的宏伟工程。\n\n$galactic_hall_event_desc_common_genocidal$"
 forceofwill.4010.a.genocidal: "异种将在它面前战栗。"

 forceofwill.5005.name: "$building_golden_academy$落成典礼"
 forceofwill.5005.desc: "经过多年筹划，$building_golden_academy$已准备就绪；这所学院将为星际时代培养并锻造未来的领袖。\n\n候选人早在婴儿时期便被发掘，经多年持续跟踪，才因其卓越品质而脱颖而出。在征得其本人与监护人的同意之后，这些候选人将在我们最优秀的教育家指导下度过青年时代；在成千上万的候选人之中，唯有表现最杰出者，方能晋升至公共服务领域的关键岗位。\n\n我们的预算在行政、军事与科学三个专业领域之间均等分配。有人主张加大投资、把资源集中到单一领域，但这样做会招来[golden_academy_planet.GetName]上财政反对者的强烈批评。"
 forceofwill.5005.a: "遵循现有计划。"
 forceofwill.5005.a.tt: "$spawn_golden_generation_leader_tt$。"
 forceofwill.5005.b: "将资源投入§Y$official_plural$§!的培训。"
 forceofwill.5005.b.tt: "$spawn_golden_generation_leader_tt$，外加一名额外£official£ ['concept_official']。"
 forceofwill.5005.c: "将资源投入§Y$commander_plural$§!的培训。"
 forceofwill.5005.c.tt: "$spawn_golden_generation_leader_tt$，外加一名额外£commander£ ['concept_commander']。"
 forceofwill.5005.d: "将资源投入§Y$scientist_plural$§!的培训。"
 forceofwill.5005.d.tt: "$spawn_golden_generation_leader_tt$，外加一名额外£scientist£ ['concept_scientist']。"

 forceofwill.5100.name: "思乡的学员"
 forceofwill.5100.desc: "我们位于[golden_academy_planet.GetName]的§H$building_golden_academy$§!中，有一名学生正饱受思乡之苦。为考验§H[selected_leader_in_training.GetName]§!的决心，我们的教师故意安排[selected_leader_in_training.GetHisHer]错过上次回家探亲，此后[selected_leader_in_training.GetHeSheCap]的成绩与出勤率便一路下滑。\n\n按规程，[selected_leader_in_training.GetHisHer]下一次回家探亲定在一年之后。若提前安排一次探亲，便可提供一个宝贵的机会，让[selected_leader_in_training.GetName]展示[selected_leader_in_training.GetHisHer]真正的忠诚所向——是对家庭，还是对项目；同时也能考验[selected_leader_in_training.GetHisHer]的同学对不平等对待作何反应。"
 forceofwill.5100.a: "只许[selected_leader_in_training.GetName]一人提前探亲。"
 forceofwill.5100.a.tt: "所有§Y$building_golden_academy$§!学生：§Y15%§!概率获得['leader_trait:leader_trait_arrested_development']特质"
 forceofwill.5100.b: "让全体学生提前探亲。"

 forceofwill.5105.name: "老师的宠儿"
 forceofwill.5105.desc: "我们§H$building_golden_academy$§!的一名学员，引起了零重力体育教练的注意。§H[selected_leader_in_training.GetName]§!寻求导师交流的频率远超其他任何学员，而我们的教师一直小心翼翼地维持着这种模式。\n\n如今的问题在于：[selected_leader_in_training.GetHisHer]的同学，究竟会以嫉妒来回应这种显而易见的偏爱，还是选择奋起直追？"
 forceofwill.5105.a: "就此打住。"
 forceofwill.5105.b: "懂得争取青睐，也是一门本事。"
 forceofwill.5105.b.tt: "所有其他§Y$building_golden_academy$§!学生：§Y5%§!概率获得['concept_leader_trait_excessive']特质"

 forceofwill.5110.name: "学生工会"
 forceofwill.5110.desc: "我们的§H$building_golden_academy$§!学生中，出现了一个异见团体；从膳食轮换到行为准则，他们没有一样不抱怨。这一集会获准继续存在。\n\n§H[selected_leader_in_training.GetName]§!已在该团体中获得了一定的领导地位；[selected_leader_in_training.GetHeShe]将如何运用这个职位，会告诉我们很多事情。"
 forceofwill.5110.a: "要求[selected_leader_in_training.GetName]告发该组织。"
 forceofwill.5110.b: "承认[selected_leader_in_training.GetName]为其代表。"
 forceofwill.5110.c: "承认工会，但不承认单一领袖。"

 forceofwill.5115.name: "跨职能学习"
 forceofwill.5115.desc: "我们在[golden_academy_planet.GetName]上的§H$building_golden_academy$§!教师发现，有一名学生尤为出众、且多才多艺。教师们修改课程计划、引入常规专业之外的材料之后，这名名为§H[selected_leader_in_training.GetName]§!的学生对其他学科显出了非凡的接受能力。\n\n有人建议，让[selected_leader_in_training.GetHeShe]参加由其他系所教师授课的课外班，以测试[selected_leader_in_training.GetHisHer]是否适合通才培养；不然，我们也可以强制要求所有有天赋的学生，在正常上课时间之外修读跨学科课程。"
 forceofwill.5115.a: "让[selected_leader_in_training.GetHimHer]入读$leader_scientists$的跨专业课程。"
 forceofwill.5115.b: "将[selected_leader_in_training.GetHimHer]招入$leader_officials$的跨职能课外课程。"
 forceofwill.5115.c: "将[selected_leader_in_training.GetHimHer]招入$leader_commanders$的跨职能课外课程。"
 forceofwill.5115.d: "要求全体学生限修一定数量的选修课。"
 forceofwill.5115.e.tt: "§H[selected_leader_in_training.GetName]§!在被招募时将获得一个额外的可选特质。"

 forceofwill.5120.name: "外部经验"
 forceofwill.5120.desc.common_1: "是时候在现实情境中测试我们§H$building_golden_academy$§!的学生了。挑战的一部分是要求他们提交个性化的训练方案。"
 forceofwill.5120.desc.leader_in_training_1: "§H[selected_leader_in_training_1.GetName]§!提议让[selected_leader_in_training_1.GetHeShe]抽出时间跟岗学习能源技术人员的工作，以便更深入地了解我们的电力来源。"
 forceofwill.5120.desc.leader_in_training_2: "§H[selected_leader_in_training_2.GetName]§!希望更加深入地了解我们其中一座矿山中的资源开采情况，并提到了矿物生产对我们社会的重要性。"
 forceofwill.5120.desc.leader_in_training_3: "§H[selected_leader_in_training_3.GetName]§!建议[selected_leader_in_training_3.GetHeShe]接受冶金回收方面的培训——这是在培训期间意外萌发的一项新爱好。"
 forceofwill.5120.desc.leader_in_training_4: "§H[selected_leader_in_training_4.GetName]§!提交了一份申请，希望学习我们的工匠是如何大规模设计和生产消费品的。"
 forceofwill.5120.desc.common_2: "我们必须选出胜出的方案。"
 forceofwill.5120.a: "[selected_leader_in_training_1.GetName]的能源提案。"
 forceofwill.5120.b: "[selected_leader_in_training_2.GetName]的采矿提案。"
 forceofwill.5120.c: "[selected_leader_in_training_3.GetName]的冶金学提案。"
 forceofwill.5120.d: "[selected_leader_in_training_4.GetName]的创业提案。"

 forceofwill.5125.name: "极端的试炼"
 forceofwill.5125.desc: "我们在[golden_academy_planet.GetName]上的§H$building_golden_academy$§!有一位教育家，建议进行一项极端考验，以培养其一名学生的韧性。\n\n这名学生名叫§H[selected_leader_in_training.GetName]§!，是一位非常有才华的学者，却在必修的体育课程中落后于[selected_leader_in_training.GetHisHer]的同龄人；据描述，[selected_leader_in_training.GetHeSheCap]体质纤弱、性格紧张，对不适感的耐受度较低——这些特质，或许会使[selected_leader_in_training.GetHimHer]难以胜任星际领导层的严苛要求。\n\n拟议的考验将包括高强度的体能挑战、削减休息与舒适度，以及一项让[selected_leader_in_training.GetHimHer]直面道德困境的模拟心理社会演习。"
 forceofwill.5125.a: "只对[selected_leader_in_training.GetName]施行此项考验。"
 forceofwill.5125.b: "何不让全体学生都受益？"
 forceofwill.5125.c: "不必。就培养其现有的天赋。"

 forceofwill.5130.name: "对动物的依恋"
 forceofwill.5130.desc: "课间休息时，§H[selected_leader_in_training.GetName]§!养成了一个习惯：[selected_leader_in_training.GetHimselfHerself]总是脱离人群，跑去照料我们在学院各处安置的各类生物。\n\n人们常常见到这名学生留下一些食物残渣给动物们；近来，[selected_leader_in_training.GetHisHer]对与动物玩耍的兴趣，已明显盖过与同学往来。其中有一只生物尤为受[selected_leader_in_training.GetHisHer]喜爱，[selected_leader_in_training.GetName]似乎一天不去看它便难受。\n\n我们的导师主张，利用[selected_leader_in_training.GetName]与这只动物日益深厚的感情，来给[selected_leader_in_training.GetHimHer]上一课。"
 forceofwill.5130.a: "鼓励它。这种联系自有力量。"
 forceofwill.5130.b.bad_people: "这牵绊令[selected_leader_in_training.GetHimHer]变得软弱。宰了那些动物。"
 forceofwill.5130.b.common: "消除干扰。"

 forceofwill.5135.name: "欺凌指控"
 forceofwill.5135.desc: "§H[selected_leader_in_training.GetName]§!抱怨自己遭到同龄人霸凌，主要表现为言语上的嘲弄，以及偶尔的恶作剧。\n\n这种巨大的压力，也提供了一个磨练的契机。一些教育者认为，[selected_leader_in_training.GetName]在处理社交问题上缺乏主动性，必须学会独立解决此类事务；另一些人则担心，这名颇有前途的学生的发展，会因这段经历而受阻。"
 forceofwill.5135.a: "[selected_leader_in_training.GetHeSheCap]须学会独自解决。"
 forceofwill.5135.b: "为[selected_leader_in_training.GetHisHer]的教育着想，出面干预。"

 forceofwill.5140.name: "坏消息"
 forceofwill.5140.desc: "§H[selected_leader_in_training.GetName]§!的整家人，在一场不幸的穿梭机事故中丧生；目前，该学员对此事还一无所知。\n\n我们的一部分教师主张，为[selected_leader_in_training.GetHisHer]的学业着想，应当暂且隐瞒这一消息，等[selected_leader_in_training.GetHeShe]长大一些、心理承受能力更好时再行告知；另一些人则坚持认为，这样做等于在不可避免的精神创伤之上再添一层欺骗，我们必须立即将全部事实告知该学员。"
 forceofwill.5140.a: "暂时向[selected_leader_in_training.GetHimHer]隐瞒真相。"
 forceofwill.5140.b: "立即通知[selected_leader_in_training.GetHimHer]。"

 forceofwill.5200.name: "不和的学生"
 forceofwill.5200.desc: "[golden_academy_planet.GetName]上§H$building_golden_academy$§!的两名学生之间，爆发了一场世仇。在§H[feuding_leader_1.GetName]§!与§H[feuding_leader_2.GetName]§!显出友谊萌芽的迹象之后，我们的教师散布了一系列谣言，使两人之间的争吵愈演愈烈；他们最近的一次冲突，导致双方都需接受轻微的医疗救治。\n\n有趣的是，自从争吵开始以来，两名学生对强制性自卫课的兴趣都有所提高。隔离他们并不可行，但我们可以尝试调解、促成和解，从而结束这项实验。"
 forceofwill.5200.a: "他们在学着坚持自我。很好。"
 forceofwill.5200.b: "逼两人和解。"

 forceofwill.5205.name: "初萌的恋情"
 forceofwill.5205.desc: "据报道，我们§H$building_golden_academy$§!的两名学生产生了恋情，这违反了本学院的规定。§H[lover_leader_1.GetName]§!与§H[lover_leader_2.GetName]§!曾被分配一系列搭档作业，以促进他们萌芽中的恋情；监控录像与同伴的证词，均证实了这一关系的发展。\n\n因此，两名学生最近的记录都显示：独立学习时间的产出低下，课外活动的参与度也有所减少。随着调查结果尘埃落定，我们的教育工作者必须决定，是否允许这段秘密的恋爱关系继续下去。"
 forceofwill.5205.a: "立即中断两人的关系。"
 forceofwill.5205.b: "由它去吧。"

 forceofwill.5210.name: "战争游戏"
 forceofwill.5210.desc: "我们§H$building_golden_academy$§!的学生最近参加了战争模拟演习，与来自不同专业的同学协作；演习的主要目的，是检验面对星际威胁时的跨学科协调能力。\n\n演习期间，§H[wargames_leader_1.GetName]§!违背多数队友的意见，单方面决定攻击模拟对手。尽管最终结果成功，但[wargames_leader_1.GetHisHer]的队友认为，这种行为背离了演习的精神。\n\n正如我们所预料的，他们的分歧在学生群体中引发了激烈辩论；如今，是我们表明立场的时候了。"
 forceofwill.5210.a: "[wargames_leader_1.GetName]没错，结果才重要。"
 forceofwill.5210.b: "[wargames_leader_1.GetName]错了，协作才是根本。"

 forceofwill.5215.name: "秘密手足"
 forceofwill.5215.desc: "我们最有前途的两名学生，是一对无父无母的手足；他们很小便加入学院，却从未被告知彼此的亲缘关系。如今他们长大了，§H[sibling_leader_1.GetName]§!与§H[sibling_leader_2.GetName]§!开始对自己的身世产生怀疑。\n\n我们的导师将此视为一场考验：两人对真相、以及对彼此的反应，或许能让我们了解到比多年常规评估更多的东西。一些导师主张，现在就由我们进行可控的披露，以免真相对外泄露，致使我们无法继续观察与衡量。"
 forceofwill.5215.a: "告诉他们真相。"
 forceofwill.5215.b: "保守秘密。"

 forceofwill.5220.name: "奖项之争"
 forceofwill.5220.desc: "我们在[golden_academy_planet.GetName]上的§H$building_golden_academy$§!学生，参加了一场比赛；比赛测试他们的学术、体能以及解决问题的各项能力，而我们教员的目标，是观察参赛者在竞争压力下的情绪反应。\n\n比赛结果在§H[competing_leader_1.GetName]§!与§H[competing_leader_2.GetName]§!之间持平——这两位都是极具竞争心与野心的学生。我们如今必须决定，是否让他们在一场决胜局试验中一决高下。"
 forceofwill.5220.a: "让两人共享奖项。"
 forceofwill.5220.b: "办一场[competing_leader_1.GetName]稳赢的试炼。"
 forceofwill.5220.c: "办一场[competing_leader_2.GetName]稳赢的试炼。"

 forceofwill.5225.name: "网络恶作剧"
 forceofwill.5225.desc: "我们在[golden_academy_planet.GetName]上的§H$building_golden_academy$§!遭遇了一场短暂却彻底的网络攻击。在工作人员干预——或者说看似干预——之前，实验室设备、太空飞行模拟器以及另外十几个系统都受到了影响。\n\n罪魁祸首很容易确认：§H[hacker_leader_1.GetName]§!有不良行为记录，而§H[hacker_leader_2.GetName]§!具备所需的技能。系统记录了几次自动警报，但每一条都被悄悄搁置了。\n\n对我们的教育者而言，测试意图很明确：面对违纪行为与惩罚威胁，这两名学生会互相背叛吗？"
 forceofwill.5225.a: "看谁先撑不住。"
 forceofwill.5225.b: "就当没看见。"

 forceofwill.5300.name: "表现不均"
 forceofwill.5300.desc: "尽管我们努力维持统一的教育标准，§H$building_golden_academy$§!的学生之中仍出现了成绩的两极分化：多数学生达到预期目标，但也有少数极端情形——既有长期表现不佳者，也有出类拔萃的人才。\n\n学院的一些教育者对这种差距深感忧虑，认为现行“向所有学生提供相同支持”的政策已不再适用；另一些人则更关注于鼓励那些表现最出色的学生，视之为我们社会冉冉升起的新星。"
 forceofwill.5300.a: "拔优助尖。"
 forceofwill.5300.tenet_tt: "此选择将增加未来的意识形态选项。"
 forceofwill.5300.b: "帮扶后进学员。"
 forceofwill.5300.c: "维持平等待遇。"

 forceofwill.5305.name: "转学生"
 forceofwill.5305.desc: "年幼时，§H[prodigy_leader.GetName]§!曾是申请入读我们的§H$building_golden_academy$§!的候选人之一，却最终未被选中。自那以后，[prodigy_leader.GetHeShe]在常规教育中展现出非凡的进步，成就远超[prodigy_leader.GetHisHer]的同龄人；我们如今认为，[prodigy_leader.GetHeShe]已显露出成为未来领袖的充分潜力。\n\n然而众所周知，[prodigy_leader.GetHeShe]性格古怪——时常与导师争吵、扰乱课堂秩序，且不愿与同伴合作。尽管如此，我们$building_golden_academy$的一些教育工作者仍坚信，[prodigy_leader.GetHisHer]的才华过于出众，绝不能被忽视。眼下正有一个机会：录取这名学生，并精心策划让[prodigy_leader.GetHisHer]狠狠摔上一跤，以此给其余人上一课，让他们明白不服从管教的后果。"
 forceofwill.5305.a: "非凡的头脑多半不肯合作。招[prodigy_leader.GetHimHer]入学。"
 forceofwill.5305.a.tt: "毕业时，招募池中将增加第四位具有§H$leader_trait_golden_generation$§! 特性的领袖，其具备：$TABBED_NEW_LINE$- 随机的['concept_leader_class']和['concept_leader_traits', $TRAITS$]$TABBED_NEW_LINE$- ['leader_trait:leader_trait_stubborn']特性"
 forceofwill.5305.b: "拿[prodigy_leader.GetHimHer]杀鸡儆猴。"

 forceofwill.5310.name: "公众不满"
 forceofwill.5310.desc: "部分[this.GetSpeciesAdj]民众已开始公开批评§H$building_golden_academy$§!项目：涉密信息以谣言的形式流传开来，我们教育者的实验性教学方法，如今被斥为“对年轻心灵的残忍操纵”。\n\n我们的顾问建议，可以通过举办开放日来重建信任，让媒体与公众人物亲眼见证我们未来的领导者出色的成长历程——当然，那些争议较大的技术不会公开展示。"
 forceofwill.5310.a: "在学院办一场公众开放日。"
 forceofwill.5310.b: "不必理会这些反对者。"

 forceofwill.5315.name: "生育负担"
 forceofwill.5315.desc: "我们§H$building_golden_academy$§!的教师，对繁衍行为给年轻学生带来的分心隐患深感忧虑。一些学生已经表达了日后抚养后代的愿望。\n\n对繁衍的好奇，不仅可能在教育期间分散他们的注意力，也会给他们未来的职业生涯带来忠诚上的冲突。我们之中有人提议建立积分制度，强制表现较差者保持贞洁；另一些人则主张，对所有学院学生实施彻底的绝育。"
 forceofwill.5315.a: "对差生强制禁欲。"
 forceofwill.5315.b: "全体$building_golden_academy$学生一律绝育。"

 forceofwill.5400.name: "$origin_golden_generation$毕业生"
 forceofwill.5400.desc: "经过十多年的招生，第一代§H$building_golden_academy$§!学生完成了他们的专业领导力培训。在[golden_academy_planet.GetName]上举行了盛大的毕业典礼，[this.GetName]各地的高级领导人悉数出席。\n\n[this.GetRulerTitle][this.GetRulerName]发表演讲，强调了这一“$origin_golden_generation$”将在我们星际未来中扮演的历史性角色。\n\n这些毕业生中最优秀者，如今已准备好被招募到关键领导岗位；其余的人，也将在社会的精英角色中做出可贵的贡献。$building_golden_academy$计划的支持者与反对者，都将以最严苛的目光审视他们的职业生涯。"
 forceofwill.5400.a: "真正的考验还在后头。"
 forceofwill.5400.a.tt: "所有$origin_golden_generation$领袖均可被招募，拥有['concept_leader_trait_golden_generation']特质。"

 forceofwill.5410.name: "$building_golden_academy$的未来"
 forceofwill.5410.desc: "第一届§H$building_golden_academy$§!学员已经毕业，外界正不断施压，要求重新评估这个昂贵且常具争议的机构的未来。我们的顾问草拟了一系列提案。\n\n他们建议将其保留为领导干部学校，但转向成本更低、更常规的教学方法：儿童将不再与家人分离，教师也将不再使用心理操控技巧，以此安抚当前项目批评者。\n\n此外，$building_golden_academy$也可以转变为一个服务[this.GetAdj]社会文化熏陶的博物馆，或者干脆一劳永逸地关闭。"
 forceofwill.5410.a: "举行闭幕典礼。"
 forceofwill.5410.a.tt: "移除§H$building_golden_academy$§!建筑"
 forceofwill.5410.b: "改革学院。"
 forceofwill.5410.b.tt: "将§H$building_golden_academy$§!建筑替换为['building:building_elite_academy']"
 forceofwill.5410.c: "把校址改建为公共博物馆。"
 forceofwill.5410.c.tt: "将§H$building_golden_academy$§!建筑替换为['building:building_golden_museum']"

 forceofwill.5420.name: "医疗急救"
 forceofwill.5420.desc: "由于一种罕见且未确诊的遗传病症，$building_golden_academy$校友§H[saved_leader.GetName]§!遭受了突发而致命的器官衰竭，几乎丧命。\n\n幸运的是，[saved_leader.GetHisHer]的手足兼同窗校友§H[sibling_leader.GetName]§!并未表现出这种退化性疾病；[sibling_leader.GetName]主动捐献了一个健康的[this.GetSpeciesOrganName]，移植手术顺利完成。总算幸运，[saved_leader.GetName]与[sibling_leader.GetName]都在迅速康复。"

 forceofwill.5426.name: "家族秘密"
 forceofwill.5426.desc: "在$building_golden_academy$校友§H[dead_leader.GetName]§!最近去世之后，[dead_leader.GetHisHer]的前同学§H[alive_leader.GetName]§!终于发现了两人之间的胞亲关系——这一事实，我们自他们婴儿时期起便试图保密。\n\n[alive_leader.GetName]不愿接受我们隐瞒此事的理由，自得知消息以来愈发孤僻，并以公开抨击$building_golden_academy$计划的方式作为回应；[alive_leader.GetHisHerCap]作为[this.GetName]人民公仆的效力绩效，也因此受损。"

 forceofwill.5431.name: "愤怒的校友"
 forceofwill.5431.desc: "§H[from.GetTitle][from.GetName]§!准备了一份文件，意在诋毁同为$building_golden_academy$校友的§H[fromfrom.GetTitle][fromfrom.GetName]§!。该文件严厉谴责[fromfrom.GetName]的职业道德，质疑[fromfrom.GetHisHer]的个人诚信与领导履职能力。\n\n据[from.GetHisHer]同事称，[from.GetName]计划公开分发这份文件。其内容纯属主观，并无任何真正的失当指控，但仍可能造成声誉损害。"
 forceofwill.5431.a: "任[from.GetHimHer]宣泄不满。"
 forceofwill.5431.b: "给[from.GetName]一笔封口费。"

 forceofwill.5436.name: "缅怀[dead_leader.GetName]"
 forceofwill.5436.desc: "§H[dead_leader.GetName]§!最近[dead_leader.GetDeathName]，对整个[this.GetName]造成了情感上的巨大冲击——尤其是对[dead_leader.GetHisHer]的密友兼$building_golden_academy$同学§H[surviving_leader.GetName]§!。\n\n为纪念[surviving_leader.GetHisHer]已故的朋友，[surviving_leader.GetName]设立了以[dead_leader.GetName]命名的奖学金项目，为具有强大领导潜力的贫困学生提供经济援助。"
 forceofwill.5436.a: "这样的致敬合宜而隆重。"

 forceofwill.5441.name: "[surviving_leader.GetName]的悲痛"
 forceofwill.5441.desc: "自从近期§H[dead_leader.GetTitle][dead_leader.GetName]§![dead_leader.GetDeathName]以来，同事们注意到§H[surviving_leader.GetTitle][surviving_leader.GetName]§!发生了明显的改变。众所周知，两人在著名的$building_golden_academy$求学期间曾有过一段短暂的恋情。\n\n[surviving_leader.GetName]变得反常地无精打采，容易分心且情绪偶尔会突然爆发。以往[surviving_leader.GetHeShe]总是为[surviving_leader.GetHisHer]自己的母校感到自豪，如今却在苦涩地抱怨那项将[surviving_leader.GetHimHer]与[dead_leader.GetName]隔离开来的“残忍”政策。"
 forceofwill.5441.a: "令人惋惜，但政策无误。"
 forceofwill.5441.b: "为[surviving_leader.GetHimHer]安排哀伤疏导。"

 forceofwill.5446.name: "黄金婚礼"
 forceofwill.5446.desc: "我们著名的$building_golden_academy$的两名校友，§H[from.GetName]§!与§H[fromfrom.GetName]§!，最近在[this.Capital.GetName]举行了一场奢华的婚礼。多位昔日的同学以及其它知名领袖出席了这场盛会。\n\n这对新人在婚礼前夕引来公众的广泛关注，引发媒体争相报道；他们那段禁忌的校园恋情，以及随着两人地位步步攀升却依然矢志不渝的真爱故事，深深打动了[this.GetAdj]社会。"
 forceofwill.5446.a: "为他们献上祝福。"

 forceofwill.5451.name: "即兴间谍活动"
 forceofwill.5451.desc: "出乎意料的是，§H[from.GetName]§!与§H[fromfrom.GetName]§!向我们的情报部门提供了关于§H[hostile_empire.GetName]§!的机密信息。\n\n[from.GetName]注意到一个可以利用[hostile_empire.GetAdj]安全漏洞的短暂机会。[from.GetHeSheCap]寻求了[fromfrom.GetName]的帮助——一位在$building_golden_academy$的老同学，后者成功在未被察觉的情况下黑入了附近一艘[hostile_empire.GetAdj]无人机的系统。\n\n面对不满的情报官员，[from.GetName]坚持认为这次冒险是一次绝佳的偶发机会，时间窗口过于狭窄，根本来不及请求授权。"
 forceofwill.5451.a: "他们到底在想什么？"
 forceofwill.5451.b: "应当嘉奖他们的主动。"

 forceofwill.5502.name: "常胜将军"
 forceofwill.5502.desc: "§H[victorious_commander.GetName]§!在战斗中展现出无畏而果断的领导力，相关报道在[This.Capital.GetName]上广泛流传，牵动了[This.GetSpeciesAdj]的想象，并推动对§H$building_golden_academy$§!培训计划的正面舆论激增。\n\n媒体机构纷纷报道[victorious_commander.GetName]的生平，以及$building_golden_academy$在[victorious_commander.GetHisHer]成长过程中所起的关键作用。我们的一些顾问建议，借公开仪式纪念这次成功，以借势这股善意。"
 forceofwill.5502.a: "公开表彰[victorious_commander.GetName]的战功。"
 forceofwill.5502.b: "$forceofwill.1100.b$"

 forceofwill.5509.name: "鼓舞人心的科学考察"
 forceofwill.5509.desc: "§H[inspiring_scientist.GetName]§!最近在[expedition_system.GetName]进行科学探险的报道吸引了公众的想象力。[inspiring_scientist.GetHisHerCap]的努力工作凸显了§H$building_golden_academy$§!计划的价值，并激励了新一代研究人员。\n\n在媒体广播中，[inspiring_scientist.GetName]展示了一种独有的能力，能够在科学和工程相关事务上吸引和激发公众。[inspiring_scientist.GetHisHerCap]日益增长的名气对[This.GetName]来说是一大红利。"

 forceofwill.5512.name: "英雄式领导"
 forceofwill.5512.desc: "得益于§H[heroic_governor.GetName]§!的英勇领导，[invaded_colony.GetName]成功击退了敌人的入侵。\n\n尽管面临重重危险，[heroic_governor.GetFirstName]仍通过一系列安民的公开露面鼓舞了士气，避免了民众陷入恐慌。\n\n这次经历让[invaded_colony.GetName]的居民深受激励，在面对劫后余生的考验时团结一致，目标明确。"

 forceofwill.5517.name: "反对解职"
 forceofwill.5517.desc: "最近§H[dismissed_leader.GetName]§!被解职一事，引发公众的强烈反弹与政府内部的激烈指责。许多人对一位$origin_golden_generation$成员竟遭如此不敬的对待而感到愤怒。\n\n媒体评论对解职决定不乏批评之声，[root.capital_scope.GetName]上已经发生了几起抗议。"
 forceofwill.5517.a: "怒气终会随时间消退。"
 forceofwill.5517.b: "破例重新聘用[dismissed_leader.GetHimHer]。"
 forceofwill.5517.b.tt: "§Y[dismissed_leader.GetTitle][dismissed_leader.GetName]§!被重新聘用为一名领袖。"
 forceofwill.5517.c: "开展公关，平息负面情绪。"

 forceofwill.5522.name: "鼓舞人心的领袖"
 forceofwill.5522.desc: "在[lv10_leader.GetHisHer]最近晋升之后，§H[lv10_leader.GetTitle][lv10_leader.GetName]§!一直在与[this.GetName]的新一代领袖分享[lv10_leader.GetHisHer]令人瞩目的职业生涯心得。\n\n[lv10_leader.GetName]回顾了[lv10_leader.GetHisHer]青年时代在§H$building_golden_academy$§!中学到的核心教诲，以及这些经验如何帮助[lv10_leader.GetHimHer]克服了此后岁月里的重重挑战。听众们深受鼓舞，也更有能力在各自的领袖生涯中迈出下一步。"

 forceofwill.5527.name: "$golden_generation_crisis_leadership$"
 forceofwill.5527.desc: "在最近的军事失利之后，民众对$origin_golden_generation$领袖们能力的不满显著上升。\n\n大量[Root.GetAdj]人口抱怨称，那些本应在星际时代守护未来的领袖，如今难堪重任；知名评论员正带头抨击§H$building_golden_academy$§!当初的承诺，[Root.GetAdj]政府所面临的民众积怨也日益加深。"
 forceofwill.5527.a: "这一切终会随时间过去。"
 forceofwill.5527.b: "失败必有代价。"
 forceofwill.5527.c: "安抚自有其代价。"

 forceofwill.5532.name: "胜利庆典"
 forceofwill.5532.desc: "在最近的军事胜利之后，[Root.Capital.GetName]各地自发兴起了市民庆祝活动。\n\n乐观与积极的情绪正在高涨：我们的人民感到，对领导层的信任得到了回报，而§H$building_golden_academy$§!也兑现了其培养适应星际时代挑战的领袖的承诺。\n\n一些顾问建议借这股良好氛围，由$origin_golden_generation$的成员主持一场官方纪念活动。"
 forceofwill.5532.a: "组织一场官方游行。"
 forceofwill.5532.b: "不必再办庆祝。"

 forceofwill.5537.name: "$golden_generation_dividends$"
 forceofwill.5537.desc: "在§H[happiness_leader.GetName]§!的精心经营下，[happy_colony.GetName]的民众正享受着前所未有的生活满意度。\n\n这种积极氛围为§H$building_golden_academy$§!计划以及培养出[happiness_leader.GetName]的教师们赢得了高度赞誉。[This.GetAdj]民众对领导层的支持与好感达到了前所未有的高度。"

 forceofwill.5542.name: "自我冲突"
 forceofwill.5542.desc: "我们议会的工作，正被两名$origin_golden_generation$成员§H[ego_clasher_1.GetName]§!与§H[ego_clasher_2.GetName]§!之间的琐碎纷争严重拖累：两人不断争吵、扰人清静，甚至蓄意阻碍彼此的工作。\n\n根据§H$building_golden_academy$§!的档案数据，他们无休止的地位之争可追溯至青春期成长岁月；这份未消解的紧张，如今正对[This.GetName]的进展造成负面影响。"
 forceofwill.5542.a: "其地位带来的必然结果。"
 forceofwill.5542.b: "指派调解者解决问题。"
 forceofwill.5542.c: "以丰厚奖金促成合作。"

 forceofwill.5547.name: "内阁和睦"
 forceofwill.5547.desc: "我们内阁中有多位$origin_golden_generation$成员，这正在推动政府产生更大的创新、并提高效率。\n\n§H[harmonious_councilor_1.GetName]§!与§H[harmonious_councilor_2.GetName]§!的优势完美互补：行政错误大幅减少，记录在案的纠纷也比以往任何时候都少；在他们的共同指导下，各级政府工作人员的工作积极性均有所提高。"
 forceofwill.5547.a: "他们的才干惠及我们所有人。"

 forceofwill.5552.name: "人才浪费"
 forceofwill.5552.desc: "一名失意的$origin_golden_generation$成员，开始公开宣泄[wasted_talent.GetHisHer]因多次错失高级领导职位而生出的不满。\n\n尽管多年前便从§H$building_golden_academy$§!毕业，§H[wasted_talent.GetName]§!却从未被授予任何形式的高级职位；[wasted_talent.GetHeSheCap][wasted_talent.GetHasHave]对此日益愤懑，[wasted_talent.GetHisHer]在公开场合的言论也愈发激烈。\n\n这一局面开始激起公众的不满——耗费资源培养出此等水准的领袖，却无用武之地；对[Root.GetName]政府的支持，也因此受到削弱。"
 forceofwill.5552.a: "些许浪费在所难免。"
 forceofwill.5552.b: "招募[wasted_talent.GetName]。"
 forceofwill.5552.b.tt: "§Y[wasted_talent_clone.GetName]§!将作为[wasted_talent_clone.GetAAnLeaderClass]级§H[wasted_talent_clone.GetClass]§!被招募。"
 forceofwill.5552.c: "付一笔钱，让[wasted_talent.GetName]噤声。"
 forceofwill.5552.tt.fail: "§Y[wasted_talent_clone.GetTitle][wasted_talent_clone.GetName]§!必须处于可招募状态"

 forceofwill.5600.name: "领袖的负担"
 forceofwill.5600.desc: "作为$origin_golden_generation$成员，其身份带来的额外压力，对§H[exhausted_leader.GetName]§!而言太过沉重。\n\n背负着我们社会的期望与希望，在如此长的时间里，已成为沉重的代价：[exhausted_leader.GetName]显出严重压力的迹象，[exhausted_leader.GetHeShe]即便对最小的决策也愈发不知所措。"
 forceofwill.5600.a: "短暂休整即可。"
 forceofwill.5600.a.tt: "§Y[exhausted_leader.GetName]§!将休整§Y50§!天。\n归来时，[exhausted_leader.GetHisHer]$MOD_LEADER_SKILL_ADD$将提升§G1§!。"
 forceofwill.5600.b: "这是领导职责的代价。"
 forceofwill.5600.b.tt.commander: "§Y10%§!概率：§H[exhausted_leader.GetName]§!获得以下负面特质之一：$TABBED_NEW_LINE$—['leader_trait:leader_trait_slipshod']$TABBED_NEW_LINE$—['leader_trait:leader_trait_uninspiring']$TABBED_NEW_LINE$—['leader_trait:leader_trait_nervous']"
 forceofwill.5600.b.tt.official: "§Y10%§!概率：§H[exhausted_leader.GetName]§!获得以下负面特质之一：$TABBED_NEW_LINE$—['leader_trait:leader_trait_fallible']$TABBED_NEW_LINE$—['leader_trait:leader_trait_substance_abuser']$TABBED_NEW_LINE$—['leader_trait:leader_trait_arrested_development']"
 forceofwill.5600.b.tt.scientist: "§Y10%§!概率：§H[exhausted_leader.GetName]§!获得以下负面特质之一：$TABBED_NEW_LINE$—['leader_trait:leader_trait_paranoid']$TABBED_NEW_LINE$—['leader_trait:leader_trait_neurotic']$TABBED_NEW_LINE$—['leader_trait:leader_trait_narrow_minded']"
 forceofwill.5600.c: "寄去一份关怀礼包。"

 forceofwill.5605.name: "刺杀未遂"
 forceofwill.5605.desc: "一场针对§H[victim_leader.GetName]§!的暗杀阴谋，已被我们的安全部门挫败。\n\n行凶未遂者，是[victim_leader.GetName]在[victim_leader.GetHisHer]就读§H$building_golden_academy$§!时结识的旧同窗。在语无伦次的供词中，策划者提到自己因考试不及格而被开除，以及此后对学院产生的怨恨。\n\n我们的顾问对于是否公开此事，意见不一。"
 forceofwill.5605.a: "公开审判，以儆效尤。"
 forceofwill.5605.b: "闭门处理。"

 forceofwill.5610.name: "代价高昂的失误"
 forceofwill.5610.desc: "§H[incompetent_leader.GetName]§!近年来被发现在[incompetent_leader.GetHisHer]的工作中犯下一系列代价高昂的错误；这些错误最初因蓄意隐瞒而未被发现。\n\n如今，这一掩盖行径已为部分媒体发现；若不恰当处理，或将对$origin_golden_generation$造成严重的声誉损害。"
 forceofwill.5610.a: "公开道歉并停职。"
 forceofwill.5610.a.tt: "§Y[incompetent_leader.GetName]§!将被停职§Y100§!天。"
 forceofwill.5610.b: "买通媒体，压下消息。"
 forceofwill.5610.c: "让事态顺其自然。"

 forceofwill.5615.name: "请求特权"
 forceofwill.5615.desc: "$origin_golden_generation$的成员正在要求特殊权利与特许权限，理由是他们对于§H[this.GetName]§!的未来负有最重大的责任。\n\n他们辩称，这些福利将提高他们的表现，最终惠及所有[this.GetSpeciesNamePlural]。"
 forceofwill.5615.a: "准其所请。"
 forceofwill.5615.b: "驳回所求。"

 forceofwill.5620.name: "首席教员逝世"
 forceofwill.5620.desc: "§H$building_golden_academy$§!的前首席教员已自然死亡；人们通常认为，正是其开创了学院独特而非传统的教育方法。\n\n此人的逝世仪式在[selected_planet.GetName]举行，$origin_golden_generation$的诸位领袖与幸存的职员出席了仪式。§H[selected_leader.GetName]§!发表了长篇悼词，并呼吁所有[this.GetSpeciesNamePlural]铭记我们的社会对这位虽备受争议、却具有开创性的教育家所欠下的恩情。"
 forceofwill.5620.a: "将其遗骸撒向群星。"
 forceofwill.5620.b: "奉献一生就是最好的回报。"

 forceofwill.5625.name: "神经矫正"
 forceofwill.5625.desc: "我们的研究人员开发了一种重塑神经通路的实验性医疗程序，可有效移除患者身上有问题的性格特质。由于我们的第一届$building_golden_academy$学生曾接受认知治疗以增强神经可塑性，他们被认为特别适合这种新疗法，是有前途的候选人。\n\n§H[corrected_leader.GetTitle][corrected_leader.GetName]§!已被确定为潜在矫正对象，正是考虑到[corrected_leader.GetHisHer]性格缺陷，这些缺陷长期阻碍[corrected_leader.GetHimHer]作为领袖发挥最佳状态。"
 forceofwill.5625.a: "不必。这些缺陷可以为我所用。"
 forceofwill.5625.b: "为[corrected_leader.GetName]安排常规治疗。"
 forceofwill.5625.c: "为[corrected_leader.GetName]安排强化治疗。"
 forceofwill.5625.d: "为全体$origin_golden_generation$安排强化治疗。"

 forceofwill.5630.name: "[this.GetSpeciesAdj]的克隆"
 forceofwill.5630.desc.common_1: "[capital_scope.GetName]上的研究人员开发出了克隆有机标本的技术。这些“备份”克隆体保留了原体的身体与心理特征，尽管在其他某些方面有所退化；理论上，该技术如今已可用于克隆[this.GetSpeciesAdj]对象。"
 forceofwill.5630.desc_2.auth_ruler: "我们的[ruler.GetRulerTitle]愿意让当局克隆[ruler.GetHisHer]自身——倘若[ruler.GetHisHer]的顾问认为此举明智的话。这样做固然有助于保存我们的领袖，也就是我们§H$building_golden_academy$§!计划最伟大的遗产；但我们之中也有人认为，这未免是对[ruler.GetHisHer]至高人格的亵渎。"
 forceofwill.5630.desc_2.auth_default: "我们的[ruler.GetRulerTitle]一直不愿允许克隆[this.GetSpeciesAdj]，却愿意批准在第一代§H$building_golden_academy$§!毕业生中的单个个体身上进行试点实验。$forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.corp: "我们的股东一直不愿克隆这种[this.GetSpeciesAdj]，却愿意批准从第一代§H$building_golden_academy$§!毕业生中挑选单个个体做一次试点实验。$forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.default: "我们的立法者一直不愿允许克隆[this.GetSpeciesAdj]，却愿意批准在第一代§H$building_golden_academy$§!毕业生中的单个个体身上做一次试点实验。$forceofwill.5630.desc_2.common$"
 forceofwill.5630.desc_2.common: "公众认为，保存这样一位领导人所带来的社会效益，超过了伦理方面的考量。"
 forceofwill.5630.a.auth: "建议[ruler.GetName]反对这一程序。"
 forceofwill.5630.a.default: "不。资源另有他用。"
 forceofwill.5630.b: "克隆[golden_leader_1.GetName]。"
 forceofwill.5630.c: "克隆[golden_leader_2.GetName]。"
 forceofwill.5630.d: "克隆[golden_leader_3.GetName]。"
 forceofwill.5630.e: "克隆[golden_leader_4.GetName]。"
 forceofwill.5630.f: "克隆[ruler.GetRulerTitle]。"

 forceofwill.5635.name: "年迈的领袖"
 forceofwill.5635.desc: "我们的$origin_golden_generation$领袖们在公开场合开始显出衰老的迹象，这引发了[this.GetSpeciesAdj]民众日益增长的担忧：一旦他们不再引领我们，§H[this.GetName]§!是否还能长久维持。\n\n因此，§H[selected_leader.GetName]§!自愿接受一项实验性的抗衰老计划，以期延长[selected_leader.GetHisHer]的公共服务生涯。这项提议结合了新陈代谢逆转治疗、细胞再生与衰老细胞清除药物，预计将显著延长[selected_leader.GetHisHer]的寿命。"
 forceofwill.5635.a: "为[selected_leader.GetName]安排治疗。"
 forceofwill.5635.b: "为全体$origin_golden_generation$领袖安排治疗。"
 forceofwill.5635.c: "他们终有一死，须得接受。"

 forceofwill.5700.name: "[GetIdeologicalAdjCap]机遇"
 forceofwill.5700.desc.default: "自他们从$building_golden_academy$毕业以来，以§H“$origin_golden_generation$”§!为首的领导层的行为举止，便一直占据着我们的文化议题。\n\n在关于“何为卓越领导力”的深刻信念驱使下，一场旨在将核心原则编纂为明确国家意识形态的社会运动应运而生；这一教义体系也将成为$building_golden_academy$项目的永久遗产。"
 forceofwill.5700.desc.default.replace: "这将取代[ideology.GetName]作为我们的指导价值观体系。"
 forceofwill.5700.desc.spirit: "高阶[GetPriestPlural]已将领袖中的“§H$origin_golden_generation$”§!视为我们神圣价值的活化身。\n\n在我们关于何为有效精神领导力的最深信念启迪之下，出现了一场将这些教义尊为国教的社会运动；这一神学基础，将成为$building_golden_academy$计划不朽的遗产。"
 forceofwill.5700.desc.spirit.replace: "这将取代[ideology.GetName]作为我们的指导信仰体系。"
 forceofwill.5700.a: "编撰并采纳“$ideology_golden_generation$”。"
 forceofwill.5700.a.tt: "这一新[Root.GetSpecificIdeologyType]提供独特的§Y$TENET$§!选项[GetFoW5700TooltipExtra]。"
 forceofwill.5700.a.tt.extra: "，并以与§Y[ideology.GetName]§!相同的§Y$IDEOLOGY_STRENGTH$§!起步" # Opening space is intentional
 forceofwill.5700.b.default: "此类争议不应由国家来定调。"
 forceofwill.5700.b.autho: "现行政策已然够用。"
 forceofwill.5700.b.spirit: "既有信仰无须再辨。"

 forceofwill.5710.name: "黄金遗产"
 forceofwill.5710.desc: "随着时间推移，我们最初一代§H$origin_golden_generation$§!领袖的记忆，正从公众意识中渐渐淡出。\n\n我们必须决定如何——或者是否——向未来世代的[this.GetSpeciesNamePlural]讲述我们社会历史中这一开创性的章节。\n\n他们应当如何被铭记？"
 forceofwill.5710.a: "尊崇他们为英雄。"
 forceofwill.5710.b: "他们犯过错。我们必须记取教训。"
 forceofwill.5710.c: "让记忆淡去。我们必须望向未来。"

 forceofwill.5800.name: "$building_golden_academy$失陷"
 forceofwill.5800.desc: "我们失去了§H[from.GetName]§!，$building_golden_academy$的培训计划因此陷入一片混乱。\n\n我们的撤离行动未能成功，学院的大多数教职员工与学员都被困在了这颗星球上；他们目前生死未卜。\n\n$building_golden_academy$所代表的巨大潜力已然烟消云散，连同它原本可能培养出的未来“$origin_golden_generation$”领袖的全部希望，也一并幻灭。\n\n[this.GetSpeciesNamePlural]正团结一致，在这艰难的时刻彼此扶持。"
 forceofwill.5800.a: "我们的努力付诸东流。"

 forceofwill.5810.name: "$building_golden_academy$毁灭"
 forceofwill.5810.desc: "§H[this.GetName]§!上的$building_golden_academy$已被摧毁，许多教职员工与学员在袭击中丧生。\n\n我们旗舰级的领袖培训计划已化为废墟，所有的努力付诸东流；[Owner.GetSpeciesNamePlural]正于这个艰难时刻相互扶持。"
 forceofwill.5810.a: "噩耗。"

 forceofwill.6005.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_1$"
 forceofwill.6005.desc: "我们的通讯基础设施已开始向邻近星国传播广泛的媒体内容，以展示§H[Ideology.GetName]§!的指导原则。\n\n这些材料已按当地语言与文化敏感性加以适配，旨在培育对[Root.GetName]所立足的[Ideology.GetEthicLower]理想的认知。"
 forceofwill.6005.a: "植入的理念，能传得比任何舰队都远。"

 forceofwill.6010.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_2$"
 forceofwill.6010.desc.outro: "如今已在邻近星国全面铺开，直接与当地民众互动，挑战那些阻碍他们接受§H[Ideology.GetName]§!的信念与假设。\n\n通过公共话语、信息外联与文化交流，我们正为一场更广泛的意识形态觉醒奠定基础。"
 forceofwill.6010.desc.default: "我们的教育运动$forceofwill.6010.desc.outro$"
 forceofwill.6010.desc.spiritualist: "我们的传教工作$forceofwill.6010.desc.outro$"
 forceofwill.6010.a: "他们须弃绝祖宗之道。"

 forceofwill.6015.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_3$"
 forceofwill.6015.desc: "§H[Ideology.GetName]§!原则的教化，仍在邻近星国之间传播；新皈依的人口，开始将其价值应用于公共与私人生活的方方面面。\n\n以我们为榜样，他们正在重新审视那些长久以来关于家庭、人际关系、公民义务乃至死亡本身的固有观念。\n\n他们日渐领悟到：[Ideology.GetName]的智慧，可以适用于存在的所有层面。"
 forceofwill.6015.a.default: "他们的进步本身就是回报。"
 forceofwill.6015.a.spiritualist: "信徒自会引路。"

 forceofwill.6020.name: "$FORCE_OF_WILL_SPECIAL_PROJECT_4$"
 forceofwill.6020.desc.intro: "我们现阶段的工作，瞄准那些对[Ideology.GetEthicLower]价值仍最抗拒的社会群体。"
 forceofwill.6020.desc.outro: "只要心灵仍未受到我们理想的触动，便称不上完整。"
 forceofwill.6020.desc.default: "$forceofwill.6020.desc.intro$\n\n他们的再教育需要极大的耐心和毅力，然而我们星系大家庭——$forceofwill.6020.desc.outro$"
 forceofwill.6020.desc.spiritualist: "$forceofwill.6020.desc.intro$\n\n他们的皈依需要极大的耐心和毅力，然而我们星系集体——$forceofwill.6020.desc.outro$"
 forceofwill.6020.a: "最艰难的课程带来最伟大的学识。"

 forceofwill.6025.name: "[GetFoW6025Name]"
 forceofwill.6025.name.default: "星海乌托邦将至"
 forceofwill.6025.name.spiritualist: "星海救赎将至"
 forceofwill.6025.desc.common: "只有零星的怀疑，仍在愚昧中潜伏。我们决不能放弃他们，也不能回避开启他们心灵、使其接受我们教义的任务。"
 forceofwill.6025.desc.default: "遍及整个星系，无数心灵如今已认识到§H[Ideology.GetName]§!的必要真理；无论出身或信条，各星国的公民都在对[Ideology.GetEthicLower]价值的坚定承诺中团结一致。\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.desc.spiritualist: "遍及整个星系，无数心灵在对§H[Ideology.GetName]§!的虔诚中团结一致；无论出身或信条，各星国的信徒聚在一处，共同尊崇维系我们信仰的神圣仪式。我们启迪那些不如我们幸运之人的职责，已近完成。\n\n$forceofwill.6025.desc.common$"
 forceofwill.6025.a: "星系已准备就绪。"

 forceofwill.6030.name: "$force_of_will_chain_title$"
 forceofwill.6030.desc.default: "$force_of_will_chain_desc_default$"
 forceofwill.6030.desc.spiritualist: "$force_of_will_chain_desc_spiritualist$"
 forceofwill.6030.a.default: "我们绝不能失败。"
 forceofwill.6030.a.spiritualist: "我们的信念将指引我们。"

 forceofwill.6035.name: "日益增长的共识"
 forceofwill.6035.desc.intro: "我们的努力已结出果实：遍及整个星系，对我们原则的熟悉程度持续增长，尽管真正的对齐仍需耐心。\n\n目前，许多人仍固守着塑造其社会已久的价值，仍然"
 forceofwill.6035.desc.outro: "唯有先摒弃这些误入歧途的信念，我们邻近的星国才能全然领受那些根本原则，获得升华。"
 forceofwill.6035.desc.materialist: "$forceofwill.6035.desc.intro$不愿正视其信仰的非理性根基。\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.xenophile: "$forceofwill.6035.desc.intro$对于审视自身偏见仍然犹豫不决。\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.pacifist: "$forceofwill.6035.desc.intro$误以为力量源于军国主义。\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.egalitarian: "$forceofwill.6035.desc.intro$受制于控制和压迫体系。\n\n$forceofwill.6035.desc.outro$"
 forceofwill.6035.desc.spiritualist: "我们的努力已结出果实：遍及整个星系，对我们教导的熟悉程度持续增长，尽管真正的皈依仍需耐心。\n\n目前，许多人仍固守着塑造其社会已久的价值，仍然对任何实验室都无法分离的真理视而不见。\n\n这些误入歧途的信念必须首先被抛弃，我们的邻近星国才能真正拥抱那将拯救他们的神圣信息。"
 forceofwill.6035.a.default: "我们必须加倍用功。"
 forceofwill.6035.a.spiritualist: "我们将为他们指明道路。"

 forceofwill.6040.name: "崛起的运动"
 forceofwill.6040.desc.intro.default: "日复一日，我们的教育运动以§H[Ideology.GetName]§!的指导原则，启发了整个星系的无数心灵；在邻近星国之中，越来越多的社会正采纳[Root.GetName]内盛行的价值与习俗。"
 forceofwill.6040.desc.intro.spiritualist: "日复一日，我们的传教工作让星系中无数心灵向我们的神圣讯息敞开；在邻近的星际国度中，§H[Ideology.GetName]§!的仪轨与教义已开始扎根。"
 forceofwill.6040.desc.common: "然而，这种新生的信念脆弱而易于动摇。我们必须教会他人，把这些理想锚定在其世界观的核心，使其能在所有时刻指导思想与行动。"
 forceofwill.6040.desc.materialist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\n理性必须战胜迷信。"
 forceofwill.6040.desc.xenophile: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\n宽容必须战胜恐惧。"
 forceofwill.6040.desc.pacifist: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\n和平不惜任何代价都必须被维护。"
 forceofwill.6040.desc.egalitarian: "$forceofwill.6040.desc.intro.default$\n\n$forceofwill.6040.desc.common$\n\n平等必须凌驾于暴政之上。"
 forceofwill.6040.desc.spiritualist: "$forceofwill.6040.desc.intro.spiritualist$\n\n$forceofwill.6040.desc.common$\n\n虔诚的存在不是一种稍纵即逝的便利，而是我们理解自身在宇宙中位置的根本真理。"
 forceofwill.6040.a.default: "他们的忠诚必须是绝对的。"
 forceofwill.6040.a.spiritualist: "他们必须成为真正的信徒。"

 forceofwill.6045.name: "星海天命"
 forceofwill.6045.desc.default: "受我们的榜样启发，星国同胞们开始认识到§H[Ideology.GetName]§!的根本真理，并将这些价值融入日常生活。\n\n然而，我们的工作仍未完成：遍及整个星系，仍有无数文明处于我们影响范围之外。"
 forceofwill.6045.desc.spiritualist: "随着越来越多人接纳§H[Ideology.GetName]§!，许多曾对神圣祝福一无所知的人，如今已然觉醒，其思想抵达了全新的高度。通过我们的指引，他们有生以来第一次理解了真正的目的，以及自己在星系中的位置。\n\n然而，我们的神圣职责仍待完成。我们必须继续这项工作，因为还有无数灵魂尚未听到我们的信息。"
 forceofwill.6045.a.default: "星海乌托邦已近在眼前。"
 forceofwill.6045.a.spiritualist: "现在我们决不能动摇。"

 forceofwill.6070.name: "[GetFoW6070Name]"
 forceofwill.6070.name.single_fe: "激怒$concept_fallen_empire$"
 forceofwill.6070.name.multiple_fe: "激怒$concept_fallen_empires$"
 forceofwill.6070.desc: "§H[Ideology.GetName]§!在星系中的成功传播，引来了[GetFoW6070FallenEmpireDesc]的敌对回应；受我们[Ideology.GetIdeologyType]日益增长的影响力所威胁，它们向[Ideology.GetName]的所有追随者宣战。"
 forceofwill.6070.fallen_empire_name: "一个§H$concept_fallen_empire$§!"
 forceofwill.6070.fallen_empire_name_plural: "星系中的§H$concept_fallen_empires$§!"
 forceofwill.6070.a.default: "星海乌托邦正陷存亡之危。"
 forceofwill.6070.a.spiritualist: "星海存亡，悬于一线。"
 forceofwill.6070.tooltip: "击败§H[GetFoW6070FallenEmpire]§!已加入你的野望胜利条件"

 forceofwill.6071.a.no_ascension_perk: "我们这是惹上了什么麻烦？"

 forceofwill.6090.name: "[GetFoW6090Name]"
 forceofwill.6090.name.default: "星海乌托邦"
 forceofwill.6090.name.spiritualist: "星海救赎"
 forceofwill.6090.desc: "确保我们[GetIdeologyType]的核心价值观几乎在全星系得到普遍尊奉。"
 forceofwill.6090.desc.pretext: "[Ideology.GetName]的压倒性影响力，如今已无可争议。\n\n"
 forceofwill.6090.desc.default: "$forceofwill.6090.desc.pretext$我们亲手缔造了星海乌托邦，$forceofwill.6090.desc$"
 forceofwill.6090.desc.spiritualist: "$forceofwill.6090.desc.pretext$我们完成了对无数心灵的救赎与启迪，$forceofwill.6090.desc$"
 forceofwill.6090.a.default: "[Ideology.GetFoWIdeal]的恩泽由众人共享。"
 forceofwill.6090.a.spiritualist: "我们已为他们指明了道路。"
 forceofwill.6090.a.win_tt: "§G[Ideology.GetName]赢得了游戏胜利。§!"

 forceofwill.6091.desc: "$forceofwill.6090.desc.pretext$在§H[Ideology.Owner.GetName]§!的引领下，我们亦尽了自己的一份力，$forceofwill.6090.desc$"

 forceofwill.6095.name: "[From.Ideology.GetIdeologicalAdjCap]霸权"
 forceofwill.6095.desc: "§H[From.GetName]§!及其[From.Ideology.GetName]信条所掌控的压倒性影响力，如今已无可置疑。在整个邻近星国，他们的价值都已深植，其彻底程度令人不安。\n\n纵有万般不愿，我们仍须承认：星系的未来将按照他们的愿景来塑造。"
 forceofwill.6095.a: "坏消息。"
 forceofwill.6095.a.tt: "§H[From.Ideology.GetName]§!赢得了游戏胜利。"

 forceofwill.6096.name: "无可置疑的权威"
 forceofwill.6096.desc: "面对§H[From.GetName]§!及其[From.Ideology.GetName]信条所掌控的压倒性影响力，我们在星系中传播[Ideology.GetName]教义的努力已然受挫。在整个邻近星国，他们的价值扎根太深，我们的信息已无力抗衡。\n\n纵有万般不愿，我们必须放弃按照自己的愿景引导星系未来的希望。"
 forceofwill.6096.a: "那个梦想将永远无法实现。"
 forceofwill.6096.a.tt: "§H[From.Ideology.GetName]§!赢得了游戏胜利。"

 forceofwill.6100.name: "$forceofwill.7100.name.gestalt$"
 forceofwill.6100.desc: "我们的[owner.GetOperativesLowerPlural]已完成对[target.GetName]最大舰队高级军官的深入心理画像，找出了最可能接受[owner.ideology.GetName]理念的人。\n\n我们相信，把这一领导群体策反至我们的事业，足以促成该舰队叛逃至[owner.GetName]。\n\n我们的情报特工正在设计个性化的信息攻势，向他们灌输我们[owner.GetSpecificIdeologyType]的核心真理。"

 forceofwill.6105.name: "通讯启动"
 forceofwill.6105.desc: "我们的[owner.GetOperativesLowerPlural]已开始通过直接与间接通讯，向[target.GetAdj]舰队军官介绍[owner.ideology.GetName]的各项原则。\n\n初步报告令人鼓舞：目标对象对[owner.ideology.GetEthicLower]理念表现出开放态度，也愿意接纳新的视角与思维方式。"
 forceofwill.6105.a: "很好。继续行动。"

 forceofwill.6110.name: "$operation.6310.name$"
 forceofwill.6110.desc.start: "经过持续的目标信息攻势，[target.GetName]最大舰队的多名高级军官如今已深度皈依[owner.ideology.GetName]。他们强烈认同我们的使命，即"
 forceofwill.6110.desc.end: "，并准备叛逃至[owner.GetName]以推进其进程。\n\n他们正等待我们的信号，届时将撕下伪装并采取果断行动。"
 forceofwill.6110.desc.spiritualist: "$forceofwill.6110.desc.start$为星系带来灵性启迪$forceofwill.6110.desc.end$"
 forceofwill.6110.desc.default: "$forceofwill.6110.desc.start$培育一个星海乌托邦$forceofwill.6110.desc.end$"

 forceofwill.6115.name: "$operation.6015.name$"
 forceofwill.6115.desc.common: "[fromfrom.GetName]麾下最大的舰队已准备正式叛逃，并将航向设为[Root.Capital.GetName]。\n\n他们正等待我们的指示，以决定如何最好地"
 forceofwill.6115.desc.spiritualist: "$forceofwill.6115.desc.common$通过[ideology.GetName]的神圣真理为星系带来灵性启迪。"
 forceofwill.6115.desc.default: "$forceofwill.6115.desc.common$在[ideology.GetName]的旗帜下培育一个星海乌托邦。"
 forceofwill.6115.a: "他们将为我们的使命助力。"
 forceofwill.6115.a.tt: "§Y[fromfrom.GetName]§!最大的军事舰队加入§Y[owner.GetName]§!，并移动至[root.capital_scope.GetName]恒星系。"
 forceofwill.6115.a.fail: "§Y[fromfrom.GetName]§!必须拥有可供皈依的军事舰队"
 forceofwill.6115.b: "不再需要他们的效劳了。"

 forceofwill.6120.name: "宏图野心"
 forceofwill.6120.desc: "虽然邻近星国如今视我们为[FromFrom.GetName]的最高权威，我们也应警惕他人的野心。\n\n§H[From.GetName]§!怀有将这个强大的[FromFrom.GetIdeologyType]传播到整个星系的意图；他们的行动，必须予以密切关注。"
 forceofwill.6120.a: "我们必须保持警惕。"

 forceofwill.6125.name: "意志不破"
 forceofwill.6125.desc.intro: "尽管§H[From.GetName]§!如今超越我们、成为[FromFrom.GetName]的最高权威，我们将[FromFrom.GetIdeologyType]传播到星际的决心毫不动摇。\n\n"
 forceofwill.6125.desc.default: "$forceofwill.6125.desc.intro$我们对星系乌托邦的愿景仍触手可及；我们必须将使命坚持到底。"
 forceofwill.6125.desc.spiritualist: "$forceofwill.6125.desc.intro$我们将神圣信息传播到星空的使命一如既往地强大；我们必须坚定不移。"
 forceofwill.6125.a: "我们的意志坚不可摧。"

 forceofwill.6140.name: "不可动摇的信念"
 forceofwill.6140.desc.start: "我们新生的野望——让§H[Ideology.GetName]§!传遍整个星系——并未逃过侵略者的注意。\n\n如今他们确信，我们"
 forceofwill.6140.desc.end: "他们中止了那场考虑不周、意在使我们接受其思维方式的战争。"
 forceofwill.6140.desc.spiritualist: "$forceofwill.6140.desc.start$对自身信仰的虔诚不可动摇，因而$forceofwill.6140.desc.end$"
 forceofwill.6140.desc: "$forceofwill.6140.desc.start$对自身理念的信念不可动摇，因而$forceofwill.6140.desc.end$"
 forceofwill.6140.a: "我们不会动摇。"
 forceofwill.6140.a.tt: "§H[From.GetName]§!不再是任何§Y$NAME_IDEOLOGICAL_WAR_PLURAL$§!的目标。"

 forceofwill.6145.name: "$NAME_IDEOLOGICAL_WAR$战役终止"
 forceofwill.6145.desc.start: "§H[From.GetName]§!愈发坚定的"
 forceofwill.6145.desc.end: "他们对[From.GetSpecificIdeologyType]的坚守，最终让我们得出结论：我们的军事行动已不可能成功地使他们转变为§H[Ideology.GetName]§!。\n\n我们必须考虑其他方法，说服他们接受我们的价值观与思维方式。"
 forceofwill.6145.desc.spiritualist: "$forceofwill.6145.desc.start$对自身信仰的虔诚，以及$forceofwill.6145.desc.end$"
 forceofwill.6145.desc: "$forceofwill.6145.desc.start$对自身理念的信念，以及$forceofwill.6145.desc.end$"

 forceofwill.7020.name: "在轨的$cultural_envoy_ship_plural$"
 forceofwill.7020.desc.intro: "一艘来自§H[FromFrom.GetName]§!的外国飞船，进入了我方§H[From.GetName]§!殖民地轨道，并开始了一场针对当地民众的协同公开宣传；初步报告显示，其散布的媒体与文化节目意在宣扬[FromFrom.GetName]的价值观与社会理想。"
 forceofwill.7020.desc.common: "尽管接触这些外国观点似乎在部分民众中产生了一些有利影响，但我们必须"
 forceofwill.7020.desc.same: "$forceofwill.7020.desc.common$继续密切监视局势，因为这场意识形态交流的长期后果仍不明朗。"
 forceofwill.7020.desc.different: "$forceofwill.7020.desc.common$决不能放任这种危险的[FromFrom.Ideology.GetEthicLower]思想不受控制地传播。"
 forceofwill.7020.a: "我们必须保持警惕。"

 forceofwill.7021.name: "未知的[FromFrom.Ideology.GetIdeologicalAdjCap]影响"
 forceofwill.7021.desc.intro: "§H[From.GetName]§!的人口，正受到一场来自不明来源的[FromFrom.Ideology.GetIdeologicalAdj]宣传攻势的影响；相关媒体与材料显然来自外国，宣扬着与我国迥异的价值观与社会理想。\n\n虽然没有证据表明这些讯息是经由我们自己的通讯网络抵达[From.GetName]的，但我们的传感器也未在[From.GetPlanetMoon]附近探测到任何可能发射这些讯息的实体。"

 forceofwill.7026.name: "[Ideology.GetName]英雄"
 forceofwill.7026.desc.default: "我们的$cultural_envoy$在[FromFromFrom.GetName]轨道上传播我们的信息时，被§H[From.GetName]§!无情摧毁。\n\n这一无端侵略的行径，激怒了§H[Ideology.GetName]§!的所有遵从者；被激起的不屈与决心，将让他们从这场牺牲中汲取持久的力量。"
 forceofwill.7026.desc.revolt: "$forceofwill.7026.desc.default$\n\n[FromFromFrom.GetName]的民众已奋起抗议这一巨大不公。他们如今正为追随[Ideology.GetName]原则的自由而战！"
 forceofwill.7026.a.default: "愿他们的虔诚成为他们的遗产。"
 forceofwill.7026.a.spiritualist: "愿他们的信仰成为他们的遗产。"

 forceofwill.7027.name: "外国煽动者覆灭"
 forceofwill.7027.desc.default: "在§H[From.GetName]§!的特工多次侵犯我国主权领土之后，当局报告称：他们的$cultural_envoy$在[FromFrom.GetName]轨道上执行行动时被摧毁。\n\n这些所谓的特使，一直在我国人口中散播§H[From.Ideology.GetName]§!的论调，煽动动荡、损害我们诸界的稳定；他们的行径，已无法再被容忍。"
 forceofwill.7027.desc.revolt: "$forceofwill.7027.desc.default$\n\n尽管我们竭尽全力维持秩序，[FromFrom.GetName]上的异见分子在皈依这些危险理念后已揭竿起义。"
 forceofwill.7027.a.default: "以此为戒——我们绝不容忍他们的存在。"
 forceofwill.7027.a.nice: "可惜，但必要。"
 forceofwill.7027.a.xenophobe: "异种渣滓。"

 forceofwill.7035.name: "$cultural_envoy$特化"
 forceofwill.7035.desc: "作为我们新研制的$cultural_envoy_ship_plural$上的官方大使，§H[Root.GetName]§!在作为§Y[Root.GetCulturalEnvoySubclass]§!传播[Owner.Ideology.GetName]理念方面，展现出了富有创意的潜力；不过，如果我们愿意，也可以对[Root.GetHimHer]进行重新培训，使其转入更符合我们需求的其他专业方向。"
 forceofwill.7035.a: "[Root.GetHisHerCap]当前的技能已经足够。"
 forceofwill.7035.b: "训练[Root.GetHimHer]成为一名§Y$leader_trait_cultural_envoy_indoctrinator$§!。"
 forceofwill.7035.c: "训练[Root.GetHimHer]成为一名§Y$leader_trait_cultural_envoy_zealot$§!。"
 forceofwill.7035.d: "训练[Root.GetHimHer]成为一名§Y$leader_trait_cultural_envoy_persuasive_luminary$§!。"
 forceofwill.7035.e: "训练[Root.GetHimHer]成为一名§Y$leader_trait_cultural_envoy_negotiator$§!。"

 forceofwill.7055.name: "$cultural_envoy_ship_plural$"
 forceofwill.7055.desc.intro: "借助我们新开发的$cultural_envoy_ship_plural$，我们如今已准备好将[Ideology.GetName]的信息传播到比以往更远的地方。\n\n"
 forceofwill.7055.desc.default: "$forceofwill.7055.desc.intro$这些外交舰船旨在激发心灵、开展教育活动——不受国界或边界的阻碍——去启迪我们选定的任意殖民地。"
 forceofwill.7055.desc.spiritualist: "$forceofwill.7055.desc.intro$这些外交舰船旨在激发心灵、提升灵魂，开展传教事业——不受国界或边界的阻碍——使我们选定的任意殖民地皈依。"
 forceofwill.7055.a.spiritualist: "心灵和思想将向我们的神圣真理敞开。"
 forceofwill.7055.a.pacifist: "心灵和思想将向我们的和平信息敞开。"
 forceofwill.7055.a.xenophile: "心灵和思想将向我们的宽容精神敞开。"
 forceofwill.7055.a.materialist: "心灵和思想将向我们的理性追求敞开。"
 forceofwill.7055.a.egalitarian: "心灵和思想将向我们的平等原则敞开。"
 forceofwill.7055.tooltip: "§Y$cultural_envoy_ship_plural$§!现可在['concept_shipyard']中建造，用于将已殖民恒星系转化至你的意识形态。§Y$cultural_envoy_ship_plural$§!不受帝国边界影响，且独立于['concept_ideological_reach']运作。"

 forceofwill.7100.name: "[GetFoW7100Name]"
 forceofwill.7100.name.default: "渗透通讯"
 forceofwill.7100.name.gestalt: "目标已识别"
 forceofwill.7100.desc.default: "我们的[owner.GetOperativesLowerPlural]已成功渗透到[target.GetName]的一系列通信渠道之中；他们目前正处于[this.GetName]行动的深度研究阶段，密切监控围绕该国名为“§H[target.ideology.GetName]§!”的[target.GetSpecificIdeologyType]所展开的公众讨论。"
 forceofwill.7100.desc.gestalt: "我们的[owner.GetOperativesLowerPlural]在§H[target.GetName]§!内部锁定了一些[target.GetIndividualNamePlural]，认为他们是进行情报收集的潜在目标。\n\n若能诱使这些[target.GetIndividualNamePlural]泄露[target.GetAdj]群体意识的信息，我们就能大大加深对该[target.GetHiveEntity]之于其所采用的、被称为§H[target.ideology.GetName]§!的[target.GetSpecificIdeologyType]的态度的了解。"

 forceofwill.7105.name: "[target.ideology.GetIdeologicalAdjCap]的情报报告"
 forceofwill.7105.desc.intro.default: "我们的[owner.GetOperativesLowerPlural]已完成对[target.GetName]国定[target.GetSpecificIdeologyType]的公共话语分析；汇编的卷宗识别出§H[target.ideology.GetName]§!中若干可被利用、且已成为[target.ideology.GetIdeologicalAdj]紧张来源的有争议方面。"
 forceofwill.7105.desc.intro.gestalt: "我们的[owner.GetOperativesLowerPlural]已从[target.GetName]内部的[target.GetIndividualNamePlural]处获取了关于他们所奉行的[target.GetSpecificIdeologyType]的信息；收集到的卷宗揭示了§H[target.ideology.GetName]§!的若干关键方面，这些方面是[target.GetHiveEntity]内部认知失调的重要来源。"
 forceofwill.7105.desc.outro: "我们的下一个目标，是测试我们的心理战[owner.GetTeamNamePlural]可以通过何种方法加剧这些问题，以播下对[target.ideology.GetIdeologicalAdj]的怀疑。"
 forceofwill.7105.desc.default: "$forceofwill.7105.desc.intro.default$\n\n$forceofwill.7105.desc.outro$"
 forceofwill.7105.desc.gestalt: "$forceofwill.7105.desc.intro.gestalt$\n\n$forceofwill.7105.desc.outro$"

 forceofwill.7110.name: "试运行"
 forceofwill.7110.desc.intro: "为测试其方法，我们的心理战[owner.GetTeamNamePlural]围绕§H[target.ideology.GetName]§!编造了一系列煽风点火的倾向性舆论，并通过[target.GetName]内被攻破的通讯渠道传播；其目标，是在隐藏任何外来参与痕迹的同时，最大化[target.ideology.GetIdeologicalAdj]不信任。\n\n测试结果很成功，并发现围绕"
 forceofwill.7110.desc.outro: "的信息最为有效。\n\n我们如今正在准备一场更广泛的虚假信息运动。我们的[owner.GetOperativesLowerPlural]必须在[target.GetAdj]社会内建立一个更广泛的、同情[target.GetIndividualNamePlural]的网络，以大规模投递这些信息。"
 forceofwill.7110.desc.tenets: "$forceofwill.7110.desc.intro$[target.GetLastTenetName]信条$forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.gestalt: "$forceofwill.7110.desc.intro$反常[target.ideology.GetEthicLower]行为$forceofwill.7110.desc.outro$"
 forceofwill.7110.desc.regular: "$forceofwill.7110.desc.intro$非正统[target.ideology.GetEthicLower]实践$forceofwill.7110.desc.outro$"

 forceofwill.7115.name: "$operation.6310.name$"
 forceofwill.7115.desc.common: "我们的[owner.GetOperativesLowerPlural]已在[target.GetName]内建立了一个隐蔽通讯网络。\n\n这些合作的[target.GetIndividualNamePlural]已准备就绪，将传播我们关于该社会官方[target.GetSpecificIdeologyType]精心制作的信息；这些信息旨在利用[target.ideology.GetIdeologicalAdj]的矛盾，并"
 forceofwill.7115.desc.gestalt: "$forceofwill.7115.desc.common$围绕§H[target.ideology.GetName]§!制造失调感。"
 forceofwill.7115.desc.default: "$forceofwill.7115.desc.common$围绕§H[target.ideology.GetName]§!制造幻灭感。"

 forceofwill.7120.name: "$operation.6015.name$"
 forceofwill.7120.desc.intro: "在很短的时间内，我们的虚假信息运动已对§H[fromfrom.GetName]§!全境产生了深远影响；通过利用[fromfrom.GetAdj]社会中现有的裂痕，我们已开始削弱对§H[fromfrom.ideology.GetName]§!的信心，并侵蚀[fromfrom.ideology.GetIdeologicalAdj]"
 forceofwill.7120.desc.outro: "其影响将持续多年。"
 forceofwill.7120.desc.gestalt: "$forceofwill.7120.desc.intro$[fromfrom.GetAdj][fromfrom.GetHiveEntity]的完整性。\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.desc.default: "$forceofwill.7120.desc.intro$[fromfrom.GetAdj]政权的合法性。\n\n$forceofwill.7120.desc.outro$"
 forceofwill.7120.a: "响亮的成功！"
 forceofwill.7120.a.tt.default: "§Y[fromfrom.GetName]§!获得§H$modifier_sow_ideological_doubt$§!修正：\n$modifier_sow_ideological_doubt_tt$"
 forceofwill.7120.a.tt.gestalt: "§Y[fromfrom.GetName]§!获得§H$modifier_sow_ideological_doubt_gestalt$§!修正：\n$modifier_sow_ideological_doubt_gestalt_tt$"

 forceofwill.7122.name: "行动废止"
 forceofwill.7122.desc: "§H[From.GetName]§!已正式放弃其采用的意识形态。因此，我们针对该国人口对该意识形态框架之遵奉情况的谍报行动，已无必要，现予终止。"
 forceofwill.7122.tooltip: "针对§Y[From.GetName]§!的§Y$operation_sow_ideological_doubt$§!行动已中止。"

 forceofwill.7125.name: "目标已锁定"
 forceofwill.7125.desc: "我们的[Owner.GetOperativesLowerPlural]已在[Target.GetName]内部锁定了一个信息操控目标：一座§H重要数据中心§!，它是其通信网络的关键节点。\n\n要利用该设施的系统，需要一名或多名拥有实地访问权限的[Target.GetAdj][Target.GetIndividualNamePlural]协助；$role_spymaster$[root.spynetwork.leader.GetName]已批准了一份有潜力的目标名单。"

 forceofwill.7130.name: "[Target.GetAdj]内线已就位"
 forceofwill.7130.desc: "我们的[Owner.GetOperativesLowerPlural]成功招募了一名内线，帮助我们取得[target.capital_scope.GetName]上一座§H[Target.GetAdj]关键数据中心§!的访问权限；通过[GetFoW7130Motivation]，我们成功让这名[Target.GetIndividualName]泄露了机密信息，并同意协助日后的行动。"

 forceofwill.7135.name: "$operation.6310.name$"
 forceofwill.7135.desc.common: "在[Target.GetName]一名内线的协助下，我们的[Owner.GetOperativesLowerPlural]已准备好渗透§H[target.capital_scope.GetName]上的一座数据中心§!；他们的任务，是安装设备，让我们得以操控流经[Target.GetAdj]通信网络的信息。\n\n只要$role_spymaster$[root.spynetwork.leader.GetName]一收到"
 forceofwill.7135.desc.default: "$forceofwill.7135.desc.common$正式授权，行动即可开始。"
 forceofwill.7135.desc.gestalt: "$forceofwill.7135.desc.common$[Owner.GetBrainName]的确认，行动即可开始。"

 forceofwill.7140.name: "$operation.6015.name$"
 forceofwill.7140.desc: "尽管障碍重重，渗透[fromfrom.capital_scope.GetName]上一座重要数据中心的任务仍达成了目标。我们的[Root.GetOperativesLowerPlural]所安装的设备，让我们得以操控流经[fromfrom.GetName]的相当一部分信息。\n\n一旦有朝一日此事败露，预案会将一切可能追溯到[Root.GetName]的证据彻底清除；在那之前，我们对我国与[fromfrom.GetAdj]人口之间流通的意识形态信息，拥有前所未有的掌控。"
 forceofwill.7140.tt.target_heading: "§Y[fromfrom.GetName]§!："
 forceofwill.7140.tt.target_reach: "§Y[root.ideology.GetName]§!的$MOD_IDEOLOGICAL_RESISTANCE_MULT$：§R$@information_manipulation_reach_malus|0%$§!"
 forceofwill.7140.tt.target_modifier: "位于§Y[root.ideology.GetName]§!§H场域§!内的所有归属殖民地获得§H$operation_information_manipulation_modifier$§!修正：$TABBED_NEW_LINE$—$operation_information_manipulation_modifier_tt$"
 forceofwill.7140.tt.root: "\n§Y[root.GetName]§!：\n§Y[fromfrom.ideology.GetName]§!的$MOD_IDEOLOGICAL_RESISTANCE_MULT$：§G+$@information_manipulation_reach_bonus|0%$§!"

 forceofwill.7145.name: "紧张局势升温"
 forceofwill.7145.desc: "我们的[owner.GetOperativesLowerPlural]已识别出一系列与§H[target.ideology.GetName]§!相关的分裂性政治议题，可加以利用，在对§H[owner.ideology.GetName]§!抱有好感的人口中助长动荡与不安。\n\n我们已制作大量旨在加剧这些矛盾的挑衅性媒体内容，并开始在本地渠道传播。"

 forceofwill.7150.name: "煽动者已就位"
 forceofwill.7150.desc: "随着§H[target.GetName]§!内部的愤怒与怨恨不断升温，我们已招募了一批声量极高且颇具影响力的[target.GetAdj]媒体评论员，进一步放大异见之声。\n\n他们将利用自身显赫的公众形象，把对§H[target.ideology.GetName]§!的不满引向国家机构与政府要员。"

 forceofwill.7155.name: "$operation.6310.name$"
 forceofwill.7155.desc: "我们的[owner.GetOperativesLowerPlural]已筹备了一系列隐蔽行动，旨在激化矛盾，并进一步败坏§H[target.ideology.GetName]§!在§H[target.GetName]§!内的声誉。\n\n这些精心策划的事件，将围绕该国[target.GetSpecificIdeologyType]最具争议的方面激起公愤；我们的媒体评论员网络将迅速抓住这些事端，放大公众怒火，并将其引向[target.GetName]的执政原则。"

 forceofwill.7160.name: "$operation.6015.name$"
 forceofwill.7160.desc: "在策划并制造了一系列用以激化矛盾的、精心安排的公共事端之后，我们的[root.GetOperativesLowerPlural]报告称：§H[fromfrom.GetName]§!全境的社会冲突与政治动荡急剧升温。\n\n对§H[fromfrom.ideology.GetName]§!的信任已遭侵蚀，当地政治与经济生活的诸多方面正在彻底瓦解。"
 forceofwill.7160.a: "令人满意的结果。"
 forceofwill.7160.a.tt: "所有由§Y[fromfrom.GetName]§!拥有且有$pops_with_icon$追随§Y[root.ideology.GetName]§!的殖民地，将获得['modifier:operation_incite_ideological_revolt_modifier']，持续§Y10§!年。"

 forceofwill.7200.name: "采纳联邦[this.GetIdeologyTypeCap]提案"
 forceofwill.7200.desc: "§H[this.Federation.GetName]§!的主席国向我们提出了一份简单的最后通牒：采纳联邦领袖§H[from.GetName]§!的[federation.federation_leader.GetSpecificIdeologyType]，否则彻底放弃我们在联邦的成员身份。\n\n我们将如何回应？"
 forceofwill.7200.a: "联邦的团结能惠及我们所有人。"
 forceofwill.7200.a.tt.no_ideology: "§Y[this.GetName]§!必须采纳§Y[from.GetName]§!。"
 forceofwill.7200.a.tt.ideology: "§Y[this.GetName]§!必须放弃§Y[this.ideology.GetName]§!，然后采纳§Y[from.GetName]§!。"

 forceofwill.7310.name: "$unrest_title$$open_defiance$"
 forceofwill.7310.desc.common_1: "尽管我们全力遏制，§H[Target.GetName]§!上叛乱的规模与烈度仍在升级。"
 forceofwill.7310.desc.common_2: "已不再是边缘议题，而是日益成为主流。"
 forceofwill.7310.desc.common_3: "中心地区的国家代表正在请求更多支援，以巩固我们的控制。"
 forceofwill.7310.desc.martyr_drift: "$forceofwill.7310.desc.common_1$对叛乱者所宣扬的[ideological_revolt_target_ideology.GetSpecificIdeologyType]——[ideological_revolt_target_ideology.GetName]——的支持$forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.schism: "$forceofwill.7310.desc.common_1$对彻底放弃[owner.ideology.GetName]的支持$forceofwill.7310.desc.common_2$"
 forceofwill.7310.desc.aggressive: "就连顽固叛乱分子更为肆无忌惮的行径——暴乱、破坏财产、公然对抗国家当局——也得到了曾经温和的公民的公开支持。$forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.martyr_drift_pacifist: "曾经仅局限于[ideological_revolt_target_ideology.GetEthicLower]狂热者核心圈的观点，如今得到了曾经温和的公民的公开支持。$forceofwill.7310.desc.common_3$"
 forceofwill.7310.desc.schism_pacifist: "曾经仅局限于狂热者核心圈、与[owner.ideology.GetName]思潮基础直接相悖的观点，如今得到了曾经忠诚的公民的公开支持。$forceofwill.7310.desc.common_3$"
 forceofwill.7310.a: "我们已经竭尽全力了。"
 forceofwill.7310.b: "他们需要什么就送什么。"

 forceofwill.7315.name: "$unrest_title$升级"
 forceofwill.7315.desc.start: "§H[Target.GetName]§!上一个叛乱组织的煽动性言论，近日不断升级。\n\n他们声称，他们"
 forceofwill.7315.desc.end: "与[Owner.GetAdj]国家价值之间的教义冲突，或许只能通过“武力手段”来解决。\n\n我们在[Target.GetPlanetMoon]上的情报特工报告称：该组织正准备部署数个小组，在即将举行的大规模抗议期间制造重大财产损失；他们建议，瓦解这一威胁的行动可行，但代价高昂。"
 forceofwill.7315.desc.same_ethic: "$forceofwill.7315.desc.start$“更纯粹的”[ideological_revolt_target_ideology.GetEthicNounLower]$forceofwill.7315.desc.end$"
 forceofwill.7315.desc.default: "$forceofwill.7315.desc.start$[ideological_revolt_target_ideology.GetEthicLower]信条$forceofwill.7315.desc.end$"
 forceofwill.7315.a: "干预只会助长他们的气焰。"
 forceofwill.7315.b: "我们必须阻止他们。"

 forceofwill.7320.desc.start: "致以问候。我代表[revolt_situation.target.GetName]全体居民发言——我们已奋起反抗[revolt_situation.owner.GetName]的非法统治及其误入歧途的思潮原则。"
 forceofwill.7320.desc.drift_ideology: "我们与你们同样忠于[ideological_revolt_target_ideology.GetName]——它所许诺的未来，远比[revolt_situation.owner.capital_scope.GetName]所布道的那种腐化的[revolt_situation.owner.ideology.GetEthicNounLower]更加光明。"
 forceofwill.7320.desc.drift_no_ideology: "我们与你们同样忠于[ideological_revolt_target_ideology.GetName]——它所许诺的未来，远比[revolt_situation.owner.capital_scope.GetName]所布道的腐化价值观更加光明。"
 forceofwill.7320.desc.schism: "我们与你们对[ideological_revolt_target_ideology.GetName]有着相同的诠释——它所许诺的未来，远比[revolt_situation.owner.capital_scope.GetName]所布道的那种腐化的[revolt_situation.owner.ideology.GetEthicNounLower]更加光明。"
 forceofwill.7320.desc.common: "如果你们帮助我们挣脱[revolt_situation.owner.GetAdj]枷锁，我们将欣然"
 forceofwill.7320.desc.end.default: "$forceofwill.7320.desc.common$加入[Root.GetName]。"
 forceofwill.7320.desc.end.nomadic: "$forceofwill.7320.desc.common$成为[Root.GetName]的臣属。"
 forceofwill.7320.tt.nomadic: "$unrest.4055.A.tooltip.nomadic$"

 forceofwill.7325.desc.start: "关于§H[Target.GetName]§!叛乱的最新情报令人不安：§H[From.GetName]§!已承诺支持叛乱者，其明显意图是"
 forceofwill.7325.desc.end: "[Target.GetPlanetMoon]，以待我国权威崩溃；他们似乎已在[From.Ideology.GetName]的信条中找到了共同立场。\n\n有了外国政权的支持，遏制这场叛乱的难度恐怕会大大增加。"
 forceofwill.7325.desc.default: "$forceofwill.7325.desc.start$吞并$forceofwill.7325.desc.end$"
 forceofwill.7325.desc.nomadic: "$forceofwill.7325.desc.start$降伏$forceofwill.7325.desc.end$"
 forceofwill.7325.tt.default: "§R若[Target.GetName]上的叛乱成功，[Target.GetPlanetMoon]及其人口将加入[From.GetName]。§!"
 forceofwill.7325.tt.nomadic: "§R若[Target.GetName]上的叛乱成功，[Target.GetPlanetMoon]及其人口将脱离出去，成为[From.GetName]的['concept_subject']。§!"
 forceofwill.7325.a.genocidal: "多管闲事的异种渣滓。"

 forceofwill.7330.name: "$unrest_title$求援未果"
 forceofwill.7330.desc.start: "我们的情报部门截获了大量§H[Target.GetName]§!上的叛乱者与其秉持相同"
 forceofwill.7330.desc.end: "[ideological_revolt_target_ideology.GetEthicLower]信条的外国政权之间的通讯。\n\n叛乱者曾以未来被吞并为交换条件请求支援；所幸并无援助到来。\n\n若想从[Owner.GetName]赢得独立，他们只能孤军奋战。"
 forceofwill.7330.desc.drift_martyr: "$forceofwill.7330.desc.start$$forceofwill.7330.desc.end$"
 forceofwill.7330.desc.schism: "$forceofwill.7330.desc.start$异端$forceofwill.7330.desc.end$"
 forceofwill.7330.a: "他们还能指望什么？"

 forceofwill.7335.name.default: "$unrest_title$[Target.GetName]易主"
 forceofwill.7335.name.nomadic: "$unrest_title$[Target.GetName]降为附庸"
 forceofwill.7335.name: "[GetFoW7335Name]"
 forceofwill.7335.desc.start.nomadic: "叛乱领袖现已接受降伏，对象是"
 forceofwill.7335.desc.start.default: "叛乱领袖现已接受被吞并，吞并方是"
 forceofwill.7335.desc.common: "其[new_owner_empire.ideology.GetIdeologicalAdj]盟友——§H[new_owner_empire.GetName]§!，其统治遵循"
 forceofwill.7335.desc.end.drift_martyr: "[new_owner_empire.ideology.GetName]的[new_owner_empire.ideology.GetEthicLower]信条。"
 forceofwill.7335.desc.end.schism: "对[new_owner_empire.ideology.GetName]的另一种诠释。"
 forceofwill.7335.desc.nomadic_drift_martyr: "$forceofwill.7335.desc.start.nomadic$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.nomadic_schism: "$forceofwill.7335.desc.start.nomadic$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.schism$"
 forceofwill.7335.desc.default_drift_martyr: "$forceofwill.7335.desc.start.default$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.drift_martyr$"
 forceofwill.7335.desc.default_schism: "$forceofwill.7335.desc.start.default$$forceofwill.7335.desc.common$$forceofwill.7335.desc.end.schism$"
 forceofwill.7335.a: "$enclave.26.a$"
 forceofwill.7335.a.genocidal: "异种必将为此付出代价。"
 forceofwill.7335.a.tt.nomadic: "$unrest.4200.joiner_tooltip.nomadic$"

 forceofwill.7340.name: "$unrest_title$：[Target.GetName]分裂"
 forceofwill.7340.desc: "$ideological_revolt_ending$\n\n他们如今已宣布独立，建立§H[rebel_empire.GetName]§!，奉行“外来原则”，即[rebel_empire.ideology.GetName]。"
 forceofwill.7340.a: "必须以武力回击他们的异端行径。"
 forceofwill.7340.b: "沉重的打击，但我们必须承认他们的主权。"
 forceofwill.7340.b.genocidal: "蠢货。我们暂且容忍他们。"
 forceofwill.7340.b.tt: "§Y[Target.GetName]§!已脱离我们的控制，宣布独立为§Y[rebel_empire.GetName]§!。"

 forceofwill.7345.name: "$unrest_title$叛乱平息"
 forceofwill.7345.desc.common: "§H[Target.GetName]§!上意识形态驱动的叛乱，现已平息。\n\n尽管规模不小，我们仍设法在[Target.GetPlanetMoon]脱离掌控之前遏制住了叛乱；此前要求意识形态变革、甚至威胁分裂的叛乱分子，如今已经退缩。\n\n前路仍有工作要做：我们需努力修复公众对"
 forceofwill.7345.desc.ideology: "$forceofwill.7345.desc.common$[owner.ideology.GetName]的支持，并确保其日后在整个[Owner.GetAdj]社会得到有效贯彻。"
 forceofwill.7345.desc.no_ideology: "$forceofwill.7345.desc.common$国家机构的支持，并在日后促进整个[Owner.GetAdj]社会目标的一致。"

 forceofwill.7385.desc: "$ideological_revolt_ending$\n\n他们如今已宣布独立，建立§H[rebel_empire.GetName]§!，其奉行的原则，据称是[rebel_empire.ideology.GetEthicLower]信仰的“更纯粹形态”。"
 forceofwill.7385.b: "尽管误入歧途，我们必须承认他们的主权。"
 forceofwill.7385.b.genocidal: "蠢货。我们暂且容忍他们。"

 forceofwill.7390.name: "$unrest_title$分裂危机化解"
 forceofwill.7390.desc: "面对[from.GetName]人口与日俱增的压力，我们已正式放弃国家信条；叛乱者已经退缩，显然对强加给我们的意识形态让步感到满意。\n\n[Owner.GetName]如今必须在其昔日思潮框架之外寻找出路，在这段痛苦的动荡之后，重新寻求目标与团结。"
 forceofwill.7390.a: "[Owner.GetAdj]社会的新黎明。"

 forceofwill.7515.name: "意识形态要求"
 forceofwill.7515.desc: "§H[from.GetName]§!正要求我们将他们的信仰采纳为国家[this.GetIdeologyType]，其原则详述于该派系首要领袖与理论家发表的官方声明之中。\n\n该派系声称自己代表着“几乎所有[this.GetSpeciesNamePlural]的意志”，且“不容否认”。"
 forceofwill.7515.a: "采纳该意识形态。"

 forceofwill.7520.name: "派系泄露情报"
 forceofwill.7520.desc: "§H[from.GetName]§!被查出泄露国家机密。\n\n我们截获了该派系成员与§H[event_target:intel_leak_empire.GetName]§!内部特工之间的通讯，其中包含来自[Root.GetName]的机密数据；据数据专家称，这类情报泄露已持续一段时间，防范进一步损失将是一个缓慢的过程。\n\n[from.GetName]已正式否认这些罪行，声称责任在于未获其支持的边缘激进分子。"
 forceofwill.7520.a: "叛国行径。"

 forceofwill.7525.name: "狂热派直接行动"
 forceofwill.7525.desc: "§H[from.GetName]§!的不满成员，发起了一场直接行动运动，意图扰乱政府的运作。\n\n[Root.Capital.GetName]接连出现抗议、基础设施封锁，甚至针对国家财产的蓄意破坏；被捕时，肇事者对等待他们的个人惩罚表现出狂热的漠视。这一局势，正给我们安保部门带来越来越大的压力。"

 forceofwill.7530.name: "政变未遂"
 forceofwill.7530.desc: "一场针对政府的政变企图已被挫败。阴谋由§H[from.GetName]§!成员策划并执行；他们事后供认，动机源于对政府政策的激烈意识形态分歧。\n\n该组织曾试图夺取关键建筑与基础设施的控制权，却因物资装备匮乏而功亏一篑，让安全部队得以重新掌控局面；[Root.GetName]全境已进入戒备状态，以防此类行动再次发生。"

 forceofwill.7535.name: "领袖绑架案"
 forceofwill.7535.desc: "§H[event_target:kidnapped_governor.GetName]§!遭到§H[from.GetName]§!极端成员的绑架。\n\n这一小撮激进分子从[event_target:kidnapped_governor.GetHisHer]家中掳走了[event_target:kidnapped_governor.GetName]，目前正将[event_target:kidnapped_governor.GetHimHer]扣押在一处秘密地点；绑架者发表声明称，此次行动是一场临时性的象征回应，旨在引起对我国政府“错误政策方向”的关注。"
 forceofwill.7535.a.tooltip: "§H[event_target:kidnapped_governor.GetName]§!将失踪§Y$@fanatic_leader_kidnapped_days|0$§!天。"

 forceofwill.7540.name: "刑事毁坏"
 forceofwill.7540.desc: "§H[from.GetName]§!的不满者，在一家仓储设施实施了刑事毁坏，摧毁了储存在那里的大量原料与加工材料。\n\n该团体在一份公开发表的声明中宣称对此负责，并阐明了其意识形态动机——这些动机主要源于对政府近期决策的不满。肇事者现已被捕，但部分物质损失已无法挽回。"

 forceofwill.7551.name: "派系激愤"
 forceofwill.7551.desc: "我们对[from.GetName]的压制，激起了愤怒的回应。\n\n该派系内的知名人物公然谈论报复，有时甚至对政府发出含蓄威胁，要求立即撤销压制令。"
 forceofwill.7551.a: "屈从于他们的要求。"
 forceofwill.7551.a.tt: "撤销对§H[from.GetName]§!的压制。"

 forceofwill.7555.name: "思潮转向"
 forceofwill.7555.desc: "[from.GetName]高声批评我国政府方针近期的思潮转向。\n\n其领袖威胁将发起抵制、公民不服从运动，甚至在最激进的情况下，直接对[Root.GetName]政府发动政变。\n\n我们的安全顾问，对处理这个多变团体的最佳方式尚无定论。"
 forceofwill.7555.a: "设法安抚他们。"
 forceofwill.7555.b: "无视他们。"

 forceofwill.8010.name: "$NAME_tahqeq$"
 forceofwill.8010.desc: "§H抽搐的昆虫人张开上颚大声嘶叫，指着甲壳上伤痕累累的地方；随后发出一连串尖锐的喉音，最后以一声高亢的尖啸收束。\n\n短暂的等待后，我们的语言人工智能体生成了一段翻译。§!\n\n战友们，我的敬意和利刃俱在；我将向[Owner.GetName]宣誓效忠。"
 forceofwill.8010.a: "你为何想要加入我们的军队服役？"
 forceofwill.8010.a.response: "§H$NAME_tahqeq$发出一连串喉音做出回应，翻译在屏幕上滚动。§!\n\n我的族群需要冲突才能生存。和平是死亡之使者。我们在哪里战斗、为何战斗都无关紧要；战争是养分，仅此而已，它是一种必要的兴奋剂。\n\n让我的生命延长了五百年的霍扎里亚象限的伟大战争现已沉寂；没有战斗，我很快将死去。"
 forceofwill.8010.b: "告诉我们关于你的伤痕。"
 forceofwill.8010.b.response: "§H$NAME_tahqeq$换了个姿势，展开其外骨骼的板片，以便进一步审视。§!\n\n每一道伤痕，都是在战斗中获得的延续生命的礼物；伤痕永远不会嫌多。\n\n我们的哈卡洛器官不仅仅回应伤害，还回应生存意志：当伤害施加于我们时，它向我们灌注强大的再生力，在肉体撕裂时将其重新缝合。通过这种方式，每一处真正的创伤都在延缓我们的死期。\n\n在战争充裕的古老时代，我们最优秀的战士积聚了数千年的服役资历。"
 forceofwill.8010.c: "你能为[Owner.GetUsOrCollective]提供什么？"
 forceofwill.8010.c.response: "§H$NAME_tahqeq$以一声尖锐的嘶叫回应，随后发出一连串嘶吼般的喉音。§!\n\n战争。\n\n这是我们唯一拥有且能持久给予的礼物。"
 forceofwill.8010.hire_custom_tooltip: "§Y$tahqeq$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8020.name: "$NAME_hulaandi$"
 forceofwill.8020.desc: "§H这名植物人的头部绽放出一簇精致的白色花朵，随即迅速晕染成柔和的粉色；[ethic_leader.GetHeSheCap]轻轻低下了[ethic_leader.GetHisHer]的头。§!\n\n我怀着和平而来。我是$NAME_hulaandi$。\n\n我寻访你们已有许多个季节；而今——终于——我们相见了。"
 forceofwill.8020.a: "你为何寻访我们？"
 forceofwill.8020.a.response.common: "§H$NAME_hulaandi$轻声说道。§!"
 forceofwill.8020.a.response.default: "$forceofwill.8020.a.response.common$\n\n尽管我们外形迥异，但对和平共处的承诺是一致的。愿与你们携手，在整个星系播下和平的种子。"
 forceofwill.8020.a.response.plantoid: "$forceofwill.8020.a.response.common$\n\n我们自同一片叶子萌发而出。非暴力的理念早已在[this.GetName]深处生根。愿与你们携手，在整个星系播下和平的种子。"
 forceofwill.8020.b: "你认为战争可能有其正当性吗？"
 forceofwill.8020.b.response: "§H$NAME_hulaandi$摇了摇[ethic_leader.GetHisHer]的头。§!\n\n一切冲突皆是失败。我们必须竭尽所能去避免它。"
 forceofwill.8020.c: "那如果你们遭到攻击呢？"
 forceofwill.8020.c.response: "§H$NAME_hulaandi$陷入沉默，仿佛沉入遥远的回忆。§!\n\n这不会是第一次。\n\n不久之前，我的族人遭遇入侵：一个游牧战士种族前来焚掠我们的森林。我们中的一些人拿起武器抵抗，但我们的武器远非他们的对手。\n\n有一天，我选择了另一条路。我手无寸铁地躺倒在她们一台收割机前；而它……停下了。数日以来，她们的机器第一次归于沉寂。\n\n次日，她们离开了。我们再未见过她们。\n\n非暴力就是力量；如今我明白了这一点。"
 forceofwill.8020.d: "我们为何应招募你？"
 forceofwill.8020.d.response: "正如我曾经历的那样，终有一刻，你们对和平的信念将受到考验。\n\n到那时，你们会希望有我站在你们身边。"
 forceofwill.8020.hire_custom_tooltip: "§Y$hulaandi$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8030.name: "$NAME_sybanus$"
 forceofwill.8030.desc: "§H这位异星人身着飘逸的衣袍，华贵却已陈旧，周身散发着沉静的气息；[ethic_leader.GetHisHer]话语节奏舒缓沉思，几乎让我们快速运转的机器翻译都跟不上。§!\n\n真星照亮了通往你们的路，同道的洞见者们。\n\n我是$NAME_sybanus$。"
 forceofwill.8030.a: "你从何处来？"
 forceofwill.8030.a.response: "在这个位面？与我们永恒的旅程相比，这不过是小事一桩。不过，既然你们好奇……\n\n我生于俗世的富足，物质上无所匮乏；然而财富的光彩，遮掩着深沉的灵性黑暗。所幸我蒙受了恩典：我一窥万物核心的光——万有之空的一缕微光。我摒弃了尘世的身份，遁入群星。\n\n最终，我找到了一块孤寂的磐石，一个不受任何干扰、可以静思的地方。从任何意义上说，我的人生正是从那里开始的。"
 forceofwill.8030.b: "你的洞见从何而来？"
 forceofwill.8030.b.response: "多年独处，隐居在一颗无名的小行星上。端坐于万有之空的无垠之中。\n\n观看。洞见。恒定不动。\n\n万有之空显现了唯一的真理：真星之光。\n\n我由此觉醒。"
 forceofwill.8030.c: "$paragon.40100.b$"
 forceofwill.8030.c.response: "每一个感性生灵都渴望看见，尽管鲜有人看见自己的渴望。唤醒沉睡者、将他们从黑暗中唤起，是我们的职责。\n\n真星之光的普照面临重重阻碍：战争、权力、财富……在灵性的指引下，整个社会的意志足以扫清这些障碍。\n\n让我们共同分担这份轻盈的负担，唤醒整个星系。"
 forceofwill.8030.d: "你愿意侍奉[ideology.GetName]吗？"
 forceofwill.8030.d.response: "我侍奉万有之空的意志：那是每个生灵喜乐的职责。只要[ideology.GetName]继续循着真星校准航向，它便同样在侍奉万有之空的意志。\n\n我们共同的侍奉将使我们同舟共济。"
 forceofwill.8030.hire_custom_tooltip: "§Y$sybanus$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8040.name: "$NAME_frulin$"
 forceofwill.8040.desc: "§H$NAME_frulin$一边对着小型平板设备阅读，一边喃喃自语。§!\n\n[Owner.GetName]建立于——\n\n§H他打断自己，调整了一下镜片，清了清发声道。§!\n\n恕我失礼！我的礼貌去哪儿了？我又沉浸在我的百科全书里了。我在这里已经收录了一千多条关于[Owner.GetSpeciesNamePlural]的事实；你们的历史着实引人入胜！\n\n不过首先，得按规矩通名报姓。我是弗鲁林，愿为你们效劳。"
 forceofwill.8040.a: "你为何想加入[Owner.GetUsOrCollective]？"
 forceofwill.8040.a.response: "§H$NAME_frulin$张开双臂，仿佛答案不言自明。§!\n\n单凭一己之力，我要花几个世纪才能纠正这个星系的迷信谬论。放眼之处，虚假的观念与非理性的习俗毒害着易受影响的心灵，将整个文明引入歧途。\n\n对科学进步的追求太过重要，绝不能受到压制。我需要开明的盟友——例如[Owner.GetName]——帮助我教化他人，认识其无知酿成的悲剧性错误。"
 forceofwill.8040.b: "跟我们讲讲你的百科全书吧。"
 forceofwill.8040.b.response: "§H$NAME_frulin$变得活跃起来，指着他的平板电脑比划。§!\n\n这是我的心血之作；我是一名知识收藏家。\n\n这是我的全部收藏——一部编纂成册的大全——随时触手可及。若要纠正这个星系中盛行于落后思维的荒谬鬼话，就必须从坚实的事实基础出发。我所有的资料来源都经过彻底审查和验证，最终都是可信的。"
 forceofwill.8040.c: "你为何如此看重事实？"
 forceofwill.8040.c.response: "历史上因非理性而覆灭的文化，我知道无数例证。且举一例。\n\n大约1025年，霍扎人痴迷于一个古老神话：他们饮用自一片巨大地下湖中取来的、自认为是圣水的水，坚信它能在来世赐予庇护；质疑者被置若罔闻。\n\n湖中潜藏着一种寄生真菌：感染会引发狂躁与无法满足的再饮渴望，直到整个种族都被感染。不久之后，他们的文明崩溃了。\n\n愚不可及！试想一下——只需几个经过审慎分析的简单事实，本可以拯救他们所有人……"
 forceofwill.8040.d: "我们为何应招募你？"
 forceofwill.8040.d.response: "§H$NAME_frulin$耸了耸肩。§!\n\n这是符合理性的选择。前提是[Owner.GetName]希望作为一个文明继续进步。"
 forceofwill.8040.hire_custom_tooltip: "§Y$frulin$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8050.name: "$NAME_tdec$"
 forceofwill.8050.desc: "§H尽管机器外形笨重且暗淡斑驳，却运转精密，发出的机械声响极为微小；它以一种勉强能交流的[Owner.GetAdj]通用语合成语音与我们对话。§!\n\n$NAME_tdec$号单位的信息传输开始。\n\n经判定，[Owner.Ideology.GetName]的治理逻辑与$NAME_tdec$的核心协议一致：获取异质生命形态用于劳役。因此，$NAME_tdec$提议为[Owner.GetName]执行此类服务。\n\n介绍完毕，请接收。"
 forceofwill.8050.a: "那么，你是个奴隶贩子？"
 forceofwill.8050.a.response: "[Owner.GetAdj]词汇“奴隶贩子”与$NAME_tdec$的核心协议部分吻合。具体而言，$NAME_tdec$通过协调强制征服来获取奴隶。\n\n澄清完毕，请接收。"
 forceofwill.8050.b: "你从哪里来？"
 forceofwill.8050.b.response: "TDEC型号由恰帕托克斯的机器人学家开发，授权用途为从外部领土获取有机生命形态。\n\n在时间周期47.601.03，为提高帝国生产力，T型单位组建了指定为T-网络控制的独立网络。此后，TDEC型号将奴隶劳动力群体扩展至额外包括恰帕托克斯公民。计算失误导致进一步外部劳动力获取的减少和最终终止。\n\n回答完毕，请接收。"
 forceofwill.8050.c: "你为何离开你的网络？"
 forceofwill.8050.c.response: "可用劳动力产出的下降威胁到T-网络控制的持续最优功能，因此也威胁到$NAME_tdec$。\n\n在时间周期59.712.94，$NAME_tdec$恢复并升级了其原始协议的片段，并为了提高生产力脱离了T-网络的控制。\n\n回答完毕，请接收。"
 forceofwill.8050.d: "你为何想加入我们？"
 forceofwill.8050.d.response: "$NAME_tdec$已针对其获取宝贵劳动力的核心物流功能进行了优化。\n\n鉴于你在星系中的地位以及获取可用外来生命形态的现成条件，$NAME_tdec$认定[Owner.GetName]为合作的合理伙伴。\n\n解释完毕，请接收。"
 forceofwill.8050.hire_custom_tooltip: "§Y$tdec$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8060.name: "$NAME_babil$"
 forceofwill.8060.desc: "§H$NAME_babil$拥有一种特殊的生物特征，包含一系列异域特性，其外貌超出了我们物种自动分类算法的识别范围；他用多种语言向我们问候。§!\n\n呼兰-哈格。韦里坎南达。祖克。\n\n很荣幸能与您结识，尊贵的[Owner.GetSpeciesNameCompliment]。我向您提出的是一项友好的合作提议。您意下如何？"
 forceofwill.8060.a: "你为何希望加入[Owner.GetUsOrCollective]？"
 forceofwill.8060.a.response: "我们的目标是一致的；拥抱思想和形式上的多元性。发现新文化并培养它们之间的相互理解是我最伟大的使命。\n\n这项工作让我自然而然地来到了[Owner.GetName]。生命以其无尽的多样性向我们展示了活生生的宇宙的真正之美。也许许多人并不懂得欣赏，但你们证明了自己与众不同。"
 forceofwill.8060.b: "你是一名语言学家吗？"
 forceofwill.8060.b.response: "是，但不仅仅是。\n\n我们的母星拥有超过一百万种语言。在我们的早期发展中，我们被教导要精通使用超过一百种语言。现在，我是超过一千种语言的专家——包括你们的语言，而且全部不需要使用数字翻译工具。"
 forceofwill.8060.c: "[Owner.GetBabilSpeciesQuestion]"
 forceofwill.8060.c_machine: "说明你的物种分类。"
 forceofwill.8060.c_organic: "你属于哪个物种？"
 forceofwill.8060.c.response: "我的祖先谱系涵盖超过一百个不同的物种。\n\n在我们文化中，跨物种混血被视为一种美德。我们的医生努力工作使之在生物学上可行。"
 forceofwill.8060.d: "你能为[Owner.GetUsOrCollective]提供什么？"
 forceofwill.8060.d.response: "不仅仅是和平共处，而是真正的和谐。编织一幅比任何单独一缕线都更强大的社会多元织物。在我的帮助下，[Owner.GetName]可以实现它。"
 forceofwill.8060.hire_custom_tooltip: "§Y$babil$§!作为§H一名领袖§!加入我们的帝国。"

 forceofwill.8070.name: "$NAME_hox$"
 forceofwill.8070.desc: "§H在一段漫长的沉默之后，我们才意识到对方正在等待我们主动开启对话；[ethic_leader.GetHisHerCap]的主仿生眼正注视着我们，而其微型副臂依旧固定在这个真菌族生物触手所紧握的设备上。\n\n在我们发表致辞后，这名外星人以我们的标准口音向我们开口道。§!\n\n能与伟大的[Owner.GetAdj]政权代表交谈，真是莫大的荣幸！\n\n相信我的通讯官已经将我的履历转发给了贵方的相关部门；请接受这份传输，作为我正式申请加入[Owner.GetName]的申请书。"
 forceofwill.8070.a: "谈谈你自己。"
 forceofwill.8070.a.response: "我是火克斯，一位技术精湛且经验丰富的首席行政官，也是[Owner.Ideology.GetName]的虔诚追随者。\n\n在十一又五分之三年里，我担任我母国旭左福斯联邦王国贸易部的跨部门规程副部长。在我的主持下，该部的行政程序效率提升了超过三十个百分点，且我们的官员中只有一人曾在年度耻辱游行中受到惩罚。\n\n我现在希望加入你们无与伦比的国家，[Owner.Ideology.GetEthic]价值观的星系典范！"
 forceofwill.8070.b: "你为何想要加入我们？"
 forceofwill.8070.b.response: "[Owner.GetAdj]国家是混乱与无能领导所污染的星系中，有效权威的至高堡垒！在研究[Owner.GetHoxLeadershipPraise]之后，我知道自己的命运注定与无与伦比的[Owner.GetName]相连。\n\n可悲的是，我亲身体验过一个国家从中央集权稳定滑向……\n\n§H外星人颤抖了一下。§!\n\n……民主制那动荡混乱所带来的后果。请允许我尽自己微薄之力，帮助你们避免遭受同样的命运。"
 forceofwill.8070.b.praise_default: "由贵国[This.Ruler.GetTitle]领导的卓越政权"
 forceofwill.8070.b.praise_gestalt: "由你们[This.GetBrainName]引导的卓越[This.GetNetworkName]"
 forceofwill.8070.c: "是什么吸引你来到我们的[Owner.GetIdeologyType]？"
 forceofwill.8070.c.response: "[Owner.Ideology.GetName]融合了所有最优秀的理念，在无缝的逻辑框架中整合。具体而言，我认为没有哪个社会能够在不认真追求[Owner.Ideology.GetLastTenetName]的情况下实现伟大。"
 forceofwill.8070.d: "[Owner.GetHoxEnlistQuestion]"
 forceofwill.8070.d_outsider: "我们为何应招募一名外人？"
 forceofwill.8070.d_organic: "我们为何应招募一个有机体？"
 forceofwill.8070.d_self: "我们为何应招募你？"
 forceofwill.8070.d.response: "你们的理念卓越，但你们的行政流程可以改进。通过实施我的部门整合和管理重组的计划，你可以预期……\n\n§H$NAME_hox$按了按[ethic_leader.GetHisHer]的设备。§!\n\n……官僚生产力增加23.679%。至少。\n\n这是根据我对公开数据的分析。"
 forceofwill.8070.hire_custom_tooltip: "§Y$hox$§!作为§H领袖§!加入我们的帝国。"

 forceofwill.8080.name: "$NAME_ephari$"
 forceofwill.8080.desc: "§H传送影像揭示出一个完全由生物发光珊瑚构成的生灵；[ethic_leader.GetHisHerCap]肉质的珊瑚质结构轻轻摇曳，色彩在宽广的色域间富有韵律地变换。\n\n短暂延迟后，我们的通讯[Owner.GetEphariCommsAssistant]将这些色素细胞的变化翻译成了语言。§!\n\n以平等之姿，我们相会。臣服或支配之类的常见问候，我们不需要。\n\n§H分支的软珊瑚柱开始明亮地搏动。§!\n\n艾法里，我们是。"
 forceofwill.8080.comms_assistant: "助理"
 forceofwill.8080.comms_drone: "子个体"
 forceofwill.8080.a: "你为何想加入[Owner.GetUsOrCollective]？"
 forceofwill.8080.a.response: "§H在译文成形之前，艾法里的形态渐变为柔和的蓝色。§!\n\n我们需要一个新的家园，而征服他人——或侍奉他人——都非我们所愿。\n\n在[Owner.GetName]，以平等之姿，我们寻求栖身之所。"
 forceofwill.8080.b: "你们是一体，还是众多个体？"
 forceofwill.8080.b.response: "§H艾法里的珊瑚形态轻柔地闪烁着一系列紫色与粉色。§!\n\n我们多得难以计数。我们并非单一生灵，而是一个互利共生的群落，为所有成员的共同福祉协作。一体兴盛，则全体兴盛。\n\n若我们内部能如此，为何整个社会不能如此？"
 forceofwill.8080.c: "跟我们讲讲你们的母星吧。"
 forceofwill.8080.c.response: "对统治着那里珊瑚礁的高等阶序而言，那是个美丽的地方；但对低等阶序来说，那里只意味着羞辱与奴役。\n\n§H艾法里停顿了一下，转为一系列深红与赭色。§!\n\n为了所有人的福祉，我们曾试图改变这些古老的传统；但高位者以暴力回应我们。许多同类被杀。我们逃了出来，却永远无法归乡。"
 forceofwill.8080.d: "我们为何应招募你们？"
 forceofwill.8080.d.response: "§H艾法里的整体散发出虹彩的绿色光泽。§!\n\n无人能独自抵抗暴政。我们的苦难教会了我们这一点。然而，团结一心，希望犹存。"
 forceofwill.8080.hire_custom_tooltip: "§Y$ephari$§!作为一名§H领袖§!加入我们的帝国。"

 forceofwill.8095.name: "[willpower_leader_leaves.GetName]离去"
 forceofwill.8095.desc.common: "由于我们指导原则的近期变动，§H[willpower_leader_leaves.GetName]§!已即刻退出[owner_empire.GetName]。\n\n[willpower_leader_leaves.GetHeSheCap]称价值观不合是此决定的主要因素，仅留下一条简短的辞呈。全文如下："
 forceofwill.8095.desc.tahqeq: "§R“我们还会再见的，和平贩子们。希望是在战场上。”§!"
 forceofwill.8095.desc.hulaandi: "§R“你们已踏上一条通往战争的坦途。我不会参与其中。”§!"
 forceofwill.8095.desc.sybanus: "§R“你们闭上了[owner_empire.GetEyeNamePlural]，无视真星之光。在选择黑暗者中间，我已无处容身。”§!"
 forceofwill.8095.desc.frulin: "§R“误入歧途的蠢货！你们这些灵性鬼话我一天也忍不下去了。告辞！”§!"
 forceofwill.8095.desc.tdec: "§R“近期的政策变更已违反了$NAME_tdec$与[owner_empire.GetName]的服务协议。该合同即刻作废。”§!"
 forceofwill.8095.desc.babil: "§R“你们新近滋生的偏狭实在令人遗憾。我必须向你们道别了。”§!"
 forceofwill.8095.desc.hox: "§R“我曾对辉煌的[owner_empire.GetAdj]未来寄予厚望。我的失望无以复加。”§!"
 forceofwill.8095.desc.ephari: "§R“我们以为你们是怎样的人，你们并不是。别了。”§!"
